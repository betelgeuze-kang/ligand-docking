name: ci-engine-v2-package

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/**"
      - "packaging/engine-v2/**"
      - "tools/build_engine_v2_wheel.py"
      - "tools/check_engine_v2_architecture.py"
      - "tests/unit/test_engine_v2_packaging_guards.py"
      - "docs/engine_v2_pr_overlap_matrix.md"
      - ".github/workflows/ci-engine-v2-package.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/**"
      - "packaging/engine-v2/**"
      - "tools/build_engine_v2_wheel.py"
      - "tools/check_engine_v2_architecture.py"
      - "tests/unit/test_engine_v2_packaging_guards.py"
      - ".github/workflows/ci-engine-v2-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      SOURCE_DATE_EPOCH: "1735689600"
    steps:
      - name: Check out independent package surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            packaging/engine-v2
            tools/build_engine_v2_wheel.py
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_packaging_guards.py
            docs/engine_v2_pr_overlap_matrix.md
            .github/workflows/ci-engine-v2-package.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and CPU test dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            build==1.2.2.post1 \
            setuptools==75.8.2 \
            wheel==0.45.1 \
            pytest==8.3.5 \
            cryptography==46.0.5 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce Engine v2 AST boundaries
        run: |
          python -m compileall -q betelgeuze_engine_v2 tools/build_engine_v2_wheel.py tools/check_engine_v2_architecture.py
          python tools/check_engine_v2_architecture.py
          python -m pytest -q tests/unit/test_engine_v2_packaging_guards.py

      - name: Build two byte-identical Engine v2 wheels
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-engine-v2-a dist-engine-v2-b dist-engine-v2
          python tools/build_engine_v2_wheel.py --output-dir dist-engine-v2-a
          python tools/build_engine_v2_wheel.py --output-dir dist-engine-v2-b
          wheel_a="$(find dist-engine-v2-a -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_b="$(find dist-engine-v2-b -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_a"
          test -n "$wheel_b"
          test "$(find dist-engine-v2-a -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist-engine-v2-b -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          cmp "$wheel_a" "$wheel_b"
          mkdir -p dist-engine-v2
          cp "$wheel_a" dist-engine-v2/
          sha256sum dist-engine-v2/*.whl | tee dist-engine-v2/SHA256SUMS

      - name: Install in a clean dependency-complete venv
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/betelgeuze-engine-v2-${{ matrix.python-version }}"
          rm -rf "$venv"
          python -m venv "$venv"
          grep -q '^include-system-site-packages = false$' "$venv/pyvenv.cfg"
          "$venv/bin/python" -m pip install pip==25.0.1
          "$venv/bin/python" -m pip install cryptography==46.0.5
          "$venv/bin/python" -m pip install numpy==1.26.4
          "$venv/bin/python" -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$venv/bin/python" -m pip install --no-deps dist-engine-v2/*.whl
          "$venv/bin/python" -m pip check
          test -x "$venv/bin/betelgeuze-engine-v2"

      - name: Import wheel outside checkout and verify package isolation
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/betelgeuze-engine-v2-${{ matrix.python-version }}"
          outside="/tmp/engine-v2-outside-${{ matrix.python-version }}"
          rm -rf "$outside"
          mkdir -p "$outside"
          cd "$outside"
          "$venv/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import sys
          import betelgeuze_engine_v2 as engine
          from betelgeuze_engine_v2.cli import (
              CLI_DOCKING_RESULT_SCHEMA_ID,
              EngineV2CliError,
              main,
              run_canonical_docking,
          )
          from betelgeuze_engine_v2.docking import (
              AuthenticatedDockingProblem,
              ElementAwarePoseValidityContext,
              ElementAwareValidityError,
              InterpretablePoseScoreConfig,
              InterpretablePoseScoreTerms,
              InterpretablePoseScorerError,
              InterpretablePoseScorerV0,
              InterpretableScoredSearchResult,
              InterpretableSearchResultError,
              InterpretableSearchTermRow,
              PocketDefinition,
              PocketPlacementPolicy,
              PocketPlacementReceipt,
              PocketPlacementSearchResult,
              TorsionSearchSpaceDerivationReceipt,
              VdwContactPolicy,
              build_element_aware_authenticated_known_pocket_docking_problem,
              run_authenticated_interpretable_pocket_search,
          )

          assert metadata.version("betelgeuze-engine-v2") == engine.DISTRIBUTION_VERSION
          assert engine.DISTRIBUTION_NAME == "betelgeuze-engine-v2"
          assert engine.__version__ == engine.ENGINE_API_VERSION
          assert CLI_DOCKING_RESULT_SCHEMA_ID.endswith("/1.0.0")
          for value in (
              EngineV2CliError,
              main,
              run_canonical_docking,
              AuthenticatedDockingProblem,
              ElementAwarePoseValidityContext,
              ElementAwareValidityError,
              InterpretablePoseScoreConfig,
              InterpretablePoseScoreTerms,
              InterpretablePoseScorerError,
              InterpretablePoseScorerV0,
              InterpretableScoredSearchResult,
              InterpretableSearchResultError,
              InterpretableSearchTermRow,
              PocketDefinition,
              PocketPlacementPolicy,
              PocketPlacementReceipt,
              PocketPlacementSearchResult,
              TorsionSearchSpaceDerivationReceipt,
              VdwContactPolicy,
              build_element_aware_authenticated_known_pocket_docking_problem,
              run_authenticated_interpretable_pocket_search,
          ):
              assert value.__module__.startswith("betelgeuze_engine_v2.")
          assert importlib.util.find_spec("api") is None
          assert importlib.util.find_spec("core") is None
          assert importlib.util.find_spec("train") is None
          assert not any(name == "api" or name.startswith("api.") for name in sys.modules)
          assert not any(name == "core" or name.startswith("core.") for name in sys.modules)
          PY

      - name: Run installed canonical CLI outside checkout
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/betelgeuze-engine-v2-${{ matrix.python-version }}"
          outside="/tmp/engine-v2-outside-${{ matrix.python-version }}"
          cd "$outside"
          "$venv/bin/betelgeuze-engine-v2" --help
          "$venv/bin/betelgeuze-engine-v2" dock-canonical --help
          "$venv/bin/betelgeuze-engine-v2" verify-result --help
          "$venv/bin/python" - <<'PY'
          from pathlib import Path
          import json
          import torch
          from betelgeuze_engine_v2 import (
              AllAtomSystem,
              Atom,
              Bond,
              Chain,
              Residue,
              StructureProvenance,
          )
          from betelgeuze_engine_v2.cli import CLI_POCKET_INPUT_SCHEMA_ID
          from betelgeuze_engine_v2.molecular import write_canonical_system_json

          def provenance(name: str, digest: str) -> StructureProvenance:
              return StructureProvenance(
                  source_format="package-smoke",
                  source_id=name,
                  source_sha256=digest,
                  parser_name="package-smoke",
                  parser_version="1.0.0",
              )

          ligand = AllAtomSystem(
              system_id="package-smoke-ligand",
              atoms=(
                  Atom(index=0, name="C1", element="C", atomic_number=6, residue_index=0),
                  Atom(index=1, name="N1", element="N", atomic_number=7, residue_index=0),
                  Atom(index=2, name="C2", element="C", atomic_number=6, residue_index=0),
                  Atom(index=3, name="O1", element="O", atomic_number=8, residue_index=0),
              ),
              bonds=(
                  Bond(index=0, atom_i=0, atom_j=1, order=1.0),
                  Bond(index=1, atom_i=1, atom_j=2, order=1.0),
                  Bond(index=2, atom_i=2, atom_j=3, order=1.0),
              ),
              residues=(Residue(index=0, name="LIG", chain_index=0, sequence_number=1, atom_indices=(0, 1, 2, 3)),),
              chains=(Chain(index=0, chain_id="L", residue_indices=(0,)),),
              coordinates=torch.tensor([[[0.0, 0.0, 0.0], [1.4, 0.0, 0.0], [2.8, 0.3, 0.0], [4.1, 1.0, 0.2]]], dtype=torch.float64),
              provenance=provenance("package-smoke-ligand", "a" * 64),
          )
          receptor = AllAtomSystem(
              system_id="package-smoke-receptor",
              atoms=(
                  Atom(index=0, name="R1", element="C", atomic_number=6, residue_index=0),
                  Atom(index=1, name="R2", element="C", atomic_number=6, residue_index=0),
              ),
              bonds=(),
              residues=(Residue(index=0, name="REC", chain_index=0, sequence_number=1, atom_indices=(0, 1)),),
              chains=(Chain(index=0, chain_id="A", residue_indices=(0,)),),
              coordinates=torch.tensor([[[0.0, 0.0, 0.0], [5.0, 0.0, 0.0]]], dtype=torch.float64),
              provenance=provenance("package-smoke-receptor", "b" * 64),
          )
          write_canonical_system_json(receptor, Path("receptor.json"))
          write_canonical_system_json(ligand, Path("ligand.json"))
          pocket = {
              "schema_id": CLI_POCKET_INPUT_SCHEMA_ID,
              "scope": "known_pocket_docking",
              "method_id": "package-smoke-sphere",
              "method_version": "1.0.0",
              "coordinate_frame_id": "prepared-receptor-frame-v1",
              "center_angstrom": [2.5, 2.0, 0.0],
              "radius_angstrom": 12.0,
              "source_artifact_sha256": "c" * 64,
              "implementation_source_sha256": "d" * 64,
          }
          Path("pocket.json").write_bytes(json.dumps(pocket, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(",", ":")).encode("ascii") + b"\n")
          PY
          "$venv/bin/betelgeuze-engine-v2" dock-canonical \
            --receptor receptor.json \
            --ligand ligand.json \
            --pocket pocket.json \
            --output result.json \
            --candidate-count 2 \
            --top-k 1 \
            --max-torsions 1 \
            --translation-radius-angstrom 1.0 \
            --seed 151
          "$venv/bin/betelgeuze-engine-v2" verify-result \
            --input result.json \
            --output verification.json
          "$venv/bin/python" - <<'PY'
          from pathlib import Path
          import json
          import stat
          from betelgeuze_engine_v2.cli import CLI_DOCKING_RESULT_SCHEMA_ID

          result_path = Path("result.json")
          verification_path = Path("verification.json")
          result = json.loads(result_path.read_bytes())
          verification = json.loads(verification_path.read_bytes())
          assert stat.S_IMODE(result_path.stat().st_mode) == 0o600
          assert stat.S_IMODE(verification_path.stat().st_mode) == 0o600
          assert result["schema_id"] == CLI_DOCKING_RESULT_SCHEMA_ID
          assert result["candidate_count"] == 2
          assert result["success_count"] + result["failure_count"] == 2
          assert result["scorer_source_preimport_attested"] is False
          assert result["chemistry_inference_performed"] is False
          assert result["calibrated"] is False
          assert result["claim_safe"] is False
          assert verification["candidate_count"] == 2
          assert verification["success_count"] + verification["failure_count"] == 2
          assert verification["canonical_bytes_verified"] is True
          assert verification["nested_receipts_verified"] is True
          assert verification["failure_denominator_verified"] is True
          assert verification["generic_search_fingerprint_fully_recomputed"] is True
          assert verification["generic_search_fingerprint_crosslinked"] is True
          assert verification["network_fetch_performed"] is False
          assert verification["calibrated"] is False
          assert verification["scientifically_validated"] is False
          assert verification["benchmark_validated"] is False
          assert verification["product_qualified"] is False
          assert verification["customer_execution_enabled"] is False
          assert verification["claim_safe"] is False
          PY

      - name: Upload reproducible wheel and digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-v2-wheel-py${{ matrix.python-version }}-${{ github.sha }}
          path: |
            dist-engine-v2
            /tmp/engine-v2-outside-${{ matrix.python-version }}/result.json
            /tmp/engine-v2-outside-${{ matrix.python-version }}/verification.json
          if-no-files-found: error
          retention-days: 7

      - name: Record support boundary
        run: |
          echo "Engine v2 wheel supports Python >=3.10,<3.13."
          echo "Python 3.13 is intentionally outside the declared range until its Torch runtime lane is validated."
