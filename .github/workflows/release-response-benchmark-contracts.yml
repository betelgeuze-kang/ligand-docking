name: release-response-benchmark-contracts

on:
  push:
    paths:
      - "api/product_release_evidence.py"
      - "api/product_benchmark_contract.py"
      - "betelgeuze_product/benchmark_contract.py"
      - "betelgeuze_product/docking_response.py"
      - "tools/product/build_release_claim_evidence_ladder_gate.py"
      - "tests/unit/test_release_claim_evidence_ladder_gate.py"
      - "tests/unit/test_product_docking_response_snapshot.py"
      - "tests/unit/test_benchmark_contract.py"
      - ".github/workflows/release-response-benchmark-contracts.yml"
  pull_request:
    paths:
      - "api/product_release_evidence.py"
      - "api/product_benchmark_contract.py"
      - "betelgeuze_product/benchmark_contract.py"
      - "betelgeuze_product/docking_response.py"
      - "tools/product/build_release_claim_evidence_ladder_gate.py"
      - "tests/unit/test_release_claim_evidence_ladder_gate.py"
      - "tests/unit/test_product_docking_response_snapshot.py"
      - "tests/unit/test_benchmark_contract.py"
      - ".github/workflows/release-response-benchmark-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Compile changed contract modules
        run: |
          python -m py_compile \
            api/product_release_evidence.py \
            api/product_benchmark_contract.py \
            betelgeuze_product/benchmark_contract.py
      - name: Run release, response, and benchmark contract tests
        run: |
          python -m pytest -q \
            tests/unit/test_release_claim_evidence_ladder_gate.py \
            tests/unit/test_product_docking_response_snapshot.py \
            tests/unit/test_benchmark_contract.py
