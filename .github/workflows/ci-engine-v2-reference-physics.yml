name: ci-engine-v2-reference-physics

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/physics/**"
      - "betelgeuze_engine/product/reference_pair_lj.py"
      - "tests/unit/test_engine_v2_reference_constrained_minimization.py"
      - "tests/unit/test_engine_v2_reference_physics.py"
      - "tests/unit/test_engine_v2_reference_pair_lj.py"
      - "tests/unit/test_engine_v2_reference_diagnostics.py"
      - "tests/unit/test_engine_v2_reference_forcefield_v2.py"
      - "tests/unit/test_engine_v2_reference_minimization.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_materializer.py"
      - "tests/unit/test_engine_v2_reference_minimization_independent_oracle.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_artifact_binding.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_review.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_receipts.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_authorization.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_nonce_reservation.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_run_start.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_runner.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_result_writer.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_protocol.py"
      - "tests/unit/test_engine_v2_reference_solvation.py"
      - ".github/workflows/ci-engine-v2-reference-physics.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/physics/**"
      - "betelgeuze_engine/product/reference_pair_lj.py"
      - "tests/unit/test_engine_v2_reference_constrained_minimization.py"
      - "tests/unit/test_engine_v2_reference_physics.py"
      - "tests/unit/test_engine_v2_reference_pair_lj.py"
      - "tests/unit/test_engine_v2_reference_diagnostics.py"
      - "tests/unit/test_engine_v2_reference_forcefield_v2.py"
      - "tests/unit/test_engine_v2_reference_minimization.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_materializer.py"
      - "tests/unit/test_engine_v2_reference_minimization_independent_oracle.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_artifact_binding.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_review.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_receipts.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_authorization.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_nonce_reservation.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_run_start.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_runner.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_result_writer.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_protocol.py"
      - "tests/unit/test_engine_v2_reference_solvation.py"
      - ".github/workflows/ci-engine-v2-reference-physics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-reference-physics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          sparse-checkout: |
            betelgeuze_engine_v2
            betelgeuze_engine
            betelgeuze_ai_md
            core
            tools/check_engine_v2_architecture.py
            .github/workflows/ci-engine-v2-reference-physics.yml
            tests/unit/test_engine_v2_reference_constrained_minimization.py
            tests/unit/test_engine_v2_reference_physics.py
            tests/unit/test_engine_v2_reference_pair_lj.py
            tests/unit/test_engine_v2_reference_diagnostics.py
            tests/unit/test_engine_v2_reference_forcefield_v2.py
            tests/unit/test_engine_v2_reference_minimization.py
            tests/unit/test_engine_v2_reference_minimization_validation_materializer.py
            tests/unit/test_engine_v2_reference_minimization_independent_oracle.py
            tests/unit/test_engine_v2_reference_minimization_validation_artifact_binding.py
            tests/unit/test_engine_v2_reference_minimization_validation_review.py
            tests/unit/test_engine_v2_reference_minimization_validation_receipts.py
            tests/unit/test_engine_v2_reference_minimization_validation_authorization.py
            tests/unit/test_engine_v2_reference_minimization_validation_nonce_reservation.py
            tests/unit/test_engine_v2_reference_minimization_validation_run_start.py
            tests/unit/test_engine_v2_reference_minimization_validation_runner.py
            tests/unit/test_engine_v2_reference_minimization_validation_result_writer.py
            tests/unit/test_engine_v2_reference_minimization_validation_protocol.py
            tests/unit/test_engine_v2_reference_solvation.py
            tests/unit/test_engine_v2_orchestrator_contract.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 cryptography==46.0.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Record exact source identity
        shell: bash
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, pathlib, platform, subprocess, sys
          roots = ('betelgeuze_engine_v2', 'betelgeuze_engine', 'betelgeuze_ai_md', 'core')
          files = sorted(p for root in roots for p in pathlib.Path(root).rglob('*.py'))
          files += sorted(pathlib.Path('tests/unit').glob('test_engine_v2_reference*.py'))
          files += [pathlib.Path('.github/workflows/ci-engine-v2-reference-physics.yml'),
                    pathlib.Path('tests/unit/test_engine_v2_orchestrator_contract.py'),
                    pathlib.Path('tools/check_engine_v2_architecture.py')]
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          payload = {
              'checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'checkout_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'pull_request_head_sha': event.get('pull_request', {}).get('head', {}).get('sha'),
              'python': sys.version, 'platform': platform.platform(),
              'source_sha256': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in files},
              'scope': 'synthetic contracts only; no public structure acquisition, fitting, protected qualification or customer execution',
          }
          pathlib.Path('reference-physics-source.json').write_text(json.dumps(payload, indent=2) + '\n')
          PYCODE

      - name: Compile and enforce architecture boundary
        run: |
          python -m compileall -q betelgeuze_engine_v2
          python tools/check_engine_v2_architecture.py

      - name: Run reference physics and composition contracts
        shell: bash
        run: |
          set +e
          python -m pytest -vv -x --junitxml=reference-physics-junit.xml \
            tests/unit/test_engine_v2_orchestrator_contract.py \
            tests/unit/test_engine_v2_reference_constrained_minimization.py \
            tests/unit/test_engine_v2_reference_diagnostics.py \
            tests/unit/test_engine_v2_reference_forcefield_v2.py \
            tests/unit/test_engine_v2_reference_minimization.py \
            tests/unit/test_engine_v2_reference_minimization_validation_materializer.py \
            tests/unit/test_engine_v2_reference_minimization_independent_oracle.py \
            tests/unit/test_engine_v2_reference_minimization_validation_artifact_binding.py \
            tests/unit/test_engine_v2_reference_minimization_validation_review.py \
            tests/unit/test_engine_v2_reference_minimization_validation_receipts.py \
            tests/unit/test_engine_v2_reference_minimization_validation_authorization.py \
            tests/unit/test_engine_v2_reference_minimization_validation_nonce_reservation.py \
            tests/unit/test_engine_v2_reference_minimization_validation_run_start.py \
            tests/unit/test_engine_v2_reference_minimization_validation_runner.py \
            tests/unit/test_engine_v2_reference_minimization_validation_result_writer.py \
            tests/unit/test_engine_v2_reference_minimization_validation_protocol.py \
            tests/unit/test_engine_v2_reference_physics.py \
            tests/unit/test_engine_v2_reference_pair_lj.py \
            tests/unit/test_engine_v2_reference_solvation.py > reference-physics.log 2>&1
          status=$?
          cat reference-physics.log
          exit "$status"

      - name: Upload reference physics diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-physics-py${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            reference-physics.log
            reference-physics-junit.xml
            reference-physics-source.json
            betelgeuze_engine/product/reference_pair_lj.py
            tests/unit/test_engine_v2_reference_pair_lj.py
            .github/workflows/ci-engine-v2-reference-physics.yml
          if-no-files-found: error
          retention-days: 7
