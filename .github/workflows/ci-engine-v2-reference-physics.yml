name: ci-engine-v2-reference-physics

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/physics/**"
      - "tests/unit/test_engine_v2_reference_physics.py"
      - ".github/workflows/ci-engine-v2-reference-physics.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/physics/**"
      - "tests/unit/test_engine_v2_reference_physics.py"
      - ".github/workflows/ci-engine-v2-reference-physics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-reference-physics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            betelgeuze_engine_v2
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_reference_physics.py
            tests/unit/test_engine_v2_orchestrator_contract.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        run: |
          python -m compileall -q betelgeuze_engine_v2
          python tools/check_engine_v2_architecture.py

      - name: Run reference physics and composition contracts
        shell: bash
        run: |
          set +e
          python -m pytest -vv -x \
            tests/unit/test_engine_v2_orchestrator_contract.py \
            tests/unit/test_engine_v2_reference_physics.py > reference-physics.log 2>&1
          status=$?
          cat reference-physics.log
          exit "$status"

      - name: Upload reference physics diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-physics-py${{ matrix.python-version }}-${{ github.run_id }}
          path: reference-physics.log
          if-no-files-found: error
          retention-days: 7
