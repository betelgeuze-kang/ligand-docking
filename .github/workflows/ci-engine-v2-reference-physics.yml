name: ci-engine-v2-reference-physics

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/physics/**"
      - "tests/unit/test_engine_v2_reference_constrained_minimization.py"
      - "tests/unit/test_engine_v2_reference_physics.py"
      - "tests/unit/test_engine_v2_reference_diagnostics.py"
      - "tests/unit/test_engine_v2_reference_forcefield_v2.py"
      - "tests/unit/test_engine_v2_reference_minimization.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_materializer.py"
      - "tests/unit/test_engine_v2_reference_minimization_independent_oracle.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_artifact_binding.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_review.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_protocol.py"
      - "tests/unit/test_engine_v2_reference_solvation.py"
      - ".github/workflows/ci-engine-v2-reference-physics.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/physics/**"
      - "tests/unit/test_engine_v2_reference_constrained_minimization.py"
      - "tests/unit/test_engine_v2_reference_physics.py"
      - "tests/unit/test_engine_v2_reference_diagnostics.py"
      - "tests/unit/test_engine_v2_reference_forcefield_v2.py"
      - "tests/unit/test_engine_v2_reference_minimization.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_materializer.py"
      - "tests/unit/test_engine_v2_reference_minimization_independent_oracle.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_artifact_binding.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_review.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_protocol.py"
      - "tests/unit/test_engine_v2_reference_solvation.py"
      - ".github/workflows/ci-engine-v2-reference-physics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-reference-physics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          sparse-checkout: |
            betelgeuze_engine_v2
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_reference_constrained_minimization.py
            tests/unit/test_engine_v2_reference_physics.py
            tests/unit/test_engine_v2_reference_diagnostics.py
            tests/unit/test_engine_v2_reference_forcefield_v2.py
            tests/unit/test_engine_v2_reference_minimization.py
            tests/unit/test_engine_v2_reference_minimization_validation_materializer.py
            tests/unit/test_engine_v2_reference_minimization_independent_oracle.py
            tests/unit/test_engine_v2_reference_minimization_validation_artifact_binding.py
            tests/unit/test_engine_v2_reference_minimization_validation_review.py
            tests/unit/test_engine_v2_reference_minimization_validation_protocol.py
            tests/unit/test_engine_v2_reference_solvation.py
            tests/unit/test_engine_v2_orchestrator_contract.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        run: |
          python -m compileall -q betelgeuze_engine_v2
          python tools/check_engine_v2_architecture.py

      - name: Run reference physics and composition contracts
        shell: bash
        run: |
          set +e
          python -m pytest -vv -x \
            tests/unit/test_engine_v2_orchestrator_contract.py \
            tests/unit/test_engine_v2_reference_constrained_minimization.py \
            tests/unit/test_engine_v2_reference_diagnostics.py \
            tests/unit/test_engine_v2_reference_forcefield_v2.py \
            tests/unit/test_engine_v2_reference_minimization.py \
            tests/unit/test_engine_v2_reference_minimization_validation_materializer.py \
            tests/unit/test_engine_v2_reference_minimization_independent_oracle.py \
            tests/unit/test_engine_v2_reference_minimization_validation_artifact_binding.py \
            tests/unit/test_engine_v2_reference_minimization_validation_review.py \
            tests/unit/test_engine_v2_reference_minimization_validation_protocol.py \
            tests/unit/test_engine_v2_reference_physics.py \
            tests/unit/test_engine_v2_reference_solvation.py > reference-physics.log 2>&1
          status=$?
          cat reference-physics.log
          exit "$status"

      - name: Upload reference physics diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-physics-py${{ matrix.python-version }}-${{ github.run_id }}
          path: reference-physics.log
          if-no-files-found: error
          retention-days: 7
