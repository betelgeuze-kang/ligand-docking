name: Fixed pose CPU development integrity

on:
  pull_request:
    paths:
      - '.github/workflows/ci-fixed-pose-cpu.yml'
      - 'betelgeuze_engine_v2/docking/fixed_pose.py'
      - 'betelgeuze_engine_v2/docking/authority.py'
      - 'betelgeuze_engine_v2/cli.py'
      - 'betelgeuze_engine_v2/cli_dispatch.py'
      - 'betelgeuze_engine_v2/fixed_pose_cli.py'
      - 'betelgeuze_engine_v2/physics/**'
      - 'betelgeuze_engine_v2/molecular/**'
      - 'betelgeuze_engine_v2/geometry/**'
      - 'tests/unit/test_engine_v2_fixed_pose*.py'
      - 'tests/unit/test_engine_v2_reference_physics.py'

permissions:
  contents: read

jobs:
  fixed-pose-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '.'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install CPU numerical test dependencies
        run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check new synthetic fixed poses and existing primitive regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -c /dev/null --noconftest -p no:cacheprovider -W error -vv \
            tests/unit/test_engine_v2_fixed_pose.py \
            tests/unit/test_engine_v2_fixed_pose_cli.py \
            tests/unit/test_engine_v2_reference_physics.py \
            --junitxml=fixed-pose-junit.xml 2>&1 | tee fixed-pose.log
      - name: Preserve numerical software evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixed-pose-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fixed-pose.log
            fixed-pose-junit.xml
          if-no-files-found: error
          retention-days: 7
