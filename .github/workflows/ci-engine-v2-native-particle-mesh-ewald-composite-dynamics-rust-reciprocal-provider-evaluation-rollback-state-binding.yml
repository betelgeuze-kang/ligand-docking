  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-native-particle-mesh-ewald-composite-dynamics-rust-reciprocal-provider-evaluation-rollback-state-binding-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  HIP_VISIBLE_DEVICES: ""
  ROCR_VISIBLE_DEVICES: ""

jobs:
  immutable-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact evidence graph
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0
      - name: Materialize exact PR 480 target and reviewed head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 3b301c25c019e132c8dabba10894d09d5ef25e98^{tree})" = "eacae3fe0453ccb1c8769d8e1753e3f22cd5ccca"
          git merge-base --is-ancestor 3b301c25c019e132c8dabba10894d09d5ef25e98 HEAD
          git fetch --no-tags --depth=1 origin refs/pull/480/head
          test "$(git rev-parse FETCH_HEAD)" = "9b5277aae0ba1335de04b37ad76b9b9e66db26df"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "eacae3fe0453ccb1c8769d8e1753e3f22cd5ccca"
      - name: Verify bounded successor evidence
        run: |
          python3 -m json.tool config/engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_evaluation_rollback_state_binding_profile_v1.json >/dev/null
          python3 -m json.tool config/engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_evaluation_rollback_state_binding_profile_v1_sources.json >/dev/null
          python3 -m pip install pytest==8.3.5
          python3 -m tools.verify_engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_evaluation_rollback_state_binding_v1
          python3 -m pytest -q tests/unit/test_engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_evaluation_rollback_state_binding_v1.py

  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out native sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false, clean: true, fetch-depth: 1}
      - name: Select frozen Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup override set 1.93.0
      - name: Synthetic release and sanitizer regressions
        run: |
          cmake -S . -B build/particle-mesh-ewald-rust-reciprocal-provider-evaluation-rollback-state-binding-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBG_ENABLE_HIP=OFF -DBG_ENABLE_HIP_SAFE=OFF
          cmake --build build/particle-mesh-ewald-rust-reciprocal-provider-evaluation-rollback-state-binding-release --target betelgeuze_engine_particle_mesh_reciprocal betelgeuze_engine_particle_mesh_ewald betelgeuze_engine_particle_mesh_ewald_composite betelgeuze_engine_particle_mesh_reciprocal_rust_adapter_transactionality betelgeuze_engine_particle_mesh_ewald_composite_dynamics --parallel 2
          engine_library="$(find build/particle-mesh-ewald-rust-reciprocal-provider-evaluation-rollback-state-binding-release -type f -name 'libbetelgeuze_engine.so.*' -print -quit)"
          test -n "$engine_library"
          nm --defined-only "$engine_library" | awk '{print $NF}' | grep -Fx 'bg_rust_particle_mesh_reciprocal_evaluate_energy_with_workspace_and_neutrality_sort_scratch_and_particle_assignment_scratch_v1'
          if nm -D --defined-only "$engine_library" | awk '{print $NF}' | grep -Fx 'bg_rust_particle_mesh_reciprocal_evaluate_energy_with_workspace_and_neutrality_sort_scratch_and_particle_assignment_scratch_v1'; then
            echo "private all-scratch energy symbol unexpectedly exported" >&2
            exit 1
          fi
          ctest --test-dir build/particle-mesh-ewald-rust-reciprocal-provider-evaluation-rollback-state-binding-release -R '^betelgeuze_engine_(particle_mesh_reciprocal|particle_mesh_ewald|particle_mesh_ewald_composite|particle_mesh_reciprocal_rust_adapter_transactionality|particle_mesh_ewald_composite_dynamics|export_allowlist)$' --output-on-failure
          cmake -S . -B build/particle-mesh-ewald-rust-reciprocal-provider-evaluation-rollback-state-binding-sanitize -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBG_ENABLE_HIP=OFF -DBG_ENABLE_HIP_SAFE=OFF -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build build/particle-mesh-ewald-rust-reciprocal-provider-evaluation-rollback-state-binding-sanitize --target betelgeuze_engine_particle_mesh_reciprocal betelgeuze_engine_particle_mesh_ewald betelgeuze_engine_particle_mesh_ewald_composite betelgeuze_engine_particle_mesh_reciprocal_rust_adapter_transactionality betelgeuze_engine_particle_mesh_ewald_composite_dynamics --parallel 2
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build/particle-mesh-ewald-rust-reciprocal-provider-evaluation-rollback-state-binding-sanitize -R '^betelgeuze_engine_(particle_mesh_reciprocal|particle_mesh_ewald|particle_mesh_ewald_composite|particle_mesh_reciprocal_rust_adapter_transactionality|particle_mesh_ewald_composite_dynamics)$' --output-on-failure

  rust-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/particle-mesh-ewald-rust-reciprocal-provider-evaluation-rollback-state-binding-cargo
    steps:
      - name: Check out Rust sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false, clean: true, fetch-depth: 1}
      - name: Select frozen Rust components
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.93.0
      - name: Existing Rust and direct-output regression, docs, and clean packages
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked --package betelgeuze-sys --test layout --test raw_smoke
          cargo test --manifest-path rust/Cargo.toml --locked --package betelgeuze-cpu-kernel particle_mesh_reciprocal
          cargo test --manifest-path rust/Cargo.toml --locked --package betelgeuze-runtime --lib particle_mesh_reciprocal
          cargo test --manifest-path rust/Cargo.toml --locked --package betelgeuze-runtime --test particle_mesh_reciprocal
          cargo test --manifest-path rust/Cargo.toml --locked --package betelgeuze-runtime --doc particle_mesh_reciprocal
          cargo test --manifest-path rust/Cargo.toml --locked --package betelgeuze-runtime --lib particle_mesh_ewald_composite_dynamics
          cargo test --manifest-path rust/Cargo.toml --locked --package betelgeuze-runtime --test particle_mesh_ewald_composite_dynamics
          cargo test --manifest-path rust/Cargo.toml --locked --package betelgeuze-runtime --doc particle_mesh_ewald_composite_dynamics
          cargo doc --manifest-path rust/Cargo.toml --locked --no-deps --package betelgeuze-sys --package betelgeuze-runtime
