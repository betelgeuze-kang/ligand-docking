name: ci-biodiscovery-protein-prep

on:
  pull_request:
    paths:
      - "betelgeuze_engine/biodiscovery/protein_prep.py"
      - "tests/unit/test_biodiscovery_protein_prep.py"
      - "tests/unit/test_biodiscovery_screening.py"
      - "tests/fixtures/tier_beta/**"
      - "requirements-base.txt"
      - ".github/workflows/ci-biodiscovery-protein-prep.yml"
  push:
    branches: [main]
    paths:
      - "betelgeuze_engine/biodiscovery/protein_prep.py"
      - "tests/unit/test_biodiscovery_protein_prep.py"
      - "tests/unit/test_biodiscovery_screening.py"
      - "tests/fixtures/tier_beta/**"
      - "requirements-base.txt"
      - ".github/workflows/ci-biodiscovery-protein-prep.yml"

permissions:
  contents: read

concurrency:
  group: protein-prep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protein-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out source on an ephemeral hosted runner
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install parser-only dependencies
        run: python -m pip install numpy==1.26.4 pytest==8.3.5
      - name: Run parser and input-validation regressions without the engine stack
        run: >-
          python -m pytest --confcutdir=tests/unit -q -W error
          tests/unit/test_biodiscovery_protein_prep.py
