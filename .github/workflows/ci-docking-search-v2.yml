name: ci-docking-search-v2

on:
  pull_request:
    paths:
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/betelgeuze-docking-search/**"
      - "rust_engine_v2/**"
      - "betelgeuze_engine_v2/docking/**"
      - "benchmarks/docking_search_v2/**"
      - "tools/run_docking_search_v2_development_cohort.py"
      - "tools/benchmarking/**"
      - "tests/unit/test_docking_search_v2_development_protocol.py"
      - "tests/unit/test_engine_v2_docking_search_v2_facade.py"
      - "tests/unit/test_run_docking_search_v2_development_cohort.py"
      - ".github/workflows/ci-docking-search-v2.yml"
  push:
    branches: ["main"]
    paths:
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/betelgeuze-docking-search/**"
      - "rust_engine_v2/**"
      - "betelgeuze_engine_v2/docking/**"
      - "benchmarks/docking_search_v2/**"
      - "tools/run_docking_search_v2_development_cohort.py"
      - "tools/benchmarking/**"
      - "tests/unit/test_docking_search_v2_development_protocol.py"
      - "tests/unit/test_engine_v2_docking_search_v2_facade.py"
      - "tests/unit/test_run_docking_search_v2_development_cohort.py"
      - ".github/workflows/ci-docking-search-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-docking-search-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-search-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            LICENSE
            rust

      - name: Report Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Format, lint, test, and package the independent search core
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml \
            -p betelgeuze-docking-search --all-targets --locked -- -D warnings
          cargo test --manifest-path rust/Cargo.toml \
            -p betelgeuze-docking-search --all-targets --locked
          cargo package --manifest-path \
            rust/betelgeuze-docking-search/Cargo.toml --locked

  development-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install pinned contract dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            pytest==8.3.5 \
            numpy==1.26.4 \
            pandas==2.3.3 \
            PyYAML==6.0.3 \
            rdkit-pypi==2022.9.5 \
            posebusters==0.3.1 \
            ruff==0.12.4 \
            torch==2.6.0

      - name: Compile and test the benchmark-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            benchmarks/docking_search_v2 \
            tools/benchmarking \
            tools/run_docking_search_v2_development_cohort.py
          python -m pytest -q \
            tests/unit/test_docking_search_v2_development_protocol.py \
            tests/unit/test_engine_v2_docking_search_v2_facade.py \
            tests/unit/test_run_docking_search_v2_development_cohort.py
          ruff check \
            benchmarks/docking_search_v2 \
            tools/benchmarking \
            tools/run_docking_search_v2_development_cohort.py \
            tests/unit/test_docking_search_v2_development_protocol.py \
            tests/unit/test_engine_v2_docking_search_v2_facade.py \
            tests/unit/test_run_docking_search_v2_development_cohort.py
          ruff format --check \
            benchmarks/docking_search_v2 \
            tools/benchmarking \
            tools/run_docking_search_v2_development_cohort.py \
            tests/unit/test_docking_search_v2_development_protocol.py \
            tests/unit/test_engine_v2_docking_search_v2_facade.py \
            tests/unit/test_run_docking_search_v2_development_cohort.py
          python tools/check_engine_v2_architecture.py
          python tools/check_external_oracle_architecture.py
