  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      BETELGEUZE_ENGINE_V2_DEVICE: cpu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install focused CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 PyYAML==6.0.3 numpy==1.26.4 pandas==2.3.3 h5py==3.11.0 psutil==7.2.1 rich==14.3.1 pydantic-settings==2.14.2 "build>=1.2,<2"
          python -m pip install rdkit==2025.9.6
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Validate capability contract
        run: |
          python - <<'PY'
          from copy import deepcopy
          import hashlib
          import json
          import pathlib
          import yaml

          path = pathlib.Path("config/independent_engine_v2_capabilities.yaml")
          document = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert document["schema_version"] == 1
          assert document["claim_policy"]["customer_execution_enabled"] is False
          assert document["claim_policy"]["gpu_acceleration_claim_allowed"] is False
          assert document["claim_policy"]["docking_accuracy_claim_allowed"] is False
