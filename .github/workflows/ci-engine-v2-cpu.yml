              assert mmcif_receipt.atom_site_header_profile == "core12_pdbx_formal_charge"
              assert mmcif_receipt.atom_site_header_count == 12
              assert mmcif_receipt.output_token_count == 26
              assert mmcif_round_trip.write_result.payload.splitlines()[-2].split()[-2:] == [b"+01", charge_token.encode("ascii")]
