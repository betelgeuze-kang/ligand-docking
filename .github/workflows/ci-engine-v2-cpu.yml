      - name: Run pinned RDKit V2.1 ingest and SMILES stereo writer corpora
        env:
          BETELGEUZE_REQUIRE_PINNED_RDKIT: "1"
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from rdkit import rdBase
          from betelgeuze_engine_v2.molecular import smiles

          assert version("rdkit") == "2025.9.6"
          assert rdBase.rdkitVersion == "2025.09.6"
          _, product_rd_base = smiles._import_rdkit()
          assert product_rd_base.rdkitVersion == "2025.09.6"
          assert smiles._version_key(product_rd_base.rdkitVersion) == (2025, 9, 6)
          PY
          python -m pytest -q \
            tests/unit/test_engine_v2_ingest_corpus.py \
            tests/unit/test_engine_v2_smiles_e_z_writer_corpus.py \
            tests/unit/test_engine_v2_smiles_r_s_writer_corpus.py

      - name: Build and import wheel in an isolated environment
        run: |
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          assert "betelgeuze_engine_v2/forcefield/parameters.py" in names
          assert "betelgeuze_engine_v2/forcefield/fitting.py" in names
          assert "betelgeuze_engine_v2/forcefield/harmonic_diagnostics.py" in names
          assert "betelgeuze_engine_v2/forcefield/harmonic_virial_diagnostics.py" in names
          assert "betelgeuze_engine_v2/forcefield/harmonic_minimization.py" in names
