                  "data_isolated_wheel_mmcif_charge\n#\nloop_\n"
                  + "\n".join(mmcif_core12_headers)
                  + f"\nATOM 1 C CA GLY A 1 0.0 0.0 0.0 +01 {charge_token}\n#\n"
              ).encode("ascii")

