          def isolated_cycloalkane_source(carbon_count):
              elements = ["C"] * carbon_count + ["H"] * (2 * carbon_count)
              edges = {
                  tuple(sorted((index, (index + 1) % carbon_count)))
                  for index in range(carbon_count)
              }
              for carbon_index in range(carbon_count):
                  edges.add((carbon_index, carbon_count + 2 * carbon_index))
                  edges.add((carbon_index, carbon_count + 2 * carbon_index + 1))
              atom_lines = [
                  f"{float(index):10.4f}{0.0:10.4f}{0.0:10.4f} {element:<3}{0:2d}{0:3d}" + "  0" * 10
                  for index, element in enumerate(elements)
              ]
              bond_lines = [
                  f"{atom_i + 1:3d}{atom_j + 1:3d}{1:3d}{0:3d}"
                  for atom_i, atom_j in sorted(edges)
              ]
              counts = f"{len(elements):3d}{len(edges):3d}  0  0  0  0  0  0  0  0999 V2000"
              return ("\n".join((
                  f"isolated-wheel-cycloalkane-c{carbon_count}",
                  "betelgeuze-v2",
                  "installed graph-profile smoke",
                  counts,
                  *atom_lines,
                  *bond_lines,
                  "M  END",
                  "$$$$",
                  "",
              ))).encode("ascii")

