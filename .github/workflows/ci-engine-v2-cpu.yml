permissions:
  contents: read

concurrency:
  group: ci-engine-v2-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      BETELGEUZE_ENGINE_V2_DEVICE: cpu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install focused CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 PyYAML==6.0.3 numpy==1.26.4 pandas==2.3.3 h5py==3.11.0 psutil==7.2.1 rich==14.3.1 pydantic-settings==2.14.2 "build>=1.2,<2"
          python -m pip install rdkit==2025.9.6
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Validate capability contract
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          path = pathlib.Path("config/independent_engine_v2_capabilities.yaml")
          document = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert document["schema_version"] == 1
          assert document["claim_policy"]["customer_execution_enabled"] is False
          assert document["claim_policy"]["gpu_acceleration_claim_allowed"] is False
          assert document["claim_policy"]["docking_accuracy_claim_allowed"] is False
          assert document["claim_policy"]["independent_commercial_solver_claim_allowed"] is False
          assert document["claim_policy"]["broad_platform_claim_allowed"] is False
          assert document["geometry_policy"]["stereo_parser_coverage_validated"] is False
          assert document["geometry_policy"]["stereo_validator_enforcement_complete"] is False
          assert document["complexity_contract"]["claim_state"] == "conditional_contract_only"
          capabilities = {row["id"]: row for row in document["capabilities"]}
          molecular_identity = capabilities["v2_contracts_and_molecular_identity"]
          assert molecular_identity["current_state"] == "scaffold_with_strict_canonical_ingest_and_sdf_v2000_pdb_mmcif_and_smiles_representable_subset_writers"
          assert molecular_identity["scientific_validity_green"] is False
          assert molecular_identity["benchmark_validity_green"] is False
          assert molecular_identity["execution_enabled"] is False
          assert molecular_identity["strict_sdf_v2000_canonical_writer_contract_implemented"] is True
          assert molecular_identity["strict_sdf_v2000_representable_subset_round_trip_evidence_ready"] is True
          assert molecular_identity["strict_sdf_v2000_simple_named_data_field_envelope_contract_implemented"] is True
          assert molecular_identity["strict_sdf_v2000_simple_named_data_field_round_trip_evidence_ready"] is True
          assert molecular_identity["strict_sdf_v2000_simple_named_data_field_corpus_evidence_ready"] is True
          assert molecular_identity["strict_sdf_v2000_simple_named_data_field_envelope_version"] == "1.0.0"
          assert molecular_identity["strict_sdf_v2000_simple_named_data_field_projection_scope"] == "ordered_opaque_ascii_simple_named_sd_data_items_only"
          for field in (
              "strict_sdf_v2000_simple_named_data_field_source_authenticated",
              "strict_sdf_v2000_simple_named_data_field_semantics_interpreted",
              "strict_sdf_v2000_simple_named_data_field_chemistry_interpreted",
              "strict_sdf_v2000_simple_named_data_field_preparation_ready",
              "strict_sdf_v2000_simple_named_data_field_parameterability_assessed",
              "strict_sdf_v2000_simple_named_data_field_simulation_ready",
              "strict_sdf_v2000_simple_named_data_field_runtime_eligible",
              "strict_sdf_v2000_simple_named_data_field_claim_safe",
          ):
              assert molecular_identity[field] is False
          assert molecular_identity["strict_pdb_parser_owned_writer_contract_implemented"] is True
          assert molecular_identity["strict_pdb_representable_subset_round_trip_evidence_ready"] is True
          assert molecular_identity["strict_pdb_parser_owned_exact_cryst1_round_trip_evidence_ready"] is True
          assert molecular_identity["strict_pdb_single_model_id1_source_reported_missingness_semantic_round_trip_evidence_ready"] is True
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_envelope_contract_implemented"] is True
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_round_trip_evidence_ready"] is True
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_corpus_evidence_ready"] is True
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_envelope_version"] == "1.0.0"
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_parser_version"] == "1.0.0"
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_writer_version"] == "1.0.0"
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_base_parser_version"] == "1.8.0"
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_base_writer_version"] == "1.2.0"
          for field in (
              "strict_pdb_ordered_conect_source_declaration_base_pedigree_bound",
              "strict_pdb_ordered_conect_source_declaration_exact_artifact_chain_bound",
              "strict_pdb_ordered_conect_source_declaration_nested_evidence_immutable",
              "strict_pdb_ordered_conect_source_declaration_single_model_id1_bound",
              "strict_pdb_ordered_conect_source_declaration_live_serial_reference_bound",
              "strict_pdb_ordered_conect_source_declaration_carrier_bondless",
          ):
              assert molecular_identity[field] is True
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_projection_scope"] == "ordered_source_directed_conect_rows_and_target_slot_occurrences_only"
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_corpus_manifest_payload_sha256"] == "c6346f7b046d157a70fb1629dfe3e7f3c13a4b9b079474961a613ec436c38a75"
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_max_input_bytes"] == 64 * 1024 * 1024
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_max_output_bytes"] == 64 * 1024 * 1024
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_max_input_lines"] == 250000
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_max_output_lines"] == 250000
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_max_records"] == 20000
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_max_target_occurrences"] == 80000
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_max_projection_bytes"] == 16 * 1024 * 1024
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_max_source_id_utf8_bytes"] == 4096
          assert molecular_identity["strict_pdb_ordered_conect_source_declaration_output_line_characters"] == 80
          for field in (
              "strict_pdb_ordered_conect_source_declaration_source_authenticated",
              "strict_pdb_ordered_conect_source_declaration_declaration_authoritative",
              "strict_pdb_ordered_conect_source_declaration_bond_topology_interpreted",
              "strict_pdb_ordered_conect_source_declaration_bond_kind_interpreted",
              "strict_pdb_ordered_conect_source_declaration_bond_order_interpreted",
