              "strict_pdb_ordered_conect_source_declaration_chemistry_interpreted",
              "strict_pdb_ordered_conect_source_declaration_preparation_ready",
              "strict_pdb_ordered_conect_source_declaration_parameterability_assessed",
              "strict_pdb_ordered_conect_source_declaration_physics_supported",
              "strict_pdb_ordered_conect_source_declaration_runtime_eligible",
              "strict_pdb_ordered_conect_source_declaration_simulation_ready",
              "strict_pdb_ordered_conect_source_declaration_execution_authorized",
              "strict_pdb_ordered_conect_source_declaration_claim_safe",
              "strict_pdb_ordered_conect_source_declaration_bare_system_preserves_declaration",
              "strict_pdb_ordered_conect_source_declaration_general_pdb_round_trip_evidence_ready",
              "strict_pdb_ordered_conect_source_declaration_all_format_round_trip_evidence_ready",
          ):
              assert molecular_identity[field] is False
          assert molecular_identity["strict_mmcif_parser_owned_writer_contract_implemented"] is True
          assert molecular_identity["strict_mmcif_atom_site_core_round_trip_evidence_ready"] is True
          assert molecular_identity["strict_mmcif_atom_site_core_and_formal_charge_round_trip_evidence_ready"] is True
          assert molecular_identity["strict_mmcif_atom_site_insertion_code_round_trip_evidence_ready"] is True
          assert molecular_identity["strict_mmcif_atom_site_bare_uncertainty_free_occupancy_round_trip_evidence_ready"] is True
          assert molecular_identity["strict_mmcif_atom_site_uncertainty_free_occupancy_b_factor_pair_round_trip_evidence_ready"] is True
          assert molecular_identity["strict_mmcif_common_core21_label_auth_entity_identity_round_trip_evidence_ready"] is True
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_envelope_contract_implemented"] is True
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_round_trip_evidence_ready"] is True
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_corpus_evidence_ready"] is True
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_envelope_version"] == "1.0.0"
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_parser_version"] == "1.0.0"
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_writer_version"] == "1.0.0"
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_base_parser_version"] == "1.9.0"
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_base_writer_version"] == "1.5.0"
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_base_pedigree_bound"] is True
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_exact_artifact_chain_bound"] is True
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_nested_evidence_immutable"] is True
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_single_model_id1_bound"] is True
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_nonperiodic_angstrom_state_bound"] is True
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_expected_plan_live_state_bound"] is True
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_carrier_topology_copy_bound"] is True
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_projection_scope"] == "source_declared_rigid_operator_expansion_and_expanded_identity_coordinates_only"
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_corpus_manifest_payload_sha256"] == "39a9d73e74ef71b7d740f4751edb35a78439eac059ec0f93f7b9eb5e40edffc5"
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_max_input_bytes"] == 64 * 1024 * 1024
          assert molecular_identity["strict_mmcif_explicit_biological_assembly_max_canonical_output_bytes"] == 64 * 1024 * 1024
