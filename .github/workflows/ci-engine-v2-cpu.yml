          assert bounded_ring_ez.write_result.receipt.typed_ez_bond_count == 1
          assert bounded_ring_ez.write_result.receipt.directional_source_bond_count == 2
          assert bounded_ring_ez.report.to_dict()["ez_stereo_projection_sha256_equal"] is True

          bounded_exocyclic_ez = round_trip_smiles_source(
              b"F/C=C1/CC1Cl",
              source_id="isolated-wheel-smiles-bounded-exocyclic-ez",
          )
          assert bounded_exocyclic_ez.write_result.payload == b"F/C=C1/CC1Cl"
          assert bounded_exocyclic_ez.write_result.receipt.ring_size == 3
          assert bounded_exocyclic_ez.write_result.receipt.typed_ez_bond_count == 1

          normalized_forest = round_trip_smiles_source(
              b"C.C-C",
              source_id="isolated-wheel-smiles-forest-normalization",
          )
          assert normalized_forest.write_result.payload == b"C.CC"
          assert normalized_forest.write_result.receipt.parent_source_sha256 == sha256(b"C.C-C").hexdigest()
          assert normalized_forest.write_result.receipt.output_source_sha256 == sha256(b"C.CC").hexdigest()
          assert normalized_forest.write_result.receipt.fragment_count == 2

          normalized_charge = round_trip_smiles_source(
              b"[Cl-1]",
              source_id="isolated-wheel-smiles-charge-normalization",
          )
          assert normalized_charge.write_result.payload == b"[Cl-]"
          assert normalized_charge.write_result.receipt.formal_charge_profile_id == "ordered_acyclic_organic_forest_bounded_formal_charge/1.0.0"
          assert normalized_charge.write_result.receipt.charged_source_atom_count == 1
          assert normalized_charge.write_result.receipt.formal_charge_total == -1

          normalized_ring = round_trip_smiles_source(
              b"C%99CC%99",
              source_id="isolated-wheel-smiles-ring-normalization",
          )
          assert normalized_ring.write_result.payload == b"C1CC1"
          ring_receipt = normalized_ring.write_result.receipt
          ring_receipt_document = ring_receipt.to_dict()
          assert ring_receipt.cycle_projection_schema_id == SMILES_COMPONENT_CYCLE_PROJECTION_SCHEMA_ID
          assert ring_receipt.cycle_profile_id == "at_most_one_simple_nonaromatic_3_8_member_all_single_bond_source_ring/1.0.0"
          assert ring_receipt.ring_bond_profile_id == "all_single_nonaromatic_stereo_none/1.0.0"
          assert ring_receipt.ring_double_bond_count == 0
          assert ring_receipt.ring_double_source_bond_index is None
          assert ring_receipt.formal_charge_profile_id == "ordered_forest_with_one_simple_unicyclic_component_bounded_formal_charge/1.0.0"
          assert ring_receipt.source_bond_count == 3
          assert ring_receipt.source_tree_edge_count == 2
          assert ring_receipt.ring_closure_count == 1
          assert ring_receipt.cyclic_component_count == 1
          assert ring_receipt.ring_size == 3
          assert ring_receipt.ring_closure_source_bond_index == 2
          assert ring_receipt.bond_count == ring_receipt.expanded_atom_count
          assert ring_receipt_document["resource_limits"]["ring_components"] == 1
          assert ring_receipt_document["resource_limits"]["ring_size_min"] == 3
          assert ring_receipt_document["resource_limits"]["ring_size_max"] == 8
          ring_report = normalized_ring.report.to_dict()
          assert ring_report["cycle_projection_sha256_equal"] is True
          assert ring_report["input_cycle_projection_sha256"] == ring_report["reparsed_cycle_projection_sha256"]
          assert ring_report["preparation_ready"] is False
          assert ring_report["parameterability_assessed"] is False
          assert ring_report["simulation_ready"] is False
          assert ring_report["claim_safe"] is False

          normalized_aromatic = round_trip_smiles_source(
              b"C1=CC=[NH+]C=C1",
              source_id="isolated-wheel-smiles-aromatic-normalization",
          )
          assert normalized_aromatic.write_result.payload == b"c1cc[nH+]cc1"
          aromatic_receipt = normalized_aromatic.write_result.receipt
          assert aromatic_receipt.cycle_projection_schema_id == SMILES_COMPONENT_CYCLE_PROJECTION_SCHEMA_ID
          assert aromatic_receipt.aromatic_projection_schema_id == "betelgeuze.smiles_aromatic_ring_projection/1.0.0"
          assert aromatic_receipt.cycle_profile_id == "at_most_one_simple_fully_aromatic_5_6_member_b_c_n_o_p_s_source_ring/1.0.0"
          assert aromatic_receipt.ring_bond_profile_id == "all_order_1_5_aromatic_stereo_none/1.0.0"
          assert aromatic_receipt.aromatic_source_atom_count == 6
          assert aromatic_receipt.aromatic_source_bond_count == 6
          assert aromatic_receipt.bracket_explicit_hydrogen_count == 1
          assert aromatic_receipt.formal_charge_total == 1
          aromatic_report = normalized_aromatic.report.to_dict()
          assert aromatic_report["aromatic_projection_sha256_equal"] is True
          assert aromatic_report["input_aromatic_projection_sha256"] == aromatic_report["reparsed_aromatic_projection_sha256"]
          assert aromatic_report["preparation_ready"] is False
          assert aromatic_report["parameterability_assessed"] is False
          assert aromatic_report["simulation_ready"] is False
          assert aromatic_report["claim_safe"] is False

          for source in (
              b"C",
              b"CCO",
              b"CC(C)C",
              b"ClCCl",
              b"C=C",
              b"C#C",
              b"C#N",
              b"O=C=O",
              b"CC#N",
              b"CC(C)=O",
              b"C=C(C)O",
              b"C.C",
              b"C.CC",
              b"C.CC(C)=O",
              b"C#N.C=C",
              b"CCO.ClCCl",
              b"CC.CC",
              b"C=C.C=C",
              b"C.C.C",
              b"C.N.O",
              b"[Cl-]",
              b"[F-]",
              b"C[O-]",
              b"O=C[O-]",
              b"CC(=O)[O-]",
              b"C[N+](C)(C)C",
              b"CC[N+](C)(C)C",
              b"C[N+](C)(C)C.[Cl-]",
              b"[Cl-].[F-]",
              b"C.C[O-]",
              b"C1CC1",
              b"C1CCC1",
              b"C1CCCC1",
              b"C1CCCCC1",
              b"C1CCCCCC1",
              b"C1CCCCCCC1",
              b"CC1CCCCC1",
              b"FC1CCCCC1",
              b"C1CCOC1",
              b"C1CCNCC1",
              b"C1CCSCC1",
              b"C[N+]1(C)CCCCC1",
              b"C=C1CCCCC1",
              b"C.C1CC1",
              b"C1CC1.CC",
              b"C1CC1.[Cl-]",
              b"C1=CC1",
              b"C1=CCCCC1",
              b"C1=CCCCCCC1",
              b"CC1=CCCCC1",
              b"FC1=CCCCC1",
              b"C1=CCOCC1",
              b"C1=CCNCC1",
              b"C1=CCSCC1",
              b"C[N+]1(C)CC=CCC1",
              b"[O-]C1=CCCCC1",
              b"C.C1=CCCCC1",
              b"C1=CCCCC1.CC",
              b"c1ccccc1",
              b"c1ccncc1",
              b"c1cc[nH]c1",
              b"c1ccoc1",
              b"c1ccsc1",
              b"b1ccccc1",
              b"c1cc[pH]c1",
              b"[Cl-].c1cc[nH+]cc1",
              b"Cc1ccc(C)cc1",
              b"F/C=C/F",
              b"F/C=C\\F",
              b"F/C=C1/CC1Cl",
              b"CC1C/C=C/CCCC1",
              b"F/C=C/C1C/C=C/CCCC1",
          ):
              fixed_point = round_trip_smiles_source(source)
              assert fixed_point.write_result.payload == source
              assert serialize_smiles(fixed_point.reparsed_ingest.system) == source

          normalized_double_ring = round_trip_smiles_source(b"C%10=CCCCC%10")
          assert normalized_double_ring.write_result.payload == b"C1=CCCCC1"
          double_ring_receipt = normalized_double_ring.write_result.receipt
          assert double_ring_receipt.cycle_projection_schema_id == SMILES_COMPONENT_CYCLE_PROJECTION_SCHEMA_ID
          assert double_ring_receipt.cycle_profile_id == "at_most_one_simple_nonaromatic_3_8_member_source_ring_with_exactly_one_nonclosure_double_bond/1.0.0"
          assert double_ring_receipt.ring_bond_profile_id == "one_nonclosure_double_otherwise_single_nonaromatic_stereo_none/1.0.0"
          assert double_ring_receipt.ring_double_bond_count == 1
          assert double_ring_receipt.ring_double_source_bond_index == 0
          assert double_ring_receipt.ring_closure_source_bond_index == 5
          assert normalized_double_ring.source_ingest.coverage.chemistry_supported is False
          assert normalized_double_ring.source_ingest.coverage.preparation_ready is False
          assert normalized_double_ring.source_ingest.coverage.claim_safe is False

          ordered_forest = round_trip_smiles_source(b"C.CC")
          ordered_forest_receipt = ordered_forest.write_result.receipt
          assert ordered_forest_receipt.fragment_count == 2
          assert ordered_forest_receipt.bond_count == ordered_forest_receipt.expanded_atom_count - 2
          assert ordered_forest_receipt.to_dict()["resource_limits"]["fragments"] == 256
          assert ordered_forest.source_ingest.system.residues[0].atom_indices == (0, 3, 4, 5, 6)
          assert ordered_forest.source_ingest.system.residues[1].atom_indices == (1, 2, 7, 8, 9, 10, 11, 12)
          assert "disconnected_fragment_roles_not_assessed" in ordered_forest.source_ingest.coverage.blockers

          charged_forest = round_trip_smiles_source(b"C[N+](C)(C)C.[Cl-]")
          charged_receipt = charged_forest.write_result.receipt
          assert charged_receipt.charged_source_atom_count == 2
          assert charged_receipt.formal_charge_total == 0
          assert charged_forest.source_ingest.coverage.formal_charge_total == 0
          assert charged_forest.source_ingest.coverage.chemistry_supported is False
          assert charged_forest.source_ingest.coverage.preparation_ready is False
          assert charged_forest.source_ingest.coverage.claim_safe is False

          for source, expected_code in (
              (b"OCC", "normalized_smiles_hash_mismatch"),
              (b"CC(=O)C", "normalized_smiles_hash_mismatch"),
              (b"CC(O)=C", "normalized_smiles_hash_mismatch"),
              (b"N#CC", "normalized_smiles_hash_mismatch"),
              (b"CC.C", "normalized_smiles_hash_mismatch"),
              (b"C=C.C#N", "normalized_smiles_hash_mismatch"),
              (b"ClCCl.CCO", "normalized_smiles_hash_mismatch"),
              (b"C.O.N", "normalized_smiles_hash_mismatch"),
              (b"C.N#C", "normalized_smiles_hash_mismatch"),
              (b"N#C.C=C", "normalized_smiles_hash_mismatch"),
              (b"[Na+].[Cl-]", "unsupported_element"),
              (b"[NH4+].[Cl-]", "unsupported_bracket_hydrogen"),
              (b"C[S+2](C)(C)C", "unsupported_formal_charge"),
              (b"C1CCCCCCCC1", "unsupported_ring_size"),
              (b"C1CCCCC=1", "unsupported_ring_closure_bond"),
              (b"C1=CCCC=C1", "unsupported_ring_multiple_bond_count"),
              (b"C1#CCCCC1", "unsupported_ring_multiple_bond_order"),
              (b"C1C=CCCC1", "normalized_smiles_hash_mismatch"),
              (b"C1CCC2CCCCC2C1", "unsupported_source_cycle_rank"),
              (b"C1CCC2(CC1)CCCC2", "unsupported_source_cycle_rank"),
              (b"C12CC1CC2", "unsupported_source_cycle_rank"),
              (b"C1CC1.C1CC1", "unsupported_source_cycle_rank"),
              (b"c1ccc2ccccc2c1", "unsupported_source_cycle_rank"),
              (b"c1ccccc1-c2ccccc2", "unsupported_source_cycle_rank"),
              (b"c1ccccc1.c1ccccc1", "unsupported_source_cycle_rank"),
              (b"[cH]1ccccc1", "unsupported_aromatic_atom_state"),
          ):
              try:
                  write_smiles(parse_smiles(source).system)
              except SmilesWriteError as exc:
                  assert exc.code == expected_code
              else:
                  raise AssertionError(f"unsupported SMILES state was emitted: {source!r}")

          assert callable(analyze_linear_alkane_topological_environment_typing)
          assert callable(analyze_linear_alkane_term_pair_inventory)
          assert callable(analyze_linear_alkane_c1_c4_parameter_assignment)
          assert callable(analyze_linear_alkane_c1_c4_evaluation_method_binding)
          assert callable(analyze_linear_alkane_c1_c4_scalar_energy_diagnostic)
          assert callable(compile_linear_alkane_c1_c4_reference_potential)
          assert callable(evaluate_linear_alkane_c1_c4_reference_kernel)
          assert callable(serialize_linear_alkane_c1_c4_evaluation_method)
          assert callable(serialize_linear_alkane_c1_c4_evaluation_method_binding_report)
          assert callable(serialize_linear_alkane_c1_c4_scalar_energy_diagnostic_report)
          assert callable(serialize_linear_alkane_c1_c4_reference_kernel_result)
          assert callable(serialize_linear_alkane_c1_c4_parameter_assignment_report)
          PY

      - name: Record non-promotion boundary
        run: |
          echo "Engine v2 CPU compilation and unit tests are implementation evidence only."
          echo "GPU, benchmark, scientific-validity, and product claims remain blocked."
