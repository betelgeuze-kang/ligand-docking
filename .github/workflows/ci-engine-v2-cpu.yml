          def isolated_terminal_monoalkene_source(carbon_count, *, double_left=0):
              assert carbon_count >= 2
              assert 0 <= double_left < carbon_count - 1
              carbon_edges = [
                  (index, index + 1, 2 if index == double_left else 1)
                  for index in range(carbon_count - 1)
              ]
              integer_valence = [0] * carbon_count
              for atom_i, atom_j, bond_type in carbon_edges:
                  integer_valence[atom_i] += bond_type
                  integer_valence[atom_j] += bond_type
              elements = ["C"] * carbon_count
              edges = list(carbon_edges)
              for carbon_index, value in enumerate(integer_valence):
                  for _ in range(4 - value):
                      elements.append("H")
                      edges.append((carbon_index, len(elements) - 1, 1))
              atom_lines = [
                  f"{float(index):10.4f}{float(index % 2):10.4f}{0.0:10.4f} {element:<3}{0:2d}{0:3d}" + "  0" * 10
                  for index, element in enumerate(elements)
              ]
              bond_lines = [
                  f"{atom_i + 1:3d}{atom_j + 1:3d}{bond_type:3d}{0:3d}"
                  for atom_i, atom_j, bond_type in sorted(edges)
              ]
              counts = f"{len(elements):3d}{len(edges):3d}  0  0  0  0  0  0  0  0999 V2000"
              return ("\n".join((
                  f"isolated-wheel-terminal-monoalkene-c{carbon_count}",
                  "betelgeuze-v2",
                  "installed graph-profile smoke",
                  counts,
                  *atom_lines,
                  *bond_lines,
                  "M  END",
                  "$$$$",
                  "",
              ))).encode("ascii")

