name: fix-v2-mmcif-nonpoly-duplicate-contracts

on:
  pull_request:
    paths:
      - ".github/workflows/fix-v2-mmcif-nonpoly-duplicate-contracts.yml"

permissions:
  contents: write

concurrency:
  group: fix-v2-mmcif-nonpoly-duplicate-contracts
  cancel-in-progress: false

jobs:
  correct-contracts:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'betelgeuze-kang' &&
      github.head_ref == 'codex/v2-mmcif-nonpoly-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/v2-mmcif-nonpoly-identity
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Align duplicate tests with bounded error contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/test_engine_v2_mmcif_nonpoly_identity.py")
          source = path.read_text(encoding="utf-8")
          replacements = {
              '_error(duplicate_component, "duplicate_component_identity")':
                  '_error(duplicate_component, "duplicate_component_id")',
              '_error(duplicate_entity, "duplicate_entity_identity")':
                  '_error(duplicate_entity, "duplicate_entity_id")',
              '_error(duplicate_instance, "duplicate_instance_identity")':
                  '_error(duplicate_instance, "duplicate_nonpoly_scheme_key")',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"unexpected duplicate-contract replacement count: {count} for {old!r}"
                  )
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")
          Path(".github/workflows/fix-v2-mmcif-nonpoly-duplicate-contracts.yml").unlink()
          PY
          python -m py_compile tests/unit/test_engine_v2_mmcif_nonpoly_identity.py
          git diff --check

      - name: Commit corrected tests and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(v2): align nonpoly duplicate error contracts"
          git push origin HEAD:codex/v2-mmcif-nonpoly-identity
