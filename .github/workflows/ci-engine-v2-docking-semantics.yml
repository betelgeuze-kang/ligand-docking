name: ci-engine-v2-docking-semantics

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/contracts/**"
      - "betelgeuze_engine_v2/benchmark/**"
      - "betelgeuze_engine_v2/docking/**"
      - "betelgeuze_engine_v2/physics/registry.py"
      - "betelgeuze_engine_v2/physics/reference_forcefield.py"
      - "betelgeuze_engine_v2/physics/reference_minimization.py"
      - "betelgeuze_engine_v2/physics/reference_parameters.py"
      - "config/engine_v2_public_redocking_contamination_registry.json"
      - "tests/unit/test_engine_v2_docking_semantics.py"
      - "tests/unit/test_engine_v2_conformer_ensemble_stage3.py"
      - "tests/unit/test_engine_v2_guided_proposal_stage4.py"
      - "tests/unit/test_engine_v2_scorer_v1_stage5.py"
      - "tests/unit/test_engine_v2_energy_local_refinement_stage6.py"
      - "tests/unit/test_engine_v2_public_redocking_benchmark_stage7.py"
      - "tests/unit/test_engine_v2_public_redocking_runner_stage7.py"
      - "benchmarks/__init__.py"
      - "benchmarks/oracles/**"
      - "tools/run_engine_v2_public_redocking_300.py"
      - ".github/workflows/ci-engine-v2-docking-semantics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-docking-semantics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformer-ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: "--confcutdir=tests/unit"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
          sparse-checkout: |
            betelgeuze_engine_v2
            benchmarks/__init__.py
            benchmarks/oracles
            tools/run_engine_v2_public_redocking_300.py
            tests/unit/test_engine_v2_conformer_ensemble_stage3.py
            tests/unit/test_engine_v2_public_redocking_runner_stage7.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Install pinned conformer capability dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install pytest==8.3.5 numpy==1.26.4 rdkit-pypi==2022.9.5
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run deterministic conformer ensemble contracts
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_conformer_ensemble_stage3.py \
            tests/unit/test_engine_v2_public_redocking_runner_stage7.py

  docking-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
          sparse-checkout: |
            betelgeuze_engine_v2
            config/engine_v2_public_redocking_contamination_registry.json
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_bounded_scaffolds.py
            tests/unit/test_engine_v2_input_identity.py
            tests/unit/test_engine_v2_docking_semantics.py
            tests/unit/test_engine_v2_guided_proposal_stage4.py
            tests/unit/test_engine_v2_scorer_v1_stage5.py
            tests/unit/test_engine_v2_energy_local_refinement_stage6.py
            tests/unit/test_engine_v2_public_redocking_benchmark_stage7.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce package boundary
        run: |
          python -m compileall -q betelgeuze_engine_v2
          python tools/check_engine_v2_architecture.py

      - name: Run inherited and docking semantics contracts
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_bounded_scaffolds.py \
            tests/unit/test_engine_v2_input_identity.py \
            tests/unit/test_engine_v2_docking_semantics.py \
            tests/unit/test_engine_v2_guided_proposal_stage4.py \
            tests/unit/test_engine_v2_scorer_v1_stage5.py \
            tests/unit/test_engine_v2_energy_local_refinement_stage6.py \
            tests/unit/test_engine_v2_public_redocking_benchmark_stage7.py
