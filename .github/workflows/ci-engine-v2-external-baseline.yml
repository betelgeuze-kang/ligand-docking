name: ci-engine-v2-external-baseline

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/benchmark/**"
      - "tests/unit/test_engine_v2_external_baseline.py"
      - ".github/workflows/ci-engine-v2-external-baseline.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/benchmark/**"
      - "tests/unit/test_engine_v2_external_baseline.py"
      - ".github/workflows/ci-engine-v2-external-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-external-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            betelgeuze_engine_v2
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_external_baseline.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        run: |
          python -m compileall -q betelgeuze_engine_v2
          python tools/check_engine_v2_architecture.py

      - name: Run external baseline receipt contracts
        run: python -m pytest -q tests/unit/test_engine_v2_external_baseline.py
