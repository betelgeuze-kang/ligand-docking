name: ci-engine-v2-d1-development

on:
  pull_request:
    paths:
      - "config/engine_v2_d1_development_profile_v1.json"
      - "docs/engine_v2_d1_development_v1.md"
      - "tools/run_engine_v2_d1_development_v1.py"
      - "tools/verify_engine_v2_d1_development_v1.py"
      - "tests/unit/test_engine_v2_d1_development_v1.py"
      - ".github/workflows/ci-engine-v2-d1-development.yml"
  push:
    branches:
      - main
    paths:
      - "config/engine_v2_d1_development_profile_v1.json"
      - "docs/engine_v2_d1_development_v1.md"
      - "tools/run_engine_v2_d1_development_v1.py"
      - "tools/verify_engine_v2_d1_development_v1.py"
      - "tests/unit/test_engine_v2_d1_development_v1.py"
      - ".github/workflows/ci-engine-v2-d1-development.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-d1-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  d1-development:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out D1 development surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            config/engine_v2_d1_development_profile_v1.json
            docs/engine_v2_d1_development_v1.md
            tools/run_engine_v2_d1_development_v1.py
            tools/verify_engine_v2_d1_development_v1.py
            tests/unit/test_engine_v2_d1_development_v1.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused test dependency
        run: python -m pip install pytest==8.3.5

      - name: Compile D1 tools
        run: |
          python -m py_compile tools/run_engine_v2_d1_development_v1.py
          python -m py_compile tools/verify_engine_v2_d1_development_v1.py

      - name: Run D1 development tests
        run: python -m pytest -q tests/unit/test_engine_v2_d1_development_v1.py
