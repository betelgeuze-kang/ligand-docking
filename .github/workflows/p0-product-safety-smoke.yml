name: p0-product-safety-smoke

on:
  push:
    paths:
      - "tools/build_ligand_mapping_queue.py"
      - "tools/run_ligand_htvs_pipeline.py"
      - "tools/product/strict_ligand_mapping_queue.py"
      - "tools/product/subprocess_runner.py"
      - "betelgeuze_product/docking_response.py"
      - "tests/fixtures/tiny_docking/**"
      - "tests/unit/test_p0_*.py"
      - ".github/workflows/p0-product-safety-smoke.yml"
  pull_request:
    paths:
      - "tools/build_ligand_mapping_queue.py"
      - "tools/run_ligand_htvs_pipeline.py"
      - "tools/product/strict_ligand_mapping_queue.py"
      - "tools/product/subprocess_runner.py"
      - "betelgeuze_product/docking_response.py"
      - "tests/fixtures/tiny_docking/**"
      - "tests/unit/test_p0_*.py"
      - ".github/workflows/p0-product-safety-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/unit/test_p0_*.py 2>&1 | tee p0-test-output.log
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-test-output
          if-no-files-found: warn
          retention-days: 14
          path: p0-test-output.log
