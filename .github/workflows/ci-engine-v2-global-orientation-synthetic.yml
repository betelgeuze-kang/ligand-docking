name: ci-engine-v2-global-orientation-synthetic

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/docking/global_orientation.py"
      - "betelgeuze_engine_v2/benchmark/oracle_selection_metrics.py"
      - "config/engine_v2_global_orientation_synthetic_contract.json"
      - "tools/verify_engine_v2_global_orientation_synthetic_contract.py"
      - "tests/unit/test_engine_v2_global_orientation*.py"
      - "tests/unit/test_engine_v2_oracle_selection_metrics.py"
      - "docs/engine_v2_global_orientation_design.md"
      - ".github/workflows/ci-engine-v2-global-orientation-synthetic.yml"

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-global-orientation-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install bounded test dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            pytest==8.3.5 \
            ruff==0.11.13 \
            cryptography==46.0.5 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Verify synthetic authority and compile
        run: |
          python -m py_compile \
            betelgeuze_engine_v2/docking/global_orientation.py \
            betelgeuze_engine_v2/benchmark/oracle_selection_metrics.py \
            tools/verify_engine_v2_global_orientation_synthetic_contract.py
          python tools/verify_engine_v2_global_orientation_synthetic_contract.py

      - name: Run synthetic contracts
        run: |
          python -m pytest -q \
            --confcutdir=tests/unit \
            tests/unit/test_engine_v2_global_orientation.py \
            tests/unit/test_engine_v2_global_orientation_synthetic_contract.py \
            tests/unit/test_engine_v2_oracle_selection_metrics.py

      - name: Lint and diff check
        run: |
          python -m ruff check \
            betelgeuze_engine_v2/docking/global_orientation.py \
            betelgeuze_engine_v2/benchmark/oracle_selection_metrics.py \
            tools/verify_engine_v2_global_orientation_synthetic_contract.py \
            tests/unit/test_engine_v2_global_orientation.py \
            tests/unit/test_engine_v2_global_orientation_synthetic_contract.py \
            tests/unit/test_engine_v2_oracle_selection_metrics.py
          git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
