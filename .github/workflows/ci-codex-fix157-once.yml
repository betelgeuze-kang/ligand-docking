name: ci-codex-fix157-once

on:
  push:
    branches:
      - "agent/v2-claim-state-truthfulness"
    paths:
      - ".github/workflows/ci-codex-fix157-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-codex-fix157-once
  cancel-in-progress: false

jobs:
  apply-repair:
    if: github.repository == 'betelgeuze-kang/ligand-docking' && github.ref == 'refs/heads/agent/v2-claim-state-truthfulness'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      TARGET_BRANCH: agent/v2-claim-state-truthfulness
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/v2-claim-state-truthfulness
          persist-credentials: true
          clean: true
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install pytest==8.3.5 PyYAML==6.0.3

      - name: Apply exact state and CI repair
        run: |
          python - <<'PY'
          from pathlib import Path

          updater = Path('tools/update_engine_v2_truthfulness_state.py')
          text = updater.read_text(encoding='utf-8')
          old = '''def _replace_exactly_once(source: str, old: str, new: str, *, name: str) -> str:\n    count = source.count(old)\n    if count != 1:\n        raise StateUpdateError(f"{name} expected exactly one match, observed {count}")\n    return source.replace(old, new, 1)\n'''
          new = '''def _replace_or_require_canonical(\n    source: str,\n    old: str,\n    new: str,\n    *,\n    name: str,\n) -> str:\n    old_count = source.count(old)\n    new_count = source.count(new)\n    if old_count == 1 and new_count == 0:\n        return source.replace(old, new, 1)\n    if old_count == 0 and new_count == 1:\n        return source\n    raise StateUpdateError(\n        f"{name} is ambiguous: legacy={old_count}, canonical={new_count}"\n    )\n\n\ndef _remove_or_require_absent(source: str, old: str, *, name: str) -> str:\n    count = source.count(old)\n    if count == 1:\n        return source.replace(old, "", 1)\n    if count == 0:\n        return source\n    raise StateUpdateError(f"{name} expected at most one match, observed {count}")\n'''
          if old not in text:
              raise SystemExit('truthfulness updater helper drifted')
          text = text.replace(old, new, 1)
          text = text.replace('_replace_exactly_once(\n        source,', '_replace_or_require_canonical(\n        source,', 1)
          text = text.replace('''_replace_exactly_once(\n        rendered,\n        _OLD_PYTHON_BLOCKERS,\n        "",\n        name="Python superseded public benchmark blockers",\n    )''', '''_remove_or_require_absent(\n        rendered,\n        _OLD_PYTHON_BLOCKERS,\n        name="Python superseded public benchmark blockers",\n    )''', 1)
          text = text.replace('_replace_exactly_once(\n        source,', '_replace_or_require_canonical(\n        source,', 1)
          text = text.replace('''_replace_exactly_once(\n        rendered,\n        _OLD_YAML_BLOCKERS,\n        "",\n        name="YAML superseded public benchmark blockers",\n    )''', '''_remove_or_require_absent(\n        rendered,\n        _OLD_YAML_BLOCKERS,\n        name="YAML superseded public benchmark blockers",\n    )''', 1)
          old_main = '''    if args.check:\n        if (\n            _NEW_PYTHON_STATE not in source_python\n            or _OLD_PYTHON_BLOCKERS in source_python\n            or _NEW_YAML_STATE not in source_yaml\n            or _OLD_YAML_BLOCKERS in source_yaml\n        ):\n            raise StateUpdateError(\n                "capability truthfulness state is stale; run with --write"\n            )\n        return 0\n\n    if args.write:\n        _write(CAPABILITIES_PATH, render_capabilities(source_python))\n        _write(CAPABILITY_YAML_PATH, render_capability_yaml(source_yaml))\n        return 0\n'''
          new_main = '''    rendered_python = render_capabilities(source_python)\n    rendered_yaml = render_capability_yaml(source_yaml)\n\n    if args.check:\n        if rendered_python != source_python or rendered_yaml != source_yaml:\n            raise StateUpdateError(\n                "capability truthfulness state is stale; run with --write"\n            )\n        return 0\n\n    if args.write:\n        _write(CAPABILITIES_PATH, rendered_python)\n        _write(CAPABILITY_YAML_PATH, rendered_yaml)\n        return 0\n'''
          if old_main not in text:
              raise SystemExit('truthfulness updater main drifted')
          text = text.replace(old_main, new_main, 1)
          text = text.replace('render_capabilities(source_python),', 'rendered_python,')
          text = text.replace('render_capability_yaml(source_yaml),', 'rendered_yaml,')
          updater.write_text(text, encoding='utf-8')

          state_test = Path('tests/unit/test_engine_v2_post_merge_state.py')
          text = state_test.read_text(encoding='utf-8')
          old = '''    assert public_protocol["current_state"] == (\n        "frozen_four_case_public_redocking_protocol_definition_"\n        "without_execution_or_results"\n    )\n    assert public_protocol["internal_reference_execution_enabled"] is False\n    assert "public_benchmark_not_executed" in public_protocol["blockers"]\n'''
          new = '''    assert public_protocol["current_state"] == (\n        "frozen_four_case_public_redocking_protocol_with_"\n        "result_free_input_materializer_without_execution_or_results"\n    )\n    assert public_protocol["internal_reference_execution_enabled"] is False\n    assert "symmetry_mapping_materializer_not_implemented" not in (\n        public_protocol["blockers"]\n    )\n    assert "reference_ligand_match_materializer_not_implemented" not in (\n        public_protocol["blockers"]\n    )\n    assert "public_benchmark_not_executed" in public_protocol["blockers"]\n'''
          if old not in text:
              raise SystemExit('post-merge public protocol assertion drifted')
          state_test.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/ci-engine-v2-truthfulness.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace(
              '      - "tests/unit/test_engine_v2_truthfulness.py"\n      - "docs/engine_v2_truthfulness.md"',
              '      - "tests/unit/test_engine_v2_truthfulness.py"\n      - "tests/unit/test_engine_v2_post_merge_state.py"\n      - "docs/engine_v2_status.md"\n      - "docs/engine_v2_truthfulness.md"',
          )
          text = text.replace(
              '            tests/unit/test_engine_v2_truthfulness.py\n            docs/engine_v2_truthfulness.md',
              '            tests/unit/test_engine_v2_truthfulness.py\n            tests/unit/test_engine_v2_post_merge_state.py\n            docs/engine_v2_status.md\n            docs/engine_v2_truthfulness.md',
          )
          text = text.replace(
              '          python -m pytest -q tests/unit/test_engine_v2_truthfulness.py\n',
              '          python -m pytest -q \\\n            tests/unit/test_engine_v2_truthfulness.py \\\n            tests/unit/test_engine_v2_post_merge_state.py\n',
          )
          if '--write' in text or 'contents: write' in text or 'git push' in text:
              raise SystemExit('truthfulness workflow is not read-only')
          workflow.write_text(text, encoding='utf-8')
          PY

          python tools/update_engine_v2_truthfulness_state.py --write
          python tools/update_engine_v2_truthfulness_state.py --write
          python tools/update_engine_v2_truthfulness_state.py --check
          python tools/update_engine_v2_main_ci_coverage.py --write
          python tools/update_engine_v2_main_ci_coverage.py --check

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_truthfulness.py \
            tests/unit/test_engine_v2_post_merge_state.py

      - name: Persist repaired branch without temporary workflows
        run: |
          git rm --ignore-unmatch \
            .github/workflows/ci-codex-source-export-once.yml \
            .github/workflows/ci-codex-fix157-once.yml
          git add \
            .github/workflows/ci-engine-v2-main.yml \
            .github/workflows/ci-engine-v2-truthfulness.yml \
            tests/unit/test_engine_v2_post_merge_state.py \
            tools/update_engine_v2_truthfulness_state.py
          git diff --cached --check
          git config user.name "betelgeuze-engine-v2-codex"
          git config user.email "engine-v2-codex@users.noreply.github.com"
          git commit -m "Stabilize Engine v2 truthfulness state and CI"
          git push origin HEAD:${TARGET_BRANCH}
