name: ci-science-smoke

on:
  push:
    paths:
      - "tools/build_ligand_mapping_queue.py"
      - "tools/pdb_loader.py"
      - "tools/product/strict_ligand_mapping_queue.py"
      - "tools/product/build_pose_level_benchmark_report.py"
      - "tools/product/build_allatom_refinement_lane.py"
      - "tools/product/build_external_docking_baseline_adapter.py"
      - "tools/product/build_public_benchmark_manifest.py"
      - "betelgeuze_engine/**"
      - "tests/fixtures/tiny_docking/**"
      - "tests/unit/test_p0_strict_ligand_mapping_queue.py"
      - "tests/unit/test_build_pose_level_benchmark_report.py"
      - "tests/unit/test_p2_*.py"
      - "docs/SCIENCE_LIMITATIONS.md"
      - "docs/P2_PRODUCT_SCIENCE_LANES.md"
      - ".github/workflows/ci-science-smoke.yml"
  pull_request:
    paths:
      - "tools/build_ligand_mapping_queue.py"
      - "tools/pdb_loader.py"
      - "tools/product/strict_ligand_mapping_queue.py"
      - "tools/product/build_pose_level_benchmark_report.py"
      - "tools/product/build_allatom_refinement_lane.py"
      - "tools/product/build_external_docking_baseline_adapter.py"
      - "tools/product/build_public_benchmark_manifest.py"
      - "betelgeuze_engine/**"
      - "tests/fixtures/tiny_docking/**"
      - "tests/unit/test_p0_strict_ligand_mapping_queue.py"
      - "tests/unit/test_build_pose_level_benchmark_report.py"
      - "tests/unit/test_p2_*.py"
      - "docs/SCIENCE_LIMITATIONS.md"
      - "docs/P2_PRODUCT_SCIENCE_LANES.md"
      - ".github/workflows/ci-science-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/**
            core/**
            config/**
            betelgeuze_engine/**
            tests/fixtures/tiny_docking/**
            tests/unit/test_p0_strict_ligand_mapping_queue.py
            tests/unit/test_build_pose_level_benchmark_report.py
            tests/unit/test_p2_*.py
            docs/SCIENCE_LIMITATIONS.md
            docs/P2_PRODUCT_SCIENCE_LANES.md
            requirements*.txt
            requirements/**
            pyproject.toml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install science smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas PyYAML pytest
      - name: Run strict input, pose benchmark, and P2 lane tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/unit/test_p0_strict_ligand_mapping_queue.py \
            tests/unit/test_build_pose_level_benchmark_report.py \
            tests/unit/test_p2_*.py \
            2>&1 | tee science-smoke-output.log
      - name: Upload science smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-smoke-output
          if-no-files-found: warn
          retention-days: 14
          path: science-smoke-output.log
