name: pr244-add-conftest-to-main-once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 244
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Include the Stage 0 fixture support in authoritative sparse checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci-engine-v2-main.yml')
          text = path.read_text(encoding='utf-8')

          trigger_anchor = '      - "tests/unit/test_engine_v2_*.py"\n'
          trigger_value = (
              trigger_anchor
              + '      - "tests/unit/conftest.py"\n'
          )
          if trigger_value not in text:
              if trigger_anchor not in text:
                  raise SystemExit('workflow path-trigger anchor missing')
              text = text.replace(trigger_anchor, trigger_value, 1)

          sparse_anchor = '            tests/unit/test_engine_v2_blind_stage0.py\n'
          sparse_value = sparse_anchor + '            tests/unit/conftest.py\n'
          if sparse_value not in text:
              if sparse_anchor not in text:
                  raise SystemExit('workflow sparse-checkout anchor missing')
              text = text.replace(sparse_anchor, sparse_value, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/zz-pr244-add-conftest-to-main.yml .pr244-conftest-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Include Stage 0 fixture support in authoritative CI'
          git push origin HEAD:codex/source-paired-clearance-activation-v1
