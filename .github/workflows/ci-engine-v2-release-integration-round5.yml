name: ci-engine-v2-release-integration-round5

on:
  pull_request:
    paths:
      - ".github/workflows/ci-engine-v2-package.yml"
      - ".github/workflows/ci-engine-v2-top-stack.yml"
      - ".github/workflows/ci-engine-v2-release-integration-round5.yml"
      - "tools/check_engine_v2_top_stack.py"
      - "tests/unit/test_engine_v2_release_integration_round5.py"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ci-engine-v2-package.yml"
      - ".github/workflows/ci-engine-v2-top-stack.yml"
      - ".github/workflows/ci-engine-v2-release-integration-round5.yml"
      - "tools/check_engine_v2_top_stack.py"
      - "tests/unit/test_engine_v2_release_integration_round5.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-release-integration-round5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-integration-round5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: "--confcutdir=tests/unit"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused test dependency
        run: |
          python -m pip install pip==25.0.1
          python -m pip install pytest==8.3.5

      - name: Compile and verify the complete workflow boundary
        run: |
          python -m compileall -q tools/check_engine_v2_top_stack.py tests/unit/test_engine_v2_release_integration_round5.py
          python tools/check_engine_v2_top_stack.py
          git diff --check

      - name: Verify exact-main and reproducible-package contracts
        run: |
          python -m pytest -q tests/unit/test_engine_v2_release_integration_round5.py
