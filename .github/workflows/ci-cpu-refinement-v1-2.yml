name: ci-cpu-refinement-v1-2
on:
  pull_request:
    paths:
      - 'betelgeuze_engine_v2/**'
      - 'betelgeuze_product/**'
      - 'tests/unit/test_cpu_*.py'
      - 'tests/unit/test_cartesian_*.py'
      - 'tests/unit/cpu_fourier_scalar_oracle.py'
      - 'tests/unit/test_engine_v2_*.py'
      - 'tests/unit/test_refinement_comparison_workflow.py'
      - 'tools/verify_cpu_refinement_v1_2_install.py'
      - 'tools/verify_cpu_candidate_resume_install.py'
      - 'tools/verify_prepared_fourier_install.py'
      - 'tools/verify_linear_angle_install.py'
      - 'tools/verify_parent_shape_install.py'
      - 'tools/verify_prepared_cartesian_budget_install.py'
      - 'tools/build_linear_angle_independent_oracle.py'
      - 'tests/fixtures/linear_angle_independent_oracle.json'
      - 'tools/verify_prepared_fourier_cartesian_install.py'
      - 'tools/benchmark_cpu_refinement_v1_2_verification.py'
      - 'tools/benchmark_cpu_tangent_projection.py'
      - 'tools/benchmark_cpu_candidate_journal_scaling.py'
      - 'tools/benchmark_cpu_candidate_resume_process.py'
      - 'pyproject.toml'
      - 'requirements-package.txt'
      - '.github/workflows/ci-cpu-refinement-v1-2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-cpu-refinement-v1-2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  corrected-extended-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned CPU and packaging dependencies
        run: |
          python -m pip install -r requirements-package.txt
          python -m pip install pytest==8.3.5 rdkit==2026.3.6 ruff==0.11.13 build==1.2.2.post1 setuptools==75.8.2 wheel==0.45.1
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Record exact head tree and environment
        run: |
          mkdir -p verification-artifacts
          git rev-parse HEAD > verification-artifacts/checkout.txt
          git rev-parse 'HEAD^{tree}' >> verification-artifacts/checkout.txt
          git status --porcelain --untracked-files=no >> verification-artifacts/checkout.txt
          python -m pip freeze > verification-artifacts/dependencies.txt
      - name: Lint new implementation and tests without exclusions
        run: |
          python -m ruff check --isolated --no-cache betelgeuze_product/cpu_refinement_v1_2 \
            betelgeuze_product/cpu_refinement_fourier_v1 \
            betelgeuze_product/cpu_refinement_linear_angle_v1 \
            betelgeuze_product/cpu_refinement_shape_v1 \
            betelgeuze_product/cpu_refinement_v1_3 \
            betelgeuze_product/cpu_prepared_cartesian_budget_v3 \
            betelgeuze_product/cpu_refinement_diagnostics_v1 \
            betelgeuze_product/cpu_prepared_shape_comparison_v1 \
            tools/verify_prepared_cartesian_budget_install.py \
            tools/verify_prepared_fourier_install.py \
            tools/verify_linear_angle_install.py \
            tools/verify_parent_shape_install.py \
            tools/build_linear_angle_independent_oracle.py \
            tools/verify_prepared_fourier_cartesian_install.py \
            tests/unit/test_cpu_*.py \
            tests/unit/test_cartesian_*.py \
            tests/unit/cpu_fourier_scalar_oracle.py \
            tools/verify_cpu_refinement_v1_2_install.py \
            tools/verify_cpu_candidate_resume_install.py \
            tools/benchmark_cpu_refinement_v1_2_verification.py \
            tools/benchmark_cpu_tangent_projection.py \
            tools/benchmark_cpu_candidate_journal_scaling.py \
            tools/benchmark_cpu_candidate_resume_process.py
          git diff --check
      - name: Actual corrected extended paths and unchanged historical regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --rootdir="$PWD" -c /dev/null --noconftest -p no:cacheprovider -W error -vv \
            tests/unit/test_cpu_*.py \
            tests/unit/test_cartesian_*.py \
            tests/unit/test_engine_v2_reference_angle_boundary.py \
            tests/unit/test_engine_v2_refinement_comparison.py \
            tests/unit/test_engine_v2_numerics_v1_1_contracts.py \
            tests/unit/test_refinement_comparison_workflow.py \
            tests/unit/test_engine_v2_reference_physics.py \
            tests/unit/test_engine_v2_reference_minimization.py \
            tests/unit/test_engine_v2_reference_forcefield_v2.py \
            tests/unit/test_engine_v2_reference_constrained_minimization.py \
            tests/unit/test_engine_v2_reference_solvation.py \
            tests/unit/test_engine_v2_energy_local_refinement_stage6.py \
            tests/unit/test_engine_v2_reference_minimization_validation_protocol.py \
            tests/unit/test_engine_v2_global_orientation_development_protocol.py \
            --junitxml=verification-artifacts/regressions.xml 2>&1 | tee verification-artifacts/regressions.log
      - name: Measure full-byte verification without another JSON parse
        run: |
          python tools/benchmark_cpu_refinement_v1_2_verification.py --output verification-artifacts/verification-benchmark.json
      - name: Compare tangent projection costs with unchanged numerical results
        run: |
          python tools/benchmark_cpu_tangent_projection.py --output verification-artifacts/tangent-projection-benchmark.json
      - name: Build actual root product wheel and install in separate environment
        run: |
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/corrected-wheels"
          python -m venv --system-site-packages "$RUNNER_TEMP/corrected-installed"
          "$RUNNER_TEMP/corrected-installed/bin/python" -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/corrected-wheels/*.whl
          "$RUNNER_TEMP/corrected-installed/bin/python" -m pip check
          sha256sum "$RUNNER_TEMP"/corrected-wheels/*.whl > verification-artifacts/wheel-sha256.txt
      - name: Verify installed diagnostics CLI without molecular execution
        run: |
          (
            cd "$RUNNER_TEMP"
            env -u PYTHONPATH "$RUNNER_TEMP/corrected-installed/bin/python" -I \
              -m betelgeuze_product.cpu_refinement_diagnostics_v1.workflow --help
          ) > verification-artifacts/diagnostics-installed-help.txt
      - name: Verify installed shape comparison CLI without molecular execution
        run: |
          (
            cd "$RUNNER_TEMP"
            env -u PYTHONPATH "$RUNNER_TEMP/corrected-installed/bin/python" -I \
              -m betelgeuze_product.cpu_prepared_shape_comparison_v1.workflow --help
          ) > verification-artifacts/shape-comparison-installed-help.txt
      - name: Verify installed CLI outside checkout with isolated Python and no PYTHONPATH
        run: |
          python tools/verify_cpu_refinement_v1_2_install.py \
            --python "$RUNNER_TEMP/corrected-installed/bin/python" \
            --output verification-artifacts/installed-cli
      - name: Verify opt-in Fourier installed run, verification and continuation
        run: |
          trap 'if [ -d "$RUNNER_TEMP/fourier-installed" ]; then cp -a "$RUNNER_TEMP/fourier-installed" verification-artifacts/fourier-installed; fi' EXIT
          python tools/verify_prepared_fourier_install.py \
            --python "$RUNNER_TEMP/corrected-installed/bin/python" \
            --output "$RUNNER_TEMP/fourier-installed"
          cp "$RUNNER_TEMP/fourier-installed/summary.json" verification-artifacts/fourier-installed.json
      - name: Verify installed Fourier Cartesian algorithms and journal continuation
        run: |
          trap 'if [ -d "$RUNNER_TEMP/fourier-cartesian-installed" ]; then cp -a "$RUNNER_TEMP/fourier-cartesian-installed" verification-artifacts/fourier-cartesian-installed; fi' EXIT
          python tools/verify_prepared_fourier_cartesian_install.py \
            --python "$RUNNER_TEMP/corrected-installed/bin/python" \
            --output "$RUNNER_TEMP/fourier-cartesian-installed"
          cp "$RUNNER_TEMP/fourier-cartesian-installed/summary.json" verification-artifacts/fourier-cartesian-installed.json
      - name: Verify installed opt-in linear harmonic endpoint
        run: |
          trap 'if [ -d "$RUNNER_TEMP/linear-angle-installed" ]; then cp -a "$RUNNER_TEMP/linear-angle-installed" verification-artifacts/linear-angle-installed; fi' EXIT
          python tools/verify_linear_angle_install.py \
            --python "$RUNNER_TEMP/corrected-installed/bin/python" \
            --output "$RUNNER_TEMP/linear-angle-installed"
          cp "$RUNNER_TEMP/linear-angle-installed/summary.json" verification-artifacts/linear-angle-installed.json
      - name: Verify installed opt-in parent shape profile
        run: |
          trap 'if [ -d "$RUNNER_TEMP/parent-shape-installed" ]; then cp -a "$RUNNER_TEMP/parent-shape-installed" verification-artifacts/parent-shape-installed; fi' EXIT
          python tools/verify_parent_shape_install.py \
            --python "$RUNNER_TEMP/corrected-installed/bin/python" \
            --output "$RUNNER_TEMP/parent-shape-installed"
          cp "$RUNNER_TEMP/parent-shape-installed/summary.json" verification-artifacts/parent-shape-installed.json
      - name: Verify installed opt-in long-budget Cartesian route
        run: |
          trap 'if [ -d "$RUNNER_TEMP/cartesian-budget-installed" ]; then cp -a "$RUNNER_TEMP/cartesian-budget-installed" verification-artifacts/cartesian-budget-installed; fi' EXIT
          python tools/verify_prepared_cartesian_budget_install.py \
            --python "$RUNNER_TEMP/corrected-installed/bin/python" \
            --output "$RUNNER_TEMP/cartesian-budget-installed"
      - name: Verify installed candidate resume and portable reports
        run: |
          trap 'if [ -d "$RUNNER_TEMP/candidate-resume-installed" ]; then cp -a "$RUNNER_TEMP/candidate-resume-installed" verification-artifacts/candidate-resume-installed; fi' EXIT
          python tools/verify_cpu_candidate_resume_install.py \
            --python "$RUNNER_TEMP/corrected-installed/bin/python" \
            --output "$RUNNER_TEMP/candidate-resume-installed"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cpu-refinement-v1-2-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-artifacts/
          if-no-files-found: error
          retention-days: 7



