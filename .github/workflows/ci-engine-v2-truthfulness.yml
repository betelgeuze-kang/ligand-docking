name: ci-engine-v2-truthfulness

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/truthfulness.py"
      - "betelgeuze_engine_v2/capabilities.py"
      - "config/independent_engine_v2_capabilities.yaml"
      - "config/independent_engine_v2_truthfulness_policy.json"
      - "tools/check_engine_v2_truthfulness.py"
      - "tools/update_engine_v2_truthfulness_state.py"
      - "tools/update_engine_v2_main_ci_coverage.py"
      - "tests/unit/test_engine_v2_truthfulness.py"
      - "docs/engine_v2_truthfulness.md"
      - ".github/workflows/ci-engine-v2-main.yml"
      - ".github/workflows/ci-engine-v2-truthfulness.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/truthfulness.py"
      - "betelgeuze_engine_v2/capabilities.py"
      - "config/independent_engine_v2_capabilities.yaml"
      - "config/independent_engine_v2_truthfulness_policy.json"
      - "tools/check_engine_v2_truthfulness.py"
      - "tools/update_engine_v2_truthfulness_state.py"
      - "tools/update_engine_v2_main_ci_coverage.py"
      - "tests/unit/test_engine_v2_truthfulness.py"
      - "docs/engine_v2_truthfulness.md"
      - ".github/workflows/ci-engine-v2-main.yml"
      - ".github/workflows/ci-engine-v2-truthfulness.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-engine-v2-truthfulness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  truthfulness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            config/independent_engine_v2_capabilities.yaml
            config/independent_engine_v2_truthfulness_policy.json
            tools/check_engine_v2_architecture.py
            tools/check_engine_v2_truthfulness.py
            tools/update_engine_v2_truthfulness_state.py
            tools/update_engine_v2_main_ci_coverage.py
            tests/unit/test_engine_v2_truthfulness.py
            docs/engine_v2_truthfulness.md
            .github/workflows/ci-engine-v2-main.yml
            .github/workflows/ci-engine-v2-truthfulness.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            pytest==8.3.5 \
            PyYAML==6.0.3 \
            cryptography==46.0.5 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        run: |
          python -m compileall -q \
            betelgeuze_engine_v2 \
            tools/check_engine_v2_truthfulness.py \
            tools/update_engine_v2_truthfulness_state.py \
            tools/update_engine_v2_main_ci_coverage.py
          python tools/check_engine_v2_architecture.py

      - name: Apply canonical Engine v2 main CI coverage once
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          python tools/update_engine_v2_main_ci_coverage.py --write
          if git diff --quiet -- .github/workflows/ci-engine-v2-main.yml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci-engine-v2-main.yml
          git commit -m "Cover current Engine v2 contracts in canonical main CI"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Verify canonical Engine v2 main CI coverage
        run: |
          python tools/update_engine_v2_main_ci_coverage.py --check

      - name: Verify synchronized capability truthfulness state
        run: |
          python tools/update_engine_v2_truthfulness_state.py --check

      - name: Verify frozen truthfulness policy
        run: |
          python tools/check_engine_v2_truthfulness.py

      - name: Run capability and evidence truthfulness tests
        run: |
          python -m pytest -q tests/unit/test_engine_v2_truthfulness.py
