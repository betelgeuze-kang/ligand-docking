name: ci-mobile-lite

on:
  pull_request:
    paths:
      - ".github/workflows/ci-mobile-lite.yml"
      - "requirements-mobile.txt"
      - "pytest-mobile.ini"
      - "api/**"
      - "betelgeuze_product/docking_response.py"
      - "betelgeuze_product/job_orchestration.py"
      - "betelgeuze_product/payload_privacy.py"
      - "betelgeuze_product/tier_beta_vertical_slice.py"
      - "core/claim_boundary.py"
      - "tests/mobile/**"
      - "tests/route_compat.py"
      - "tools/check_mobile_lite_environment.py"
      - "docs/mobile_lite_development.md"
      - "docs/api_server_bound_identity.md"
  push:
    branches:
      - "codex/mobile-lite-ci-contracts"
    paths:
      - ".github/workflows/ci-mobile-lite.yml"
      - "requirements-mobile.txt"
      - "pytest-mobile.ini"
      - "api/**"
      - "betelgeuze_product/docking_response.py"
      - "betelgeuze_product/job_orchestration.py"
      - "betelgeuze_product/payload_privacy.py"
      - "betelgeuze_product/tier_beta_vertical_slice.py"
      - "core/claim_boundary.py"
      - "tests/mobile/**"
      - "tests/route_compat.py"
      - "tools/check_mobile_lite_environment.py"
      - "docs/mobile_lite_development.md"
      - "docs/api_server_bound_identity.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-mobile-lite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-lite-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PRODUCT_API_AUTH_REQUIRED: "0"
    steps:
      - name: Check out dependency-light source
        uses: actions/checkout@v4
        with:
          show-progress: false
          sparse-checkout: |
            api
            betelgeuze_product/__init__.py
            betelgeuze_product/docking_response.py
            betelgeuze_product/job_orchestration.py
            betelgeuze_product/payload_privacy.py
            betelgeuze_product/tier_beta_vertical_slice.py
            core/__init__.py
            core/claim_boundary.py
            tests/__init__.py
            tests/route_compat.py
            tests/mobile
            tests/unit/test_api_security_middleware.py
            tests/unit/test_api_job_store.py
            tools/check_mobile_lite_environment.py
            requirements-mobile.txt
            pytest-mobile.ini
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-mobile.txt

      - name: Install dependency-light mobile profile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements-mobile.txt
          python -m pip uninstall -y torch rdkit rdkit-pypi openmm h5py >/dev/null 2>&1 || true

      - name: Enforce mobile dependency boundary
        run: python tools/check_mobile_lite_environment.py

      - name: Compile dependency-light source surfaces
        run: |
          python -m compileall -q \
            api \
            betelgeuze_product/docking_response.py \
            betelgeuze_product/job_orchestration.py \
            betelgeuze_product/payload_privacy.py \
            betelgeuze_product/tier_beta_vertical_slice.py \
            core/claim_boundary.py \
            tests/route_compat.py \
            tests/mobile \
            tools/check_mobile_lite_environment.py

      - name: Import dependency-light test modules
        run: |
          python - <<'PY'
          import importlib

          for module_name in (
              "tests.mobile.test_mobile_api_contracts",
              "tests.mobile.test_mobile_security_contracts",
              "tests.mobile.test_optional_runtime_boundaries",
              "tests.mobile.test_authenticated_identity_contracts",
              "tests.mobile.test_product_docking_tenant_isolation",
          ):
              importlib.import_module(module_name)
              print(f"imported: {module_name}")
          PY

      - name: Collect mobile tests without heavy scientific runtimes
        run: python -m pytest -c pytest-mobile.ini --collect-only -q

      - name: Run mobile API and route contracts
        run: python -m pytest -c pytest-mobile.ini -q tests/mobile/test_mobile_api_contracts.py

      - name: Run mobile security and SQLite privacy contracts
        run: python -m pytest -c pytest-mobile.ini -q tests/mobile/test_mobile_security_contracts.py

      - name: Run authenticated identity contracts
        run: python -m pytest -c pytest-mobile.ini -q tests/mobile/test_authenticated_identity_contracts.py

      - name: Run product docking tenant isolation contracts
        run: python -m pytest -c pytest-mobile.ini -q tests/mobile/test_product_docking_tenant_isolation.py

      - name: Run explicit optional-runtime skip probes
        run: python -m pytest -c pytest-mobile.ini -q tests/mobile/test_optional_runtime_boundaries.py

      - name: Regress blocked-request audit and redaction
        run: >-
          python -m pytest -c pytest-mobile.ini -q
          tests/unit/test_api_security_middleware.py::test_product_security_middleware_audits_blocked_requests_and_sets_headers

      - name: Regress allowed-request security headers
        run: >-
          python -m pytest -c pytest-mobile.ini -q
          tests/unit/test_api_security_middleware.py::test_product_security_middleware_sets_headers_on_allowed_requests

      - name: Regress secret-free security metrics
        run: >-
          python -m pytest -c pytest-mobile.ini -q
          tests/unit/test_api_security_middleware.py::test_metrics_endpoint_is_secret_free_and_exposes_runtime_counters

      - name: Regress SQLite outbox privacy
        run: >-
          python -m pytest -c pytest-mobile.ini -q
          tests/unit/test_api_job_store.py::test_sqlite_job_store_outbox_payload_excludes_private_material
