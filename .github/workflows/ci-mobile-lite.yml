name: ci-mobile-lite

on:
  pull_request:
    paths:
      - ".github/workflows/ci-mobile-lite.yml"
      - "requirements-mobile.txt"
      - "pytest-mobile.ini"
      - "api/**"
      - "tests/mobile/**"
      - "tests/route_compat.py"
      - "tools/check_mobile_lite_environment.py"
      - "docs/mobile_lite_development.md"
  push:
    branches:
      - "codex/mobile-lite-ci-contracts"
    paths:
      - ".github/workflows/ci-mobile-lite.yml"
      - "requirements-mobile.txt"
      - "pytest-mobile.ini"
      - "api/**"
      - "tests/mobile/**"
      - "tests/route_compat.py"
      - "tools/check_mobile_lite_environment.py"
      - "docs/mobile_lite_development.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-mobile-lite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-lite-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PRODUCT_API_AUTH_REQUIRED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-mobile.txt

      - name: Install dependency-light mobile profile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mobile.txt
          python -m pip uninstall -y torch rdkit rdkit-pypi openmm h5py || true

      - name: Enforce mobile dependency boundary
        run: python tools/check_mobile_lite_environment.py

      - name: Compile dependency-light source surfaces
        run: |
          python -m compileall -q \
            api \
            tests/route_compat.py \
            tests/mobile \
            tools/check_mobile_lite_environment.py

      - name: Collect mobile tests without heavy scientific runtimes
        run: python -m pytest -c pytest-mobile.ini --collect-only -q

      - name: Run mobile API, route, security, and optional-runtime contracts
        run: python -m pytest -c pytest-mobile.ini -q

      - name: Run established core security regression slice
        run: |
          python -m pytest -c pytest-mobile.ini -q \
            tests/unit/test_api_security_middleware.py::test_product_security_middleware_audits_blocked_requests_and_sets_headers \
            tests/unit/test_api_security_middleware.py::test_product_security_middleware_sets_headers_on_allowed_requests \
            tests/unit/test_api_security_middleware.py::test_metrics_endpoint_is_secret_free_and_exposes_runtime_counters \
            tests/unit/test_api_job_store.py::test_sqlite_job_store_outbox_payload_excludes_private_material
