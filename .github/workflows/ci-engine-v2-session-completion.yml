      - "docs/engine_v2_product_release_reconstruction_v1.md"
      - "docs/community_license_owner_decision_v1.md"
      - ".github/workflows/ci-engine-v2-session-completion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-session-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused dependencies
        run: python -m pip install pytest==8.3.5 numpy

      - name: Compile tools
        run: |
          python -m py_compile tools/run_engine_v2_d1_development_v2.py
          python -m py_compile tools/verify_engine_v2_d1_development_v2.py
          python -m py_compile tools/materialize_engine_v2_d1_case_results_v1.py
          python -m py_compile tools/run_engine_v2_sampling_funnel_v1.py
          python -m py_compile tools/capture_engine_v2_sampling_pool_cpu_observation_v1.py
          python -m py_compile tools/run_engine_v2_water_box_reference_v1.py
          python -m py_compile tools/inventory_github_actions_pins_v1.py
          python -m py_compile tools/verify_engine_v2_hip_d1_benchmark_v1.py
          python -m py_compile tools/bind_engine_v2_hip_d1_profile_v1.py
          python -m py_compile tools/normalize_engine_v2_hip_d1_measurement_v1.py
          python -m py_compile tools/assemble_engine_v2_hip_d1_candidate_result_v1.py
          python -m py_compile tools/analyze_rust_docking_module_boundaries_v1.py

      - name: Run focused tests
        run: |
          python tools/capture_engine_v2_sampling_pool_cpu_observation_v1.py \
            --verify config/engine_v2_sampling_pool_cpu_observation_evidence_v1.json
          python -m pytest -q \
            tests/unit/test_engine_v2_d1_development_v2.py \
            tests/unit/test_materialize_engine_v2_d1_case_results_v1.py \
            tests/unit/test_engine_v2_sampling_funnel_v1.py \
            tests/unit/test_engine_v2_sampling_pool_cpu_observation_evidence_v1.py \
            tests/unit/test_engine_v2_water_box_reference_v1.py \
            tests/unit/test_inventory_github_actions_pins_v1.py \
            tests/unit/test_verify_engine_v2_hip_d1_benchmark_v1.py \
            tests/unit/test_bind_engine_v2_hip_d1_profile_v1.py \
            tests/unit/test_normalize_engine_v2_hip_d1_measurement_v1.py \
            tests/unit/test_assemble_engine_v2_hip_d1_candidate_result_v1.py \
            tests/unit/test_analyze_rust_docking_module_boundaries_v1.py
