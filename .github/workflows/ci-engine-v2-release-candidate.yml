name: ci-engine-v2-release-candidate

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/**"
      - "packaging/engine-v2/**"
      - "rust_engine_v2/**"
      - "tools/build_engine_v2_wheel.py"
      - "tools/build_engine_v2_native_wheel.py"
      - "tools/build_engine_v2_sbom.py"
      - "tests/unit/test_engine_v2_release_candidate.py"
      - "tests/unit/test_engine_v2_native_packaging.py"
      - "tests/unit/test_engine_v2_scorer_v1_stage5.py"
      - "CHANGELOG.md"
      - "docs/engine_v2_0_2_0rc5.md"
      - ".github/workflows/ci-engine-v2-release-candidate.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/**"
      - "packaging/engine-v2/**"
      - "rust_engine_v2/**"
      - "tools/build_engine_v2_wheel.py"
      - "tools/build_engine_v2_native_wheel.py"
      - "tools/build_engine_v2_sbom.py"
      - "tests/unit/test_engine_v2_release_candidate.py"
      - "tests/unit/test_engine_v2_native_packaging.py"
      - "tests/unit/test_engine_v2_scorer_v1_stage5.py"
      - "CHANGELOG.md"
      - "docs/engine_v2_0_2_0rc5.md"
      - ".github/workflows/ci-engine-v2-release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            packaging/engine-v2
            rust_engine_v2
            tools/build_engine_v2_wheel.py
            tools/build_engine_v2_native_wheel.py
            tools/build_engine_v2_sbom.py
            .github/workflows/ci-engine-v2-release-candidate.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install pinned static-analysis tools
        run: |
          python -m pip install pip==25.0.1
          python -m pip install ruff==0.12.4 pyright==1.1.403 cryptography==46.0.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run focused static analysis
        shell: bash
        run: |
          set +e
          ruff check \
            betelgeuze_engine_v2/contracts \
            betelgeuze_engine_v2/molecular \
            betelgeuze_engine_v2/physics/reference_parameters.py \
            betelgeuze_engine_v2/physics/reference_forcefield.py \
            tools/build_engine_v2_wheel.py \
            tools/build_engine_v2_sbom.py \
            --config packaging/engine-v2/pyproject.toml > static-analysis.log 2>&1
          ruff_status=$?
          pyright --project packaging/engine-v2/pyrightconfig.json >> static-analysis.log 2>&1
          pyright_status=$?
          cat static-analysis.log
          if [ "$ruff_status" -ne 0 ] || [ "$pyright_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload static-analysis diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-v2-static-analysis-${{ github.run_id }}
          path: static-analysis.log
          if-no-files-found: error
          retention-days: 7

  release-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      SOURCE_DATE_EPOCH: "1735689600"
      PYTHONHASHSEED: "0"
      TZ: "UTC"
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            packaging/engine-v2
            rust_engine_v2
            tools/build_engine_v2_wheel.py
            tools/build_engine_v2_native_wheel.py
            tools/build_engine_v2_sbom.py
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_release_candidate.py
            tests/unit/test_engine_v2_native_packaging.py
            tests/unit/test_engine_v2_scorer_v1_stage5.py
            tests/unit/test_engine_v2_packaging_guards.py
            CHANGELOG.md
            docs/engine_v2_0_2_0rc5.md
            docs/engine_v2_pr_overlap_matrix.md
            .github/workflows/ci-engine-v2-main.yml
            .github/workflows/ci-engine-v2-package.yml
            .github/workflows/ci-engine-v2-release-candidate.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned release tooling and CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            build==1.2.2.post1 \
            setuptools==75.8.2 \
            wheel==0.45.1 \
            pytest==8.3.5 \
            cryptography==46.0.5 \
            numpy==1.26.4 \
            "tomli==2.2.1; python_version < '3.11'"
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run release and architecture contracts
        run: |
          python tools/check_engine_v2_architecture.py
          python -m pytest -q \
            tests/unit/test_engine_v2_packaging_guards.py \
            tests/unit/test_engine_v2_release_candidate.py

      - name: Build wheel twice and require byte identity
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_engine_v2_wheel.py --output-dir dist-a --source-date-epoch "$SOURCE_DATE_EPOCH"
          python tools/build_engine_v2_wheel.py --output-dir dist-b --source-date-epoch "$SOURCE_DATE_EPOCH"
          wheel_a="$(find dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_b="$(find dist-b -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_a" -a -n "$wheel_b"
          sha256sum "$wheel_a" "$wheel_b"
          test "$(sha256sum "$wheel_a" | cut -d' ' -f1)" = "$(sha256sum "$wheel_b" | cut -d' ' -f1)"
          cmp "$wheel_a" "$wheel_b"

      - name: Generate and verify SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          python tools/build_engine_v2_sbom.py "$wheel" --output dist-a/betelgeuze-engine-v2-0.2.0rc5.spdx.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          wheel = next(Path("dist-a").glob("*.whl"))
          sbom = json.loads(Path("dist-a/betelgeuze-engine-v2-0.2.0rc5.spdx.json").read_text())
          assert sbom["spdxVersion"] == "SPDX-2.3"
          root = next(package for package in sbom["packages"] if package["name"] == "betelgeuze-engine-v2")
          observed = next(item["checksumValue"] for item in root["checksums"] if item["algorithm"] == "SHA256")
          expected = hashlib.sha256(wheel.read_bytes()).hexdigest()
          assert observed == expected
          dependencies = {package["name"] for package in sbom["packages"]}
          assert dependencies >= {"betelgeuze-engine-v2", "cryptography", "numpy", "torch"}
          PY

      - name: Clean install, pip check, and outside-checkout import
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/engine-v2-rc-${{ matrix.python-version }}"
          outside="/tmp/engine-v2-rc-outside-${{ matrix.python-version }}"
          rm -rf "$venv" "$outside"
          python -m venv "$venv"
          grep -q '^include-system-site-packages = false$' "$venv/pyvenv.cfg"
          "$venv/bin/python" -m pip install pip==25.0.1
          "$venv/bin/python" -m pip install cryptography==46.0.5
          "$venv/bin/python" -m pip install numpy==1.26.4
          "$venv/bin/python" -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$venv/bin/python" -m pip install --no-deps dist-a/*.whl
          "$venv/bin/python" -m pip check
          mkdir -p "$outside"
          cd "$outside"
          "$venv/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import betelgeuze_engine_v2 as engine

          assert metadata.version("betelgeuze-engine-v2") == "0.2.0rc5"
          assert engine.DISTRIBUTION_VERSION == "0.2.0rc5"
          assert engine.ENGINE_API_VERSION == "2.0.0"
          assert importlib.util.find_spec("api") is None
          assert importlib.util.find_spec("core") is None
          assert importlib.util.find_spec("train") is None
          PY

      - name: Upload reproducible wheel and SBOM
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-v2-0.2.0rc5-${{ github.run_id }}
          path: |
            dist-a/*.whl
            dist-a/*.spdx.json
          if-no-files-found: error
          retention-days: 14

  native-cpu-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            abi: cp310-cp310
          - python-version: "3.11"
            abi: cp311-cp311
          - python-version: "3.12"
            abi: cp312-cp312
    env:
      SOURCE_DATE_EPOCH: "1735689600"
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:fdb9a9c223b215604dc7b6f7e8fff4b39bfea5fbaa7777a2e5544a60dfa437f8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            rust_engine_v2
            tools/build_engine_v2_native_wheel.py
            tools/build_engine_v2_sbom.py
            tests/unit/test_engine_v2_native_packaging.py
            tests/unit/test_engine_v2_scorer_v1_stage5.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install frozen Rust and Python verification tools
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
          python -m pip install pip==25.0.1 pytest==8.3.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Build native manylinux wheel twice
        shell: bash
        run: |
          set -euo pipefail
          for output in native-dist-a native-dist-b; do
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PWD:/io" -w /io \
              -v "$HOME/.rustup:/rustup:ro" \
              -v "$HOME/.cargo:/cargo:ro" \
              -e RUSTUP_HOME=/rustup \
              -e CARGO_HOME=/cargo \
              -e CARGO_TARGET_DIR=/tmp/native-target \
              "$MANYLINUX_IMAGE" \
              bash -lc "set -euo pipefail
                /opt/python/${{ matrix.abi }}/bin/python -m venv /tmp/native-venv
                /tmp/native-venv/bin/python -m pip install --disable-pip-version-check maturin==1.11.5 >/tmp/maturin-install.log
                PATH=/cargo/bin:/tmp/native-venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
                  /tmp/native-venv/bin/python tools/build_engine_v2_native_wheel.py --output-dir $output"
          done
          wheel_a="$(find native-dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_b="$(find native-dist-b -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_a" -a -n "$wheel_b"
          cmp "$wheel_a" "$wheel_b"
          sha256sum "$wheel_a" "$wheel_b"

      - name: Verify native wheel, SBOM, and scorer parity
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find native-dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          python -m pip install --no-deps "$wheel"
          python tools/build_engine_v2_sbom.py "$wheel" \
            --cargo-lock rust_engine_v2/Cargo.lock \
            --output native-dist-a/betelgeuze-engine-v2-native-0.2.0rc5.spdx.json
          cargo check --locked --manifest-path rust_engine_v2/Cargo.toml
          cargo test --locked --manifest-path rust_engine_v2/Cargo.toml
          python -m pytest -q \
            tests/unit/test_engine_v2_native_packaging.py \
            tests/unit/test_engine_v2_scorer_v1_stage5.py -k 'native or rust_cpu'

      - name: Upload native wheel and SBOM
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-v2-native-0.2.0rc5-${{ github.run_id }}
          path: |
            native-dist-a/*.whl
            native-dist-a/*.spdx.json
          if-no-files-found: error
          retention-days: 14
