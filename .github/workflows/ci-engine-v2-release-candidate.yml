name: ci-engine-v2-release-candidate

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/**"
      - "packaging/engine-v2/**"
      - "rust_engine_v2/**"
      - "rust/betelgeuze-docking-search/**"
      - "rust/betelgeuze-runtime/**"
      - "rust/betelgeuze-sys/**"
      - "rust/cpu-kernel/**"
      - "rust/reference-dynamics/**"
      - "rust/reference-physics/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "include/**"
      - "native/**"
      - "LICENSE"
      - "tools/build_engine_v2_wheel.py"
      - "tools/build_engine_v2_native_wheel.py"
      - "tools/run_engine_v2_cpu_performance_qualification.py"
      - "tools/build_engine_v2_sbom.py"
      - "tests/unit/test_engine_v2_release_candidate.py"
      - "tests/unit/test_engine_v2_native_packaging.py"
      - "tests/unit/test_engine_v2_scorer_v1_stage5.py"
      - "tests/unit/test_engine_v2_native_geometric_admission.py"
      - "tests/unit/test_engine_v2_native_fixed64_pipeline.py"
      - "tests/unit/test_engine_v2_native_fixed64_complete_pipeline.py"
      - "tests/unit/test_verify_engine_v2_native_fixed64_bounded_input_v3.py"
      - "config/engine_v2_native_fixed64_bounded_input_v3.json"
      - "tools/verify_engine_v2_native_fixed64_bounded_input_v3.py"
      - "docs/engine_v2_native_fixed64_bounded_input_v3.md"
      - "tests/unit/test_verify_engine_v2_native_fixed64_context_lease_v1.py"
      - "config/engine_v2_native_fixed64_context_lease_v1.json"
      - "tools/verify_engine_v2_native_fixed64_context_lease_v1.py"
      - "docs/engine_v2_native_fixed64_context_lease_v1.md"
      - "tests/unit/test_verify_engine_v2_native_fixed64_prepared_session_v1.py"
      - "config/engine_v2_native_fixed64_prepared_session_v1.json"
      - "tools/verify_engine_v2_native_fixed64_prepared_session_v1.py"
      - "docs/engine_v2_native_fixed64_prepared_session_v1.md"
      - "tests/unit/test_verify_engine_v2_native_fixed64_workspace_reuse_v1.py"
      - "config/engine_v2_native_fixed64_workspace_reuse_v1.json"
      - "tools/verify_engine_v2_native_fixed64_workspace_reuse_v1.py"
      - "docs/engine_v2_native_fixed64_workspace_reuse_v1.md"
      - "tests/unit/test_verify_engine_v2_repository_synthetic_d0_native_source_v1.py"
      - "config/engine_v2_repository_synthetic_d0_native_source_v1.json"
      - "tools/verify_engine_v2_repository_synthetic_d0_native_source_v1.py"
      - "docs/engine_v2_repository_synthetic_d0_native_source_v1.md"
      - "config/engine_v2_cpu_performance_profile.json"
      - "config/engine_v2_native_fixed64_cpu_profile_v5_archive.json"
      - "config/engine_v2_native_fixed64_cpu_profile_v6.json"
      - "config/engine_v2_native_fixed64_cpu_profile_v6_archive.json"
      - "config/engine_v2_native_fixed64_cpu_profile_v6_sources.json"
      - "tools/verify_engine_v2_native_fixed64_cpu_v6_rustc_wrapper.py"
      - "config/engine_v2_native_fixed64_cpu_profile_v7.json"
      - "config/engine_v2_native_fixed64_cpu_profile_v7_sources.json"
      - "config/engine_v2_native_fixed64_cpu_post_qualification_build_boundary_v1.json"
      - "tools/verify_engine_v2_native_fixed64_cpu_v7_rustc_wrapper.py"
      - "tests/unit/test_engine_v2_docking_search_v2_facade.py"
      - "CHANGELOG.md"
      - "docs/engine_v2_0_2_0rc5.md"
      - ".github/workflows/ci-engine-v2-release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            packaging/engine-v2
            rust_engine_v2
            rust/betelgeuze-docking-search
            rust/betelgeuze-runtime
            rust/betelgeuze-sys
            rust/cpu-kernel
            rust/reference-dynamics
            rust/reference-physics
            rust/Cargo.toml
            rust/Cargo.lock
            include
            native
            LICENSE
            tools/build_engine_v2_wheel.py
            tools/build_engine_v2_native_wheel.py
            tools/run_engine_v2_cpu_performance_qualification.py
            tools/build_engine_v2_sbom.py
            config/engine_v2_cpu_performance_profile.json
            config/engine_v2_native_fixed64_cpu_profile_v5_archive.json
            config/engine_v2_native_fixed64_cpu_profile_v6.json
            config/engine_v2_native_fixed64_cpu_profile_v6_archive.json
            config/engine_v2_native_fixed64_cpu_profile_v6_sources.json
            tools/verify_engine_v2_native_fixed64_cpu_v6_rustc_wrapper.py
            config/engine_v2_native_fixed64_cpu_profile_v7.json
            config/engine_v2_native_fixed64_cpu_profile_v7_sources.json
            tools/verify_engine_v2_native_fixed64_cpu_v7_rustc_wrapper.py
            config/engine_v2_native_fixed64_bounded_input_v3.json
            tools/verify_engine_v2_native_fixed64_bounded_input_v3.py
            docs/engine_v2_native_fixed64_bounded_input_v3.md
            config/engine_v2_native_fixed64_context_lease_v1.json
            tools/verify_engine_v2_native_fixed64_context_lease_v1.py
            docs/engine_v2_native_fixed64_context_lease_v1.md
            config/engine_v2_native_fixed64_prepared_session_v1.json
            tools/verify_engine_v2_native_fixed64_prepared_session_v1.py
            docs/engine_v2_native_fixed64_prepared_session_v1.md
            config/engine_v2_native_fixed64_workspace_reuse_v1.json
            tools/verify_engine_v2_native_fixed64_workspace_reuse_v1.py
            docs/engine_v2_native_fixed64_workspace_reuse_v1.md
            config/engine_v2_repository_synthetic_d0_native_source_v1.json
            tools/verify_engine_v2_repository_synthetic_d0_native_source_v1.py
            docs/engine_v2_repository_synthetic_d0_native_source_v1.md
            tests/unit/test_engine_v2_native_fixed64_complete_pipeline.py
            .github/workflows/ci-native-compute-abi.yml
            .github/workflows/ci-engine-v2-release-candidate.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install pinned static-analysis tools
        run: |
          python -m pip install pip==25.0.1
          python -m pip install ruff==0.12.4 pyright==1.1.403 cryptography==46.0.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run focused static analysis
        shell: bash
        run: |
          set +e
          ruff check \
            betelgeuze_engine_v2/contracts \
            betelgeuze_engine_v2/molecular \
            betelgeuze_engine_v2/physics/reference_parameters.py \
            betelgeuze_engine_v2/physics/reference_forcefield.py \
            tools/build_engine_v2_wheel.py \
            tools/run_engine_v2_cpu_performance_qualification.py \
            tools/build_engine_v2_sbom.py \
            --config packaging/engine-v2/pyproject.toml > static-analysis.log 2>&1
          ruff_status=$?
          pyright --project packaging/engine-v2/pyrightconfig.json >> static-analysis.log 2>&1
          pyright_status=$?
          cat static-analysis.log
          if [ "$ruff_status" -ne 0 ] || [ "$pyright_status" -ne 0 ]; then
            exit 1
          fi

      - name: Verify bounded native fixed64 input v3 contract
        run: >-
          python tools/verify_engine_v2_native_fixed64_bounded_input_v3.py

      - name: Verify native fixed64 context lease v1 contract
        run: >-
          python tools/verify_engine_v2_native_fixed64_context_lease_v1.py

      - name: Verify native fixed64 prepared session v1 contract
        run: >-
          python tools/verify_engine_v2_native_fixed64_prepared_session_v1.py

      - name: Verify native fixed64 workspace reuse v1 contract
        run: >-
          python tools/verify_engine_v2_native_fixed64_workspace_reuse_v1.py

      - name: Verify native repository synthetic D0 source v1 contract
        run: >-
          python tools/verify_engine_v2_repository_synthetic_d0_native_source_v1.py

      - name: Upload static-analysis diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-v2-static-analysis-${{ github.run_id }}
          path: static-analysis.log
          if-no-files-found: error
          retention-days: 7

  release-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      SOURCE_DATE_EPOCH: "1735689600"
      PYTHONHASHSEED: "0"
      TZ: "UTC"
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            packaging/engine-v2
            rust_engine_v2
            rust/betelgeuze-docking-search
            rust/betelgeuze-runtime
            rust/betelgeuze-sys
            rust/cpu-kernel
            rust/reference-dynamics
            rust/reference-physics
            rust/Cargo.toml
            rust/Cargo.lock
            include
            native
            LICENSE
            tools/build_engine_v2_wheel.py
            tools/build_engine_v2_native_wheel.py
            tools/run_engine_v2_cpu_performance_qualification.py
            tools/build_engine_v2_sbom.py
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_release_candidate.py
            tests/unit/test_engine_v2_native_packaging.py
            tests/unit/test_engine_v2_scorer_v1_stage5.py
            tests/unit/test_engine_v2_native_geometric_admission.py
            config/engine_v2_cpu_performance_profile.json
            config/engine_v2_native_fixed64_cpu_profile_v5_archive.json
            config/engine_v2_native_fixed64_cpu_profile_v6.json
            config/engine_v2_native_fixed64_cpu_profile_v6_archive.json
            config/engine_v2_native_fixed64_cpu_profile_v6_sources.json
            tools/verify_engine_v2_native_fixed64_cpu_v6_rustc_wrapper.py
            config/engine_v2_native_fixed64_cpu_profile_v7.json
            config/engine_v2_native_fixed64_cpu_profile_v7_sources.json
            tools/verify_engine_v2_native_fixed64_cpu_v7_rustc_wrapper.py
            tests/unit/test_engine_v2_docking_search_v2_facade.py
            tests/unit/test_engine_v2_packaging_guards.py
            CHANGELOG.md
            docs/engine_v2_0_2_0rc5.md
            docs/engine_v2_pr_overlap_matrix.md
            .github/workflows/ci-engine-v2-main.yml
            .github/workflows/ci-engine-v2-package.yml
            .github/workflows/ci-engine-v2-release-candidate.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned release tooling and CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            build==1.2.2.post1 \
            setuptools==75.8.2 \
            wheel==0.45.1 \
            pytest==8.3.5 \
            cryptography==46.0.5 \
            numpy==1.26.4 \
            "tomli==2.2.1; python_version < '3.11'"
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run release and architecture contracts
        run: |
          python tools/check_engine_v2_architecture.py
          python -m pytest -q \
            tests/unit/test_engine_v2_packaging_guards.py \
            tests/unit/test_engine_v2_release_candidate.py

      - name: Build wheel twice and require byte identity
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_engine_v2_wheel.py --output-dir dist-a --source-date-epoch "$SOURCE_DATE_EPOCH"
          python tools/build_engine_v2_wheel.py --output-dir dist-b --source-date-epoch "$SOURCE_DATE_EPOCH"
          wheel_a="$(find dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_b="$(find dist-b -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_a" -a -n "$wheel_b"
          sha256sum "$wheel_a" "$wheel_b"
          test "$(sha256sum "$wheel_a" | cut -d' ' -f1)" = "$(sha256sum "$wheel_b" | cut -d' ' -f1)"
          cmp "$wheel_a" "$wheel_b"

      - name: Generate and verify SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          python tools/build_engine_v2_sbom.py "$wheel" --output dist-a/betelgeuze-engine-v2-0.2.0rc5.spdx.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          wheel = next(Path("dist-a").glob("*.whl"))
          sbom = json.loads(Path("dist-a/betelgeuze-engine-v2-0.2.0rc5.spdx.json").read_text())
          assert sbom["spdxVersion"] == "SPDX-2.3"
          root = next(package for package in sbom["packages"] if package["name"] == "betelgeuze-engine-v2")
          observed = next(item["checksumValue"] for item in root["checksums"] if item["algorithm"] == "SHA256")
          expected = hashlib.sha256(wheel.read_bytes()).hexdigest()
          assert observed == expected
          dependencies = {package["name"] for package in sbom["packages"]}
          assert dependencies >= {"betelgeuze-engine-v2", "cryptography", "numpy", "torch"}
          PY

      - name: Clean install, pip check, and outside-checkout import
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/engine-v2-rc-${{ matrix.python-version }}"
          outside="/tmp/engine-v2-rc-outside-${{ matrix.python-version }}"
          rm -rf "$venv" "$outside"
          python -m venv "$venv"
          grep -q '^include-system-site-packages = false$' "$venv/pyvenv.cfg"
          "$venv/bin/python" -m pip install pip==25.0.1
          "$venv/bin/python" -m pip install cryptography==46.0.5
          "$venv/bin/python" -m pip install numpy==1.26.4
          "$venv/bin/python" -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$venv/bin/python" -m pip install --no-deps dist-a/*.whl
          "$venv/bin/python" -m pip check
          mkdir -p "$outside"
          cd "$outside"
          "$venv/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import betelgeuze_engine_v2 as engine

          assert metadata.version("betelgeuze-engine-v2") == "0.2.0rc5"
          assert engine.DISTRIBUTION_VERSION == "0.2.0rc5"
          assert engine.ENGINE_API_VERSION == "2.0.0"
          assert importlib.util.find_spec("api") is None
          assert importlib.util.find_spec("core") is None
          assert importlib.util.find_spec("train") is None
          PY

      - name: Upload reproducible wheel and SBOM
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-v2-0.2.0rc5-${{ github.run_id }}
          path: |
            dist-a/*.whl
            dist-a/*.spdx.json
          if-no-files-found: error
          retention-days: 14

  native-cpu-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            abi: cp310-cp310
          - python-version: "3.11"
            abi: cp311-cp311
          - python-version: "3.12"
            abi: cp312-cp312
    env:
      SOURCE_DATE_EPOCH: "1735689600"
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:fdb9a9c223b215604dc7b6f7e8fff4b39bfea5fbaa7777a2e5544a60dfa437f8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            rust_engine_v2
            rust/betelgeuze-docking-search
            rust/betelgeuze-runtime
            rust/betelgeuze-sys
            rust/cpu-kernel
            rust/reference-dynamics
            rust/reference-physics
            rust/Cargo.toml
            rust/Cargo.lock
            include
            native
            LICENSE
            tools/build_engine_v2_native_wheel.py
            tools/run_engine_v2_cpu_performance_qualification.py
            tools/build_engine_v2_sbom.py
            tests/unit/test_engine_v2_native_packaging.py
            tests/unit/test_engine_v2_scorer_v1_stage5.py
            tests/unit/test_engine_v2_native_geometric_admission.py
            tests/unit/test_engine_v2_native_fixed64_pipeline.py
            tests/unit/test_engine_v2_native_fixed64_complete_pipeline.py
            tests/unit/test_verify_engine_v2_native_fixed64_bounded_input_v3.py
            config/engine_v2_native_fixed64_bounded_input_v3.json
            tools/verify_engine_v2_native_fixed64_bounded_input_v3.py
            docs/engine_v2_native_fixed64_bounded_input_v3.md
            tests/unit/test_verify_engine_v2_native_fixed64_context_lease_v1.py
            config/engine_v2_native_fixed64_context_lease_v1.json
            tools/verify_engine_v2_native_fixed64_context_lease_v1.py
            docs/engine_v2_native_fixed64_context_lease_v1.md
            tests/unit/test_verify_engine_v2_native_fixed64_prepared_session_v1.py
            config/engine_v2_native_fixed64_prepared_session_v1.json
            tools/verify_engine_v2_native_fixed64_prepared_session_v1.py
            docs/engine_v2_native_fixed64_prepared_session_v1.md
            tests/unit/test_verify_engine_v2_native_fixed64_workspace_reuse_v1.py
            config/engine_v2_native_fixed64_workspace_reuse_v1.json
            tools/verify_engine_v2_native_fixed64_workspace_reuse_v1.py
            docs/engine_v2_native_fixed64_workspace_reuse_v1.md
            tests/unit/test_verify_engine_v2_repository_synthetic_d0_native_source_v1.py
            config/engine_v2_repository_synthetic_d0_native_source_v1.json
            tools/verify_engine_v2_repository_synthetic_d0_native_source_v1.py
            docs/engine_v2_repository_synthetic_d0_native_source_v1.md
            config/engine_v2_cpu_performance_profile.json
            config/engine_v2_native_fixed64_cpu_profile_v5_archive.json
            config/engine_v2_native_fixed64_cpu_profile_v6.json
            config/engine_v2_native_fixed64_cpu_profile_v6_archive.json
            config/engine_v2_native_fixed64_cpu_profile_v6_sources.json
            tools/verify_engine_v2_native_fixed64_cpu_v6_rustc_wrapper.py
            config/engine_v2_native_fixed64_cpu_profile_v7.json
            config/engine_v2_native_fixed64_cpu_profile_v7_sources.json
            tools/verify_engine_v2_native_fixed64_cpu_v7_rustc_wrapper.py
            .github/workflows/ci-native-compute-abi.yml
            .github/workflows/ci-engine-v2-release-candidate.yml
            tests/unit/test_engine_v2_docking_search_v2_facade.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install frozen Rust and Python verification tools
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
          python -m pip install pip==25.0.1 pytest==8.3.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Build native manylinux wheel twice
        shell: bash
        run: |
          set -euo pipefail
          for output in native-dist-a native-dist-b; do
            mkdir -p "$output"
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PWD:/io:ro" -w /io \
              -v "$PWD/$output:/output" \
              -v "$HOME/.rustup:/rustup:ro" \
              -v "$HOME/.cargo:/cargo:ro" \
              -e RUSTUP_HOME=/rustup \
              -e CARGO_HOME=/tmp/cargo-home \
              -e CARGO_TARGET_DIR=/tmp/native-target \
              -e BETELGEUZE_V7_NON_AUTHORITATIVE_PACKAGE_BUILD=1 \
              "$MANYLINUX_IMAGE" \
              bash -lc "set -euo pipefail
                /opt/python/${{ matrix.abi }}/bin/python -m venv /tmp/native-venv
                /tmp/native-venv/bin/python -m pip install --disable-pip-version-check maturin==1.11.5 >/tmp/maturin-install.log
                PATH=/opt/rh/gcc-toolset-14/root/usr/bin:/cargo/bin:/tmp/native-venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
                  /tmp/native-venv/bin/python tools/build_engine_v2_native_wheel.py \
                    --backend-profile cpu-manylinux_2_28-gcc14 \
                    --compatibility manylinux_2_28 \
                    --output-dir /output
                set +e
                PATH=/opt/rh/gcc-toolset-14/root/usr/bin:/cargo/bin:/tmp/native-venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
                  BETELGEUZE_V7_SOURCE_ROOT=/io \
                  /cargo/bin/cargo run --locked \
                    --manifest-path rust/betelgeuze-runtime/Cargo.toml \
                    --bin betelgeuze-fixed64-cpu-qualify-v7 \
                    -- --verify-activation \
                    >/tmp/v7-nonauthoritative.stdout \
                    2>/tmp/v7-nonauthoritative.stderr
                activation_status=\$?
                set -e
                test \"\$activation_status\" -eq 1
                test ! -s /tmp/v7-nonauthoritative.stdout
                grep -F \
                  'native fixed64 CPU v7 non-authoritative build cannot activate' \
                  /tmp/v7-nonauthoritative.stderr"
            git diff --exit-code
          done
          wheel_a="$(find native-dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_b="$(find native-dist-b -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_a" -a -n "$wheel_b"
          cmp "$wheel_a" "$wheel_b"
          sha256sum "$wheel_a" "$wheel_b"

      - name: Verify native wheel, SBOM, and scorer parity
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/engine-v2-native-verify-${{ matrix.abi }}
        run: |
          set -euo pipefail
          wheel="$(find native-dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          python -m pip install --no-deps "$wheel"
          python tools/build_engine_v2_sbom.py "$wheel" \
            --cargo-lock rust_engine_v2/Cargo.lock \
            --output native-dist-a/betelgeuze-engine-v2-native-0.2.0rc6.spdx.json
          cargo check --locked --manifest-path rust_engine_v2/Cargo.toml
          cargo test --locked --no-default-features --manifest-path rust_engine_v2/Cargo.toml
          python -m pytest -q \
            tests/unit/test_engine_v2_native_packaging.py \
            tests/unit/test_engine_v2_scorer_v1_stage5.py \
            tests/unit/test_engine_v2_native_geometric_admission.py \
            tests/unit/test_engine_v2_native_fixed64_pipeline.py \
            tests/unit/test_engine_v2_native_fixed64_complete_pipeline.py \
            tests/unit/test_verify_engine_v2_native_fixed64_bounded_input_v3.py \
            tests/unit/test_verify_engine_v2_native_fixed64_context_lease_v1.py \
            tests/unit/test_verify_engine_v2_native_fixed64_prepared_session_v1.py \
            tests/unit/test_verify_engine_v2_native_fixed64_workspace_reuse_v1.py \
            tests/unit/test_verify_engine_v2_repository_synthetic_d0_native_source_v1.py \
            -k 'native or rust_cpu'
          python -m pytest -q tests/unit/test_engine_v2_docking_search_v2_facade.py

      - name: Upload native wheel and SBOM
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-v2-native-0.2.0rc6-${{ github.run_id }}
          path: |
            native-dist-a/*.whl
            native-dist-a/*.spdx.json
          if-no-files-found: error
          retention-days: 14
