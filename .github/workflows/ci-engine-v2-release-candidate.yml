name: ci-engine-v2-release-candidate

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/**"
      - "packaging/engine-v2/**"
      - "tools/build_engine_v2_wheel.py"
      - "tools/build_engine_v2_sbom.py"
      - "tests/unit/test_engine_v2_release_candidate.py"
      - "tests/unit/test_engine_v2_chemistry_aware_pose_validity_v2.py"
      - "tests/unit/test_engine_v2_interpretable_pose_scorer.py"
      - "tests/unit/test_engine_v2_interpretable_local_refinement.py"
      - "tests/unit/test_engine_v2_haar_docking_proposals.py"
      - "tests/unit/test_engine_v2_steric_field_proposals.py"
      - "tests/unit/test_engine_v2_redocking_cli.py"
      - "tests/unit/test_engine_v2_rdkit_openff_preparation.py"
      - "CHANGELOG.md"
      - "docs/engine_v2_0_3_0a1.md"
      - ".github/workflows/ci-engine-v2-release-candidate.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/**"
      - "packaging/engine-v2/**"
      - "tools/build_engine_v2_wheel.py"
      - "tools/build_engine_v2_sbom.py"
      - "tests/unit/test_engine_v2_release_candidate.py"
      - "tests/unit/test_engine_v2_chemistry_aware_pose_validity_v2.py"
      - "tests/unit/test_engine_v2_interpretable_pose_scorer.py"
      - "tests/unit/test_engine_v2_interpretable_local_refinement.py"
      - "tests/unit/test_engine_v2_haar_docking_proposals.py"
      - "tests/unit/test_engine_v2_steric_field_proposals.py"
      - "tests/unit/test_engine_v2_redocking_cli.py"
      - "tests/unit/test_engine_v2_rdkit_openff_preparation.py"
      - "CHANGELOG.md"
      - "docs/engine_v2_0_3_0a1.md"
      - ".github/workflows/ci-engine-v2-release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            packaging/engine-v2
            tools/build_engine_v2_wheel.py
            tools/build_engine_v2_sbom.py
            .github/workflows/ci-engine-v2-release-candidate.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install pinned static-analysis tools
        run: |
          python -m pip install pip==25.0.1
          python -m pip install ruff==0.12.4 pyright==1.1.403 cryptography==46.0.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run focused static analysis
        shell: bash
        run: |
          set +e
          ruff check \
            betelgeuze_engine_v2/contracts \
            betelgeuze_engine_v2/benchmark/redocking_cli.py \
            betelgeuze_engine_v2/benchmark/public_posebusters_internal_preparation.py \
            betelgeuze_engine_v2/benchmark/public_posebusters_internal_execution.py \
            betelgeuze_engine_v2/benchmark/public_posebusters_internal_rmsd_evaluation.py \
            betelgeuze_engine_v2/benchmark/public_posebusters_generated_pose_evaluation.py \
            betelgeuze_engine_v2/benchmark/public_posebusters_internal_oracle_evaluation.py \
            betelgeuze_engine_v2/docking/chemistry_validity_v2.py \
            betelgeuze_engine_v2/docking/interpretable_refinement.py \
            betelgeuze_engine_v2/docking/interpretable_scoring.py \
            betelgeuze_engine_v2/docking/proposals.py \
            betelgeuze_engine_v2/docking/search.py \
            betelgeuze_engine_v2/docking/steric_field.py \
            betelgeuze_engine_v2/molecular \
            betelgeuze_engine_v2/physics/reference_parameters.py \
            betelgeuze_engine_v2/physics/reference_forcefield.py \
            betelgeuze_engine_v2/offline/openmm_force_double_rattle_oracle.py \
            betelgeuze_engine_v2/offline/openmm_force_double_rattle_trajectory.py \
            tools/build_engine_v2_wheel.py \
            tools/build_engine_v2_sbom.py \
            --config packaging/engine-v2/pyproject.toml > static-analysis.log 2>&1
          ruff_status=$?
          pyright --project packaging/engine-v2/pyrightconfig.json >> static-analysis.log 2>&1
          pyright_status=$?
          cat static-analysis.log
          if [ "$ruff_status" -ne 0 ] || [ "$pyright_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload static-analysis diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-v2-static-analysis-${{ github.run_id }}
          path: static-analysis.log
          if-no-files-found: error
          retention-days: 7

  release-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      SOURCE_DATE_EPOCH: "1735689600"
      PYTHONHASHSEED: "0"
      TZ: "UTC"
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            packaging/engine-v2
            tools/build_engine_v2_wheel.py
            tools/build_engine_v2_sbom.py
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_release_candidate.py
            tests/unit/test_engine_v2_packaging_guards.py
            tests/unit/test_engine_v2_chemistry_aware_pose_validity_v2.py
            tests/unit/test_engine_v2_interpretable_pose_scorer.py
            tests/unit/test_engine_v2_interpretable_local_refinement.py
            tests/unit/test_engine_v2_haar_docking_proposals.py
            tests/unit/test_engine_v2_steric_field_proposals.py
            tests/unit/test_engine_v2_redocking_cli.py
            tests/unit/test_engine_v2_public_posebusters_corpus_audit.py
            tests/unit/test_engine_v2_rdkit_openff_preparation.py
            tests/unit/test_engine_v2_public_pose_ranking_calibration_partition_intake.py
            tests/unit/test_engine_v2_openmm_force_double_rattle_oracle.py
            CHANGELOG.md
            docs/engine_v2_0_3_0a1.md
            docs/engine_v2_pr_overlap_matrix.md
            .github/workflows/ci-engine-v2-main.yml
            .github/workflows/ci-engine-v2-package.yml
            .github/workflows/ci-engine-v2-release-candidate.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned release tooling and CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            build==1.2.2.post1 \
            setuptools==75.8.2 \
            wheel==0.45.1 \
            pytest==8.3.5 \
            cryptography==46.0.5 \
            numpy==1.26.4 \
            rdkit==2025.9.6 \
            "tomli==2.2.1; python_version < '3.11'"
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run release and architecture contracts
        run: |
          python tools/check_engine_v2_architecture.py
          python -m pytest -q \
            tests/unit/test_engine_v2_packaging_guards.py \
            tests/unit/test_engine_v2_chemistry_aware_pose_validity_v2.py \
            tests/unit/test_engine_v2_interpretable_pose_scorer.py \
            tests/unit/test_engine_v2_interpretable_local_refinement.py \
            tests/unit/test_engine_v2_haar_docking_proposals.py \
            tests/unit/test_engine_v2_steric_field_proposals.py \
            tests/unit/test_engine_v2_redocking_cli.py \
            tests/unit/test_engine_v2_rdkit_openff_preparation.py \
            tests/unit/test_engine_v2_public_posebusters_corpus_audit.py \
            tests/unit/test_engine_v2_release_candidate.py \
            tests/unit/test_engine_v2_public_pose_ranking_calibration_partition_intake.py \
            tests/unit/test_engine_v2_openmm_force_double_rattle_oracle.py

      - name: Build wheel twice and require byte identity
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_engine_v2_wheel.py --output-dir dist-a --source-date-epoch "$SOURCE_DATE_EPOCH"
          python tools/build_engine_v2_wheel.py --output-dir dist-b --source-date-epoch "$SOURCE_DATE_EPOCH"
          wheel_a="$(find dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_b="$(find dist-b -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_a" -a -n "$wheel_b"
          sha256sum "$wheel_a" "$wheel_b"
          test "$(sha256sum "$wheel_a" | cut -d' ' -f1)" = "$(sha256sum "$wheel_b" | cut -d' ' -f1)"
          cmp "$wheel_a" "$wheel_b"

      - name: Generate and verify SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          python tools/build_engine_v2_sbom.py "$wheel" --output dist-a/betelgeuze-engine-v2-0.3.0a1.spdx.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          wheel = next(Path("dist-a").glob("*.whl"))
          sbom = json.loads(Path("dist-a/betelgeuze-engine-v2-0.3.0a1.spdx.json").read_text())
          assert sbom["spdxVersion"] == "SPDX-2.3"
          root = next(package for package in sbom["packages"] if package["name"] == "betelgeuze-engine-v2")
          observed = next(item["checksumValue"] for item in root["checksums"] if item["algorithm"] == "SHA256")
          expected = hashlib.sha256(wheel.read_bytes()).hexdigest()
          assert observed == expected
          dependencies = {package["name"] for package in sbom["packages"]}
          assert dependencies >= {"betelgeuze-engine-v2", "cryptography", "numpy", "torch"}
          PY

      - name: Clean install, pip check, and outside-checkout import
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/engine-v2-rc-${{ matrix.python-version }}"
          outside="/tmp/engine-v2-rc-outside-${{ matrix.python-version }}"
          rm -rf "$venv" "$outside"
          python -m venv "$venv"
          grep -q '^include-system-site-packages = false$' "$venv/pyvenv.cfg"
          "$venv/bin/python" -m pip install pip==25.0.1
          "$venv/bin/python" -m pip install cryptography==46.0.5
          "$venv/bin/python" -m pip install numpy==1.26.4
          "$venv/bin/python" -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$venv/bin/python" -m pip install --no-deps dist-a/*.whl
          "$venv/bin/python" -m pip check
          mkdir -p "$outside"
          cd "$outside"
          "$venv/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import betelgeuze_engine_v2 as engine
          from betelgeuze_engine_v2.docking import (
              DOCKING_SAMPLING_POLICY_ID,
              DOCKING_STERIC_FIELD_TRANSLATION_PLACEMENT_POLICY_ID,
              InterpretableLocalPoseRefinerV0,
              InterpretableLocalRefinementReceipt,
              StericFieldPlacementConfig,
          )

          assert metadata.version("betelgeuze-engine-v2") == "0.3.0a1"
          assert engine.DISTRIBUTION_VERSION == "0.3.0a1"
          assert engine.ENGINE_API_VERSION == "2.0.0"
          assert importlib.util.find_spec("api") is None
          assert importlib.util.find_spec("core") is None
          assert importlib.util.find_spec("rdkit") is None
          assert importlib.util.find_spec("train") is None
          assert InterpretableLocalPoseRefinerV0.refiner_version == "1.0.0"
          assert InterpretableLocalRefinementReceipt is not None
          assert "haar_so3" in DOCKING_SAMPLING_POLICY_ID
          assert "steric_field" in DOCKING_STERIC_FIELD_TRANSLATION_PLACEMENT_POLICY_ID
          assert StericFieldPlacementConfig(translation_radius_angstrom=1.0).maximum_site_count == 64
          PY
          "$venv/bin/betelgeuze-engine-v2-prepare-ligand" --help | grep -q "bounded ligand with RDKit"
          "$venv/bin/betelgeuze-engine-v2-redock-diagnostic" --help | grep -q "claim-closed prepared redocking diagnostic"
          "$venv/bin/betelgeuze-engine-v2-s0-review" contract > s0-contract.json
          "$venv/bin/python" - <<'PY'
          import json
          from pathlib import Path
          from betelgeuze_engine_v2.offline.s0_production_evidence_bundle import (
              FROZEN_S0_PRODUCTION_EVIDENCE_BUNDLE_CONTRACT_SHA256,
          )

          contract = json.loads(Path("s0-contract.json").read_text(encoding="ascii"))
          assert contract["contract_sha256"] == FROZEN_S0_PRODUCTION_EVIDENCE_BUNDLE_CONTRACT_SHA256
          PY
          "$venv/bin/betelgeuze-engine-v2-s0-review" --help | grep -q "never accepts a private key"
          "$venv/bin/betelgeuze-engine-v2-openmm-materialize" --help | grep -q "never accepts a private key"
          "$venv/bin/betelgeuze-engine-v2-openmm-native-minimization" --help | grep -q "failure-inclusive OpenMM Reference native"
          "$venv/bin/betelgeuze-engine-v2-openmm-fixed-born-disposition" --help | grep -q "never replaces the rejected endpoint"
          "$venv/bin/betelgeuze-engine-v2-openmm-constraint-stationarity" --help | grep -q "claim-closed stationarity candidate"
          "$venv/bin/betelgeuze-engine-v2-minimization-stationarity-successor" --help | grep -q "claim-closed 14-case minimization"
          "$venv/bin/betelgeuze-engine-v2-openmm-nve-trajectory" --help | grep -q "claim-closed OpenMM"
          "$venv/bin/betelgeuze-engine-v2-openmm-explicit-solvent-trajectory" --help | grep -q "claim-closed OpenMM Reference explicit-solvent"
          "$venv/bin/betelgeuze-engine-v2-openmm-force-double-rattle-trajectory" --help | grep -q "claim-closed OpenMM-force double-RATTLE"
          "$venv/bin/betelgeuze-engine-v2-posebusters-intake" --help | grep -q "without extraction"
          "$venv/bin/betelgeuze-engine-v2-posebusters-corpus-audit" --help | grep -q "without extraction or docking"
          "$venv/bin/betelgeuze-engine-v2-posebusters-internal-prepare" --help | grep -q "canonical internal redocking inputs"
          "$venv/bin/betelgeuze-engine-v2-posebusters-internal-execute" --help | grep -q "failure-inclusive internal redocking"
          "$venv/bin/betelgeuze-engine-v2-posebusters-internal-rmsd" --help | grep -q "connectivity-symmetry direct RMSD"
          "$venv/bin/betelgeuze-engine-v2-posebusters-internal-oracle" --help | grep -q "pinned PoseBusters oracle"
          "$venv/bin/betelgeuze-engine-v2-posebusters-external-prepare" --help | grep -q "without extraction or docking"
          "$venv/bin/betelgeuze-engine-v2-posebusters-external-execute" --help | grep -q "all-case rows"
          "$venv/bin/betelgeuze-engine-v2-posebusters-external-evaluate-generated" --help | grep -q "GNINA or Smina poses"
          "$venv/bin/betelgeuze-engine-v2-posebusters-vina-execute" --help | grep -q "all-case rows"
          "$venv/bin/betelgeuze-engine-v2-posebusters-evaluate-generated" --help | grep -q "all-case rows"
          "$venv/bin/betelgeuze-engine-v2-posebusters-target-clusters" --help | grep -q "conservative observed-target clusters"
          "$venv/bin/betelgeuze-engine-v2-posebusters-rcsb-target-families" --help | grep -q "pocket-associated RCSB/Pfam annotations"
          "$venv/bin/betelgeuze-engine-v2-posebusters-ranking-intake" --help | grep -q "test-only, failure-inclusive calibration intake"
          "$venv/bin/betelgeuze-engine-v2-posebusters-ranking-test-partitions" --help | grep -q "failure-inclusive"
          "$venv/bin/betelgeuze-engine-v2-posebusters-external-ranking-evaluate" --help | grep -q "fixed Vina/GNINA/Smina source ranking policies"
          "$venv/bin/betelgeuze-engine-v2-posebusters-external-ranking-reproduce" --help | grep -q "second-host, failure-inclusive"
          "$venv/bin/betelgeuze-engine-v2-posebusters-internal-diagnostic-ranking" --help | grep -q "uncalibrated internal PDBQT/UFF diagnostic"
          "$venv/bin/betelgeuze-engine-v2-public-ranking-corpus-intake" --help | grep -q "PDBbind fit, CASF validation, and PoseBusters test manifests"
          "$venv/bin/betelgeuze-engine-v2-public-ranking-calibration-partition-intake" --help | grep -q "PDBbind fit and CASF validation score partitions"
          "$venv/bin/betelgeuze-engine-v2-public-ranking-calibration-training-view" --help | grep -q "success-only PDBbind training view"
          "$venv/bin/betelgeuze-engine-v2-public-ranking-fit-validation" --help | grep -q "PoseBusters test score partition"
          "$venv/bin/betelgeuze-engine-v2-posebusters-pose-scaffold-identity" --help | grep -q "generated-coordinate identity"
          "$venv/bin/betelgeuze-engine-v2-posebusters-prepared-ligand-diagnostic" --help | grep -q "prepared ligand Gasteiger charge and atom-type diagnostics"
          "$venv/bin/betelgeuze-engine-v2-posebusters-openbabel-compare" --help | grep -q "independent Open Babel charge"
          "$venv/bin/betelgeuze-engine-v2-posebusters-sulfur-qm-esp" --help | grep -q "fixed-geometry PoseBusters sulfur QM ESP diagnostic"
          "$venv/bin/betelgeuze-engine-v2-posebusters-sulfur-interaction" --help | grep -q "neutral-thioether"
          "$venv/bin/betelgeuze-engine-v2-posebusters-sulfur-reproduce" --help | grep -q "two-host neutral-thioether"
          "$venv/bin/betelgeuze-engine-v2-posebusters-vina-sulfur-invariance" --help | grep -q "default-Vina neutral-thioether"
          "$venv/bin/betelgeuze-engine-v2-posebusters-native-geometry" --help | grep -q "without extraction or docking"

      - name: Upload reproducible wheel and SBOM
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-v2-0.3.0a1-${{ github.run_id }}
          path: |
            dist-a/*.whl
            dist-a/*.spdx.json
          if-no-files-found: error
          retention-days: 14
