name: ci-engine-v2-public-benchmark-protocol

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/benchmark/**"
      - "betelgeuze_engine_v2/docking/metrics.py"
      - "betelgeuze_engine_v2/docking/validity.py"
      - "betelgeuze_engine_v2/capabilities.py"
      - "config/independent_engine_v2_capabilities.yaml"
      - "tests/unit/test_engine_v2_public_benchmark_protocol.py"
      - "tests/unit/test_engine_v2_public_benchmark_materializer.py"
      - "tests/unit/test_engine_v2_benchmark_contracts.py"
      - ".github/workflows/ci-engine-v2-public-benchmark-protocol.yml"
      - ".github/workflows/ci-engine-v2-main.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/benchmark/**"
      - "betelgeuze_engine_v2/docking/metrics.py"
      - "betelgeuze_engine_v2/docking/validity.py"
      - "betelgeuze_engine_v2/capabilities.py"
      - "config/independent_engine_v2_capabilities.yaml"
      - "tests/unit/test_engine_v2_public_benchmark_protocol.py"
      - "tests/unit/test_engine_v2_public_benchmark_materializer.py"
      - "tests/unit/test_engine_v2_benchmark_contracts.py"
      - ".github/workflows/ci-engine-v2-public-benchmark-protocol.yml"
      - ".github/workflows/ci-engine-v2-main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-public-benchmark-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-benchmark-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_public_benchmark_protocol.py
            tests/unit/test_engine_v2_public_benchmark_materializer.py
            tests/unit/test_engine_v2_benchmark_contracts.py
            .github/workflows/ci-engine-v2-public-benchmark-protocol.yml
            .github/workflows/ci-engine-v2-main.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Record exact public materializer source hash
        run: |
          sha256sum \
            betelgeuze_engine_v2/benchmark/public_materializer.py \
            > public-materializer-source-hash.txt

      - name: Upload exact public materializer source hash
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-materializer-source-hash-${{ matrix.python-version }}
          path: public-materializer-source-hash.txt
          if-no-files-found: error
          retention-days: 1

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install pytest==8.3.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        run: |
          python -m compileall -q betelgeuze_engine_v2
          python tools/check_engine_v2_architecture.py

      - name: Verify frozen protocol and result-free materializer contracts
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_public_benchmark_protocol.py \
            tests/unit/test_engine_v2_public_benchmark_materializer.py \
            tests/unit/test_engine_v2_benchmark_contracts.py
