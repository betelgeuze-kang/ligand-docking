name: ci-engine-v2-h5-parameter-applicability

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/physics/**"
      - "betelgeuze_engine_v2/geometry/**"
      - "betelgeuze_engine_v2/molecular/models.py"
      - "betelgeuze_engine_v2/molecular/serialization.py"
      - "betelgeuze_engine_v2/parameter_source_provenance.py"
      - "betelgeuze_engine_v2/capabilities.py"
      - "config/independent_engine_v2_capabilities.yaml"
      - "tests/unit/test_engine_v2_reference_parameter_applicability.py"
      - "tests/unit/test_engine_v2_reference_physics.py"
      - ".github/workflows/ci-engine-v2-h5-parameter-applicability.yml"
      - ".github/workflows/ci-engine-v2-main.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/physics/**"
      - "betelgeuze_engine_v2/geometry/**"
      - "betelgeuze_engine_v2/molecular/models.py"
      - "betelgeuze_engine_v2/molecular/serialization.py"
      - "betelgeuze_engine_v2/parameter_source_provenance.py"
      - "betelgeuze_engine_v2/capabilities.py"
      - "config/independent_engine_v2_capabilities.yaml"
      - "tests/unit/test_engine_v2_reference_parameter_applicability.py"
      - "tests/unit/test_engine_v2_reference_physics.py"
      - ".github/workflows/ci-engine-v2-h5-parameter-applicability.yml"
      - ".github/workflows/ci-engine-v2-main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-h5-parameter-applicability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  h5-parameter-applicability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_reference_parameter_applicability.py
            tests/unit/test_engine_v2_reference_physics.py
            tests/unit/test_engine_v2_parameter_source_provenance.py
            .github/workflows/ci-engine-v2-parameter-source-provenance.yml
            .github/workflows/ci-engine-v2-mmcif-nonpoly-preparation.yml
            .github/workflows/ci-engine-v2-mmcif-nonpoly-hydrogen-coordinates.yml
            .github/workflows/ci-engine-v2-mmcif-nonpoly-preparation-corpus.yml
            .github/workflows/ci-engine-v2-h5-parameter-applicability.yml
            .github/workflows/ci-engine-v2-main.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install pytest==8.3.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        run: |
          python -m compileall -q betelgeuze_engine_v2
          python tools/check_engine_v2_architecture.py

      - name: Verify H5 origin, envelope, source identity, and non-promotion
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_reference_parameter_applicability.py \
            tests/unit/test_engine_v2_reference_physics.py \
            tests/unit/test_engine_v2_parameter_source_provenance.py
