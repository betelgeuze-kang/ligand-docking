name: ci-engine-v2-molecular-round3

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/__init__.py"
      - "betelgeuze_engine_v2/stack_round1_hardening.py"
      - "betelgeuze_engine_v2/stack_round2_evaluator.py"
      - "betelgeuze_engine_v2/stack_round3_molecular.py"
      - "betelgeuze_engine_v2/stack_round3_integrity_compat.py"
      - "betelgeuze_engine_v2/stack_round3_list_compat.py"
      - "betelgeuze_engine_v2/stack_round3_reader_compat.py"
      - "betelgeuze_engine_v2/molecular/models.py"
      - "betelgeuze_engine_v2/molecular/serialization.py"
      - "tests/unit/test_engine_v2_stack_round3_molecular.py"
      - "tests/unit/test_engine_v2_stack_round3_compatibility.py"
      - "tests/unit/test_engine_v2_input_identity.py"
      - "tests/unit/test_engine_v2_contracts_molecular.py"
      - ".github/workflows/ci-engine-v2-molecular-round3.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/__init__.py"
      - "betelgeuze_engine_v2/stack_round1_hardening.py"
      - "betelgeuze_engine_v2/stack_round2_evaluator.py"
      - "betelgeuze_engine_v2/stack_round3_molecular.py"
      - "betelgeuze_engine_v2/stack_round3_integrity_compat.py"
      - "betelgeuze_engine_v2/stack_round3_list_compat.py"
      - "betelgeuze_engine_v2/stack_round3_reader_compat.py"
      - "betelgeuze_engine_v2/molecular/models.py"
      - "betelgeuze_engine_v2/molecular/serialization.py"
      - "tests/unit/test_engine_v2_stack_round3_molecular.py"
      - "tests/unit/test_engine_v2_stack_round3_compatibility.py"
      - "tests/unit/test_engine_v2_input_identity.py"
      - "tests/unit/test_engine_v2_contracts_molecular.py"
      - ".github/workflows/ci-engine-v2-molecular-round3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-molecular-round3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  molecular-round3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: "--confcutdir=tests/unit"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install pytest==8.3.5 PyYAML==6.0.3 cryptography==46.0.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        run: |
          python -m compileall -q \
            betelgeuze_engine_v2/stack_round1_hardening.py \
            betelgeuze_engine_v2/stack_round2_evaluator.py \
            betelgeuze_engine_v2/stack_round3_molecular.py \
            betelgeuze_engine_v2/stack_round3_integrity_compat.py \
            betelgeuze_engine_v2/stack_round3_list_compat.py \
            betelgeuze_engine_v2/stack_round3_reader_compat.py
          python tools/check_engine_v2_architecture.py

      - name: Verify molecular immutability and canonical artifacts
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_stack_round3_molecular.py \
            tests/unit/test_engine_v2_stack_round3_compatibility.py \
            tests/unit/test_engine_v2_input_identity.py \
            tests/unit/test_engine_v2_contracts_molecular.py
