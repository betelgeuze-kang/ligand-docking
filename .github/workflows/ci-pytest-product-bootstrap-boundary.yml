name: ci-pytest-product-bootstrap-boundary

on:
  pull_request:
    paths:
      - "tests/conftest.py"
      - "tests/unit/test_pytest_product_artifact_bootstrap_boundary.py"
      - ".github/workflows/ci-pytest-product-bootstrap-boundary.yml"

permissions:
  contents: read

concurrency:
  group: ci-pytest-product-bootstrap-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install bounded test dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install pytest==8.3.5 ruff==0.11.13

      - name: Compile and test explicit product artifact ownership
        run: |
          python -m py_compile \
            tests/conftest.py \
            tests/unit/test_pytest_product_artifact_bootstrap_boundary.py
          python -m pytest -q \
            --confcutdir=tests/unit \
            tests/unit/test_pytest_product_artifact_bootstrap_boundary.py

      - name: Prove a new focused test performs no implicit bootstrap
        run: |
          test ! -e runs/product_capability_surface_contract_current.json
          cat > tests/unit/test_temporary_explicit_bootstrap_probe.py <<'PY'
          def test_new_focused_contract_has_no_product_dependency():
              assert True
          PY
          BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP=auto \
            python -m pytest -q \
              tests/unit/test_temporary_explicit_bootstrap_probe.py
          test ! -e runs/product_capability_surface_contract_current.json
          rm -f tests/unit/test_temporary_explicit_bootstrap_probe.py

      - name: Lint and diff check
        run: |
          python -m ruff check \
            tests/conftest.py \
            tests/unit/test_pytest_product_artifact_bootstrap_boundary.py
          git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
