name: pr244-rebuild-authoritative-main-once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: pr244-rebuild-authoritative-main-once
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event.pull_request.number == 244
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild authoritative main workflow from activation coverage plus Phase 2.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show d9b9355cbfe58a39ed5a0d764d875020b60c52dd:.github/workflows/ci-engine-v2-main.yml \
            > .github/workflows/ci-engine-v2-main.yml

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci-engine-v2-main.yml')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  '      - "config/engine_v2_fresh_redocking_holdout_manifest.json"\n',
                  '      - "config/engine_v2_fresh_redocking_holdout_manifest.json"\n'
                  '      - "config/engine_v2_phase25_cohort_admission.json"\n',
              ),
              (
                  '            config/engine_v2_fresh_redocking_holdout_manifest.json\n',
                  '            config/engine_v2_fresh_redocking_holdout_manifest.json\n'
                  '            config/engine_v2_phase25_cohort_admission.json\n',
              ),
              (
                  '      - "tools/verify_engine_v2_public_redocking_stage0.py"\n',
                  '      - "tools/verify_engine_v2_public_redocking_stage0.py"\n'
                  '      - "tools/verify_engine_v2_phase25_cohort_admission.py"\n',
              ),
              (
                  '            tools/verify_engine_v2_public_redocking_stage0.py\n',
                  '            tools/verify_engine_v2_public_redocking_stage0.py\n'
                  '            tools/verify_engine_v2_phase25_cohort_admission.py\n',
              ),
              (
                  '      - "tests/unit/test_build_engine_v2_receipt_bound_scale_feasibility_audit.py"\n',
                  '      - "tests/unit/test_build_engine_v2_receipt_bound_scale_feasibility_audit.py"\n'
                  '      - "tests/unit/test_verify_engine_v2_phase25_cohort_admission.py"\n',
              ),
              (
                  '            tests/unit/test_build_engine_v2_receipt_bound_scale_feasibility_audit.py\n',
                  '            tests/unit/test_build_engine_v2_receipt_bound_scale_feasibility_audit.py\n'
                  '            tests/unit/test_verify_engine_v2_phase25_cohort_admission.py\n',
              ),
              (
                  '            tools/verify_engine_v2_public_redocking_stage0.py \\\n',
                  '            tools/verify_engine_v2_public_redocking_stage0.py \\\n'
                  '            tools/verify_engine_v2_phase25_cohort_admission.py \\\n',
              ),
              (
                  '          python tools/check_engine_v2_architecture.py\n',
                  '          python tools/check_engine_v2_architecture.py\n'
                  '          python tools/verify_engine_v2_phase25_cohort_admission.py\n',
              ),
              (
                  '            tests/unit/test_build_engine_v2_receipt_bound_scale_feasibility_audit.py \\\n',
                  '            tests/unit/test_build_engine_v2_receipt_bound_scale_feasibility_audit.py \\\n'
                  '            tests/unit/test_verify_engine_v2_phase25_cohort_admission.py \\\n',
              ),
          )
          for old, new in replacements:
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'missing Phase 2.5 workflow anchor: {old!r}')
                  text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/zz-pr244-rebuild-authoritative-main.yml .pr244-authoritative-ci-trigger
          git add -A
          git diff --cached --check
          git commit -m "Reconcile clearance activation with Phase 2.5 authoritative CI"
          git push origin HEAD:codex/source-paired-clearance-activation-v1
