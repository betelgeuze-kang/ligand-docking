name: ci-cpu-shape-supervisor
on:
  pull_request:
    paths:
      - 'betelgeuze_product/cpu_shape_comparison_supervisor_v1/**'
      - 'betelgeuze_product/cpu_prepared_shape_comparison_v1/**'
      - 'tests/unit/test_cpu_shape_supervisor_*.py'
      - '.github/workflows/ci-cpu-shape-supervisor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-process-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned CPU test and package tools
        run: |
          python -m pip install -r requirements-package.txt
          python -m pip install pytest==8.3.5 rdkit==2026.3.6 ruff==0.11.13 build==1.2.2.post1 setuptools==75.8.2 wheel==0.45.1
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Lint additive supervisor and tests
        run: |
          python -m ruff check --isolated --no-cache betelgeuze_product/cpu_shape_comparison_supervisor_v1 tests/unit/test_cpu_shape_supervisor_*.py
          git diff --check
      - name: Test only synthetic process and worker contracts
        run: |
          timeout 180 python -m pytest --rootdir="$PWD" -c /dev/null --noconftest -p no:cacheprovider -W error -q tests/unit/test_cpu_shape_supervisor_*.py
      - name: Build and verify installed isolated CLI help
        run: |
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/supervisor-wheels"
          python -m venv --system-site-packages "$RUNNER_TEMP/supervisor-installed"
          "$RUNNER_TEMP/supervisor-installed/bin/python" -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/supervisor-wheels/*.whl
          "$RUNNER_TEMP/supervisor-installed/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/supervisor-installed/bin/python" -I -m betelgeuze_product.cpu_shape_comparison_supervisor_v1 --help
