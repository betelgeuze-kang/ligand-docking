name: pr244-sync-main-once

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

concurrency:
  group: pr244-sync-main-once
  cancel-in-progress: false

jobs:
  merge-main:
    if: github.event.pull_request.number == 244
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and resolve the known overlap surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if ! git merge --no-ff --no-commit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/ci-engine-v2-main.yml' \
              'docs/engine_v2_stage0_status.md' \
              'tests/unit/test_engine_v2_blind_stage0.py' \
              | sort)"
            if [[ "$conflicts" != "$expected" ]]; then
              printf 'unexpected conflicts:\n%s\n' "$conflicts" >&2
              exit 1
            fi

            git checkout --ours .github/workflows/ci-engine-v2-main.yml
            git checkout --theirs docs/engine_v2_stage0_status.md
            git checkout --ours tests/unit/test_engine_v2_blind_stage0.py

            python - <<'PY'
          from pathlib import Path

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          workflow_path = ".github/workflows/ci-engine-v2-main.yml"
          text = Path(workflow_path).read_text(encoding="utf-8")
          replacements = (
              (
                  '      - "config/engine_v2_fresh_redocking_holdout_manifest.json"\n',
                  '      - "config/engine_v2_fresh_redocking_holdout_manifest.json"\n'
                  '      - "config/engine_v2_phase25_cohort_admission.json"\n',
              ),
              (
                  '            config/engine_v2_fresh_redocking_holdout_manifest.json\n',
                  '            config/engine_v2_fresh_redocking_holdout_manifest.json\n'
                  '            config/engine_v2_phase25_cohort_admission.json\n',
              ),
              (
                  '      - "tools/verify_engine_v2_public_redocking_stage0.py"\n',
                  '      - "tools/verify_engine_v2_public_redocking_stage0.py"\n'
                  '      - "tools/verify_engine_v2_phase25_cohort_admission.py"\n',
              ),
              (
                  '            tools/verify_engine_v2_public_redocking_stage0.py\n',
                  '            tools/verify_engine_v2_public_redocking_stage0.py\n'
                  '            tools/verify_engine_v2_phase25_cohort_admission.py\n',
              ),
              (
                  '      - "tests/unit/test_build_engine_v2_receipt_bound_scale_feasibility_audit.py"\n',
                  '      - "tests/unit/test_build_engine_v2_receipt_bound_scale_feasibility_audit.py"\n'
                  '      - "tests/unit/test_verify_engine_v2_phase25_cohort_admission.py"\n',
              ),
              (
                  '            tests/unit/test_build_engine_v2_receipt_bound_scale_feasibility_audit.py\n',
                  '            tests/unit/test_build_engine_v2_receipt_bound_scale_feasibility_audit.py\n'
                  '            tests/unit/test_verify_engine_v2_phase25_cohort_admission.py\n',
              ),
              (
                  '            tools/verify_engine_v2_public_redocking_stage0.py \\\n',
                  '            tools/verify_engine_v2_public_redocking_stage0.py \\\n'
                  '            tools/verify_engine_v2_phase25_cohort_admission.py \\\n',
              ),
              (
                  '          python tools/check_engine_v2_architecture.py\n',
                  '          python tools/check_engine_v2_architecture.py\n'
                  '          python tools/verify_engine_v2_phase25_cohort_admission.py\n',
              ),
              (
                  '            tests/unit/test_build_engine_v2_receipt_bound_scale_feasibility_audit.py \\\n',
                  '            tests/unit/test_build_engine_v2_receipt_bound_scale_feasibility_audit.py \\\n'
                  '            tests/unit/test_verify_engine_v2_phase25_cohort_admission.py \\\n',
              ),
          )
          for old, new in replacements:
              if new not in text:
                  if old not in text:
                      raise SystemExit(f"workflow merge anchor missing: {old!r}")
                  text = text.replace(old, new)
          write(workflow_path, text)

          stage_path = "docs/engine_v2_stage0_status.md"
          text = Path(stage_path).read_text(encoding="utf-8")
          start = text.index(
              "- The source-paired clearance-selection policy is now predeclared, but remains\n"
          )
          end = text.index("- Solo self-review pass records", start)
          activation_block = """- The frozen source-paired clearance policy remains exactly
            `e5936f33d5aec54aae67f519e5cf6dffcc61181237270adb3e367a5f65cb29ad`.
            Its original caller-supplied probe is explicitly inadmissible activation
            evidence. A separate
            [snapshot-driven activation contract](engine_v2_source_paired_clearance_activation.md)
            now binds the exact frozen per-case archive-member authority, full 64-slot
            source-proposal receipt, full typed current-V7 candidate/V1.1 lineage, V1.1
            target receipts, and allocation receipt to every allocated target and parent,
            proposal and coordinate/torsion identities, V6-baseline and optimized states,
            raw-distance and VDW-gap telemetry, objectives, counts, and torsion status.
            Snapshot `1.2.0` also binds the authenticated input, element-aware validity
            context, receptor tensor, element-derived VDW radii, and baseline/optimized
            torsion digests. The adapter independently recomputes the complete clearance
            statistics and replays every authenticated torsion move; snapshot subclasses
            fail before dispatch.
            Its outer receipt independently rederives every activated state, requires all
            allocated targets, permits changes only for targets selected by the
            predeclared rule, rejects equal cross-arm non-target substitutions, and retains complete
            `ScorerV1Terms`, context-bound internal validity, the exact 22-check
            PoseBusters map, authenticated symmetry-aware RMSD, and the complete 64-slot
            score/rank order for both arms. Score terms, exact validity, Top-1, and Top-5
            can therefore be rederived without treating the incomplete historical score
            archive as authority. It constructs non-executing evidence only: historical
            A/B, result materialization, default V7 changes, CLI/product wiring,
            fresh-128, and scientific or product claims remain unauthorized.
          """
          text = text[:start] + activation_block + text[end:]

          start = text.index(
              "   The result-independent clearance shadow rule is predeclared, but its current\n"
          )
          end = text.index("4. **Full-suite self-review:**", start)
          blocker = """   One result-independent shadow rule is frozen, and its snapshot-driven
             activation-evidence contract can preserve complete score, term, validity,
             and rank semantics. The historical A/B has not been authorized or run;
             do not relabel, filter, abstain, relax thresholds, or substitute an
             incomplete historical score archive around the current pool.
          """
          text = text[:start] + blocker + text[end:]
          write(stage_path, text)

          blind_path = "tests/unit/test_engine_v2_blind_stage0.py"
          text = Path(blind_path).read_text(encoding="utf-8")
          anchor = (
              '                "tools/reconcile_engine_v2_stage0_full_suites.py",\n'
              '                *CLEARANCE_ACTIVATION_REQUIRED_TOKENS,\n'
          )
          replacement = (
              '                "tools/reconcile_engine_v2_stage0_full_suites.py",\n'
              '                "config/engine_v2_phase25_cohort_admission.json",\n'
              '                "tools/verify_engine_v2_phase25_cohort_admission.py",\n'
              '                "tests/unit/test_verify_engine_v2_phase25_cohort_admission.py",\n'
              '                *CLEARANCE_ACTIVATION_REQUIRED_TOKENS,\n'
          )
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit("blind-stage merge anchor missing")
              text = text.replace(anchor, replacement, 1)
          write(blind_path, text)
          PY

            git add .github/workflows/ci-engine-v2-main.yml \
              docs/engine_v2_stage0_status.md \
              tests/unit/test_engine_v2_blind_stage0.py \
              tools/audit_engine_v2_ci_authority.py \
              tests/unit/test_audit_engine_v2_ci_authority.py
          fi

          rm -f .github/workflows/zz-pr244-sync-main.yml
          git add -A
          git diff --cached --check
          git commit -m "Merge main into source-bound clearance activation"
          git push origin HEAD:codex/source-paired-clearance-activation-v1
