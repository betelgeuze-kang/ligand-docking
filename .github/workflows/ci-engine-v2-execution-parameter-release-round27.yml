name: ci-engine-v2-execution-parameter-release-round27

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/__init__.py"
      - "betelgeuze_engine_v2/execution_parameter_attestation.py"
      - "tests/unit/test_engine_v2_execution_parameter_attestation_round26.py"
      - "tests/unit/test_engine_v2_execution_parameter_release_round27.py"
      - "tests/unit/test_engine_v2_input_bound_verifier_round24.py"
      - "tools/check_engine_v2_top_stack.py"
      - ".github/workflows/ci-engine-v2-execution-parameter-attestation-round26.yml"
      - ".github/workflows/ci-engine-v2-execution-parameter-release-round27.yml"
      - ".github/workflows/ci-engine-v2-input-bound-verifier-release-round25.yml"
      - ".github/workflows/ci-engine-v2-top-stack.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/__init__.py"
      - "betelgeuze_engine_v2/execution_parameter_attestation.py"
      - "tests/unit/test_engine_v2_execution_parameter_release_round27.py"
      - "tools/check_engine_v2_top_stack.py"
      - ".github/workflows/ci-engine-v2-execution-parameter-release-round27.yml"
      - ".github/workflows/ci-engine-v2-input-bound-verifier-release-round25.yml"
      - ".github/workflows/ci-engine-v2-top-stack.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-execution-parameter-release-round27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution-parameter-release-round27:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: "--confcutdir=tests/unit"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install pytest==8.3.5 PyYAML==6.0.3 cryptography==46.0.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and verify the release boundary
        run: |
          python -m compileall -q \
            betelgeuze_engine_v2/execution_parameter_attestation.py \
            tests/unit/test_engine_v2_execution_parameter_release_round27.py
          python tools/check_engine_v2_architecture.py
          python tools/check_engine_v2_top_stack.py
          git diff --check

      - name: Verify source, replay, and release contracts
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_execution_parameter_attestation_round26.py \
            tests/unit/test_engine_v2_execution_parameter_release_round27.py \
            tests/unit/test_engine_v2_input_bound_verifier_round24.py
