name: Public pose preparation and accounting contracts

on:
  pull_request:
    paths:
      - 'betelgeuze_product/benchmark_preparation_audit.py'
      - 'betelgeuze_product/public_pose_benchmark.py'
      - 'tests/unit/test_benchmark_preparation_audit.py'
      - 'tests/unit/test_public_pose_benchmark.py'
      - 'docs/benchmark_preparation_audit.ko.md'
      - 'docs/public_pose_benchmark.ko.md'
      - '.github/workflows/ci-public-pose-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'betelgeuze_product/benchmark_preparation_audit.py'
      - 'betelgeuze_product/public_pose_benchmark.py'
      - 'tests/unit/test_benchmark_preparation_audit.py'
      - 'tests/unit/test_public_pose_benchmark.py'
      - 'docs/benchmark_preparation_audit.ko.md'
      - 'docs/public_pose_benchmark.ko.md'
      - '.github/workflows/ci-public-pose-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-pose-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stdlib-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Source-loaded preparation demand and accounting tests
        run: |
          python -S -m unittest discover -s tests/unit -p test_benchmark_preparation_audit.py -v
          python -S -m unittest discover -s tests/unit -p test_public_pose_benchmark.py -v
      - name: Optimized isolated-site contracts
        run: |
          python -O -S -m unittest discover -s tests/unit -p test_benchmark_preparation_audit.py -v
          python -O -S -m unittest discover -s tests/unit -p test_public_pose_benchmark.py -v
      - name: Compile additive modules and check whitespace
        run: |
          python -S -m py_compile betelgeuze_product/benchmark_preparation_audit.py betelgeuze_product/public_pose_benchmark.py
          git diff --check
