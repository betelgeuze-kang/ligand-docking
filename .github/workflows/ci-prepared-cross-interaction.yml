name: ci-prepared-cross-interaction

on:
  pull_request:
    paths:
      - 'betelgeuze_engine/product/prepared_rigid_poses.py'
      - 'tests/unit/test_prepared_rigid_poses.py'
      - 'betelgeuze_engine/product/v2_cross_interaction.py'
      - 'betelgeuze_engine/product/prepared_gromacs_input.py'
      - 'betelgeuze_engine/product/compiled_gromacs_cross_input.py'
      - 'betelgeuze_engine/product/prepared_source_geometry.py'
      - 'betelgeuze_engine/product/mmcif_ligand_observation.py'
      - 'tools/product/observe_mmcif_ligand_coordinates.py'
      - 'tests/unit/test_mmcif_ligand_observation.py'
      - 'tools/product/score_prepared_cross_interactions.py'
      - 'betelgeuze_engine/product/prepared_assay_shadow.py'
      - 'betelgeuze_engine/product/public_assay_selector_shadow.py'
      - 'tests/unit/test_prepared_assay_shadow.py'
      - 'tests/unit/test_public_assay_selector_shadow.py'
      - 'tests/unit/test_v2_prepared_cross_interaction.py'
      - 'tests/unit/test_v2_cross_projection_metadata.py'
      - 'tests/unit/test_prepared_gromacs_input.py'
      - 'tests/unit/test_compiled_gromacs_cross_input.py'
      - 'tests/unit/test_prepared_source_geometry.py'
      - 'tests/unit/test_score_prepared_cross_interactions.py'
      - 'docs/prepared_cross_interaction_development.md'
      - '.github/workflows/ci-prepared-cross-interaction.yml'
  push:
    branches: [main]
    paths:
      - 'betelgeuze_engine/product/prepared_rigid_poses.py'
      - 'tests/unit/test_prepared_rigid_poses.py'
      - 'betelgeuze_engine/product/v2_cross_interaction.py'
      - 'betelgeuze_engine/product/prepared_gromacs_input.py'
      - 'betelgeuze_engine/product/compiled_gromacs_cross_input.py'
      - 'betelgeuze_engine/product/prepared_source_geometry.py'
      - 'betelgeuze_engine/product/mmcif_ligand_observation.py'
      - 'tools/product/observe_mmcif_ligand_coordinates.py'
      - 'tests/unit/test_mmcif_ligand_observation.py'
      - 'tools/product/score_prepared_cross_interactions.py'
      - 'betelgeuze_engine/product/prepared_assay_shadow.py'
      - 'betelgeuze_engine/product/public_assay_selector_shadow.py'
      - 'tests/unit/test_prepared_assay_shadow.py'
      - 'tests/unit/test_public_assay_selector_shadow.py'
      - 'tests/unit/test_v2_prepared_cross_interaction.py'
      - 'tests/unit/test_v2_cross_projection_metadata.py'
      - 'tests/unit/test_prepared_gromacs_input.py'
      - 'tests/unit/test_compiled_gromacs_cross_input.py'
      - 'tests/unit/test_prepared_source_geometry.py'
      - 'tests/unit/test_score_prepared_cross_interactions.py'
      - 'docs/prepared_cross_interaction_development.md'
      - '.github/workflows/ci-prepared-cross-interaction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-prepared-cross-interaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-prepared-cross-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Record checkout and source identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, sys
          files = [
              'betelgeuze_engine/product/prepared_rigid_poses.py',
              'tests/unit/test_prepared_rigid_poses.py',
              'betelgeuze_engine/product/v2_cross_interaction.py',
              'betelgeuze_engine/product/prepared_gromacs_input.py',
              'betelgeuze_engine/product/compiled_gromacs_cross_input.py',
              'betelgeuze_engine/product/prepared_source_geometry.py',
              'betelgeuze_engine/product/mmcif_ligand_observation.py',
              'tools/product/observe_mmcif_ligand_coordinates.py',
              'tests/unit/test_mmcif_ligand_observation.py',
              'tools/product/score_prepared_cross_interactions.py',
              'betelgeuze_engine/product/prepared_assay_shadow.py',
              'betelgeuze_engine/product/public_assay_selector_shadow.py',
              'tests/unit/test_prepared_assay_shadow.py',
              'tests/unit/test_public_assay_selector_shadow.py',
              'tests/unit/test_v2_prepared_cross_interaction.py',
              'tests/unit/test_v2_cross_projection_metadata.py',
              'tests/unit/test_prepared_gromacs_input.py',
              'tests/unit/test_compiled_gromacs_cross_input.py',
              'tests/unit/test_prepared_source_geometry.py',
              'tests/unit/test_score_prepared_cross_interactions.py',
              'docs/prepared_cross_interaction_development.md',
              '.github/workflows/ci-prepared-cross-interaction.yml',
          ]
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          value = {
              'checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'checkout_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'pull_request_head_sha': event.get('pull_request', {}).get('head', {}).get('sha'),
              'github_sha': os.environ['GITHUB_SHA'],
              'cwd': str(pathlib.Path.cwd()), 'python': sys.version, 'platform': platform.platform(),
              'source_sha256': {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in files},
              'scope': 'synthetic explicit-file parser, unchanged V2 cross kernel and CLI contracts; no public downloads, solver, training, protected holdouts or qualification',
          }
          pathlib.Path('prepared-cross-source.json').write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')
          PY
      - name: Install CPU test dependencies
        run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4 rdkit==2026.3.6 PyYAML==6.0.2 ruff==0.11.13
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip freeze > prepared-cross-dependencies.txt
      - name: Exercise synthetic prepared input, existing V2 kernel and command consumer
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --isolated --no-cache betelgeuze_engine/product/prepared_rigid_poses.py tests/unit/test_prepared_rigid_poses.py betelgeuze_engine/product/mmcif_ligand_observation.py tools/product/observe_mmcif_ligand_coordinates.py tests/unit/test_mmcif_ligand_observation.py betelgeuze_engine/product/prepared_source_geometry.py tests/unit/test_prepared_source_geometry.py betelgeuze_engine/product/v2_cross_interaction.py betelgeuze_engine/product/prepared_gromacs_input.py betelgeuze_engine/product/compiled_gromacs_cross_input.py tools/product/score_prepared_cross_interactions.py betelgeuze_engine/product/prepared_assay_shadow.py betelgeuze_engine/product/public_assay_selector_shadow.py tests/unit/test_prepared_assay_shadow.py tests/unit/test_public_assay_selector_shadow.py tests/unit/test_v2_prepared_cross_interaction.py tests/unit/test_v2_cross_projection_metadata.py tests/unit/test_prepared_gromacs_input.py tests/unit/test_compiled_gromacs_cross_input.py tests/unit/test_score_prepared_cross_interactions.py 2>&1 | tee prepared-cross-lint.log
          set +e
          python -m pytest --rootdir="$PWD" -c /dev/null --noconftest -p no:cacheprovider -W error -vv tests/unit/test_prepared_rigid_poses.py tests/unit/test_mmcif_ligand_observation.py tests/unit/test_prepared_source_geometry.py tests/unit/test_v2_prepared_cross_interaction.py tests/unit/test_v2_cross_projection_metadata.py tests/unit/test_prepared_gromacs_input.py tests/unit/test_compiled_gromacs_cross_input.py tests/unit/test_score_prepared_cross_interactions.py tests/unit/test_prepared_assay_shadow.py tests/unit/test_public_assay_selector_shadow.py --junitxml=prepared-cross-junit.xml 2>&1 | tee prepared-cross.log
          pytest_status=${PIPESTATUS[0]}
          set -e
          printf '{"pytest_exit_code": %s}\n' "$pytest_status" > prepared-cross-exit.json
          exit "$pytest_status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: prepared-cross-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            prepared-cross.log
            prepared-cross-lint.log
            prepared-cross-junit.xml
            prepared-cross-exit.json
            prepared-cross-source.json
            prepared-cross-dependencies.txt
            betelgeuze_engine/product/prepared_rigid_poses.py
            tests/unit/test_prepared_rigid_poses.py
            betelgeuze_engine/product/v2_cross_interaction.py
            betelgeuze_engine/product/prepared_gromacs_input.py
            betelgeuze_engine/product/compiled_gromacs_cross_input.py
            betelgeuze_engine/product/prepared_source_geometry.py
            betelgeuze_engine/product/mmcif_ligand_observation.py
            tools/product/observe_mmcif_ligand_coordinates.py
            tests/unit/test_mmcif_ligand_observation.py
            tools/product/score_prepared_cross_interactions.py
            betelgeuze_engine/product/prepared_assay_shadow.py
            betelgeuze_engine/product/public_assay_selector_shadow.py
            tests/unit/test_prepared_assay_shadow.py
            tests/unit/test_public_assay_selector_shadow.py
            tests/unit/test_v2_prepared_cross_interaction.py
            tests/unit/test_v2_cross_projection_metadata.py
            tests/unit/test_prepared_gromacs_input.py
            tests/unit/test_compiled_gromacs_cross_input.py
            tests/unit/test_prepared_source_geometry.py
            tests/unit/test_score_prepared_cross_interactions.py
            docs/prepared_cross_interaction_development.md
            .github/workflows/ci-prepared-cross-interaction.yml
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
