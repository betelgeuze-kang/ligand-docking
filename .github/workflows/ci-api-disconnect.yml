name: ci-api-disconnect

on:
  pull_request:
    paths:
      - 'api/security.py'
      - 'api/request_identity.py'
      - 'tests/unit/test_api_payload_disconnect.py'
      - '.github/workflows/ci-api-disconnect.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-api-disconnect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  body-replay-and-disconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fixed metadata-only dependencies
        run: python -m pip install pytest==8.3.5 ruff==0.11.13 fastapi==0.136.3 starlette==1.7.0 pydantic==2.12.5 pydantic-settings==2.14.1 prometheus-client==0.24.1 PyYAML==6.0.3
      - name: Preserve body replay, blocking receive, disconnect, and byte accounting
        run: |
          python -B -m pytest --rootdir=. -c /dev/null --noconftest -p no:cacheprovider -q --junitxml=disconnect.xml tests/unit/test_api_payload_disconnect.py
          python -m ruff check --isolated --no-cache api/security.py tests/unit/test_api_payload_disconnect.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('disconnect.xml').getroot()
          assert len(list(root.iter('testcase'))) == 3
          assert not list(root.iter('skipped'))
          assert not list(root.iter('failure')) and not list(root.iter('error'))
          PY
          git diff --check
