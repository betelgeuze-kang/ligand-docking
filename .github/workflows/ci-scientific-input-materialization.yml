name: ci-scientific-input-materialization

on:
  pull_request:
    paths:
      - "api/**"
      - "betelgeuze_product/docking_materialization_errors.py"
      - "betelgeuze_product/docking_private_payload.py"
      - "betelgeuze_product/job_orchestration.py"
      - "betelgeuze_product/payload_privacy.py"
      - "betelgeuze_product/private_payload_store.py"
      - "betelgeuze_product/scientific_input_materialization.py"
      - "betelgeuze_product/scientific_input_provenance.py"
      - "tools/product/materialize_docking_htvs_request.py"
      - "tools/product/materialize_docking_backmapping_request.py"
      - "tests/unit/test_docking_pipeline_hardening.py"
      - "tests/unit/test_scientific_input_materialization_recheck.py"
      - ".github/workflows/ci-scientific-input-materialization.yml"
  push:
    branches: ["main"]
    paths:
      - "api/**"
      - "betelgeuze_product/docking_materialization_errors.py"
      - "betelgeuze_product/docking_private_payload.py"
      - "betelgeuze_product/job_orchestration.py"
      - "betelgeuze_product/payload_privacy.py"
      - "betelgeuze_product/private_payload_store.py"
      - "betelgeuze_product/scientific_input_materialization.py"
      - "betelgeuze_product/scientific_input_provenance.py"
      - "tools/product/materialize_docking_htvs_request.py"
      - "tools/product/materialize_docking_backmapping_request.py"
      - "tests/unit/test_docking_pipeline_hardening.py"
      - "tests/unit/test_scientific_input_materialization_recheck.py"
      - ".github/workflows/ci-scientific-input-materialization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-scientific-input-materialization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialization-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PRODUCT_API_AUTH_REQUIRED: "0"
    steps:
      - name: Check out focused materialization surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            api
            betelgeuze_product
            core
            tools/__init__.py
            tools/pdb_loader.py
            tools/product/__init__.py
            tools/product/materialize_docking_htvs_request.py
            tools/product/materialize_docking_backmapping_request.py
            tests/__init__.py
            tests/unit/test_docking_pipeline_hardening.py
            tests/unit/test_scientific_input_materialization_recheck.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            pytest==9.1.1 \
            pandas==2.3.3 \
            pydantic==2.12.5 \
            pydantic-settings==2.14.2 \
            PyYAML==6.0.3

      - name: Compile materialization and receipt surfaces
        run: |
          python -m compileall -q \
            api \
            betelgeuze_product \
            tools/product/materialize_docking_htvs_request.py \
            tools/product/materialize_docking_backmapping_request.py \
            tests/unit/test_scientific_input_materialization_recheck.py

      - name: Run worker-side materialization and legacy fail-closed regressions
        shell: bash
        run: |
          set +e
          python -m pytest --confcutdir=tests/unit -vv -x \
            tests/unit/test_scientific_input_materialization_recheck.py \
            tests/unit/test_docking_pipeline_hardening.py::test_htvs_materializer_rejects_redacted_hash_only_ligand \
            tests/unit/test_docking_pipeline_hardening.py::test_htvs_materializer_error_exposes_structured_reason \
            tests/unit/test_docking_pipeline_hardening.py::test_backmapping_materializer_rejects_empty_ligand_input \
            tests/unit/test_docking_pipeline_hardening.py::test_backmapping_materializer_recovers_redacted_ligands_from_private_store \
            tests/unit/test_docking_pipeline_hardening.py::test_explicit_internal_smoke_uses_one_labelled_synthetic_ligand \
            tests/unit/test_docking_pipeline_hardening.py::test_htvs_materializer_recovers_redacted_ligands_from_private_store \
            tests/unit/test_docking_pipeline_hardening.py::test_htvs_materializer_fails_closed_when_private_store_binding_mismatches \
            > scientific-input-materialization.log 2>&1
          status=$?
          cat scientific-input-materialization.log
          exit "$status"

      - name: Upload scientific input materialization diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scientific-input-materialization-${{ github.run_id }}-${{ github.run_attempt }}
          path: scientific-input-materialization.log
          if-no-files-found: error
          retention-days: 7
