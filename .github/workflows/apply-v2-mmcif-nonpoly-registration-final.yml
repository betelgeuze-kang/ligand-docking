name: apply-v2-mmcif-nonpoly-registration-final

on:
  pull_request:
    paths:
      - ".github/patches/apply_v2_mmcif_nonpoly_registration.py"
      - ".github/workflows/apply-v2-mmcif-nonpoly-registration-final.yml"

permissions:
  contents: write

concurrency:
  group: apply-v2-mmcif-nonpoly-registration-final
  cancel-in-progress: false

jobs:
  apply-registration:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'betelgeuze-kang' &&
      github.head_ref == 'codex/v2-mmcif-nonpoly-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/v2-mmcif-nonpoly-identity
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply bounded public export capability and canonical registration
        shell: bash
        run: |
          set -euo pipefail
          python .github/patches/apply_v2_mmcif_nonpoly_registration.py
          python -m py_compile \
            betelgeuze_engine_v2/capabilities.py \
            betelgeuze_engine_v2/molecular/__init__.py \
            betelgeuze_engine_v2/molecular/mmcif_nonpoly_identity.py \
            tests/unit/test_engine_v2_mmcif_nonpoly_identity.py \
            tests/unit/test_engine_v2_post_merge_state.py
          git diff --check

      - name: Commit registration and remove one-time files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(v2): register bounded mmCIF nonpoly identity"
          git push origin HEAD:codex/v2-mmcif-nonpoly-identity
