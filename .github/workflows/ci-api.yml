name: ci-api

on:
  push:
    paths:
      - "api/**"
      - "betelgeuze_product/docking_response.py"
      - "betelgeuze_product/api_contract.py"
      - "requirements-api.txt"
      - "requirements/constraints-api-py311-linux-x86_64.txt"
      - "tests/unit/test_product_docking_response_contract.py"
      - "tests/unit/test_p0_proxy_score_contract.py"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "api/**"
      - "betelgeuze_product/docking_response.py"
      - "betelgeuze_product/api_contract.py"
      - "requirements-api.txt"
      - "requirements/constraints-api-py311-linux-x86_64.txt"
      - "tests/unit/test_product_docking_response_contract.py"
      - "tests/unit/test_p0_proxy_score_contract.py"
      - ".github/workflows/ci-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install bounded API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -c requirements/constraints-api-py311-linux-x86_64.txt \
            -r requirements.txt \
            -r requirements-api.txt
      - name: Compile API surface
        run: |
          python -m py_compile \
            api/product_docking.py \
            betelgeuze_product/docking_response.py \
            betelgeuze_product/api_contract.py
      - name: Run API response contract tests
        run: |
          python -m pytest -q \
            tests/unit/test_product_docking_response_contract.py \
            tests/unit/test_p0_proxy_score_contract.py
