name: ci-product-supply-chain-guardrails

on:
  pull_request:
    paths:
      - "Dockerfile.product"
      - ".dockerignore"
      - ".github/dependabot.yml"
      - "requirements-api-runtime.txt"
      - "requirements-api.txt"
      - "requirements-deploy.txt"
      - "deploy/docker-compose.product.yml"
      - "config/product_supply_chain_policy.json"
      - "tools/verify_product_supply_chain.py"
      - "tests/unit/test_product_supply_chain.py"
      - "docs/PRODUCT_SUPPLY_CHAIN_POLICY.md"
      - ".github/workflows/ci-product-supply-chain-guardrails.yml"

permissions:
  contents: read

concurrency:
  group: ci-product-supply-chain-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install bounded test dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install pytest==8.3.5 ruff==0.11.13 PyYAML==6.0.3

      - name: Verify supply-chain policy and syntax
        run: |
          python -m py_compile tools/verify_product_supply_chain.py
          python tools/verify_product_supply_chain.py --repo-root .
          python - <<'PY'
          import pathlib
          import yaml

          yaml.safe_load(pathlib.Path('.github/dependabot.yml').read_text(encoding='utf-8'))
          yaml.safe_load(pathlib.Path('deploy/docker-compose.product.yml').read_text(encoding='utf-8'))
          PY

      - name: Run supply-chain tamper contracts
        run: |
          python -m pytest -q \
            --confcutdir=tests/unit \
            tests/unit/test_product_supply_chain.py

      - name: Lint and diff check
        run: |
          python -m ruff check \
            tools/verify_product_supply_chain.py \
            tests/unit/test_product_supply_chain.py
          git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
