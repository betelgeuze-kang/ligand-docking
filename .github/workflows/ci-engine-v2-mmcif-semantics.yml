name: apply-mmcif-semantic-static-analysis-fix

on:
  pull_request:
    paths:
      - ".github/workflows/ci-engine-v2-mmcif-semantics.yml"

permissions:
  contents: write

concurrency:
  group: apply-mmcif-semantic-static-analysis-fix
  cancel-in-progress: false

jobs:
  apply-fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'betelgeuze-kang' &&
      github.head_ref == 'codex/v2-mmcif-semantic-projection'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled semantic projection branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/v2-mmcif-semantic-projection
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Remove the one Ruff-reported unused import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("betelgeuze_engine_v2/molecular/mmcif_semantics.py")
          source = path.read_text(encoding="utf-8")
          if source.count("import stat\n") != 1:
              raise SystemExit("mmCIF semantic stat import drifted")
          path.write_text(source.replace("import stat\n", "", 1), encoding="utf-8")
          PY
          python -m py_compile betelgeuze_engine_v2/molecular/mmcif_semantics.py
          git diff --check

      - name: Commit source fix without modifying workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add betelgeuze_engine_v2/molecular/mmcif_semantics.py
          git diff --cached --check
          git commit -m "fix(v2): remove unused mmCIF semantic import"
          git push origin HEAD:codex/v2-mmcif-semantic-projection
