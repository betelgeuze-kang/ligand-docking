name: apply-mmcif-semantic-projection-corrections

on:
  pull_request:
    paths:
      - ".github/patches/mmcif-semantic-location.patch"
      - ".github/workflows/ci-engine-v2-mmcif-semantics.yml"

permissions:
  contents: write

concurrency:
  group: apply-mmcif-semantic-projection-corrections
  cancel-in-progress: false

jobs:
  apply-corrections:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'betelgeuze-kang' &&
      github.head_ref == 'codex/v2-mmcif-semantic-projection'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled semantic projection branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/v2-mmcif-semantic-projection
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Separate semantic values from source locations and fix scalar fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          module = Path("betelgeuze_engine_v2/molecular/mmcif_semantics.py")
          source = module.read_text(encoding="utf-8")
          old = (
              '            "quoted": self.quoted,\n'
              '            "line_number": self.line_number,\n'
              '            "column_number": self.column_number,\n'
          )
          new = '            "quoted": self.quoted,\n'
          if source.count(old) != 1:
              raise SystemExit("semantic value location block drifted")
          module.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/unit/test_engine_v2_mmcif_semantics.py")
          tests = test_path.read_text(encoding="utf-8")
          old_test = (
              '            _replace_once(CANONICAL, "loop_\\n_entity.id\\n_entity.type", '
              '"_entity.id 1\\n_entity.type polymer"),'
          )
          new_test = (
              '            _replace_once(\n'
              '                CANONICAL,\n'
              '                "loop_\\n_entity.id\\n_entity.type\\n1 polymer\\n2 water\\n#",\n'
              '                "_entity.id 1\\n_entity.type polymer\\n#",\n'
              '            ),'
          )
          if tests.count(old_test) != 1:
              raise SystemExit("scalar category fixture drifted")
          test_path.write_text(tests.replace(old_test, new_test, 1), encoding="utf-8")

          Path(".github/patches/mmcif-semantic-location.patch").unlink()
          PY
          python -m py_compile \
            betelgeuze_engine_v2/molecular/mmcif_semantics.py \
            tests/unit/test_engine_v2_mmcif_semantics.py
          git diff --check

      - name: Commit corrected source and tests without modifying workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            betelgeuze_engine_v2/molecular/mmcif_semantics.py \
            tests/unit/test_engine_v2_mmcif_semantics.py \
            .github/patches/mmcif-semantic-location.patch
          git diff --cached --check
          git commit -m "fix(v2): separate mmCIF semantics from source binding"
          git push origin HEAD:codex/v2-mmcif-semantic-projection
