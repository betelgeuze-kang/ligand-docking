name: Pose budget allocation offline
on:
  pull_request:
    paths:
      - 'tools/allocate_pose_budget.py'
      - 'tools/compare_pose_budget_policies.py'
      - 'tests/unit/test_pose_budget_allocation.py'
      - 'tests/fixtures/pose_budget_synthetic.json'
      - 'docs/pose_budget_allocation.ko.md'
      - '.github/workflows/pose-budget-offline.yml'
  push:
    branches: [main]
    paths:
      - 'tools/allocate_pose_budget.py'
      - 'tools/compare_pose_budget_policies.py'
      - 'tests/unit/test_pose_budget_allocation.py'
      - 'tests/fixtures/pose_budget_synthetic.json'
      - 'docs/pose_budget_allocation.ko.md'
      - '.github/workflows/pose-budget-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic stdlib contract
        run: python -m unittest discover -s tests/unit -p test_pose_budget_allocation.py -v
      - name: Optimized isolated-site stdlib contract
        run: python -O -S -m unittest discover -s tests/unit -p test_pose_budget_allocation.py -v
