name: ci-engine-v2-cli-result-verifier-package-round19

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/**"
      - "packaging/engine-v2/**"
      - "tools/build_engine_v2_wheel.py"
      - "tools/check_engine_v2_top_stack.py"
      - "tests/unit/test_engine_v2_cli_result_verifier_release_round19.py"
      - ".github/workflows/ci-engine-v2-cli-result-verifier-package-round19.yml"
      - ".github/workflows/ci-engine-v2-top-stack.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/**"
      - "packaging/engine-v2/**"
      - "tools/build_engine_v2_wheel.py"
      - "tools/check_engine_v2_top_stack.py"
      - "tests/unit/test_engine_v2_cli_result_verifier_release_round19.py"
      - ".github/workflows/ci-engine-v2-cli-result-verifier-package-round19.yml"
      - ".github/workflows/ci-engine-v2-top-stack.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-cli-result-verifier-package-round19-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-verifier-round19:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      SOURCE_DATE_EPOCH: "1735689600"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            build==1.2.2.post1 \
            setuptools==75.8.2 \
            wheel==0.45.1 \
            cryptography==46.0.5 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Build two byte-identical wheels
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-a dist-b dist
          python tools/build_engine_v2_wheel.py --output-dir dist-a
          python tools/build_engine_v2_wheel.py --output-dir dist-b
          wheel_a="$(find dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_b="$(find dist-b -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_a"
          test -n "$wheel_b"
          test "$(find dist-a -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist-b -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          cmp "$wheel_a" "$wheel_b"
          mkdir -p dist
          cp "$wheel_a" dist/
          sha256sum dist/*.whl | tee dist/SHA256SUMS

      - name: Clean-install the wheel
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/engine-v2-verifier-${{ matrix.python-version }}"
          rm -rf "$venv"
          python -m venv "$venv"
          grep -q '^include-system-site-packages = false$' "$venv/pyvenv.cfg"
          "$venv/bin/python" -m pip install pip==25.0.1
          "$venv/bin/python" -m pip install cryptography==46.0.5 numpy==1.26.4
          "$venv/bin/python" -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$venv/bin/python" -m pip install --no-deps dist/*.whl
          "$venv/bin/python" -m pip check
          test -x "$venv/bin/betelgeuze-engine-v2"

      - name: Generate canonical fixtures outside checkout
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/engine-v2-verifier-${{ matrix.python-version }}"
          outside="/tmp/engine-v2-verifier-outside-${{ matrix.python-version }}"
          rm -rf "$outside"
          mkdir -p "$outside"
          cd "$outside"
          "$venv/bin/python" - <<'PY'
          from pathlib import Path
          import json
          import torch
          from betelgeuze_engine_v2 import (
              AllAtomSystem,
              Atom,
              Bond,
              Chain,
              Residue,
              StructureProvenance,
          )
          from betelgeuze_engine_v2.cli import CLI_POCKET_INPUT_SCHEMA_ID
          from betelgeuze_engine_v2.molecular import write_canonical_system_json

          def provenance(name: str, digest: str) -> StructureProvenance:
              return StructureProvenance(
                  source_format="round19-package",
                  source_id=name,
                  source_sha256=digest,
                  parser_name="round19-package",
                  parser_version="1.0.0",
              )

          ligand = AllAtomSystem(
              system_id="round19-ligand",
              atoms=(
                  Atom(index=0, name="C1", element="C", atomic_number=6, residue_index=0),
                  Atom(index=1, name="N1", element="N", atomic_number=7, residue_index=0),
                  Atom(index=2, name="C2", element="C", atomic_number=6, residue_index=0),
                  Atom(index=3, name="O1", element="O", atomic_number=8, residue_index=0),
              ),
              bonds=(
                  Bond(index=0, atom_i=0, atom_j=1, order=1.0),
                  Bond(index=1, atom_i=1, atom_j=2, order=1.0),
                  Bond(index=2, atom_i=2, atom_j=3, order=1.0),
              ),
              residues=(
                  Residue(
                      index=0,
                      name="LIG",
                      chain_index=0,
                      sequence_number=1,
                      atom_indices=(0, 1, 2, 3),
                  ),
              ),
              chains=(Chain(index=0, chain_id="L", residue_indices=(0,)),),
              coordinates=torch.tensor(
                  [[[0.0, 0.0, 0.0], [1.4, 0.0, 0.0], [2.8, 0.3, 0.0], [4.1, 1.0, 0.2]]],
                  dtype=torch.float64,
              ),
              provenance=provenance("round19-ligand", "a" * 64),
          )
          receptor = AllAtomSystem(
              system_id="round19-receptor",
              atoms=(
                  Atom(index=0, name="R1", element="C", atomic_number=6, residue_index=0),
                  Atom(index=1, name="R2", element="C", atomic_number=6, residue_index=0),
                  Atom(index=2, name="R3", element="C", atomic_number=6, residue_index=0),
              ),
              bonds=(),
              residues=(
                  Residue(
                      index=0,
                      name="REC",
                      chain_index=0,
                      sequence_number=1,
                      atom_indices=(0, 1, 2),
                  ),
              ),
              chains=(Chain(index=0, chain_id="A", residue_indices=(0,)),),
              coordinates=torch.tensor(
                  [[[0.0, 0.0, 0.0], [5.0, 0.0, 0.0], [8.0, 7.0, 4.0]]],
                  dtype=torch.float64,
              ),
              provenance=provenance("round19-receptor", "b" * 64),
          )
          write_canonical_system_json(receptor, Path("receptor.json"))
          write_canonical_system_json(ligand, Path("ligand.json"))
          pocket = {
              "schema_id": CLI_POCKET_INPUT_SCHEMA_ID,
              "scope": "known_pocket_docking",
              "method_id": "round19-reviewed-sphere",
              "method_version": "1.0.0",
              "coordinate_frame_id": "prepared-receptor-frame-v1",
              "center_angstrom": [2.5, 2.0, 0.0],
              "radius_angstrom": 12.0,
              "source_artifact_sha256": "c" * 64,
              "implementation_source_sha256": "d" * 64,
          }
          Path("pocket.json").write_bytes(
              json.dumps(
                  pocket,
                  ensure_ascii=True,
                  allow_nan=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("ascii") + b"\n"
          )
          PY

      - name: Execute installed docking and verifier commands
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/engine-v2-verifier-${{ matrix.python-version }}"
          outside="/tmp/engine-v2-verifier-outside-${{ matrix.python-version }}"
          cd "$outside"
          "$venv/bin/betelgeuze-engine-v2" --help
          "$venv/bin/betelgeuze-engine-v2" verify-result --help
          "$venv/bin/betelgeuze-engine-v2" dock-canonical \
            --receptor receptor.json \
            --ligand ligand.json \
            --pocket pocket.json \
            --output result.json \
            --candidate-count 3 \
            --top-k 2 \
            --max-torsions 1 \
            --translation-radius-angstrom 1.0 \
            --seed 167
          "$venv/bin/betelgeuze-engine-v2" verify-result \
            --input result.json \
            --output verification.json
          "$venv/bin/python" - <<'PY'
          from pathlib import Path
          import json
          import stat

          result_path = Path("result.json")
          verification_path = Path("verification.json")
          result = json.loads(result_path.read_bytes())
          verification = json.loads(verification_path.read_bytes())
          assert stat.S_IMODE(result_path.stat().st_mode) == 0o600
          assert stat.S_IMODE(verification_path.stat().st_mode) == 0o600
          assert result["candidate_count"] == 3
          assert result["success_count"] + result["failure_count"] == 3
          assert verification["candidate_count"] == 3
          assert verification["success_count"] + verification["failure_count"] == 3
          assert verification["canonical_bytes_verified"] is True
          assert verification["nested_receipts_verified"] is True
          assert verification["failure_denominator_verified"] is True
          assert verification["generic_search_fingerprint_fully_recomputed"] is False
          assert verification["generic_search_fingerprint_crosslinked"] is True
          assert verification["network_fetch_performed"] is False
          assert verification["calibrated"] is False
          assert verification["scientifically_validated"] is False
          assert verification["benchmark_validated"] is False
          assert verification["product_qualified"] is False
          assert verification["customer_execution_enabled"] is False
          assert verification["claim_safe"] is False
          PY

      - name: Upload reproducible wheel and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-v2-verifier-py${{ matrix.python-version }}-${{ github.sha }}
          path: |
            dist
            /tmp/engine-v2-verifier-outside-${{ matrix.python-version }}/result.json
            /tmp/engine-v2-verifier-outside-${{ matrix.python-version }}/verification.json
          if-no-files-found: error
          retention-days: 7
