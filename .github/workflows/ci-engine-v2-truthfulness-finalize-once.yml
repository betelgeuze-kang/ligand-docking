name: ci-engine-v2-truthfulness-finalize-once

on:
  push:
    branches:
      - "agent/v2-claim-state-truthfulness"
    paths:
      - ".github/workflows/ci-engine-v2-truthfulness-finalize-once.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: ci-engine-v2-truthfulness-finalize-once
  cancel-in-progress: false

jobs:
  finalize-and-verify:
    if: github.repository == 'betelgeuze-kang/ligand-docking' && github.ref == 'refs/heads/agent/v2-claim-state-truthfulness'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      TARGET_BRANCH: agent/v2-claim-state-truthfulness
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/v2-claim-state-truthfulness
          persist-credentials: true
          clean: true
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            pytest==8.3.5 \
            PyYAML==6.0.3 \
            cryptography==46.0.5 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Render canonical checked-in state
        run: |
          python tools/update_engine_v2_main_ci_coverage.py --write
          python tools/update_engine_v2_truthfulness_state.py --write
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci-engine-v2-main.yml')
          text = path.read_text(encoding='utf-8')
          if '\n  workflow_dispatch:\n' not in text:
              needle = 'on:\n  pull_request:'
              if text.count(needle) != 1:
                  raise SystemExit('canonical Engine v2 main workflow trigger drifted')
              text = text.replace(
                  needle,
                  'on:\n  workflow_dispatch:\n  pull_request:',
                  1,
              )
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify generated state before persistence
        run: |
          python tools/update_engine_v2_main_ci_coverage.py --check
          python tools/update_engine_v2_truthfulness_state.py --check
          python tools/check_engine_v2_truthfulness.py
          python -m pytest -q tests/unit/test_engine_v2_truthfulness.py
          python -m compileall -q \
            betelgeuze_engine_v2 \
            tools/check_engine_v2_truthfulness.py \
            tools/update_engine_v2_truthfulness_state.py \
            tools/update_engine_v2_main_ci_coverage.py
          python tools/check_engine_v2_architecture.py

      - name: Persist final state and remove every temporary write workflow
        id: persist
        run: |
          git rm --ignore-unmatch \
            .github/workflows/ci-engine-v2-truthfulness-sync-once.yml \
            .github/workflows/ci-engine-v2-truthfulness-sync-once-v2.yml \
            .github/workflows/ci-engine-v2-truthfulness-sync-once-v3.yml \
            .github/workflows/ci-engine-v2-truthfulness-finalize-once.yml
          git add \
            .github/workflows/ci-engine-v2-main.yml \
            .github/workflows/ci-engine-v2-truthfulness.yml \
            betelgeuze_engine_v2/capabilities.py \
            config/independent_engine_v2_capabilities.yaml \
            config/independent_engine_v2_truthfulness_policy.json \
            docs/engine_v2_status.md \
            docs/engine_v2_truthfulness.md
          git diff --cached --check
          git config user.name "betelgeuze-engine-v2-truthfulness-bot"
          git config user.email "engine-v2-truthfulness-bot@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No generated state changes were required"
          else
            git commit -m "Synchronize Engine v2 truthfulness state"
            git push origin HEAD:${TARGET_BRANCH}
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch and await final-head canonical workflows
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_HEAD_SHA: ${{ steps.persist.outputs.head_sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timezone
          import json
          import os
          import time
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          branch = os.environ['TARGET_BRANCH']
          head_sha = os.environ['FINAL_HEAD_SHA']
          api = f'https://api.github.com/repos/{repository}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          workflows = (
              'ci-engine-v2-main.yml',
              'ci-engine-v2-truthfulness.yml',
          )
          started_at = datetime.now(timezone.utc)

          def request_json(url: str, *, method: str = 'GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = Request(url, data=data, method=method, headers=headers)
              try:
                  with urlopen(request, timeout=60) as response:
                      raw = response.read()
                      if not raw:
                          return None
                      return json.loads(raw.decode('utf-8'))
              except HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(
                      f'GitHub API {method} {url} failed: {exc.code}: {body}'
                  ) from exc

          for workflow in workflows:
              request_json(
                  f'{api}/actions/workflows/{workflow}/dispatches',
                  method='POST',
                  payload={'ref': branch},
              )

          selected = {}
          deadline = time.monotonic() + 60 * 55
          while time.monotonic() < deadline:
              for workflow in workflows:
                  query = urlencode(
                      {
                          'branch': branch,
                          'event': 'workflow_dispatch',
                          'per_page': 20,
                      }
                  )
                  payload = request_json(
                      f'{api}/actions/workflows/{workflow}/runs?{query}'
                  )
                  runs = payload.get('workflow_runs', []) if payload else []
                  candidates = [
                      run
                      for run in runs
                      if run.get('head_sha') == head_sha
                      and run.get('event') == 'workflow_dispatch'
                  ]
                  if candidates:
                      selected[workflow] = max(
                          candidates,
                          key=lambda row: row.get('run_number', 0),
                      )
              if len(selected) == len(workflows) and all(
                  row.get('status') == 'completed' for row in selected.values()
              ):
                  break
              time.sleep(20)
          else:
              raise RuntimeError(
                  f'final-head workflow verification timed out: {selected}'
              )

          failures = {
              workflow: {
                  'id': row.get('id'),
                  'conclusion': row.get('conclusion'),
                  'html_url': row.get('html_url'),
              }
              for workflow, row in selected.items()
              if row.get('conclusion') != 'success'
          }
          target_url = selected['ci-engine-v2-truthfulness.yml'].get('html_url')
          status_payload = {
              'state': 'failure' if failures else 'success',
              'context': 'engine-v2/truthfulness-final',
              'description': (
                  'Final-head Engine v2 truthfulness verification failed'
                  if failures
                  else 'Final-head Engine v2 main and truthfulness verification passed'
              ),
              'target_url': target_url,
          }
          request_json(
              f'{api}/statuses/{head_sha}',
              method='POST',
              payload=status_payload,
          )
          print(
              json.dumps(
                  {
                      'schema_id': (
                          'betelgeuze.engine_v2_final_head_truthfulness_verification/1.0.0'
                      ),
                      'head_sha': head_sha,
                      'started_at_utc': started_at.strftime('%Y-%m-%dT%H:%M:%SZ'),
                      'workflows': {
                          workflow: {
                              'run_id': row.get('id'),
                              'conclusion': row.get('conclusion'),
                              'html_url': row.get('html_url'),
                          }
                          for workflow, row in selected.items()
                      },
                      'failures': failures,
                      'scientific_validity_green': False,
                      'benchmark_validity_green': False,
                      'product_qualified': False,
                      'customer_execution_enabled': False,
                      'claim_safe': False,
                  },
                  sort_keys=True,
                  separators=(',', ':'),
              )
          )
          if failures:
              raise SystemExit(1)
          PY
