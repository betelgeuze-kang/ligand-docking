name: Prepared cross contacts offline
on:
  pull_request:
    paths:
      - 'tools/project_prepared_cross_contacts.py'
      - 'tests/unit/test_project_prepared_cross_contacts.py'
      - 'tests/fixtures/prepared_cross_contacts_synthetic.json'
      - 'docs/prepared_cross_contacts_adapter.md'
      - '.github/workflows/prepared-cross-contacts-offline.yml'
  push:
    branches: [main]
    paths:
      - 'tools/project_prepared_cross_contacts.py'
      - 'tests/unit/test_project_prepared_cross_contacts.py'
      - 'tests/fixtures/prepared_cross_contacts_synthetic.json'
      - 'docs/prepared_cross_contacts_adapter.md'
      - '.github/workflows/prepared-cross-contacts-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic stdlib contract
        run: python -m unittest discover -s tests/unit -p test_project_prepared_cross_contacts.py -v
      - name: Optimized isolated-site stdlib contract
        run: python -O -S -m unittest discover -s tests/unit -p test_project_prepared_cross_contacts.py -v
