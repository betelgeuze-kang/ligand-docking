name: ci-engine-v2-runtime

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/**"
      - "core/ai_correction.py"
      - "core/sim_param_schema.py"
      - "train/runtime_inputs.py"
      - "train/checkpoint_contracts.py"
      - "config/independent_engine_v2_capabilities.yaml"
      - "tests/unit/test_engine_v2_runtime_checkpoint_contracts.py"
      - ".github/workflows/ci-engine-v2-runtime.yml"
  push:
    branches:
      - "agent/v2-e-runtime-checkpoint-contracts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-checkpoint-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Check out Engine v2 runtime surface
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            betelgeuze_engine_v2
            core/__init__.py
            core/ai_correction.py
            core/config.py
            core/definitions.py
            core/sim_param_schema.py
            config/settings.yaml
            config/independent_engine_v2_capabilities.yaml
            train/__init__.py
            train/runtime_inputs.py
            train/checkpoint_contracts.py
            tests/unit/test_engine_v2_contracts_molecular.py
            tests/unit/test_engine_v2_sparse_geometry_features.py
            tests/unit/test_engine_v2_ai_core.py
            tests/unit/test_engine_v2_periodic_energy.py
            tests/unit/test_engine_v2_orchestrator_contract.py
            tests/unit/test_engine_v2_runtime_checkpoint_contracts.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 PyYAML==6.0.3 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile runtime and checkpoint surfaces
        run: |
          python -m compileall -q \
            betelgeuze_engine_v2 \
            core/ai_correction.py \
            core/sim_param_schema.py \
            train/runtime_inputs.py \
            train/checkpoint_contracts.py

      - name: Run inherited Engine v2 CPU contracts
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_contracts_molecular.py \
            tests/unit/test_engine_v2_sparse_geometry_features.py \
            tests/unit/test_engine_v2_ai_core.py \
            tests/unit/test_engine_v2_periodic_energy.py \
            tests/unit/test_engine_v2_orchestrator_contract.py

      - name: Run runtime vocabulary conditioning and checkpoint contracts
        shell: bash
        run: |
          set +e
          python -m pytest -vv -x tests/unit/test_engine_v2_runtime_checkpoint_contracts.py > runtime-contracts.log 2>&1
          status=$?
          cat runtime-contracts.log
          exit "$status"

      - name: Upload runtime contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-contracts-py${{ matrix.python-version }}-${{ github.run_id }}
          path: runtime-contracts.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce source-level migration boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("train/runtime_inputs.py").read_text(encoding="utf-8")
          assert "torch.cdist" not in source
          assert ".remainder(" not in source
          assert ".mean().item()" not in source
          assert "runtime_conditioning_batch_mean_used" in source
          assert "residue_modulo_aliasing_used" in source
          PY
