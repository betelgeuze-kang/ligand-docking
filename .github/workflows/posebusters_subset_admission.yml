name: Frozen bonded subset admission
'on':
  push:
    branches:
      - codex/pb-subset-admission-20261104
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: posebusters-subset-admission-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
  PB_REPLAY_REQUIRE_FROZEN_RUNTIME: '1'
  PB_INTEGRATION_REQUIRE_FROZEN_RUNTIME: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  PYTHONNOUSERSITE: '1'
  PYTHONPATH: ${{ github.workspace }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  CUDA_VISIBLE_DEVICES: ''
  HIP_VISIBLE_DEVICES: ''
  ROCR_VISIBLE_DEVICES: ''
jobs:
  native:
    name: Require exact frozen molecular subset equivalence
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: 3.10.22
          check-latest: false
      - name: Download original frozen runtime
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: p0p1-runtime-41697499611-1
          run-id: '41697499611'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/pb-replay-runtime
      - name: Install exact retained wheels
        run: |
          mkdir -p "$RUNNER_TEMP/pb-subset-admission"
          python -m venv "$RUNNER_TEMP/p0p1-python"
          "$RUNNER_TEMP/p0p1-python/bin/python" -m tools.redocking_p0_p1_runtime install-evaluator --bundle-root "$RUNNER_TEMP/pb-replay-runtime" 2>&1 | tee "$RUNNER_TEMP/pb-subset-admission/runtime-install.log"
      - name: Verify frozen native binaries and complete reports
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/pb-subset-admission/source-commit.txt"
          sha256sum tools/posebusters_subset.py tests/unit/test_posebusters_subset.py > "$RUNNER_TEMP/pb-subset-admission/source-files.sha256"
          "$RUNNER_TEMP/p0p1-python/bin/python" -m pytest -q \
            tests/unit/test_posebusters_subset.py \
            tests/unit/test_posebusters_evaluator_context.py \
            tests/unit/test_posebusters_replay_evaluator.py \
            -o cache_dir="$RUNNER_TEMP/pb-subset-pytest-cache" \
            --junitxml="$RUNNER_TEMP/pb-subset-admission/tests.xml" \
            2>&1 | tee "$RUNNER_TEMP/pb-subset-admission/tests.log"
          "$RUNNER_TEMP/p0p1-python/bin/python" - <<'PYVERIFY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse(Path(os.environ['RUNNER_TEMP'])/'pb-subset-admission/tests.xml').getroot()
          suites = list(root.iter('testsuite'))
          assert suites and sum(int(s.attrib['tests']) for s in suites) > 0
          assert all(int(s.attrib.get(k, '0')) == 0 for s in suites for k in ('skipped', 'failures', 'errors'))
          PYVERIFY
      - name: Retain all native admission evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pb-subset-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pb-subset-admission/
          if-no-files-found: error
