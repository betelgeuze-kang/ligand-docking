name: temporary-pr264-source-export

on:
  push:
    branches:
      - codex/temp-export-pr264-20260806

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Package complete-evidence sources
        run: |
          tar -czf pr264-sources.tar.gz \
            betelgeuze_engine_v2/docking/validity.py \
            betelgeuze_engine_v2/benchmark/source_paired_clearance_activation.py \
            betelgeuze_engine_v2/benchmark/source_paired_clearance_one_shot_full_evidence.py \
            tests/unit/test_source_paired_clearance_one_shot_full_evidence.py \
            .github/workflows/ci-engine-v2-source-paired-clearance-one-shot-ab.yml

      - name: Upload source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr264-sources
          path: pr264-sources.tar.gz
          if-no-files-found: error
          retention-days: 1
