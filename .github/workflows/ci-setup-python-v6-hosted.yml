# GitHub-hosted setup-python v6 policy; reviewed v5 exceptions are explicit below.
name: ci-setup-python-v6-hosted

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-setup-python-v6-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-python-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out workflow policy surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Set up Python 3.11 with Node 24 action runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Enforce hosted v6 and reviewed v5 exceptions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          hosted_v6 = "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1"
          reviewed_v5 = "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065"
          v5_exceptions = {
              Path(".github/workflows/ci-engine-v2-external-baseline.yml"),
              Path(".github/workflows/product-api-worker-trusted.yml"),
          }
          uses_pattern = re.compile(
              r"(?m)^\s*(?:-\s*)?uses:\s*(actions/setup-python@[^\s#]+)"
          )
          observed = {}
          for path in sorted(Path(".github/workflows").glob("*.y*ml")):
              refs = uses_pattern.findall(path.read_text(encoding="utf-8"))
              if not refs:
                  continue
              observed[str(path)] = refs
              expected = reviewed_v5 if path in v5_exceptions else hosted_v6
              if any(ref != expected for ref in refs):
                  raise SystemExit(
                      f"unapproved setup-python reference in {path}: {refs}"
                  )
          missing_exceptions = sorted(
              str(path) for path in v5_exceptions if str(path) not in observed
          )
          if missing_exceptions:
              raise SystemExit(
                  f"reviewed setup-python v5 exceptions missing: {missing_exceptions}"
              )
          if len(observed) != 22:
              raise SystemExit(
                  f"setup-python workflow inventory changed: {len(observed)}"
              )
          print(observed)
          PY

      - name: Record migration boundary
        run: |
          echo "GitHub-hosted workflows use setup-python v6.3.0 by immutable SHA."
          echo "The external-baseline exact-identity workflow and trusted self-hosted workflow remain on reviewed v5.6.0."
