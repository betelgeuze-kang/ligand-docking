name: temporary-fix-pr485-source-manifest

on:
  push:
    branches:
      - codex/fix-pr485-frozen-source-manifest-20260903
    paths:
      - .github/scripts/temporary_fix_pr485_source_manifest.py
      - .github/workflows/temporary-fix-pr485-source-manifest.yml

permissions:
  contents: write

concurrency:
  group: temporary-fix-pr485-source-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install focused dependency
        run: python -m pip install pytest==8.3.5

      - name: Bind temporary transformer to current main source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/temporary_fix_pr485_source_manifest.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'VERIFIER: "8dff071b125a379e8b35fbbdc88ba1874744462157587858911456569ce6a0ca",',
              'VERIFIER: "a22557ef115d4ee9928ecf12a684e2f3517246d722b6381ab07ac7ffb4906346",',
              1,
          )
          source = source.replace(
              '    UNIT: "c42c8665b5e36ca74274eb70d0a4eb08c55fdb607f502d28265f6bf25bc1295b",\n'
              '    DOC: "b765262703c10acc848f74575028e06ee4d8faf48d8059e1ace6e6ea49357004",\n',
              '',
              1,
          )
          source = source.replace(
              '    expected = EXPECTED_SHA256[path]\n'
              '    if observed != expected:\n',
              '    expected = EXPECTED_SHA256.get(path)\n'
              '    if expected is not None and observed != expected:\n',
              1,
          )
          old_required_anchor = (
              '        "rollback_scratch_validation_and_commit_preserved",\n'
              '    ):\n'
              '        if implementation.get(key) is not True:'
          )
          new_required_anchor = (
              '        "rollback_scratch_validation_and_commit_preserved",\n'
              '        "source_manifest_non_evidence_paths_frozen_to_source_snapshot",\n'
              '        "source_manifest_live_evidence_paths_current_checkout",\n'
              '    ):\n'
              '        if implementation.get(key) is not True:'
          )
          source = source.replace(
              old_required_anchor,
              (
                  '        "rollback_scratch_validation_and_commit_preserved",\n'
                  '        "evaluation_rollback_candidate_force_storage_type_alias_exact",'
              ),
              1,
          )
          source = source.replace(
              new_required_anchor,
              (
                  '        "rollback_scratch_validation_and_commit_preserved",\n'
                  '        "source_manifest_non_evidence_paths_frozen_to_source_snapshot",\n'
                  '        "source_manifest_live_evidence_paths_current_checkout",\n'
                  '        "evaluation_rollback_candidate_force_storage_type_alias_exact",'
              ),
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply descendant-stable manifest fix
        run: python .github/scripts/temporary_fix_pr485_source_manifest.py

      - name: Refresh and verify canonical evidence
        run: |
          python -m tools.verify_engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_v1 --refresh
          python -m tools.verify_engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_v1
          python -m pytest -q tests/unit/test_engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_v1.py
          python -m py_compile \
            tools/verify_engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_v1.py \
            tests/unit/test_engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_v1.py
          python -m json.tool config/engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_profile_v1.json >/dev/null
          python -m json.tool config/engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_profile_v1_sources.json >/dev/null
          git diff --check

      - name: Commit candidate fix
        run: |
          git add \
            config/engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_profile_v1.json \
            config/engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_profile_v1_sources.json \
            docs/engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_v1.md \
            tests/unit/test_engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_v1.py \
            tools/verify_engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_v1.py
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze PR 485 source manifest across descendants"

      - name: Verify against PR 486 descendant merge
        run: |
          git fetch --no-tags origin codex/engine-v2-generated-state-bundle-v1
          git worktree add --detach "${RUNNER_TEMP}/pr486-descendant" HEAD
          git -C "${RUNNER_TEMP}/pr486-descendant" merge --no-commit --no-ff FETCH_HEAD
          python "${RUNNER_TEMP}/pr486-descendant/tools/verify_engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_v1.py"
          python -m pytest -q \
            "${RUNNER_TEMP}/pr486-descendant/tests/unit/test_engine_v2_native_particle_mesh_ewald_composite_dynamics_rust_reciprocal_provider_validated_nonempty_input_soa_binding_v1.py" \
            --rootdir="${RUNNER_TEMP}/pr486-descendant"

      - name: Push validated fix
        run: git push origin HEAD:codex/fix-pr485-frozen-source-manifest-20260903
