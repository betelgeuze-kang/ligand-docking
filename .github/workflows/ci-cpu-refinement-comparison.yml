name: ci-cpu-refinement-comparison
on:
  pull_request:
    paths:
      - 'betelgeuze_engine_v2/**'
      - 'betelgeuze_product/cpu_refinement/**'
      - 'betelgeuze_product/__init__.py'
      - 'betelgeuze_product/refinement_comparison_workflow.py'
      - 'betelgeuze_product/reference_minimization_workflow.py'
      - 'betelgeuze_product/local_research_workflow.py'
      - 'tests/unit/test_engine_v2_*.py'
      - 'tests/unit/test_refinement_comparison_workflow.py'
      - 'tests/unit/test_cpu_refinement_source_boundaries.py'
      - '.github/workflows/ci-cpu-refinement-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-cpu-refinement-comparison-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-refinement-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU test dependencies
        run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4 rdkit==2026.3.6 ruff==0.11.13 PyYAML==6.0.2
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Record exact checkout and environment
        run: |
          git rev-parse HEAD > comparison-checkout.txt
          git rev-parse 'HEAD^{tree}' >> comparison-checkout.txt
          python -m pip freeze > comparison-dependencies.txt
      - name: Lint changed implementation and tests
        run: |
          python -m ruff check --isolated --no-cache \
            betelgeuze_product/cpu_refinement/reference_forcefield_v1_1.py \
            betelgeuze_product/cpu_refinement/reference_minimization_v1_1.py \
            betelgeuze_product/cpu_refinement/energy_refinement_v1_1.py \
            betelgeuze_product/cpu_refinement/refinement_comparison.py \
            betelgeuze_product/cpu_refinement/__init__.py \
            betelgeuze_product/refinement_comparison_workflow.py \
            tests/unit/test_engine_v2_reference_angle_boundary.py \
            tests/unit/test_engine_v2_refinement_comparison.py \
            tests/unit/test_engine_v2_numerics_v1_1_contracts.py \
            tests/unit/test_refinement_comparison_workflow.py \
            tests/unit/test_cpu_refinement_source_boundaries.py
      - name: Exercise actual CPU paths and unchanged historical protocols
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --rootdir="$PWD" -c /dev/null --noconftest -p no:cacheprovider -W error -vv \
            tests/unit/test_engine_v2_reference_angle_boundary.py \
            tests/unit/test_engine_v2_refinement_comparison.py \
            tests/unit/test_engine_v2_numerics_v1_1_contracts.py \
            tests/unit/test_refinement_comparison_workflow.py \
            tests/unit/test_cpu_refinement_source_boundaries.py \
            tests/unit/test_engine_v2_global_orientation_development_protocol.py \
            tests/unit/test_engine_v2_reference_physics.py \
            tests/unit/test_engine_v2_reference_minimization.py \
            tests/unit/test_engine_v2_reference_forcefield_v2.py \
            tests/unit/test_engine_v2_reference_constrained_minimization.py \
            tests/unit/test_engine_v2_energy_local_refinement_stage6.py \
            tests/unit/test_engine_v2_reference_minimization_independent_oracle.py \
            tests/unit/test_engine_v2_reference_minimization_validation_protocol.py \
            tests/unit/test_engine_v2_reference_minimization_validation_materializer.py \
            tests/unit/test_engine_v2_scorer_v1_stage5.py \
            tests/unit/test_engine_v2_docking_authority_search.py \
            tests/unit/test_reference_minimization_workflow.py \
            --junitxml=cpu-refinement-comparison.xml 2>&1 | tee cpu-refinement-comparison.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cpu-refinement-comparison-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            comparison-checkout.txt
            comparison-dependencies.txt
            cpu-refinement-comparison.xml
            cpu-refinement-comparison.log
          if-no-files-found: error
          retention-days: 7
