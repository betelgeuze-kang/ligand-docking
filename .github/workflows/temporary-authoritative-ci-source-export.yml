name: temporary-authoritative-ci-source-export

on:
  push:
    branches:
      - codex/temporary-authoritative-ci-source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Package authoritative CI sources
        run: |
          tar -czf authoritative-ci-sources.tar.gz \
            .github/workflows/ci-engine-v2-main.yml \
            .github/workflows/ci-engine-v2-package.yml \
            .github/workflows/ci-repository-hygiene.yml \
            .github/workflows/product-image-smoke.yml \
            .github/workflows/product-api-worker.yml \
            .github/workflows/product-api-worker-trusted.yml \
            tools/audit_engine_v2_ci_authority.py \
            tests/unit/test_audit_engine_v2_ci_authority.py

      - name: Upload source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authoritative-ci-sources
          path: authoritative-ci-sources.tar.gz
          if-no-files-found: error
          retention-days: 1
