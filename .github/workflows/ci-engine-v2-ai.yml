name: ci-engine-v2-ai

on:
  pull_request:
  push:
    branches:
      - "agent/v2-c-ai-projection"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Check out Engine v2 AI surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            betelgeuze_engine_v2
            tests/unit/test_engine_v2_contracts_molecular.py
            tests/unit/test_engine_v2_sparse_geometry_features.py
            tests/unit/test_engine_v2_ai_core.py
            tests/unit/test_engine_v2_periodic_energy.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile AI and projection modules
        run: python -m compileall -q betelgeuze_engine_v2

      - name: Run contract, sparse, AI, periodic, and projection tests
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_contracts_molecular.py \
            tests/unit/test_engine_v2_sparse_geometry_features.py \
            tests/unit/test_engine_v2_ai_core.py \
            tests/unit/test_engine_v2_periodic_energy.py

      - name: Enforce uncalibrated quantity boundary
        run: |
          python - <<'PY'
          from betelgeuze_engine_v2 import UNCALIBRATED_ENERGY, UNCALIBRATED_FORCE
          assert UNCALIBRATED_ENERGY.unit is None
          assert UNCALIBRATED_FORCE.unit is None
          assert not UNCALIBRATED_ENERGY.physical_quantity
          assert not UNCALIBRATED_FORCE.physical_quantity
          PY
