name: ci-engine-v2-mmcif-nonpoly-preparation

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/molecular/mmcif_syntax.py"
      - "betelgeuze_engine_v2/molecular/mmcif_biological_assembly_policy.py"
      - "betelgeuze_engine_v2/molecular/mmcif_missing_atom_residue_policy.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_identity.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_component_declarations.py"
      - "betelgeuze_engine_v2/molecular/mmcif_struct_conn_declarations.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_atom_site_observations.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_coordinate_values.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_atom_site_scalar_values.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_canonical_topology.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_preparation.py"
      - "betelgeuze_engine_v2/molecular/__init__.py"
      - "tests/unit/test_engine_v2_mmcif_syntax.py"
      - "tests/unit/test_engine_v2_mmcif_biological_assembly_policy.py"
      - "tests/unit/test_engine_v2_mmcif_missing_atom_residue_policy.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_identity.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_component_declarations.py"
      - "tests/unit/test_engine_v2_mmcif_struct_conn_declarations.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_atom_site_observations.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_coordinate_values.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_atom_site_scalar_values.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_canonical_topology.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_preparation.py"
      - ".github/workflows/ci-engine-v2-mmcif-nonpoly-preparation.yml"
      - ".github/workflows/ci-engine-v2-mmcif-biological-assembly-policy.yml"
      - ".github/workflows/ci-engine-v2-mmcif-missing-atom-residue-policy.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/molecular/mmcif_syntax.py"
      - "betelgeuze_engine_v2/molecular/mmcif_biological_assembly_policy.py"
      - "betelgeuze_engine_v2/molecular/mmcif_missing_atom_residue_policy.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_identity.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_component_declarations.py"
      - "betelgeuze_engine_v2/molecular/mmcif_struct_conn_declarations.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_atom_site_observations.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_coordinate_values.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_atom_site_scalar_values.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_canonical_topology.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_preparation.py"
      - "betelgeuze_engine_v2/molecular/__init__.py"
      - "tests/unit/test_engine_v2_mmcif_syntax.py"
      - "tests/unit/test_engine_v2_mmcif_biological_assembly_policy.py"
      - "tests/unit/test_engine_v2_mmcif_missing_atom_residue_policy.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_identity.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_component_declarations.py"
      - "tests/unit/test_engine_v2_mmcif_struct_conn_declarations.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_atom_site_observations.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_coordinate_values.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_atom_site_scalar_values.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_canonical_topology.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_preparation.py"
      - ".github/workflows/ci-engine-v2-mmcif-nonpoly-preparation.yml"
      - ".github/workflows/ci-engine-v2-mmcif-biological-assembly-policy.yml"
      - ".github/workflows/ci-engine-v2-mmcif-missing-atom-residue-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-mmcif-nonpoly-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nonpoly-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out bounded nonpoly preparation surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_mmcif_syntax.py
            tests/unit/test_engine_v2_mmcif_biological_assembly_policy.py
            tests/unit/test_engine_v2_mmcif_missing_atom_residue_policy.py
            tests/unit/test_engine_v2_mmcif_nonpoly_identity.py
            tests/unit/test_engine_v2_mmcif_nonpoly_component_declarations.py
            tests/unit/test_engine_v2_mmcif_struct_conn_declarations.py
            tests/unit/test_engine_v2_mmcif_nonpoly_atom_site_observations.py
            tests/unit/test_engine_v2_mmcif_nonpoly_coordinate_values.py
            tests/unit/test_engine_v2_mmcif_nonpoly_atom_site_scalar_values.py
            tests/unit/test_engine_v2_mmcif_nonpoly_canonical_topology.py
            tests/unit/test_engine_v2_mmcif_nonpoly_preparation.py
            .github/workflows/ci-engine-v2-mmcif-missing-atom-residue-policy.yml
            .github/workflows/ci-engine-v2-mmcif-biological-assembly-policy.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install pytest==8.3.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        shell: bash
        run: |
          set +e
          {
            python -m compileall -q betelgeuze_engine_v2
            python tools/check_engine_v2_architecture.py
          } > mmcif-nonpoly-preparation.log 2>&1
          status=$?
          cat mmcif-nonpoly-preparation.log
          exit "$status"

      - name: Run source carriers and bounded preparation contracts
        shell: bash
        run: |
          set +e
          python -m pytest -vv -x \
            tests/unit/test_engine_v2_mmcif_syntax.py \
            tests/unit/test_engine_v2_mmcif_biological_assembly_policy.py \
            tests/unit/test_engine_v2_mmcif_missing_atom_residue_policy.py \
            tests/unit/test_engine_v2_mmcif_nonpoly_identity.py \
            tests/unit/test_engine_v2_mmcif_nonpoly_component_declarations.py \
            tests/unit/test_engine_v2_mmcif_struct_conn_declarations.py \
            tests/unit/test_engine_v2_mmcif_nonpoly_atom_site_observations.py \
            tests/unit/test_engine_v2_mmcif_nonpoly_coordinate_values.py \
            tests/unit/test_engine_v2_mmcif_nonpoly_atom_site_scalar_values.py \
            tests/unit/test_engine_v2_mmcif_nonpoly_canonical_topology.py \
            tests/unit/test_engine_v2_mmcif_nonpoly_preparation.py \
            >> mmcif-nonpoly-preparation.log 2>&1
          status=$?
          cat mmcif-nonpoly-preparation.log
          exit "$status"

      - name: Upload nonpoly preparation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mmcif-nonpoly-preparation-py${{ matrix.python-version }}-${{ github.run_id }}
          path: mmcif-nonpoly-preparation.log
          if-no-files-found: error
          retention-days: 7
