name: ci-engine-v2-pme-reciprocal-reference

on:
  pull_request:
    paths:
      - "LICENSE"
      - "rust/Cargo.toml"
      - "rust/reference-ewald/Cargo.toml"
      - "rust/reference-ewald/Cargo.lock"
      - "rust/reference-ewald/README.md"
      - "rust/reference-ewald/src/lib.rs"
      - "rust/reference-ewald/fixtures/direct_ewald_v1.tsv"
      - "rust/reference-pme/**"
      - "config/engine_v2_direct_ewald_reference_profile_v1.json"
      - "config/engine_v2_native_direct_ewald_composite_dynamics_profile_v1.json"
      - "config/engine_v2_native_direct_ewald_composite_dynamics_profile_v1_sources.json"
      - "config/engine_v2_pme_reciprocal_reference_profile_v1.json"
      - "config/engine_v2_pme_reciprocal_reference_profile_v1_sources.json"
      - "docs/engine_v2_pme_reciprocal_reference_v1.md"
      - "tools/__init__.py"
      - "tools/verify_engine_v2_pme_reciprocal_reference_v1.py"
      - "tests/unit/test_engine_v2_pme_reciprocal_reference_v1.py"
      - ".github/workflows/ci-engine-v2-pme-reciprocal-reference.yml"
  push:
    branches: ["main"]
    paths:
      - "LICENSE"
      - "rust/Cargo.toml"
      - "rust/reference-ewald/Cargo.toml"
      - "rust/reference-ewald/Cargo.lock"
      - "rust/reference-ewald/README.md"
      - "rust/reference-ewald/src/lib.rs"
      - "rust/reference-ewald/fixtures/direct_ewald_v1.tsv"
      - "rust/reference-pme/**"
      - "config/engine_v2_direct_ewald_reference_profile_v1.json"
      - "config/engine_v2_native_direct_ewald_composite_dynamics_profile_v1.json"
      - "config/engine_v2_native_direct_ewald_composite_dynamics_profile_v1_sources.json"
      - "config/engine_v2_pme_reciprocal_reference_profile_v1.json"
      - "config/engine_v2_pme_reciprocal_reference_profile_v1_sources.json"
      - "docs/engine_v2_pme_reciprocal_reference_v1.md"
      - "tools/__init__.py"
      - "tools/verify_engine_v2_pme_reciprocal_reference_v1.py"
      - "tests/unit/test_engine_v2_pme_reciprocal_reference_v1.py"
      - ".github/workflows/ci-engine-v2-pme-reciprocal-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-pme-reciprocal-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-scalar-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/pme-reciprocal-reference-cargo
    steps:
      - name: Check out current and historical evidence objects
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Materialize frozen reviewed heads
        run: |
          git fetch --no-tags --depth=1 origin refs/pull/435/head
          test "$(git rev-parse FETCH_HEAD)" = "b94e4c008db1c8414f5d0f24fa266c85c828d13c"
          git fetch --no-tags --depth=1 origin refs/pull/438/head
          test "$(git rev-parse FETCH_HEAD)" = "581a17a135d75ddf085c4edd29f3763c2f691fcf"

      - name: Select frozen hosted Rust toolchain
        run: |
          rustup toolchain install 1.93.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup override set 1.93.0

      - name: Verify immutable evidence and fail-closed unit contracts
        run: |
          python3 -m json.tool config/engine_v2_pme_reciprocal_reference_profile_v1.json >/dev/null
          python3 -m json.tool config/engine_v2_pme_reciprocal_reference_profile_v1_sources.json >/dev/null
          python3 tools/verify_engine_v2_pme_reciprocal_reference_v1.py
          python3 -m pip install pytest==8.3.5
          python3 -m pytest -q tests/unit/test_engine_v2_pme_reciprocal_reference_v1.py

      - name: Format and lint the standalone scalar reference
        run: |
          cargo fmt --manifest-path rust/reference-pme/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/reference-pme/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test debug and release scalar reference
        run: |
          cargo test --manifest-path rust/reference-pme/Cargo.toml --all-targets --locked
          cargo test --release --manifest-path rust/reference-pme/Cargo.toml --all-targets --locked
          cargo doc --manifest-path rust/reference-pme/Cargo.toml --no-deps --locked

      - name: Require debug and release frozen observation identity
        shell: bash
        run: |
          observation_dir="$(mktemp -d)"
          cargo run --quiet --manifest-path rust/reference-pme/Cargo.toml --example profile_observation --locked > "$observation_dir/debug.txt"
          cargo run --quiet --release --manifest-path rust/reference-pme/Cargo.toml --example profile_observation --locked > "$observation_dir/release.txt"
          diff -u "$observation_dir/debug.txt" "$observation_dir/release.txt"
          observed_sha="$(sha256sum "$observation_dir/debug.txt" | cut -d ' ' -f1)"
          expected_sha="$(python3 -c 'import json; print(json.load(open("config/engine_v2_pme_reciprocal_reference_profile_v1.json", encoding="ascii"))["accuracy_observation"]["debug_release_observation_sha256"])')"
          test "$observed_sha" = "$expected_sha"
          test "$(wc -l < "$observation_dir/debug.txt")" -eq 31
          grep -Fx 'full_pme_implemented=false' "$observation_dir/debug.txt"
