permissions:
  contents: read

concurrency:
  group: ci-native-compute-abi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-cpu-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Check out native compute sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          sparse-checkout: |
            CMakeLists.txt
            LICENSE
            betelgeuze_engine_v2/docking/synthetic_d0_fixture_admission.json
            tools/build_engine_v2_native_wheel.py
            tools/build_engine_v2_sbom.py
            tests/unit/test_engine_v2_native_packaging.py
            include
            native
            rust
            rust_engine_v2
            betelgeuze_engine_v2/docking/native_fixed64_consumers.py
            betelgeuze_engine_v2/docking/native_cpu_parity.py
            betelgeuze_engine_v2/docking/performance_host_preflight_v3.py
