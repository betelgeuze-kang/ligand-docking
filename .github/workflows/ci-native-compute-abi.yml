name: ci-native-compute-abi

on:
  push:
    branches: ["main"]
    paths:
      - "CMakeLists.txt"
      - "include/betelgeuze/**"
      - "native/**"
      - "rust/**"
      - ".github/workflows/ci-native-compute-abi.yml"
      - ".github/workflows/ci-native-hip-safe-trusted.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "include/betelgeuze/**"
      - "native/**"
      - "rust/**"
      - ".github/workflows/ci-native-compute-abi.yml"
      - ".github/workflows/ci-native-hip-safe-trusted.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-native-compute-abi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-cpu-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Check out native compute sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          sparse-checkout: |
            CMakeLists.txt
            LICENSE
            include
            native
            rust

      - name: Report hosted toolchain
        run: |
          cmake --version
          c++ --version
          rustc --version
          cargo --version

      - name: Build and test the C ABI
        run: |
          cmake -S . -B build/native \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBG_ENABLE_HIP_SAFE=OFF
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure

      - name: Exercise native ABI under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S . -B build/native-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBG_ENABLE_HIP_SAFE=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/native-sanitize --parallel 2
          ctest --test-dir build/native-sanitize --output-on-failure

      - name: Guard deterministic HIP source policy
        run: |
          if grep -R -n -E -- '-ffast-math|-munsafe-fp-atomics|atomic(Add|Sub|Exch|CAS)' \
            native/src/hip/provider.hip \
            native/src/hip/docking_geometric_admission.hip \
            native/src/hip/docking_torsion_v7.hip \
            native/src/hip/evaluator.cpp \
            native/src/hip/evaluator.hpp native/src/hip/provider.h; then
            echo "hip_safe contains a forbidden fast-math or floating-atomic primitive" >&2
            exit 1
          fi

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Test Rust C++ boundary
        run: cargo test --manifest-path rust/Cargo.toml --workspace --locked

      - name: Verify standalone Rust packages
        run: |
          cargo package --manifest-path rust/betelgeuze-sys/Cargo.toml --locked \
            --config 'patch.crates-io.betelgeuze-cpu-kernel.path="rust/cpu-kernel"'
          cargo package --manifest-path rust/betelgeuze-runtime/Cargo.toml --locked \
            --config 'patch.crates-io.betelgeuze-sys.path="rust/betelgeuze-sys"' \
            --config 'patch.crates-io.betelgeuze-cpu-kernel.path="rust/cpu-kernel"' \
            --config 'patch.crates-io.betelgeuze-docking-search.path="rust/betelgeuze-docking-search"' \
            --config 'patch.crates-io.betelgeuze-reference-physics.path="rust/reference-physics"' \
            --config 'patch.crates-io.betelgeuze-reference-dynamics.path="rust/reference-dynamics"'
