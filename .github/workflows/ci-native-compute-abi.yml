            .github/workflows/ci-native-compute-abi.yml
            .github/workflows/ci-engine-v2-release-candidate.yml
            .github/workflows/ci-engine-v2-main.yml

      - name: Fetch consumed native fixed64 CPU v7 source object
        run: |
          git fetch --no-tags --depth=1 origin 5c1e4791e988d4c75a5111f933feac85236ba821
          test "$(git rev-parse --verify '5c1e4791e988d4c75a5111f933feac85236ba821^{commit}')" = \
            "5c1e4791e988d4c75a5111f933feac85236ba821"
          git fetch --no-tags --depth=1 origin 38c16136a1e2cc126517ff9b50a05f06c5795adb
          test "$(git rev-parse --verify '38c16136a1e2cc126517ff9b50a05f06c5795adb^{commit}')" = \
            "38c16136a1e2cc126517ff9b50a05f06c5795adb"

      - name: Report hosted toolchain
        run: |
          cmake --version
          c++ --version
          rustc --version
          cargo --version

      - name: Verify archived native fixed64 CPU profile v4
        run: python3 tools/verify_engine_v2_native_fixed64_cpu_profile_v4.py

      - name: Verify archived native fixed64 CPU profile v5
        run: python3 tools/verify_engine_v2_native_fixed64_cpu_profile_v5.py

      - name: Verify archived native fixed64 CPU profile v6
        run: python3 tools/verify_engine_v2_native_fixed64_cpu_profile_v6.py

      - name: Verify non-consuming native fixed64 CPU activation v7
        run: python3 tools/verify_engine_v2_native_fixed64_cpu_profile_v7.py

      - name: Verify native fixed64 CPU evidence verifier interfaces
        run: |
          python3 tools/verify_engine_v2_native_fixed64_cpu_v6_evidence.py --help
          python3 tools/verify_engine_v2_native_fixed64_cpu_v7_evidence.py --help

      - name: Verify consumed native fixed64 CPU v7 execution receipt
        run: >-
          python3
          tools/verify_engine_v2_native_fixed64_cpu_qualification_v7_execution_receipt.py

      - name: Verify native fixed64 workspace reuse v1 contract
        run: >-
          python3 tools/verify_engine_v2_native_fixed64_workspace_reuse_v1.py

      - name: Verify native repository synthetic D0 source v1 contract
        run: >-
          python3 tools/verify_engine_v2_repository_synthetic_d0_native_source_v1.py

      - name: Verify repository synthetic D0 native session v1 contract
        run: >-
          python3 tools/verify_engine_v2_repository_synthetic_d0_native_session_v1.py

      - name: Verify repository synthetic D0 native CPU parity v1 contract
        run: >-
          python3 tools/verify_engine_v2_repository_synthetic_d0_cpu_parity_v1.py

      - name: Verify native CPU runtime artifacts v1 contract
        run: >-
          python3 tools/verify_engine_v2_native_cpu_runtime_artifacts_v1.py

      - name: Verify full-pipeline CPU performance v1 activation
        run: >-
          python3 tools/verify_engine_v2_full_pipeline_cpu_performance_v1_activation.py

      - name: Build and test the C ABI
        run: |
          cmake -S . -B build/native \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBG_ENABLE_HIP_SAFE=OFF
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure

      - name: Exercise native ABI under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S . -B build/native-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DBG_ENABLE_HIP_SAFE=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/native-sanitize --parallel 2
          ctest --test-dir build/native-sanitize --output-on-failure

      - name: Guard deterministic HIP source policy
        run: |
          if grep -R -n -E -- '-ffast-math|-munsafe-fp-atomics|atomic(Add|Sub|Exch|CAS)' \
            native/src/hip/provider.hip \
            native/src/hip/docking_geometric_admission.hip \
            native/src/hip/docking_torsion_v7.hip \
            native/src/hip/evaluator.cpp \
            native/src/hip/evaluator.hpp native/src/hip/provider.h; then
            echo "hip_safe contains a forbidden fast-math or floating-atomic primitive" >&2
            exit 1
          fi

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Test Rust C++ boundary
        run: cargo test --manifest-path rust/Cargo.toml --workspace --locked

      - name: Verify release non-test activation artifact is blocked
        run: >-
          cargo test --release --manifest-path rust/Cargo.toml
          -p betelgeuze-runtime
          --test fixed64_cpu_probe_v5_activation
          --locked --
          --exact native_fixed64_cpu_probe_is_blocked_before_measurement

      - name: Verify standalone Rust packages
        run: |
          cargo package --manifest-path rust/betelgeuze-sys/Cargo.toml --locked \
            --config 'patch.crates-io.betelgeuze-cpu-kernel.path="rust/cpu-kernel"'
          BETELGEUZE_V7_NON_AUTHORITATIVE_PACKAGE_BUILD=1 \
          BETELGEUZE_V7_SOURCE_ROOT="$GITHUB_WORKSPACE" \
          cargo package --manifest-path rust/betelgeuze-runtime/Cargo.toml --locked \
            --config 'patch.crates-io.betelgeuze-sys.path="rust/betelgeuze-sys"' \
            --config 'patch.crates-io.betelgeuze-cpu-kernel.path="rust/cpu-kernel"' \
            --config 'patch.crates-io.betelgeuze-docking-search.path="rust/betelgeuze-docking-search"' \
            --config 'patch.crates-io.betelgeuze-reference-physics.path="rust/reference-physics"' \
            --config 'patch.crates-io.betelgeuze-reference-dynamics.path="rust/reference-dynamics"'

      - name: Verify normalized standalone v7 package activation
        run: |
          set +e
          BETELGEUZE_V7_NON_AUTHORITATIVE_PACKAGE_BUILD=1 \
          BETELGEUZE_V7_SOURCE_ROOT="$GITHUB_WORKSPACE" \
          cargo run --offline --locked \
            --manifest-path rust/target/package/betelgeuze-runtime-0.1.0/Cargo.toml \
            --bin betelgeuze-fixed64-cpu-qualify-v7 \
            --config "patch.crates-io.betelgeuze-sys.path=\"$GITHUB_WORKSPACE/rust/betelgeuze-sys\"" \
            --config "patch.crates-io.betelgeuze-cpu-kernel.path=\"$GITHUB_WORKSPACE/rust/cpu-kernel\"" \
            --config "patch.crates-io.betelgeuze-docking-search.path=\"$GITHUB_WORKSPACE/rust/betelgeuze-docking-search\"" \
            --config "patch.crates-io.betelgeuze-reference-physics.path=\"$GITHUB_WORKSPACE/rust/reference-physics\"" \
            --config "patch.crates-io.betelgeuze-reference-dynamics.path=\"$GITHUB_WORKSPACE/rust/reference-dynamics\"" \
            -- --verify-activation \
            > /tmp/v7-normalized-package.stdout \
            2> /tmp/v7-normalized-package.stderr
          activation_status=$?
          set -e
          test "$activation_status" -eq 1
          test ! -s /tmp/v7-normalized-package.stdout
          grep -F \
            'native fixed64 CPU v7 non-authoritative build cannot activate' \
            /tmp/v7-normalized-package.stderr
