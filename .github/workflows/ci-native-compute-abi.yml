            betelgeuze_engine_v2/docking/full_pipeline_cpu_performance_v1_activation.py
            betelgeuze_engine_v2/standalone_cli.py
            .cargo
            .cargo/config
            .cargo/config.toml
            rust-toolchain
            rust-toolchain.toml
            config/engine_v2_native_fixed64_cpu_profile_v4.json
            config/engine_v2_native_fixed64_cpu_profile_v4_archive.json
            config/engine_v2_native_fixed64_cpu_profile_v5.json
