name: ci-engine-v2-top-stack

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-top-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Reject self-modifying or temporary stacked workflows
        run: |
          python tools/check_engine_v2_top_stack.py
          git diff --check

  focused-security-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: "--confcutdir=tests/unit"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            build==1.2.2.post1 \
            setuptools==75.8.2 \
            wheel==0.45.1 \
            pytest==8.3.5 \
            PyYAML==6.0.3 \
            cryptography==46.0.5 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        run: |
          python -m compileall -q betelgeuze_engine_v2 tools
          python tools/check_engine_v2_architecture.py
          python tools/check_engine_v2_top_stack.py

      - name: Run focused stacked contracts
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_truthfulness.py \
            tests/unit/test_engine_v2_post_merge_state.py \
            tests/unit/test_engine_v2_public_benchmark_protocol.py \
            tests/unit/test_engine_v2_public_benchmark_materializer.py \
            tests/unit/test_engine_v2_offline_public_evaluator.py \
            tests/unit/test_engine_v2_authenticated_public_evaluator.py \
            tests/unit/test_engine_v2_evidence_contracts.py \
            tests/unit/test_engine_v2_evidence_contracts_v3.py \
            tests/unit/test_engine_v2_stack_round1_hardening.py \
            tests/unit/test_engine_v2_stack_round2_evaluator.py \
            tests/unit/test_engine_v2_stack_round3_molecular.py \
            tests/unit/test_engine_v2_stack_round3_compatibility.py \
            tests/unit/test_engine_v2_docking_authority_contract.py \
            tests/unit/test_engine_v2_docking_authority_search.py \
            tests/unit/test_engine_v2_pocket_placement_round6.py \
            tests/unit/test_engine_v2_element_contact_round8.py \
            tests/unit/test_engine_v2_interpretable_scorer_round10.py \
            tests/unit/test_engine_v2_interpretable_result_round12.py \
            tests/unit/test_engine_v2_canonical_cli_round14.py \
            tests/unit/test_engine_v2_sparse_base_validity_round16.py \
            tests/unit/test_engine_v2_cli_result_verifier_round18.py \
            tests/unit/test_engine_v2_cli_result_verifier_release_round19.py \
            tests/unit/test_engine_v2_search_fingerprint_material_round20.py \
            tests/unit/test_engine_v2_search_fingerprint_release_round21.py \
            tests/unit/test_engine_v2_reference_pocket_round22.py \
            tests/unit/test_engine_v2_reference_pocket_release_round23.py \
            tests/unit/test_engine_v2_input_bound_verifier_round24.py \
            tests/unit/test_engine_v2_input_bound_verifier_release_round25.py \
            tests/unit/test_engine_v2_release_integration_round5.py \
            tests/unit/test_engine_v2_reference_minimization_validation_dependency_identity.py \
            tests/unit/test_engine_v2_reference_minimization_validation_preimport_binding.py \
            tests/unit/test_engine_v2_reference_minimization_validation_bootstrap_e2e.py \
            tests/unit/test_engine_v2_reference_minimization_validation_source_snapshot.py \
            tests/unit/test_engine_v2_verified_source_runtime_hardening.py

      - name: Run isolated runner boundary tests
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_reference_minimization_validation_runner.py \
            -k "source or isolated or bootstrap or supervised or worker"

  complete-engine-v2-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: "--confcutdir=tests/unit"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install complete Engine v2 CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            build==1.2.2.post1 \
            setuptools==75.8.2 \
            wheel==0.45.1 \
            pytest==8.3.5 \
            PyYAML==6.0.3 \
            cryptography==46.0.5 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run complete Engine v2 unit suite
        run: |
          python -m pytest -q tests/unit/test_engine_v2_*.py
