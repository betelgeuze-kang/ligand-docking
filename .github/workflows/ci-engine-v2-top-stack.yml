name: ci-engine-v2-top-stack

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-top-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Reject self-modifying or temporary stacked workflows
        run: |
          python tools/check_engine_v2_top_stack.py
          git diff --check

  focused-security-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: "--confcutdir=tests/unit"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            build==1.2.2.post1 \
            setuptools==75.8.2 \
            wheel==0.45.1 \
            pytest==8.3.5 \
            PyYAML==6.0.3 \
            cryptography==46.0.5 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        run: |
          python -m compileall -q betelgeuze_engine_v2 tools
          python tools/check_engine_v2_architecture.py
          python tools/check_engine_v2_top_stack.py

      - name: Run focused stacked contracts
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_truthfulness.py \
            tests/unit/test_engine_v2_post_merge_state.py \
            tests/unit/test_engine_v2_input_identity.py \
            tests/unit/test_engine_v2_authenticated_docking_problem.py \
            tests/unit/test_engine_v2_docking_integrity.py \
            tests/unit/test_engine_v2_docking_root_positions.py \
            tests/unit/test_engine_v2_docking_semantics.py \
            tests/unit/test_engine_v2_docking_validity_selection.py \
            tests/unit/test_engine_v2_reference_minimization.py \
            tests/unit/test_engine_v2_public_benchmark_protocol.py \
            tests/unit/test_engine_v2_public_benchmark_materializer.py \
            tests/unit/test_engine_v2_offline_public_evaluator.py \
            tests/unit/test_engine_v2_authenticated_public_evaluator.py \
            tests/unit/test_engine_v2_evidence_contracts.py \
            tests/unit/test_engine_v2_evidence_contracts_v3.py \
            tests/unit/test_engine_v2_reference_minimization_validation_dependency_identity.py \
            tests/unit/test_engine_v2_reference_minimization_validation_preimport_binding.py \
            tests/unit/test_engine_v2_reference_minimization_validation_bootstrap_e2e.py \
            tests/unit/test_engine_v2_reference_minimization_validation_source_snapshot.py \
            tests/unit/test_engine_v2_verified_source_runtime_hardening.py

      - name: Run isolated runner boundary tests
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_reference_minimization_validation_runner.py \
            -k "source or isolated or bootstrap or supervised or worker"

  complete-engine-v2-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTEST_ADDOPTS: "--confcutdir=tests/unit"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install complete Engine v2 CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            build==1.2.2.post1 \
            setuptools==75.8.2 \
            wheel==0.45.1 \
            pytest==8.3.5 \
            PyYAML==6.0.3 \
            cryptography==46.0.5 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run complete Engine v2 unit suite
        run: |
          python -m pytest -q tests/unit/test_engine_v2_*.py

  reproducible-wheel-clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: "1735689600"
      PYTHONHASHSEED: "0"
      TZ: "UTC"
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned wheel tooling
        run: |
          python -m pip install pip==25.0.1
          python -m pip install build==1.2.2.post1 setuptools==75.8.2 wheel==0.45.1

      - name: Require byte-identical isolated wheels
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_engine_v2_wheel.py --output-dir dist-a --source-date-epoch "$SOURCE_DATE_EPOCH"
          python tools/build_engine_v2_wheel.py --output-dir dist-b --source-date-epoch "$SOURCE_DATE_EPOCH"
          wheel_a="$(find dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_b="$(find dist-b -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_a" -a -n "$wheel_b"
          test "$(sha256sum "$wheel_a" | cut -d' ' -f1)" = "$(sha256sum "$wheel_b" | cut -d' ' -f1)"
          cmp "$wheel_a" "$wheel_b"

      - name: Clean install and import outside checkout
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/engine-v2-p0-clean"
          outside="${RUNNER_TEMP}/engine-v2-p0-outside"
          python -m venv "$venv"
          grep -q '^include-system-site-packages = false$' "$venv/pyvenv.cfg"
          "$venv/bin/python" -m pip install pip==25.0.1
          "$venv/bin/python" -m pip install cryptography==46.0.5 numpy==1.26.4
          "$venv/bin/python" -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$venv/bin/python" -m pip install --no-deps dist-a/*.whl
          "$venv/bin/python" -m pip check
          mkdir -p "$outside"
          cd "$outside"
          "$venv/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import betelgeuze_engine_v2 as engine

          assert metadata.version("betelgeuze-engine-v2") == "0.3.0a1"
          assert engine.DISTRIBUTION_VERSION == "0.3.0a1"
          assert engine.ENGINE_API_VERSION == "2.0.0"
          PY

  p0-release-line:
    if: always()
    needs:
      - stack-hygiene
      - focused-security-and-evidence
      - complete-engine-v2-suite
      - reproducible-wheel-clean-install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every P0 aggregate lane
        run: |
          test "${{ needs.stack-hygiene.result }}" = "success"
          test "${{ needs.focused-security-and-evidence.result }}" = "success"
          test "${{ needs.complete-engine-v2-suite.result }}" = "success"
          test "${{ needs.reproducible-wheel-clean-install.result }}" = "success"
