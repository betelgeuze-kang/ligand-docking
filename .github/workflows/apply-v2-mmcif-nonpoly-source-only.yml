name: apply-v2-mmcif-nonpoly-source-only

on:
  pull_request:
    paths:
      - ".github/workflows/apply-v2-mmcif-nonpoly-source-only.yml"

permissions:
  contents: write

concurrency:
  group: apply-v2-mmcif-nonpoly-source-only
  cancel-in-progress: false

jobs:
  apply-registration:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/v2-mmcif-nonpoly-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/v2-mmcif-nonpoly-identity
          fetch-depth: 0
          persist-credentials: true
          clean: true
          show-progress: false

      - name: Apply registration without deleting workflow files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/patches/apply_v2_mmcif_nonpoly_registration.py')
          source = path.read_text(encoding='utf-8')
          removal = '    workflow_path.unlink()\n    script_path.unlink()\n'
          if source.count(removal) != 1:
              raise SystemExit('temporary-file deletion block drifted')
          path.write_text(source.replace(removal, '', 1), encoding='utf-8')
          PY
          python .github/patches/apply_v2_mmcif_nonpoly_registration.py
          python -m py_compile \
            betelgeuze_engine_v2/molecular/__init__.py \
            betelgeuze_engine_v2/capabilities.py \
            tests/unit/test_engine_v2_post_merge_state.py
          git diff --check

      - name: Commit only final product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            betelgeuze_engine_v2/molecular/__init__.py \
            betelgeuze_engine_v2/capabilities.py \
            config/independent_engine_v2_capabilities.yaml \
            tests/unit/test_engine_v2_post_merge_state.py \
            .github/workflows/ci-engine-v2-main.yml \
            .github/workflows/ci-engine-v2-mmcif-nonpoly-identity.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(v2): register bounded mmCIF nonpoly identity capability"
          git push origin HEAD:codex/v2-mmcif-nonpoly-identity
