  workflow_dispatch:
    inputs:
      runner_labels_json:
        description: "JSON array for runner labels. Default self-hosted avoids GitHub-hosted minutes; use [\"ubuntu-latest\"] only by explicit choice."
        required: true
        default: '["self-hosted","linux"]'

jobs:
  api-worker-contract:
    runs-on: ${{ fromJSON(inputs.runner_labels_json || '["self-hosted","linux"]') }}
    steps:
      - name: Recover stale product image smoke workspace artifacts
        shell: bash
        run: |
          set -euo pipefail
          runs_dir="${GITHUB_WORKSPACE}/runs"
          smoke_dir="${runs_dir}/product_image_smoke_runner_artifacts"
          receipt_path="${runs_dir}/product_image_smoke_receipt_current.json"
          build_log_path="${runs_dir}/product_image_build_smoke.log"
          rocm_log_path="${runs_dir}/product_image_rocm_runtime_smoke.log"
          repair_path() {
            local path="$1"
            if [[ -e "${path}" ]]; then
              chown -R "$(id -u):$(id -g)" "${path}" 2>/dev/null || sudo -n chown -R "$(id -u):$(id -g)" "${path}" 2>/dev/null || true
              chmod -R u+rwX "${path}" 2>/dev/null || sudo -n chmod -R u+rwX "${path}" 2>/dev/null || true
            fi
          }
          if [[ -e "${runs_dir}" ]]; then
            chown "$(id -u):$(id -g)" "${runs_dir}" 2>/dev/null || sudo -n chown "$(id -u):$(id -g)" "${runs_dir}" 2>/dev/null || true
            chmod u+rwx "${runs_dir}" 2>/dev/null || sudo -n chmod u+rwx "${runs_dir}" 2>/dev/null || true
          fi
          repair_path "${receipt_path}"
          repair_path "${build_log_path}"
          repair_path "${rocm_log_path}"
          if [[ -e "${smoke_dir}" ]]; then
            repair_path "${smoke_dir}"
            if ! rm -rf "${smoke_dir}"; then
              echo "::warning::product_image_smoke_workspace_cleanup_failed path=${smoke_dir}; continuing because product-image-smoke owns the fail-closed hygiene receipt" >&2
            fi
          fi
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install API test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r requirements-api.txt

      - name: Compile API and worker modules
        run: |
          python3 -m py_compile \
            api/config.py \
            api/docking_dispatch.py \
            api/job_store.py \
            api/runner_profile_contract.py \
            api/security.py \
            api/validated_runner.py \
            api/worker.py \
            api/main.py \
            api/result_manifest.py \
            api/tasks.py \
            betelgeuze_product/engine_dispatch.py \
            betelgeuze_product/job_terminal_state.py \
            betelgeuze_product/payload_privacy.py \
            betelgeuze_product/docking_response.py \
            betelgeuze_product/api_contract.py \
            api/product_docking.py \
            betelgeuze_product/private_payload_store.py \
            betelgeuze_product/benchmark_ledger.py \
            tools/product/build_benchmark_ledger.py \
            betelgeuze_product/hbond_backmap_report.py \
            betelgeuze_product/docking_comparison_contract.py \
            betelgeuze_product/gpcr_hard_decoy_suite.py \
            betelgeuze_product/pocketmd_lite_contract.py \
            betelgeuze_product/docking_private_payload.py \
            betelgeuze_product/structured_reason.py \
            betelgeuze_product/docking_materialization_errors.py \
            deploy/model_registry.py \
            deploy/upload_model.py \
            deploy/download_model.py \
            deploy/rollback_model.py \
            deploy/product_release_bundle.py \
            deploy/product_rollout.py \
            tools/run_api_simulation_worker.py \
            tools/smoke_alert_delivery.py \
            tools/product/materialize_docking_htvs_request.py \
            tools/product/materialize_docking_backmapping_request.py \
            tools/accounting/build_pdbbind_casf_pose_affinity_results.py \
            scripts/verify_quality_gate.py \
            tools/product/bootstrap_api_worker_contract_artifacts.py \
            tools/product/build_api_runner_profile_promotion_operator_receipt.py \
            tools/product/build_production_ai_registry_promotion_operator_receipt.py \
            tools/product/build_production_ai_registry_promotion_priority_packet.py \
            tools/product/build_product_pose_sampling_readiness.py \
            tools/product/build_product_launch_r4_preflight.py \
            tools/product/build_refine_tier_public_benchmark_readiness.py \
            tools/product/apply_refine_tier_public_benchmark_work_order.py \
            tools/product/validate_api_runner_profiles.py \
            tools/product/build_api_runner_profile_enablement_work_order.py \
            tools/build_viewer_asset_base_url_decision.py \
            tools/product/build_engine_refinement_tier_readiness.py \
            tools/product/build_engine_refinement_claim_evidence_receipt.py \
            tools/product/build_product_scope_breadth_evidence_receipt.py \
            tools/product/build_product_full_commercial_blocker_evidence_matrix.py \
            tools/product/build_self_hosted_license_distribution_audit.py

      - name: Refresh release bundle local decision artifacts
        run: |
          python3 tools/product/bootstrap_api_worker_contract_artifacts.py
          python3 tools/build_viewer_asset_base_url_decision.py \
            --out-json runs/viewer_asset_base_url_decision_current.json
          python3 tools/build_product_commercial_independence_gate.py
          python3 tools/product/build_self_hosted_license_distribution_audit.py \
            --out-json runs/self_hosted_license_distribution_audit_current.json
          python3 tools/product/build_product_launch_r4_preflight.py
          python3 deploy/product_release_bundle.py

      - name: Run API worker and deploy artifact tests
        run: |
          python3 -m pytest -q \
            tests/unit/test_docking_pipeline_hardening.py \
            tests/unit/test_api_job_store.py \
            tests/unit/test_api_validated_runner_adapter.py \
            tests/unit/test_api_runner_profile_enablement_work_order.py \
            tests/unit/test_api_worker_deploy_artifacts.py \
            tests/unit/test_api_security_middleware.py \
            tests/unit/test_payload_privacy.py \
            tests/unit/test_product_docking_response_contract.py \
            tests/unit/test_build_product_api_contract.py \
            tests/unit/test_private_payload_store.py \
            tests/unit/test_benchmark_ledger.py \
            tests/unit/test_hbond_backmap_report.py \
            tests/unit/test_docking_comparison_contract.py \
            tests/unit/test_gpcr_hard_decoy_suite.py \
            tests/unit/test_pocketmd_lite_contract.py \
            tests/unit/test_docking_private_payload.py \
            tests/unit/test_structured_reason.py \
            tests/unit/test_build_pdbbind_casf_pose_affinity_results.py \
            tests/unit/test_deploy_model_registry.py \
            tests/unit/test_product_release_bundle.py \
            tests/unit/test_build_product_launch_r4_preflight.py \
            tests/unit/test_build_refine_tier_public_benchmark_readiness.py \
            tests/unit/test_apply_refine_tier_public_benchmark_work_order.py \
            tests/unit/test_product_rollout.py \
            tests/unit/test_smoke_alert_delivery.py \
            tests/unit/test_viewer_self_hosted_assets.py \
            tests/unit/test_build_viewer_asset_base_url_decision.py \
            tests/unit/test_build_self_hosted_license_distribution_audit.py \
            tests/unit/test_api_goal_import.py \
            tests/unit/test_api_casp17_import.py \
            tests/unit/test_api_cleanup_import.py \
            tests/unit/test_api_product_import.py

      - name: Validate API runner profiles
        run: |
          python3 tools/product/validate_api_runner_profiles.py --profiles-dir config/api_validated_runner_profiles

      - name: Build API runner profile enablement work order
        run: |
          python3 tools/product/build_api_runner_profile_enablement_work_order.py \
            --profiles-dir config/api_validated_runner_profiles \
            --evidence-dir /tmp/api_runner_profile_evidence_templates \
            --write-evidence-templates \
            --out-json /tmp/api_runner_profile_enablement_work_order.json \
            --out-md /tmp/api_runner_profile_enablement_work_order.md

      - name: Smoke worker CLI with empty durable queue
        run: |
          tmpdir="$(mktemp -d)"
          API_JOB_STORE_PATH="$tmpdir/api_jobs.sqlite3" \
          API_INLINE_WORKER_ENABLED=0 \
          API_WORKER_HEARTBEAT_INTERVAL_SECONDS=0.05 \
          python3 tools/run_api_simulation_worker.py \
            --once \
            --worker-id ci-smoke-worker \
            --heartbeat-interval-seconds 0.05 \
            --poll-interval-seconds 0.01

      - name: Smoke alert delivery CLI with localhost receiver
        run: |
          python3 tools/smoke_alert_delivery.py --local-receiver-smoke
