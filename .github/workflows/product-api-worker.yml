name: product-api-worker

on:
  pull_request:
    paths:
      - "api/**"
      - "betelgeuze_product/engine_dispatch.py"
      - "betelgeuze_product/job_terminal_state.py"
      - "betelgeuze_product/payload_privacy.py"
      - "betelgeuze_product/docking_response.py"
      - "betelgeuze_product/scientific_input_provenance.py"
      - "betelgeuze_product/api_contract.py"
      - "betelgeuze_product/private_payload_store.py"
      - "betelgeuze_product/benchmark_ledger.py"
      - "betelgeuze_product/hbond_backmap_report.py"
      - "betelgeuze_product/docking_comparison_contract.py"
      - "betelgeuze_product/gpcr_hard_decoy_suite.py"
      - "betelgeuze_product/pocketmd_lite_contract.py"
      - "betelgeuze_product/docking_private_payload.py"
      - "betelgeuze_product/structured_reason.py"
      - "betelgeuze_product/docking_materialization_errors.py"
      - "tools/run_api_simulation_worker.py"
      - "tools/smoke_alert_delivery.py"
      - "tools/product/materialize_docking_htvs_request.py"
      - "tools/product/materialize_docking_backmapping_request.py"
      - "tools/accounting/build_pdbbind_casf_pose_affinity_results.py"
      - "tools/product/validate_api_runner_profiles.py"
      - "tools/product/build_api_runner_profile_enablement_work_order.py"
      - "tools/product/build_refine_tier_public_benchmark_readiness.py"
      - "tools/product/apply_refine_tier_public_benchmark_work_order.py"
      - "config/api_validated_runner_profiles/**"
      - "config/refine_tier_public_benchmark_intake_current.csv"
      - "tools/build_viewer_asset_base_url_decision.py"
      - "tools/build_product_commercial_independence_gate.py"
      - "tools/accounting/build_product_scope_breadth_closure_checklist.py"
      - "tools/product/bootstrap_api_worker_contract_artifacts.py"
      - "tools/product/ci_contract_fixture_packets.py"
      - "tools/product/build_api_runner_profile_promotion_operator_receipt.py"
      - "tools/product/build_production_ai_registry_promotion_operator_receipt.py"
      - "tools/product/build_production_ai_registry_promotion_priority_packet.py"
      - "tools/product/build_product_pose_sampling_readiness.py"
      - "tools/product/build_product_launch_r4_preflight.py"
      - "tools/product/build_self_hosted_license_distribution_audit.py"
      - "tools/product/build_engine_refinement_tier_readiness.py"
      - "tools/product/build_engine_refinement_claim_evidence_receipt.py"
      - "tools/product/build_product_scope_breadth_evidence_receipt.py"
      - "tools/product/build_product_full_commercial_blocker_evidence_matrix.py"
      - "scripts/verify_quality_gate.py"
      - "deploy/**"
      - "monitoring/**"
      - "viewer/**"
      - "tests/unit/test_docking_pipeline_hardening.py"
      - "tests/unit/test_scientific_input_dispatch_enforcement.py"
      - "tests/unit/test_ci_contract_fixture_packets.py"
      - "tests/unit/test_deploy_model_registry.py"
      - "tests/unit/test_product_release_bundle.py"
      - "tests/unit/test_product_rollout.py"
      - "tests/unit/test_smoke_alert_delivery.py"
      - "tests/unit/test_viewer_self_hosted_assets.py"
      - "tests/unit/test_build_viewer_asset_base_url_decision.py"
      - "tests/unit/test_build_self_hosted_license_distribution_audit.py"
      - "tests/unit/test_build_refine_tier_public_benchmark_readiness.py"
      - "tests/unit/test_apply_refine_tier_public_benchmark_work_order.py"
      - "tests/unit/test_api_job_store.py"
      - "tests/unit/test_api_goal_import.py"
      - "tests/unit/test_api_casp17_import.py"
      - "tests/unit/test_api_cleanup_import.py"
      - "tests/unit/test_api_product_import.py"
      - "tests/unit/test_api_worker_deploy_artifacts.py"
      - "tests/unit/test_api_security_middleware.py"
      - "tests/unit/test_payload_privacy.py"
      - "tests/unit/test_product_docking_response_contract.py"
      - "tests/unit/test_build_product_api_contract.py"
      - "tests/unit/test_private_payload_store.py"
      - "tests/unit/test_benchmark_ledger.py"
      - "tests/unit/test_hbond_backmap_report.py"
      - "tests/unit/test_docking_comparison_contract.py"
      - "tests/unit/test_gpcr_hard_decoy_suite.py"
      - "tests/unit/test_pocketmd_lite_contract.py"
      - "tests/unit/test_docking_private_payload.py"
      - "tests/unit/test_structured_reason.py"
      - "tests/unit/test_build_pdbbind_casf_pose_affinity_results.py"
      - "tests/unit/test_github_workflow_trust_boundaries.py"
      - "tools/product/github_workflow_trust_boundaries.py"
      - "tests/mobile/**"
      - "requirements-mobile.txt"
      - "pytest-mobile.ini"
      - ".github/dependabot.yml"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: product-api-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-worker-contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PRODUCT_API_AUTH_REQUIRED: "0"
    steps:
      - name: Check out untrusted source on an ephemeral hosted runner
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          show-progress: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-mobile.txt

      - name: Install dependency-light API test profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mobile.txt

      - name: Compile dependency-light API source
        run: |
          python -m compileall -q \
            api \
            betelgeuze_product/docking_response.py \
            betelgeuze_product/job_orchestration.py \
            betelgeuze_product/payload_privacy.py \
            betelgeuze_product/scientific_input_provenance.py \
            betelgeuze_product/tier_beta_vertical_slice.py \
            core/claim_boundary.py \
            tests/mobile \
            tests/unit/test_scientific_input_dispatch_enforcement.py

      - name: Enforce workflow trust boundaries
        run: >-
          python -m pytest --confcutdir=tests/unit -q
          tests/unit/test_github_workflow_trust_boundaries.py

      - name: Run scientific input dispatch enforcement contracts
        shell: bash
        run: |
          set +e
          python -m pytest --confcutdir=tests/unit -vv -x \
            tests/unit/test_scientific_input_dispatch_enforcement.py \
            tests/unit/test_docking_pipeline_hardening.py \
            > scientific-input-dispatch.log 2>&1
          status=$?
          cat scientific-input-dispatch.log
          exit "$status"

      - name: Upload scientific input dispatch diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scientific-input-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: scientific-input-dispatch.log
          if-no-files-found: error
          retention-days: 7

      - name: Run dependency-light API contracts
        run: >-
          python -m pytest --confcutdir=tests/mobile -c pytest-mobile.ini -q
          tests/mobile
          tests/unit/test_api_security_middleware.py
          tests/unit/test_api_job_store.py
