name: finalize-session-completion-v3

on:
  push:
    branches:
      - codex/session-completion-v3
    paths:
      - "tools/finalize_session_completion_v3.py"
      - ".github/workflows/finalize-session-completion-v3.yml"

permissions:
  contents: write

concurrency:
  group: finalize-session-completion-v3
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/session-completion-v3
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install pytest==8.3.5 numpy==2.2.6

      - name: Apply exact D1 patch
        run: python tools/finalize_session_completion_v3.py

      - name: Compile tools
        run: python -m compileall -q tools

      - name: Run focused suite
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_d1_development_v1_hardening.py \
            tests/unit/test_materialize_engine_v2_d1_case_results_v1.py \
            tests/unit/test_engine_v2_sampling_funnel_v1.py \
            tests/unit/test_engine_v2_water_box_reference_v1.py \
            tests/unit/test_inventory_github_actions_pins_v1.py \
            tests/unit/test_verify_engine_v2_hip_d1_benchmark_v1.py

      - name: Remove temporary finalizer
        run: |
          rm -f tools/finalize_session_completion_v3.py
          rm -f .github/workflows/finalize-session-completion-v3.yml

      - name: Commit verified result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Engine V2: finalize remaining in-session development work"
          git push origin HEAD:codex/session-completion-v3
