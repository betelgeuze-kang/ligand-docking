name: ci-engine-v2-global-orientation-development-protocol

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/benchmark/global_orientation_development_decision.py"
      - "config/engine_v2_global_orientation_contaminated_development.json"
      - "tools/verify_engine_v2_global_orientation_contaminated_development.py"
      - "tests/unit/test_engine_v2_global_orientation_development_decision.py"
      - "tests/unit/test_engine_v2_global_orientation_development_protocol.py"
      - "docs/engine_v2_global_orientation_contaminated_development_protocol.md"
      - ".github/workflows/ci-engine-v2-global-orientation-development-protocol.yml"

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-global-orientation-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install bounded test dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install pytest==8.3.5 ruff==0.11.13
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Verify frozen protocol and compile decision surfaces
        run: |
          python -m py_compile \
            betelgeuze_engine_v2/benchmark/global_orientation_development_decision.py \
            tools/verify_engine_v2_global_orientation_contaminated_development.py
          python -m tools.verify_engine_v2_global_orientation_contaminated_development

      - name: Run protocol and decision contracts
        run: |
          python -m pytest -q \
            --confcutdir=tests/unit \
            tests/unit/test_engine_v2_global_orientation_development_protocol.py \
            tests/unit/test_engine_v2_global_orientation_development_decision.py

      - name: Lint and diff check
        run: |
          python -m ruff check \
            betelgeuze_engine_v2/benchmark/global_orientation_development_decision.py \
            tools/verify_engine_v2_global_orientation_contaminated_development.py \
            tests/unit/test_engine_v2_global_orientation_development_protocol.py \
            tests/unit/test_engine_v2_global_orientation_development_decision.py
          git diff --check ${{ github.event.pull_request.base.sha }}...HEAD
