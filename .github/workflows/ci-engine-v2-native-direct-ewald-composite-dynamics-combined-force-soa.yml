permissions:
  contents: read

concurrency:
  group: ci-engine-v2-native-direct-ewald-composite-dynamics-combined-force-soa-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  HIP_VISIBLE_DEVICES: ""
  ROCR_VISIBLE_DEVICES: ""

jobs:
  immutable-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact evidence graph
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0
      - name: Materialize exact PR 450 architecture, PR 449 target, and PR 446 inherited final SoA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 75d3a4e2b7ba5b0f1dcf99007358f6f2c47c7330^{tree})" = "03ccd07339b71eafa435a9b2012d2ab6a863d4d9"
          git merge-base --is-ancestor 75d3a4e2b7ba5b0f1dcf99007358f6f2c47c7330 HEAD
          git fetch --no-tags --depth=1 origin refs/pull/450/head
          test "$(git rev-parse FETCH_HEAD)" = "b0e26a8b2eea995a6038a484894808387486ff9e"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "03ccd07339b71eafa435a9b2012d2ab6a863d4d9"
          test "$(git rev-parse 11ee408d89c44e70188af5133544ecebd604b182^{tree})" = "01d37e1adf097384c1e895fa637af0cfff45f4e8"
          git merge-base --is-ancestor 11ee408d89c44e70188af5133544ecebd604b182 75d3a4e2b7ba5b0f1dcf99007358f6f2c47c7330
          git fetch --no-tags --depth=1 origin refs/pull/449/head
          test "$(git rev-parse FETCH_HEAD)" = "0268e1731eb5f8b472cb527ac277a66c7ce4317f"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "01d37e1adf097384c1e895fa637af0cfff45f4e8"
          test "$(git rev-parse 29edcd1ea18e9fb64b9d416a0d05d87e0485be4b^{tree})" = "77f5298c291130f7ea86b96bd13b6bd9596f6850"
          git merge-base --is-ancestor 29edcd1ea18e9fb64b9d416a0d05d87e0485be4b 11ee408d89c44e70188af5133544ecebd604b182
          git fetch --no-tags --depth=1 origin refs/pull/446/head
          test "$(git rev-parse FETCH_HEAD)" = "5b3fb7ab339d21598ccd22c8c2fe89b38cc97fe7"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "77f5298c291130f7ea86b96bd13b6bd9596f6850"
      - name: Verify bounded successor evidence
        run: |
          python3 -m json.tool config/engine_v2_native_direct_ewald_composite_dynamics_combined_force_soa_profile_v1.json >/dev/null
          python3 -m json.tool config/engine_v2_native_direct_ewald_composite_dynamics_combined_force_soa_profile_v1_sources.json >/dev/null
          python3 -m pip install pytest==8.3.5
          python3 tools/verify_engine_v2_native_direct_ewald_composite_dynamics_combined_force_soa_v1.py
          python3 -m pytest -q tests/unit/test_engine_v2_native_direct_ewald_composite_dynamics_combined_force_soa_v1.py

  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out native sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false, clean: true, fetch-depth: 1}
      - name: Select frozen Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup override set 1.93.0
      - name: Synthetic release and sanitizer regressions
        run: |
          cmake -S . -B build/direct-ewald-combined-force-soa-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBG_ENABLE_HIP=OFF -DBG_ENABLE_HIP_SAFE=OFF
          cmake --build build/direct-ewald-combined-force-soa-release --target betelgeuze_engine_direct_ewald_composite_dynamics --parallel 2
          ctest --test-dir build/direct-ewald-combined-force-soa-release -R '^betelgeuze_engine_(direct_ewald_composite_dynamics|export_allowlist)$' --output-on-failure
          cmake -S . -B build/direct-ewald-combined-force-soa-sanitize -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBG_ENABLE_HIP=OFF -DBG_ENABLE_HIP_SAFE=OFF -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build build/direct-ewald-combined-force-soa-sanitize --target betelgeuze_engine_direct_ewald_composite_dynamics --parallel 2
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 ctest --test-dir build/direct-ewald-combined-force-soa-sanitize -R '^betelgeuze_engine_direct_ewald_composite_dynamics$' --output-on-failure

  rust-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/direct-ewald-combined-force-soa-cargo
    steps:
      - name: Check out Rust sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false, clean: true, fetch-depth: 1}
      - name: Select frozen Rust components
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.93.0
      - name: Existing Rust regression, docs, and clean packages
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked --package betelgeuze-sys --test layout --test raw_smoke
          cargo test --manifest-path rust/Cargo.toml --locked --package betelgeuze-runtime --lib direct_ewald_composite_dynamics
          cargo test --manifest-path rust/Cargo.toml --locked --package betelgeuze-runtime --test direct_ewald_composite_dynamics
          cargo test --manifest-path rust/Cargo.toml --locked --package betelgeuze-runtime --doc direct_ewald_composite_dynamics
          cargo doc --manifest-path rust/Cargo.toml --locked --no-deps --package betelgeuze-sys --package betelgeuze-runtime
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --package betelgeuze-sys --package betelgeuze-runtime --all-targets -- -D warnings
          cargo package --manifest-path rust/betelgeuze-sys/Cargo.toml --locked --config 'patch.crates-io.betelgeuze-cpu-kernel.path="rust/cpu-kernel"'
          BETELGEUZE_V7_NON_AUTHORITATIVE_PACKAGE_BUILD=1 BETELGEUZE_V7_SOURCE_ROOT="$GITHUB_WORKSPACE" cargo package --manifest-path rust/betelgeuze-runtime/Cargo.toml --locked --config 'patch.crates-io.betelgeuze-sys.path="rust/betelgeuze-sys"' --config 'patch.crates-io.betelgeuze-cpu-kernel.path="rust/cpu-kernel"' --config 'patch.crates-io.betelgeuze-docking-search.path="rust/betelgeuze-docking-search"' --config 'patch.crates-io.betelgeuze-reference-physics.path="rust/reference-physics"' --config 'patch.crates-io.betelgeuze-reference-dynamics.path="rust/reference-dynamics"'

  macos-export-boundary:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out export sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false, clean: true, fetch-depth: 1}
      - name: Select frozen Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup override set 1.93.0
      - name: Exact export regression
        run: |
          cmake -S . -B build/direct-ewald-combined-force-soa-macos -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBG_ENABLE_HIP=OFF -DBG_ENABLE_HIP_SAFE=OFF
          cmake --build build/direct-ewald-combined-force-soa-macos --target betelgeuze_engine --parallel 2
          ctest --test-dir build/direct-ewald-combined-force-soa-macos -R '^betelgeuze_engine_export_allowlist$' --output-on-failure
