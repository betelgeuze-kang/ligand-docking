name: Observe two hosts while running the original 6YSP three-strategy case
'on':
  push:
    branches:
    - codex/pb-observed-integration-20261104
permissions:
  contents: read
  actions: read
concurrency:
  group: posebusters-observed-integration-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  PYTHONNOUSERSITE: '1'
  PYTHONPATH: ${{ github.workspace }}/execution
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  LANG: C.UTF-8
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  CUDA_VISIBLE_DEVICES: ''
  HIP_VISIBLE_DEVICES: ''
  ROCR_VISIBLE_DEVICES: ''
jobs:
  observed_case:
    name: Original three-strategy case (host ${{ matrix.host_slot }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host_slot:
        - 1
        - 2
    env:
      HOST_SLOT: ${{ matrix.host_slot }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/execution
        shell: bash
    steps:
    - name: Checkout diagnostic launcher
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        path: launcher
        persist-credentials: false
        fetch-depth: 1
        filter: blob:none
        clean: true
    - name: Checkout unchanged execution source
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        ref: 8f5fc53ab68b7e6d9801c6a5830e94dbdd914bb4
        path: execution
        persist-credentials: false
        fetch-depth: 1
        filter: blob:none
        clean: true
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.10.22
        check-latest: false
    - name: Download original frozen runtime
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: p0p1-runtime-41697499611-1
        run-id: '41697499611'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        path: ${{ runner.temp }}/pb-replay-runtime
    - name: Install the retained wheels into the original venv path
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/pb-observed-logs/host-$HOST_SLOT"
        python -m venv "$RUNNER_TEMP/p0p1-python"
        "$RUNNER_TEMP/p0p1-python/bin/python" -m tools.redocking_p0_p1_runtime install-evaluator \
          --bundle-root "$RUNNER_TEMP/pb-replay-runtime" \
          2>&1 | tee "$RUNNER_TEMP/pb-observed-logs/host-$HOST_SLOT/runtime-install.log"
    - name: Verify observed integration and workflow boundary regressions
      working-directory: ${{ github.workspace }}/launcher
      env:
        PYTHONPATH: ${{ github.workspace }}/launcher
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/p0p1-python/bin/python" -m pytest -q -p no:cacheprovider --confcutdir=tests/unit \
          tests/unit/test_posebusters_observed_integration.py \
          tests/unit/test_posebusters_observed_workflow.py \
          tests/unit/test_posebusters_qualified_integration.py \
          tests/unit/test_posebusters_cpu_diagnostic.py \
          tests/unit/test_github_workflow_trust_boundaries.py \
          --junitxml="$RUNNER_TEMP/pb-observed-logs/host-$HOST_SLOT/tests.xml" \
          2>&1 | tee "$RUNNER_TEMP/pb-observed-logs/host-$HOST_SLOT/tests.log"
    - name: Download exact admitted original inputs
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: pb-integration-inputs-41798394302-1
        run-id: '41798394302'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        path: ${{ runner.temp }}/pb-integration-prepared
    - name: Run all original strategies and preserve the original scientific verdict
      env:
        LD_LIBRARY_PATH: /opt/hostedtoolcache/Python/3.10.22/x64/lib
      run: |
        set -euo pipefail
        unset ATEN_CPU_CAPABILITY
        "$RUNNER_TEMP/p0p1-python/bin/python" "$GITHUB_WORKSPACE/launcher/tools/run_posebusters_observed_integration.py" run \
          --launcher-root "$GITHUB_WORKSPACE/launcher" \
          --execution-root "$GITHUB_WORKSPACE/execution" \
          --python "$RUNNER_TEMP/p0p1-python/bin/python" \
          --protocol "$GITHUB_WORKSPACE/launcher/config/posebusters_observed_protocol_20261104.json" \
          --protocol-sha256 1cea1d24c3e02b675cadf73c1a998775f6dfdee76b328d3116683d9e12ebf08d \
          --input-root "$RUNNER_TEMP/pb-integration-prepared" \
          --bundle-sha256 35276e0afe5101ca165439af012c6eeaed70a605950446310426b000743d298e \
          --runtime-root "$RUNNER_TEMP/pb-replay-runtime" \
          --output-root "$RUNNER_TEMP/pb-observed-integration/host-$HOST_SLOT" \
          --launcher-workflow-sha "$GITHUB_SHA" \
          --host-slot "$HOST_SLOT" \
          2>&1 | tee "$RUNNER_TEMP/pb-observed-logs/host-$HOST_SLOT/integration.log"
    - name: Preserve infrastructure failure when no observed result was written
      if: always()
      working-directory: ${{ runner.temp }}
      env:
        OBSERVED_JOB_STATUS: ${{ job.status }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/pb-observed-logs/host-$HOST_SLOT"
        if [ ! -f "$RUNNER_TEMP/pb-observed-integration/host-$HOST_SLOT/observed-result.json" ]; then
          printf '{"schema_id":"betelgeuze.posebusters_observed_infrastructure_failure/1.0.0","status":"incomplete","diagnostic_collection_complete":false,"scientific_validation_passed":false,"error_type":"infrastructure_or_prerequisite_failure","host_slot":%s,"workflow_sha":"%s","run_id":"%s","run_attempt":"%s","job_status":"%s"}\n' "$HOST_SLOT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$OBSERVED_JOB_STATUS" > "$RUNNER_TEMP/pb-observed-logs/host-$HOST_SLOT/infrastructure-failure.json"
        fi
    - name: Retain every host result including strict scientific failures
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pb-observed-integration-6YSP_PAL-host-${{ matrix.host_slot }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          ${{ runner.temp }}/pb-observed-integration/host-${{ matrix.host_slot }}
          ${{ runner.temp }}/pb-observed-logs/host-${{ matrix.host_slot }}
        if-no-files-found: error
        retention-days: 30
