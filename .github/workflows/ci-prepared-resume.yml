name: ci-prepared-resume
on:
  pull_request:
    paths:
      - 'betelgeuze_engine/product/prepared_rigid_poses.py'
      - 'betelgeuze_engine/product/prepared_pose_journal.py'
      - 'tests/unit/test_prepared_rigid_poses.py'
      - 'tests/unit/test_prepared_pose_resume.py'
      - 'tools/product/score_prepared_cross_interactions.py'
      - '.github/workflows/ci-prepared-resume.yml'
  push:
    branches: [main]
    paths:
      - 'betelgeuze_engine/product/prepared_rigid_poses.py'
      - 'betelgeuze_engine/product/prepared_pose_journal.py'
      - 'tests/unit/test_prepared_rigid_poses.py'
      - 'tests/unit/test_prepared_pose_resume.py'
      - 'tools/product/score_prepared_cross_interactions.py'
      - '.github/workflows/ci-prepared-resume.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-prepared-resume-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepared-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4 rdkit==2026.3.6 ruff==0.11.13
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check and exercise actual consumers
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > checkout.txt
          git rev-parse 'HEAD^{tree}' >> checkout.txt
          sha256sum betelgeuze_engine/product/prepared_rigid_poses.py betelgeuze_engine/product/prepared_pose_journal.py tests/unit/test_prepared_rigid_poses.py tests/unit/test_prepared_pose_resume.py tools/product/score_prepared_cross_interactions.py > source-sha256.txt
          python -m pip freeze > dependencies.txt
          python -m ruff check --isolated --no-cache betelgeuze_engine/product/prepared_rigid_poses.py betelgeuze_engine/product/prepared_pose_journal.py tests/unit/test_prepared_rigid_poses.py tests/unit/test_prepared_pose_resume.py tools/product/score_prepared_cross_interactions.py
          python -m pytest --rootdir="$PWD" -c /dev/null --noconftest -p no:cacheprovider -W error -vv tests/unit/test_prepared_rigid_poses.py tests/unit/test_prepared_pose_resume.py --junitxml=prepared-resume.xml 2>&1 | tee prepared-resume.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: prepared-resume-${{ github.run_id }}
          path: |
            prepared-resume.xml
            prepared-resume.log
            checkout.txt
            source-sha256.txt
            dependencies.txt
          if-no-files-found: error
          retention-days: 14
