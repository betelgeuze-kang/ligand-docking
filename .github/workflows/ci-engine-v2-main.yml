permissions:
  contents: read

concurrency:
  group: ci-engine-v2-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-merge-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
