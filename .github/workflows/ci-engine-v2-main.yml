        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-v2-main-py${{ matrix.python-version }}-${{ github.run_id }}
          path: engine-v2-main.log
          if-no-files-found: error
          retention-days: 7

      - name: Build isolated Engine v2 wheel
        run: |
          rm -rf dist-engine-v2
          python tools/build_engine_v2_wheel.py --output-dir dist-engine-v2
          test "$(find dist-engine-v2 -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

      - name: Clean install and pip check
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/engine-v2-main-${{ matrix.python-version }}"
          rm -rf "$venv"
          python -m venv "$venv"
          grep -q '^include-system-site-packages = false$' "$venv/pyvenv.cfg"
          "$venv/bin/python" -m pip install pip==25.0.1
          "$venv/bin/python" -m pip install cryptography==46.0.5
          "$venv/bin/python" -m pip install numpy==1.26.4
          "$venv/bin/python" -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$venv/bin/python" -m pip install --no-deps dist-engine-v2/*.whl
          "$venv/bin/python" -m pip check

