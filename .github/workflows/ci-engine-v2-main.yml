          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            build==1.2.2.post1 \
            setuptools==75.8.2 \
            wheel==0.45.1 \
            pytest==8.3.5 \
            PyYAML==6.0.3 \
            cryptography==46.0.5 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundaries
        run: |
          python -m compileall -q \
            betelgeuze_engine_v2 \
            tools/build_engine_v2_wheel.py \
            tools/check_engine_v2_architecture.py \
            tools/build_engine_v2_stage0_development_gate_ledger.py \
            tools/build_engine_v2_source_paired_failure_atlas.py \
            tools/build_engine_v2_receipt_bound_scale_feasibility_audit.py \
            tools/run_engine_v2_public_redocking_300.py \
            tools/verify_engine_v2_public_redocking_stage0.py \
            tools/verify_engine_v2_phase25_cohort_admission.py \
            tools/classify_engine_v2_stage0_full_suite.py \
            tools/reconcile_engine_v2_stage0_full_suites.py \
            tools/audit_engine_v2_ci_authority.py \
            tools/run_engine_v2_standalone_cli_wheel_smoke.py \
            tools/verify_engine_v2_source_paired_clearance_activation.py \
            tools/verify_engine_v2_source_paired_clearance_one_shot_ab.py \
            tools/manage_engine_v2_source_paired_clearance_one_shot_ab.py \
            tools/verify_engine_v2_source_paired_clearance_external_reservation.py \
            tools/verify_engine_v2_source_paired_clearance_external_reservation_operations_decision.py
          python tools/check_engine_v2_architecture.py
          python tools/verify_engine_v2_phase25_cohort_admission.py
          python tools/verify_engine_v2_source_paired_clearance_activation.py \
            --policy config/engine_v2_source_paired_clearance_activation.json
          python tools/verify_engine_v2_source_paired_clearance_one_shot_ab.py \
            --repo-root . \
            --policy config/engine_v2_source_paired_clearance_one_shot_ab.json
          python tools/manage_engine_v2_source_paired_clearance_one_shot_ab.py \
            write-result --help > /tmp/engine-v2-one-shot-write-result-help.txt
          grep -q -- '--full-evidence' /tmp/engine-v2-one-shot-write-result-help.txt
          ! grep -q -- '--baseline-arm' /tmp/engine-v2-one-shot-write-result-help.txt
          ! grep -q -- '--experimental-arm' /tmp/engine-v2-one-shot-write-result-help.txt
          ! grep -q -- '--cross-arm' /tmp/engine-v2-one-shot-write-result-help.txt
          python tools/verify_engine_v2_source_paired_clearance_external_reservation.py \
            > /tmp/engine-v2-external-reservation-status.json
          grep -q '"external_reservation_operational": false' \
            /tmp/engine-v2-external-reservation-status.json
          grep -q '"historical_execution_operational": false' \
            /tmp/engine-v2-external-reservation-status.json
          python tools/manage_engine_v2_source_paired_clearance_one_shot_ab.py \
            status > /tmp/engine-v2-one-shot-combined-status.json
          grep -q '"authorized_if_reserved_now": false' \
            /tmp/engine-v2-one-shot-combined-status.json
          grep -q 'external_reservation_provider_not_operational' \
            /tmp/engine-v2-one-shot-combined-status.json
          python tools/verify_engine_v2_source_paired_clearance_external_reservation_operations_decision.py \
            > /tmp/engine-v2-external-reservation-operations-decision.json
          grep -q '"operations_decision_ready": false' \
            /tmp/engine-v2-external-reservation-operations-decision.json
          grep -q 'external_reservation_provider_not_operational' \
            /tmp/engine-v2-external-reservation-operations-decision.json
          grep -q 'external_reservation_endpoint_not_configured' \
            /tmp/engine-v2-external-reservation-operations-decision.json
          grep -q 'external_reservation_trust_anchor_not_configured' \
            /tmp/engine-v2-external-reservation-operations-decision.json
          grep -q 'historical_execution_operational_authority_false' \
            /tmp/engine-v2-external-reservation-operations-decision.json

      - name: Run complete focused Engine v2 CPU suite
        shell: bash
        run: |
          set +e
          python -m pytest -vv -x \
            tests/unit/test_engine_v2_contracts_molecular.py \
            tests/unit/test_engine_v2_mmcif_syntax.py \
