      - name: Fetch consumed native fixed64 CPU v7 source object
        run: |
          git fetch --no-tags --depth=1 origin 5c1e4791e988d4c75a5111f933feac85236ba821
          test "$(git rev-parse --verify '5c1e4791e988d4c75a5111f933feac85236ba821^{commit}')" = \
            "5c1e4791e988d4c75a5111f933feac85236ba821"
          git fetch --no-tags --depth=1 origin 38c16136a1e2cc126517ff9b50a05f06c5795adb
          test "$(git rev-parse --verify '38c16136a1e2cc126517ff9b50a05f06c5795adb^{commit}')" = \
            "38c16136a1e2cc126517ff9b50a05f06c5795adb"
          git fetch --no-tags --depth=1 origin c15b46e4a93e157826677165642b8788b75f20c7
          test "$(git rev-parse --verify 'c15b46e4a93e157826677165642b8788b75f20c7^{commit}')" = \
            "c15b46e4a93e157826677165642b8788b75f20c7"
          git fetch --no-tags --depth=1 origin 2d03360e782ec9f06518b704ac4fb498fb3448e6
          test "$(git rev-parse --verify '2d03360e782ec9f06518b704ac4fb498fb3448e6^{commit}')" = \
            "2d03360e782ec9f06518b704ac4fb498fb3448e6"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            build==1.2.2.post1 \
            setuptools==75.8.2 \
            wheel==0.45.1 \
            pytest==8.3.5 \
            PyYAML==6.0.3 \
            cryptography==46.0.5 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Verify full-pipeline CPU supervisor v1
        run: >-
          python tools/verify_engine_v2_full_pipeline_cpu_supervisor_v1.py

      - name: Verify packaged full-pipeline CPU supervisor activation v1
        run: |
          chmod 0555 packaging/engine-v2/full-pipeline-cpu-supervisor/1.0.0/engine-v2-full-pipeline-cpu-supervisor-v1
          python tools/verify_engine_v2_full_pipeline_cpu_supervisor_activation_v1.py

