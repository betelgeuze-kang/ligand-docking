name: ci-engine-v2-main

on:
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/**"
      - "packaging/engine-v2/**"
      - "config/independent_engine_v2_capabilities.yaml"
      - "tools/build_engine_v2_wheel.py"
      - "tools/check_engine_v2_architecture.py"
      - "tests/unit/test_engine_v2_*.py"
      - "docs/engine_v2_*.md"
      - "docs/entrypoints.md"
      - "README.md"
      - "README.ko.md"
      - ".github/workflows/ci-engine-v2-external-baseline.yml"
      - ".github/workflows/ci-engine-v2-main.yml"
  pull_request:
    paths:
      - "betelgeuze_engine_v2/**"
      - "packaging/engine-v2/**"
      - "config/independent_engine_v2_capabilities.yaml"
      - "tools/build_engine_v2_wheel.py"
      - "tools/check_engine_v2_architecture.py"
      - "tests/unit/test_engine_v2_*.py"
      - "docs/engine_v2_*.md"
      - "docs/entrypoints.md"
      - "README.md"
      - "README.ko.md"
      - ".github/workflows/ci-engine-v2-external-baseline.yml"
      - ".github/workflows/ci-engine-v2-main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-merge-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out canonical Engine v2 surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          sparse-checkout: |
            betelgeuze_engine_v2
            packaging/engine-v2
            core/__init__.py
            core/ai_correction.py
            core/config.py
            core/definitions.py
            core/sim_param_schema.py
            train/__init__.py
            train/runtime_inputs.py
            train/checkpoint_contracts.py
            config/settings.yaml
            config/independent_engine_v2_capabilities.yaml
            tools/build_engine_v2_wheel.py
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_contracts_molecular.py
            tests/unit/test_engine_v2_mmcif_syntax.py
            tests/unit/test_engine_v2_sparse_geometry_features.py
            tests/unit/test_engine_v2_ai_core.py
            tests/unit/test_engine_v2_periodic_energy.py
            tests/unit/test_engine_v2_orchestrator_contract.py
            tests/unit/test_engine_v2_runtime_checkpoint_contracts.py
            tests/unit/test_engine_v2_packaging_guards.py
            tests/unit/test_engine_v2_bounded_scaffolds.py
            tests/unit/test_engine_v2_post_merge_state.py
            tests/unit/test_engine_v2_input_identity.py
            tests/unit/test_engine_v2_docking_semantics.py
            tests/unit/test_engine_v2_benchmark_contracts.py
            tests/unit/test_engine_v2_reference_physics.py
            tests/unit/test_engine_v2_external_baseline.py
            docs/engine_v2_pr_overlap_matrix.md
            docs/engine_v2_status.md
            docs/engine_v2_public_api.md
            docs/entrypoints.md
            README.md
            README.ko.md
            .github/workflows/ci-engine-v2-external-baseline.yml
            .github/workflows/ci-engine-v2-main.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            build==1.2.2.post1 \
            setuptools==75.8.2 \
            wheel==0.45.1 \
            pytest==8.3.5 \
            PyYAML==6.0.3 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundaries
        run: |
          python -m compileall -q betelgeuze_engine_v2 tools/build_engine_v2_wheel.py tools/check_engine_v2_architecture.py
          python tools/check_engine_v2_architecture.py

      - name: Run complete focused Engine v2 CPU suite
        shell: bash
        run: |
          set +e
          python -m pytest -vv -x \
            tests/unit/test_engine_v2_contracts_molecular.py \
            tests/unit/test_engine_v2_mmcif_syntax.py \
            tests/unit/test_engine_v2_sparse_geometry_features.py \
            tests/unit/test_engine_v2_ai_core.py \
            tests/unit/test_engine_v2_periodic_energy.py \
            tests/unit/test_engine_v2_orchestrator_contract.py \
            tests/unit/test_engine_v2_runtime_checkpoint_contracts.py \
            tests/unit/test_engine_v2_packaging_guards.py \
            tests/unit/test_engine_v2_bounded_scaffolds.py \
            tests/unit/test_engine_v2_post_merge_state.py \
            tests/unit/test_engine_v2_input_identity.py \
            tests/unit/test_engine_v2_docking_semantics.py \
            tests/unit/test_engine_v2_benchmark_contracts.py \
            tests/unit/test_engine_v2_reference_physics.py \
            tests/unit/test_engine_v2_external_baseline.py > engine-v2-main.log 2>&1
          status=$?
          cat engine-v2-main.log
          exit "$status"

      - name: Upload canonical suite diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-v2-main-py${{ matrix.python-version }}-${{ github.run_id }}
          path: engine-v2-main.log
          if-no-files-found: error
          retention-days: 7

      - name: Build isolated Engine v2 wheel
        run: |
          rm -rf dist-engine-v2
          python tools/build_engine_v2_wheel.py --output-dir dist-engine-v2
          test "$(find dist-engine-v2 -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

      - name: Clean install and pip check
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/engine-v2-main-${{ matrix.python-version }}"
          rm -rf "$venv"
          python -m venv "$venv"
          grep -q '^include-system-site-packages = false$' "$venv/pyvenv.cfg"
          "$venv/bin/python" -m pip install pip==25.0.1
          "$venv/bin/python" -m pip install numpy==1.26.4
          "$venv/bin/python" -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$venv/bin/python" -m pip install --no-deps dist-engine-v2/*.whl
          "$venv/bin/python" -m pip check

      - name: Import outside checkout
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/engine-v2-main-${{ matrix.python-version }}"
          outside="/tmp/engine-v2-main-outside-${{ matrix.python-version }}"
          rm -rf "$outside"
          mkdir -p "$outside"
          cd "$outside"
          "$venv/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import importlib.util
          import betelgeuze_engine_v2 as engine
          from betelgeuze_engine_v2.benchmark import (
              ExternalBaselineEngine,
              MetricDefinition,
              MetricDirection,
          )
          from betelgeuze_engine_v2.capabilities import capability_snapshot
          from betelgeuze_engine_v2.docking import DockingProblemIdentity
          from betelgeuze_engine_v2.molecular import CANONICAL_SYSTEM_JSON_SCHEMA_ID
          from betelgeuze_engine_v2.molecular.mmcif_syntax import parse_cif_block
          from betelgeuze_engine_v2.physics import (
              AtomNonbondedParameter,
              ReferenceForceFieldParameters,
          )

          assert metadata.version("betelgeuze-engine-v2") == engine.DISTRIBUTION_VERSION
          assert engine.__version__ == engine.ENGINE_API_VERSION
          assert importlib.util.find_spec("api") is None
          assert importlib.util.find_spec("core") is None
          assert importlib.util.find_spec("train") is None
          assert capability_snapshot()["implementation_stage"] == "v2_g_bounded_scientific_scaffolds"
          assert DockingProblemIdentity.unbound().fingerprint_sha256
          assert ExternalBaselineEngine(
              engine_id="vina",
              engine_version="1.2.5",
              executable_sha256="a" * 64,
          ).fingerprint_sha256
          assert MetricDefinition(
              metric_id="import_metric",
              unit=None,
              direction=MetricDirection.MINIMIZE,
              bootstrap_samples=0,
          ).metric_id == "import_metric"
          assert ReferenceForceFieldParameters(
              parameter_set_id="import-only",
              parameter_set_version="1",
              topology_sha256="0" * 64,
              atom_parameters=(AtomNonbondedParameter(0, 1.0, 0.0, 0.0),),
              cutoff_angstrom=2.0,
              switch_start_angstrom=1.0,
          ).scientifically_validated is False
          assert CANONICAL_SYSTEM_JSON_SCHEMA_ID.endswith("/1.0.0")
          assert parse_cif_block("data_child\n_entry.id syntax\n").name == "child"
          PY
