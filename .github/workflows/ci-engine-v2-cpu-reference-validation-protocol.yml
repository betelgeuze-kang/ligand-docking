permissions:
  contents: read

concurrency:
  group: ci-engine-v2-cpu-reference-validation-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-reference-validation-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            packaging/engine-v2/pyproject.toml
            config/independent_engine_v2_capabilities.yaml
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_cpu_reference_validation_protocol.py
            tests/unit/test_engine_v2_reference_minimization.py
            tests/unit/test_engine_v2_reference_nve.py
