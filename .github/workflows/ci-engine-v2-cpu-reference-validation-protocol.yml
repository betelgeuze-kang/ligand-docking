name: ci-engine-v2-cpu-reference-validation-protocol

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/physics/**"
      - "betelgeuze_engine_v2/capabilities.py"
      - "packaging/engine-v2/pyproject.toml"
      - "config/independent_engine_v2_capabilities.yaml"
      - "tests/unit/test_engine_v2_cpu_reference_validation_protocol.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_materializer.py"
      - "tests/unit/test_engine_v2_reference_minimization_independent_oracle.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_artifact_binding.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_review.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_receipts.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_authorization.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_nonce_reservation.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_run_start.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_runner.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_protocol.py"
      - "tests/unit/test_engine_v2_reference_validation_artifacts.py"
      - "tests/unit/test_engine_v2_reference_validation_review.py"
      - "tests/unit/test_engine_v2_reference_validation_authorization.py"
      - "tests/unit/test_engine_v2_reference_validation_receipts.py"
      - "tests/unit/test_engine_v2_reference_validation_nonce_reservation.py"
      - "tests/unit/test_engine_v2_reference_validation_run_start.py"
      - "tests/unit/test_engine_v2_reference_validation_runner.py"
      - "tests/unit/test_engine_v2_reference_validation_result_writer.py"
      - "tests/unit/test_engine_v2_reference_parameter_applicability.py"
      - "tests/unit/test_engine_v2_reference_physics.py"
      - "tests/unit/test_engine_v2_commercial_roadmap.py"
      - "docs/engine_v2_status.md"
      - "docs/engine_v2_public_api.md"
      - "docs/independent_engine_v2_commercial_roadmap.ko.md"
      - "docs/roadmaps/engine-v2-scientific-evidence-roadmap.md"
      - "README.md"
      - "README.ko.md"
      - "CHANGELOG.md"
      - ".github/workflows/ci-engine-v2-cpu-reference-validation-protocol.yml"
      - ".github/workflows/ci-engine-v2-main.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/physics/**"
      - "betelgeuze_engine_v2/capabilities.py"
      - "packaging/engine-v2/pyproject.toml"
      - "config/independent_engine_v2_capabilities.yaml"
      - "tests/unit/test_engine_v2_cpu_reference_validation_protocol.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_materializer.py"
      - "tests/unit/test_engine_v2_reference_minimization_independent_oracle.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_artifact_binding.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_review.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_receipts.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_authorization.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_nonce_reservation.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_run_start.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_runner.py"
      - "tests/unit/test_engine_v2_reference_minimization_validation_protocol.py"
      - "tests/unit/test_engine_v2_reference_validation_artifacts.py"
      - "tests/unit/test_engine_v2_reference_validation_review.py"
      - "tests/unit/test_engine_v2_reference_validation_authorization.py"
      - "tests/unit/test_engine_v2_reference_validation_receipts.py"
      - "tests/unit/test_engine_v2_reference_validation_nonce_reservation.py"
      - "tests/unit/test_engine_v2_reference_validation_run_start.py"
      - "tests/unit/test_engine_v2_reference_validation_runner.py"
      - "tests/unit/test_engine_v2_reference_validation_result_writer.py"
      - "tests/unit/test_engine_v2_reference_parameter_applicability.py"
      - "tests/unit/test_engine_v2_reference_physics.py"
      - "tests/unit/test_engine_v2_commercial_roadmap.py"
      - "docs/engine_v2_status.md"
      - "docs/engine_v2_public_api.md"
      - "docs/independent_engine_v2_commercial_roadmap.ko.md"
      - "docs/roadmaps/engine-v2-scientific-evidence-roadmap.md"
      - "README.md"
      - "README.ko.md"
      - "CHANGELOG.md"
      - ".github/workflows/ci-engine-v2-cpu-reference-validation-protocol.yml"
      - ".github/workflows/ci-engine-v2-main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-cpu-reference-validation-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-reference-validation-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            packaging/engine-v2/pyproject.toml
            config/independent_engine_v2_capabilities.yaml
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_cpu_reference_validation_protocol.py
            tests/unit/test_engine_v2_reference_minimization_validation_materializer.py
            tests/unit/test_engine_v2_reference_minimization_independent_oracle.py
            tests/unit/test_engine_v2_reference_minimization_validation_artifact_binding.py
            tests/unit/test_engine_v2_reference_minimization_validation_review.py
            tests/unit/test_engine_v2_reference_minimization_validation_receipts.py
            tests/unit/test_engine_v2_reference_minimization_validation_authorization.py
            tests/unit/test_engine_v2_reference_minimization_validation_nonce_reservation.py
            tests/unit/test_engine_v2_reference_minimization_validation_run_start.py
            tests/unit/test_engine_v2_reference_minimization_validation_runner.py
            tests/unit/test_engine_v2_reference_minimization_validation_protocol.py
            tests/unit/test_engine_v2_reference_validation_artifacts.py
            tests/unit/test_engine_v2_reference_validation_review.py
            tests/unit/test_engine_v2_reference_validation_authorization.py
            tests/unit/test_engine_v2_reference_validation_receipts.py
            tests/unit/test_engine_v2_reference_validation_nonce_reservation.py
            tests/unit/test_engine_v2_reference_validation_run_start.py
            tests/unit/test_engine_v2_reference_validation_runner.py
            tests/unit/test_engine_v2_reference_validation_result_writer.py
            tests/unit/test_engine_v2_reference_parameter_applicability.py
            tests/unit/test_engine_v2_reference_physics.py
            tests/unit/test_engine_v2_commercial_roadmap.py
            docs/engine_v2_status.md
            docs/engine_v2_public_api.md
            docs/independent_engine_v2_commercial_roadmap.ko.md
            docs/roadmaps/engine-v2-scientific-evidence-roadmap.md
            README.md
            README.ko.md
            CHANGELOG.md
            .github/workflows/ci-engine-v2-cpu-reference-validation-protocol.yml
            .github/workflows/ci-engine-v2-main.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            pytest==8.3.5 \
            PyYAML==6.0.3 \
            ruff==0.12.4 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        run: |
          python -m compileall -q betelgeuze_engine_v2
          python tools/check_engine_v2_architecture.py
          ruff check \
            betelgeuze_engine_v2/physics/reference_validation_protocol.py \
            betelgeuze_engine_v2/physics/reference_minimization_validation_materializer.py \
            betelgeuze_engine_v2/physics/reference_minimization_independent_oracle.py \
            betelgeuze_engine_v2/physics/reference_minimization_validation_artifact_binding.py \
            betelgeuze_engine_v2/physics/reference_minimization_validation_review.py \
            betelgeuze_engine_v2/physics/reference_minimization_validation_receipts.py \
            betelgeuze_engine_v2/physics/reference_minimization_validation_authorization.py \
            betelgeuze_engine_v2/physics/reference_minimization_validation_nonce_reservation.py \
            betelgeuze_engine_v2/physics/reference_minimization_validation_run_start.py \
            betelgeuze_engine_v2/physics/reference_minimization_validation_protocol.py \
            betelgeuze_engine_v2/physics/reference_validation_materializer.py \
            betelgeuze_engine_v2/physics/reference_validation_oracle.py \
            betelgeuze_engine_v2/physics/reference_validation_artifact_binding.py \
            betelgeuze_engine_v2/physics/reference_validation_authorization.py \
            betelgeuze_engine_v2/physics/reference_validation_nonce_reservation.py \
            betelgeuze_engine_v2/physics/reference_validation_run_start.py \
            betelgeuze_engine_v2/physics/reference_validation_runner.py \
            betelgeuze_engine_v2/physics/reference_validation_result_writer.py \
            betelgeuze_engine_v2/physics/reference_validation_receipts.py \
            betelgeuze_engine_v2/physics/__init__.py \
            betelgeuze_engine_v2/capabilities.py \
            tests/unit/test_engine_v2_cpu_reference_validation_protocol.py \
            tests/unit/test_engine_v2_reference_minimization_validation_materializer.py \
            tests/unit/test_engine_v2_reference_minimization_independent_oracle.py \
            tests/unit/test_engine_v2_reference_minimization_validation_artifact_binding.py \
            tests/unit/test_engine_v2_reference_minimization_validation_review.py \
            tests/unit/test_engine_v2_reference_minimization_validation_receipts.py \
            tests/unit/test_engine_v2_reference_minimization_validation_authorization.py \
            tests/unit/test_engine_v2_reference_minimization_validation_nonce_reservation.py \
            tests/unit/test_engine_v2_reference_minimization_validation_run_start.py \
            tests/unit/test_engine_v2_reference_minimization_validation_runner.py \
            tests/unit/test_engine_v2_reference_minimization_validation_protocol.py \
            tests/unit/test_engine_v2_reference_validation_artifacts.py \
            tests/unit/test_engine_v2_reference_validation_review.py \
            tests/unit/test_engine_v2_reference_validation_authorization.py \
            tests/unit/test_engine_v2_reference_validation_receipts.py \
            tests/unit/test_engine_v2_reference_validation_nonce_reservation.py \
            tests/unit/test_engine_v2_reference_validation_run_start.py \
            tests/unit/test_engine_v2_reference_validation_runner.py \
            tests/unit/test_engine_v2_reference_validation_result_writer.py \
            --config packaging/engine-v2/pyproject.toml

      - name: Verify frozen protocol, H5 dependency, and non-promotion
        run: |
          python -m pytest -q \
            tests/unit/test_engine_v2_cpu_reference_validation_protocol.py \
            tests/unit/test_engine_v2_reference_minimization_validation_materializer.py \
            tests/unit/test_engine_v2_reference_minimization_independent_oracle.py \
            tests/unit/test_engine_v2_reference_minimization_validation_artifact_binding.py \
            tests/unit/test_engine_v2_reference_minimization_validation_review.py \
            tests/unit/test_engine_v2_reference_minimization_validation_receipts.py \
            tests/unit/test_engine_v2_reference_minimization_validation_authorization.py \
            tests/unit/test_engine_v2_reference_minimization_validation_nonce_reservation.py \
            tests/unit/test_engine_v2_reference_minimization_validation_run_start.py \
            tests/unit/test_engine_v2_reference_minimization_validation_runner.py \
            tests/unit/test_engine_v2_reference_minimization_validation_protocol.py \
            tests/unit/test_engine_v2_reference_validation_artifacts.py \
            tests/unit/test_engine_v2_reference_validation_review.py \
            tests/unit/test_engine_v2_reference_validation_authorization.py \
            tests/unit/test_engine_v2_reference_validation_receipts.py \
            tests/unit/test_engine_v2_reference_validation_nonce_reservation.py \
            tests/unit/test_engine_v2_reference_validation_run_start.py \
            tests/unit/test_engine_v2_reference_validation_runner.py \
            tests/unit/test_engine_v2_reference_validation_result_writer.py \
            tests/unit/test_engine_v2_reference_parameter_applicability.py \
            tests/unit/test_engine_v2_reference_physics.py \
            tests/unit/test_engine_v2_commercial_roadmap.py

      - name: Verify capability snapshot and closed authorization gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          from betelgeuze_engine_v2.capabilities import capability_snapshot
          from betelgeuze_engine_v2.physics import (
              FROZEN_REFERENCE_MINIMIZATION_VALIDATION_AUTHORIZATION_CONTRACT_SHA256,
              FROZEN_REFERENCE_MINIMIZATION_VALIDATION_NONCE_RESERVATION_CONTRACT_SHA256,
              FROZEN_REFERENCE_MINIMIZATION_VALIDATION_RUN_START_CONTRACT_SHA256,
              FROZEN_REFERENCE_MINIMIZATION_VALIDATION_RUNNER_CONTRACT_SHA256,
              FROZEN_REFERENCE_VALIDATION_ARTIFACT_BINDING_SHA256,
              FROZEN_REFERENCE_VALIDATION_REVIEW_CONTRACT_SHA256,
              FROZEN_REFERENCE_VALIDATION_AUTHORIZATION_CONTRACT_SHA256,
              FROZEN_REFERENCE_VALIDATION_EXECUTION_ENVIRONMENT_CONTRACT_SHA256,
              FROZEN_REFERENCE_VALIDATION_NONCE_RESERVATION_CONTRACT_SHA256,
              FROZEN_REFERENCE_VALIDATION_RESULT_RECEIPT_CONTRACT_SHA256,
              FROZEN_REFERENCE_VALIDATION_RUN_START_CONTRACT_SHA256,
              FROZEN_REFERENCE_VALIDATION_RUNNER_CONTRACT_SHA256,
              FROZEN_REFERENCE_VALIDATION_RESULT_WRITER_CONTRACT_SHA256,
              reference_validation_authorization_contract_decision,
              reference_validation_authorization_contract_document,
              reference_validation_execution_environment_contract_document,
              reference_validation_execution_readiness_decision,
              reference_validation_nonce_reservation_contract_decision,
              reference_validation_nonce_reservation_contract_document,
              reference_validation_result_receipt_contract_document,
              reference_validation_run_start_contract_decision,
              reference_validation_run_start_contract_document,
              reference_validation_runner_contract_decision,
              reference_validation_runner_contract_document,
              reference_validation_result_writer_contract_decision,
              reference_validation_result_writer_contract_document,
              reference_validation_artifact_authorization_decision,
              reference_validation_artifact_binding_document,
              reference_validation_review_contract_authorization_decision,
              reference_validation_review_contract_document,
              reference_minimization_validation_authorization_contract_decision,
              reference_minimization_validation_authorization_contract_document,
              reference_minimization_validation_nonce_reservation_contract_decision,
              reference_minimization_validation_nonce_reservation_contract_document,
              reference_minimization_validation_run_start_contract_decision,
              reference_minimization_validation_run_start_contract_document,
              reference_minimization_validation_runner_contract_decision,
              reference_minimization_validation_runner_contract_document,
          )

          loaded = yaml.safe_load(
              Path("config/independent_engine_v2_capabilities.yaml").read_text(
                  encoding="utf-8"
              )
          )
          assert loaded == capability_snapshot()
          assert len(loaded["capabilities"]) == 44
          assert loaded["implementation_stage"] == "v2_ai_minimization_validation_runner"
          minimization_authorization = reference_minimization_validation_authorization_contract_document()
          assert minimization_authorization["contract_sha256"] == (
              FROZEN_REFERENCE_MINIMIZATION_VALIDATION_AUTHORIZATION_CONTRACT_SHA256
          )
          minimization_authorization_decision = (
              reference_minimization_validation_authorization_contract_decision()
          )
          assert minimization_authorization_decision["authorization_receipt_present"] is False
          assert minimization_authorization_decision["authorization_nonce_reserved"] is False
          assert minimization_authorization_decision["validation_execution_authorized"] is False
          minimization_reservation = reference_minimization_validation_nonce_reservation_contract_document()
          assert minimization_reservation["contract_sha256"] == (
              FROZEN_REFERENCE_MINIMIZATION_VALIDATION_NONCE_RESERVATION_CONTRACT_SHA256
          )
          minimization_reservation_decision = (
              reference_minimization_validation_nonce_reservation_contract_decision()
          )
          assert minimization_reservation_decision["atomic_nonce_reservation_primitive_implemented"] is True
          assert minimization_reservation_decision["authorization_nonce_reserved"] is False
          assert minimization_reservation_decision["validation_execution_authorized"] is False
          minimization_run_start = reference_minimization_validation_run_start_contract_document()
          assert minimization_run_start["contract_sha256"] == (
              FROZEN_REFERENCE_MINIMIZATION_VALIDATION_RUN_START_CONTRACT_SHA256
          )
          minimization_run_start_decision = reference_minimization_validation_run_start_contract_decision()
          assert minimization_run_start_decision["run_start_environment_primitive_implemented"] is True
          assert minimization_run_start_decision["production_environment_receipt_present"] is False
          assert minimization_run_start_decision["validation_execution_authorized"] is False
          minimization_runner = reference_minimization_validation_runner_contract_document()
          assert minimization_runner["contract_sha256"] == (
              FROZEN_REFERENCE_MINIMIZATION_VALIDATION_RUNNER_CONTRACT_SHA256
          )
          minimization_runner_decision = reference_minimization_validation_runner_contract_decision()
          assert minimization_runner_decision["bounded_validation_runner_implemented"] is True
          assert minimization_runner_decision["result_receipt_writer_implemented"] is False
          assert minimization_runner_decision["claim_safe"] is False
          binding = reference_validation_artifact_binding_document()
          assert binding["binding_sha256"] == FROZEN_REFERENCE_VALIDATION_ARTIFACT_BINDING_SHA256
          decision = reference_validation_artifact_authorization_decision(binding)
          assert decision.validation_execution_authorized is False
          assert decision.parameter_fitting_proposal_authorized is False
          assert decision.parameter_fitting_authorized is False
          review_contract = reference_validation_review_contract_document()
          assert (
              review_contract["contract_sha256"]
              == FROZEN_REFERENCE_VALIDATION_REVIEW_CONTRACT_SHA256
          )
          review_decision = reference_validation_review_contract_authorization_decision()
          assert review_decision["review_attestation_present"] is False
          assert review_decision["validation_execution_authorized"] is False
          assert review_decision["parameter_fitting_authorized"] is False
          authorization_contract = reference_validation_authorization_contract_document()
          assert (
              authorization_contract["contract_sha256"]
              == FROZEN_REFERENCE_VALIDATION_AUTHORIZATION_CONTRACT_SHA256
          )
          authorization_decision = reference_validation_authorization_contract_decision()
          assert authorization_decision["authorization_receipt_present"] is False
          assert authorization_decision["authorization_nonce_reserved"] is False
          assert authorization_decision["validation_execution_authorized"] is False
          reservation_contract = reference_validation_nonce_reservation_contract_document()
          assert reservation_contract["contract_sha256"] == (
              FROZEN_REFERENCE_VALIDATION_NONCE_RESERVATION_CONTRACT_SHA256
          )
          reservation_decision = reference_validation_nonce_reservation_contract_decision()
          assert reservation_decision["atomic_nonce_reservation_primitive_implemented"] is True
          assert reservation_decision["authorization_nonce_reserved"] is False
          assert reservation_decision["validation_execution_authorized"] is False
          assert reservation_decision["validation_results_collected"] is False
          run_start_contract = reference_validation_run_start_contract_document()
          assert run_start_contract["contract_sha256"] == (
              FROZEN_REFERENCE_VALIDATION_RUN_START_CONTRACT_SHA256
          )
          run_start_decision = reference_validation_run_start_contract_decision()
          assert run_start_decision["run_start_environment_primitive_implemented"] is True
          assert run_start_decision["production_environment_receipt_present"] is False
          assert run_start_decision["validation_runner_implemented"] is False
          assert run_start_decision["validation_execution_authorized"] is False
          runner_contract = reference_validation_runner_contract_document()
          assert runner_contract["contract_sha256"] == (
              FROZEN_REFERENCE_VALIDATION_RUNNER_CONTRACT_SHA256
          )
          runner_decision = reference_validation_runner_contract_decision()
          assert runner_decision["bounded_validation_runner_implemented"] is True
          assert runner_decision["production_runner_start_consumed"] is False
          assert runner_decision["production_validation_execution_authorized"] is False
          assert runner_decision["production_validation_results_collected"] is False
          assert runner_decision["result_receipt_writer_implemented"] is False
          writer_contract = reference_validation_result_writer_contract_document()
          assert writer_contract["contract_sha256"] == (
              FROZEN_REFERENCE_VALIDATION_RESULT_WRITER_CONTRACT_SHA256
          )
          writer_decision = reference_validation_result_writer_contract_decision()
          assert writer_decision["result_receipt_writer_implemented"] is True
          assert writer_decision["production_result_receipt_present"] is False
          assert writer_decision["independent_result_review_complete"] is False
          assert writer_decision["claim_safe"] is False
          environment_contract = reference_validation_execution_environment_contract_document()
          assert environment_contract["contract_sha256"] == (
              FROZEN_REFERENCE_VALIDATION_EXECUTION_ENVIRONMENT_CONTRACT_SHA256
          )
          result_contract = reference_validation_result_receipt_contract_document()
          assert result_contract["contract_sha256"] == (
              FROZEN_REFERENCE_VALIDATION_RESULT_RECEIPT_CONTRACT_SHA256
          )
          readiness = reference_validation_execution_readiness_decision()
          assert readiness["receipt_contracts_frozen"] is True
          assert readiness["execution_environment_receipt_present"] is False
          assert readiness["validation_runner_implemented"] is False
          assert readiness["result_receipt_writer_implemented"] is False
          assert readiness["validation_execution_authorized"] is False
          assert readiness["validation_results_collected"] is False
          PY
