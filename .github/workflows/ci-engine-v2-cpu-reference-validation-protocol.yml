            .github/workflows/ci-engine-v2-cpu-reference-validation-protocol.yml
            .github/workflows/ci-engine-v2-main.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install \
            pytest==8.3.5 \
            PyYAML==6.0.3 \
            ruff==0.12.4 \
            cryptography==46.0.5 \
            numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        run: |
          python -m compileall -q betelgeuze_engine_v2
          python tools/check_engine_v2_architecture.py
          ruff check \
            betelgeuze_engine_v2/physics/reference_validation_protocol.py \
            betelgeuze_engine_v2/physics/reference_minimization.py \
