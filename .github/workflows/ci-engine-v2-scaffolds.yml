name: ci-engine-v2-scaffolds

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/io/**"
      - "betelgeuze_engine_v2/physics/**"
      - "betelgeuze_engine_v2/docking/**"
      - "betelgeuze_engine_v2/benchmark/**"
      - "tests/unit/test_engine_v2_bounded_scaffolds.py"
      - ".github/workflows/ci-engine-v2-scaffolds.yml"
  push:
    branches:
      - "agent/v2-g-bounded-scientific-scaffolds"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-scaffolds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-scaffolds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Check out bounded Engine v2 surface
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            betelgeuze_engine_v2
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_bounded_scaffolds.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        run: |
          python -m compileall -q betelgeuze_engine_v2
          python tools/check_engine_v2_architecture.py

      - name: Run strict parser registry docking and benchmark contracts
        shell: bash
        run: |
          set +e
          python -m pytest -vv -x tests/unit/test_engine_v2_bounded_scaffolds.py > bounded-scaffolds.log 2>&1
          status=$?
          cat bounded-scaffolds.log
          exit "$status"

      - name: Upload bounded scaffold diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-scaffolds-py${{ matrix.python-version }}-${{ github.run_id }}
          path: bounded-scaffolds.log
          if-no-files-found: error
          retention-days: 7

      - name: Record non-promotion boundary
        run: |
          echo "Parsers are bounded ingest only; chemistry is not validated."
          echo "Physics registry providers and docking scorers are synthetic contract surfaces."
          echo "Benchmark reports remain claim_safe=false until public evidence is supplied."
