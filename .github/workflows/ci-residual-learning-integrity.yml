name: ci-residual-learning-integrity

on:
  pull_request:
    paths:
      - "tools/train_residual_production_score_model.py"
      - "tools/builder_json_utils.py"
      - "tools/product/builder_json_utils.py"
      - "tools/product/stage2_skip_router.py"
      - "tests/unit/test_train_residual_production_score_model.py"
      - ".github/workflows/ci-residual-learning-integrity.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/train_residual_production_score_model.py"
      - "tools/builder_json_utils.py"
      - "tools/product/builder_json_utils.py"
      - "tools/product/stage2_skip_router.py"
      - "tests/unit/test_train_residual_production_score_model.py"
      - ".github/workflows/ci-residual-learning-integrity.yml"

permissions:
  contents: read

concurrency:
  group: residual-learning-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  residual-learning-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out exact source on ephemeral hosted runner
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install bounded CPU test dependencies
        run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4 scikit-learn==1.6.1
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run real trainer, checkpoint, reference metric and router tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --confcutdir=tests/unit -W error -vv \
            tests/unit/test_train_residual_production_score_model.py \
            2>&1 | tee residual-learning-integrity.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: residual-learning-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: residual-learning-integrity.log
          if-no-files-found: warn
          retention-days: 7
