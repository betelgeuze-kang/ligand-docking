name: temporary-pr252-source-export

on:
  push:
    branches:
      - codex/product-supply-chain-guardrails

permissions:
  contents: read

jobs:
  export-reviewed-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Package bounded source set
        run: |
          tar -czf pr252-source-export.tgz \
            tools/product/build_product_image_smoke_preflight.py \
            tests/unit/test_build_product_image_smoke_preflight.py \
            tools/product/build_pr38_ci_runner_hygiene_child_pr_gate.py \
            tests/unit/test_build_pr38_ci_runner_hygiene_child_pr_gate.py \
            tests/unit/test_product_runtime_reality.py \
            tests/unit/test_api_worker_deploy_artifacts.py

      - name: Upload bounded source set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr252-source-export-${{ github.sha }}
          path: pr252-source-export.tgz
          if-no-files-found: error
          retention-days: 1
