name: apply-external-baseline-action-identity

on:
  pull_request:
    paths:
      - ".github/workflows/apply-external-baseline-action-identity.yml"

permissions:
  contents: write

concurrency:
  group: apply-external-baseline-action-identity
  cancel-in-progress: false

jobs:
  apply-migration:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/external-baseline-action-identity-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/external-baseline-action-identity-v2
          fetch-depth: 0
          persist-credentials: true
          clean: true
          show-progress: false

      - name: Migrate the exact workflow identity and its contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/ci-engine-v2-external-baseline.yml')
          test_path = Path('tests/unit/test_engine_v2_external_baseline.py')
          temporary_workflow = Path('.github/workflows/apply-external-baseline-action-identity.yml')

          old_checkout = 'actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5'
          new_checkout = 'actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0'
          old_setup = 'actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065'
          new_setup = 'actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1'

          workflow = workflow_path.read_text(encoding='utf-8')
          if workflow.count(old_checkout) != 1:
              raise SystemExit('external-baseline checkout identity count drifted')
          if workflow.count(old_setup) != 1:
              raise SystemExit('external-baseline setup-python identity count drifted')
          workflow = workflow.replace(
              old_checkout + ' # v4.3.1',
              new_checkout + ' # v7.0.0',
          ).replace(
              old_setup + ' # v5.6.0',
              new_setup + ' # v6.3.0',
          )
          if old_checkout in workflow or old_setup in workflow:
              raise SystemExit('old external-baseline Action identity remains')
          workflow_path.write_text(workflow, encoding='utf-8')

          test_source = test_path.read_text(encoding='utf-8')
          if test_source.count(old_checkout) != 1:
              raise SystemExit('checkout assertion count drifted')
          if test_source.count(old_setup) != 1:
              raise SystemExit('setup-python assertion count drifted')
          test_source = test_source.replace(old_checkout, new_checkout).replace(
              old_setup,
              new_setup,
          )
          test_path.write_text(test_source, encoding='utf-8')

          temporary_workflow.unlink()
          PY

          python -m py_compile tests/unit/test_engine_v2_external_baseline.py
          grep -F "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0" \
            .github/workflows/ci-engine-v2-external-baseline.yml
          grep -F "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0" \
            .github/workflows/ci-engine-v2-external-baseline.yml
          git diff --check

      - name: Commit the focused identity migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/ci-engine-v2-external-baseline.yml \
            tests/unit/test_engine_v2_external_baseline.py \
            .github/workflows/apply-external-baseline-action-identity.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "ci: migrate external-baseline Action identity to hosted v7/v6"
          git push origin HEAD:codex/external-baseline-action-identity-v2
