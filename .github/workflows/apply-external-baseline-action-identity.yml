name: apply-external-baseline-action-identity

on:
  pull_request:
    paths:
      - ".github/workflows/apply-external-baseline-action-identity.yml"

permissions:
  contents: write

concurrency:
  group: apply-external-baseline-action-identity
  cancel-in-progress: false

jobs:
  apply-test-migration:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/external-baseline-action-identity-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/external-baseline-action-identity-v2
          fetch-depth: 0
          persist-credentials: true
          clean: true
          show-progress: false

      - name: Migrate the exact workflow identity assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/unit/test_engine_v2_external_baseline.py')
          old_checkout = 'actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5'
          new_checkout = 'actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0'
          old_setup = 'actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065'
          new_setup = 'actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1'

          source = test_path.read_text(encoding='utf-8')
          if source.count(old_checkout) != 1:
              raise SystemExit('checkout assertion count drifted')
          if source.count(old_setup) != 1:
              raise SystemExit('setup-python assertion count drifted')
          source = source.replace(old_checkout, new_checkout).replace(old_setup, new_setup)
          if old_checkout in source or old_setup in source:
              raise SystemExit('old workflow identity assertion remains')
          test_path.write_text(source, encoding='utf-8')
          PY

          python -m py_compile tests/unit/test_engine_v2_external_baseline.py
          git diff --check

      - name: Commit the contract assertion only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/unit/test_engine_v2_external_baseline.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m "test(v2): bind external-baseline CI to hosted v7/v6"
          git push origin HEAD:codex/external-baseline-action-identity-v2
