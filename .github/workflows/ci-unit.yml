name: ci-unit

on:
  push:
    paths:
      - "betelgeuze_product/**"
      - "tools/product/**"
      - "tests/unit/test_p0_*.py"
      - "tests/unit/test_p1_*.py"
      - "tests/unit/test_product_docking_response_contract.py"
      - ".github/workflows/ci-unit.yml"
  pull_request:
    paths:
      - "betelgeuze_product/**"
      - "tools/product/**"
      - "tests/unit/test_p0_*.py"
      - "tests/unit/test_p1_*.py"
      - "tests/unit/test_product_docking_response_contract.py"
      - ".github/workflows/ci-unit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install unit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run P0/P1 unit contracts
        run: |
          python -m pytest -q \
            tests/unit/test_product_docking_response_contract.py \
            tests/unit/test_p0_subprocess_runner.py \
            tests/unit/test_p0_proxy_score_contract.py \
            tests/unit/test_p1_dependency_contract.py \
            tests/unit/test_p1_dockerfile_contract.py
