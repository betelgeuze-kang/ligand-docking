name: ci-self-hosted-runner-qualification

on:
  pull_request:
    paths:
      - "tools/product/self_hosted_runner_qualification.py"
      - "tests/unit/test_self_hosted_runner_qualification.py"
      - ".github/workflows/self-hosted-runner-node24-qualification-trusted.yml"
      - ".github/workflows/ci-self-hosted-runner-qualification.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/product/self_hosted_runner_qualification.py"
      - "tests/unit/test_self_hosted_runner_qualification.py"
      - ".github/workflows/self-hosted-runner-node24-qualification-trusted.yml"
      - ".github/workflows/ci-self-hosted-runner-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-self-hosted-runner-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out qualification surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            tools/__init__.py
            tools/product/__init__.py
            tools/product/self_hosted_runner_qualification.py
            tests/__init__.py
            tests/unit/test_self_hosted_runner_qualification.py
            .github/workflows/self-hosted-runner-node24-qualification-trusted.yml
            .github/workflows/ci-self-hosted-runner-qualification.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.3

      - name: Compile and run qualification contracts
        shell: bash
        run: |
          set +e
          mkdir -p qualification-receipts
          {
            python -m py_compile \
              tools/product/self_hosted_runner_qualification.py \
              tests/unit/test_self_hosted_runner_qualification.py
            python -m pytest --confcutdir=tests/unit -vv -x \
              tests/unit/test_self_hosted_runner_qualification.py
          } > qualification-contract.log 2>&1
          status=$?
          cat qualification-contract.log
          exit "$status"

      - name: Exercise qualified and blocked CLI receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-receipts
          python tools/product/self_hosted_runner_qualification.py \
            --observed-version 2.327.1 \
            --observed-at-utc 2026-07-16T00:00:00Z \
            --receipt qualification-receipts/qualified.json
          if python tools/product/self_hosted_runner_qualification.py \
            --observed-version 2.326.0 \
            --observed-at-utc 2026-07-16T00:00:00Z \
            --receipt qualification-receipts/blocked.json; then
            echo "old runner unexpectedly qualified" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          qualified = json.loads(Path("qualification-receipts/qualified.json").read_text())
          blocked = json.loads(Path("qualification-receipts/blocked.json").read_text())
          assert qualified["qualified"] is True
          assert blocked["qualified"] is False
          assert qualified["minimum_runner_version"] == blocked["minimum_runner_version"] == "2.327.1"
          PY

      - name: Upload qualification diagnostics and synthetic receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-hosted-runner-qualification-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification-contract.log
            qualification-receipts
          if-no-files-found: warn
          retention-days: 7
