name: ci-engine-v2-input-bound-verifier-release-round25

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/**"
      - "packaging/engine-v2/**"
      - "tools/build_engine_v2_wheel.py"
      - "tools/check_engine_v2_top_stack.py"
      - "tests/unit/test_engine_v2_input_bound_verifier_release_round25.py"
      - ".github/workflows/ci-engine-v2-input-bound-verifier-release-round25.yml"
      - ".github/workflows/ci-engine-v2-top-stack.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/**"
      - "packaging/engine-v2/**"
      - "tools/build_engine_v2_wheel.py"
      - "tools/check_engine_v2_top_stack.py"
      - "tests/unit/test_engine_v2_input_bound_verifier_release_round25.py"
      - ".github/workflows/ci-engine-v2-input-bound-verifier-release-round25.yml"
      - ".github/workflows/ci-engine-v2-top-stack.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-input-bound-verifier-release-round25-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-input-bound-verifier-round25:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      SOURCE_DATE_EPOCH: "1735689600"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install build==1.2.2.post1 setuptools==75.8.2 wheel==0.45.1 cryptography==46.0.5 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Build two byte-identical wheels
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-bundle-a dist-bundle-b dist-bundle
          python tools/build_engine_v2_wheel.py --output-dir dist-bundle-a
          python tools/build_engine_v2_wheel.py --output-dir dist-bundle-b
          wheel_a="$(find dist-bundle-a -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_b="$(find dist-bundle-b -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_a"
          test -n "$wheel_b"
          test "$(find dist-bundle-a -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist-bundle-b -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          cmp "$wheel_a" "$wheel_b"
          mkdir -p dist-bundle
          cp "$wheel_a" dist-bundle/
          sha256sum dist-bundle/*.whl | tee dist-bundle/SHA256SUMS

      - name: Clean-install the independent wheel
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/engine-v2-input-bound-${{ matrix.python-version }}"
          rm -rf "$venv"
          python -m venv "$venv"
          grep -q '^include-system-site-packages = false$' "$venv/pyvenv.cfg"
          "$venv/bin/python" -m pip install pip==25.0.1
          "$venv/bin/python" -m pip install cryptography==46.0.5 numpy==1.26.4
          "$venv/bin/python" -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          "$venv/bin/python" -m pip install --no-deps dist-bundle/*.whl
          "$venv/bin/python" -m pip check
          test -x "$venv/bin/betelgeuze-engine-v2"

      - name: Generate canonical input fixtures outside checkout
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/engine-v2-input-bound-${{ matrix.python-version }}"
          outside="/tmp/engine-v2-input-bound-outside-${{ matrix.python-version }}"
          rm -rf "$outside"
          mkdir -p "$outside"
          cd "$outside"
          "$venv/bin/python" - <<'PY'
          from pathlib import Path
          import torch
          from betelgeuze_engine_v2 import AllAtomSystem, Atom, Bond, Chain, Residue, StructureProvenance
          from betelgeuze_engine_v2.molecular import write_canonical_system_json

          def provenance(name: str, digest: str) -> StructureProvenance:
              return StructureProvenance(
                  source_format="round29-installed",
                  source_id=name,
                  source_sha256=digest,
                  parser_name="round29-installed",
                  parser_version="1.0.0",
              )

          ligand = AllAtomSystem(
              system_id="round29-ligand",
              atoms=(
                  Atom(index=0, name="C1", element="C", atomic_number=6, residue_index=0),
                  Atom(index=1, name="N1", element="N", atomic_number=7, residue_index=0),
                  Atom(index=2, name="C2", element="C", atomic_number=6, residue_index=0),
                  Atom(index=3, name="O1", element="O", atomic_number=8, residue_index=0),
              ),
              bonds=(
                  Bond(index=0, atom_i=0, atom_j=1, order=1.0),
                  Bond(index=1, atom_i=1, atom_j=2, order=1.0),
                  Bond(index=2, atom_i=2, atom_j=3, order=1.0),
              ),
              residues=(Residue(index=0, name="LIG", chain_index=0, sequence_number=1, atom_indices=(0, 1, 2, 3)),),
              chains=(Chain(index=0, chain_id="L", residue_indices=(0,)),),
              coordinates=torch.tensor([[[0.0, 0.0, 0.0], [1.4, 0.0, 0.0], [2.8, 0.3, 0.0], [4.1, 1.0, 0.2]]], dtype=torch.float64),
              provenance=provenance("round29-ligand", "a" * 64),
          )
          receptor = AllAtomSystem(
              system_id="round29-receptor",
              atoms=tuple(
                  Atom(index=i, name=f"R{i}", element="C", atomic_number=6, residue_index=0)
                  for i in range(5)
              ),
              bonds=(),
              residues=(Residue(index=0, name="REC", chain_index=0, sequence_number=1, atom_indices=(0, 1, 2, 3, 4)),),
              chains=(Chain(index=0, chain_id="A", residue_indices=(0,)),),
              coordinates=torch.tensor([[[0.0, 4.0, 0.0], [4.0, 4.0, 0.0], [7.0, 0.0, 0.0], [9.0, 0.0, 0.0], [60.0, 60.0, 60.0]]], dtype=torch.float64),
              provenance=provenance("round29-receptor", "b" * 64),
          )
          write_canonical_system_json(receptor, Path("receptor.json"))
          write_canonical_system_json(ligand, Path("ligand.json"))
          PY

      - name: Execute installed pocket, docking, result, and bundle verification
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/engine-v2-input-bound-${{ matrix.python-version }}"
          outside="/tmp/engine-v2-input-bound-outside-${{ matrix.python-version }}"
          cd "$outside"
          "$venv/bin/betelgeuze-engine-v2" pocket-from-reference \
            --ligand ligand.json \
            --coordinate-frame-id prepared-receptor-frame-v1 \
            --padding-angstrom 4.0 \
            --minimum-radius-angstrom 6.0 \
            --output pocket.json
          "$venv/bin/betelgeuze-engine-v2" dock-canonical \
            --receptor receptor.json \
            --ligand ligand.json \
            --pocket pocket.json \
            --output result.json \
            --candidate-count 4 \
            --top-k 2 \
            --max-torsions 1 \
            --translation-radius-angstrom 1.0 \
            --receptor-margin-angstrom 4.0 \
            --seed 229
          "$venv/bin/betelgeuze-engine-v2" verify-result --input result.json --output result-verification.json
          "$venv/bin/betelgeuze-engine-v2" verify-bundle \
            --result result.json \
            --receptor receptor.json \
            --ligand ligand.json \
            --pocket pocket.json \
            --receptor-model-index 0 \
            --ligand-model-index 0 \
            --receptor-margin-angstrom 4.0 \
            --require-reference-pocket-derivation \
            --output bundle-verification.json

      - name: Verify installed source observation, execution attestation, and closed claim boundary
        shell: bash
        run: |
          set -euo pipefail
          venv="/tmp/engine-v2-input-bound-${{ matrix.python-version }}"
          outside="/tmp/engine-v2-input-bound-outside-${{ matrix.python-version }}"
          cd "$outside"
          "$venv/bin/python" - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import stat

          receptor_path = Path("receptor.json")
          ligand_path = Path("ligand.json")
          pocket_path = Path("pocket.json")
          result_path = Path("result.json")
          result_verification_path = Path("result-verification.json")
          bundle_path = Path("bundle-verification.json")
          result = json.loads(result_path.read_bytes())
          result_verification = json.loads(result_verification_path.read_bytes())
          bundle = json.loads(bundle_path.read_bytes())

          for path in (pocket_path, result_path, result_verification_path, bundle_path):
              assert stat.S_IMODE(path.stat().st_mode) == 0o600

          execution = result["execution_parameters"]
          assert execution["receptor_model_index"] == 0
          assert execution["ligand_model_index"] == 0
          assert execution["receptor_margin_angstrom_binary64_hex"] == (4.0).hex()
          assert execution["parameters_uniquely_attested"] is True
          assert execution["model_selection_fixed_by_cli"] is True
          assert execution["receipt_sha256"] == result["execution_parameters_receipt_sha256"]
          assert execution["receptor_artifact_sha256"] == hashlib.sha256(receptor_path.read_bytes()).hexdigest()
          assert execution["ligand_artifact_sha256"] == hashlib.sha256(ligand_path.read_bytes()).hexdigest()
          assert execution["pocket_artifact_sha256"] == hashlib.sha256(pocket_path.read_bytes()).hexdigest()
          assert execution["authenticated_input_receipt_sha256"] == result["authenticated_input_receipt_sha256"]

          assert result["receptor_artifact_sha256"] == hashlib.sha256(receptor_path.read_bytes()).hexdigest()
          assert result["ligand_artifact_sha256"] == hashlib.sha256(ligand_path.read_bytes()).hexdigest()
          assert result["pocket_artifact_sha256"] == hashlib.sha256(pocket_path.read_bytes()).hexdigest()
          assert bundle["input_artifact_sha256s_verified"] is True
          assert bundle["pocket_definition_fully_recomputed"] is True
          assert bundle["reference_pocket_derivation_fully_recomputed"] is True
          assert bundle["authority_state_fully_recomputed"] is True
          assert bundle["scorer_contract_recomputed_from_declared_source_sha"] is True
          assert bundle["scorer_source_bytes_locally_observed"] is True
          assert bundle["scorer_source_bytes_sha256_matched_result"] is True
          assert bundle["scorer_source_bytes_observed_after_import"] is True
          assert bundle["scorer_source_bytes_locally_attested"] is False
          assert bundle["scorer_source_execution_preimport_attested"] is False
          assert bundle["scorer_source_signature_verified"] is False
          assert bundle["scorer_source_sha256"] == result["scorer_source_sha256"]
          assert bundle["scorer_source_byte_count"] > 0
          assert len(bundle["scorer_source_observation_receipt_sha256"]) == 64
          assert bundle["search_fingerprint_fully_recomputed"] is True
          assert bundle["execution_parameters_fully_verified"] is True
          assert bundle["receptor_margin_uniquely_attested"] is True
          assert bundle["model_indices_uniquely_attested"] is True
          assert bundle["execution_parameters_receipt_sha256"] == result["execution_parameters_receipt_sha256"]
          assert bundle["candidate_count"] == 4
          assert bundle["success_count"] + bundle["failure_count"] == 4
          assert result_verification["generic_search_fingerprint_fully_recomputed"] is True
          assert result_verification["generic_search_fingerprint_crosslinked"] is True
          for document in (result, result_verification, bundle):
              assert document["scientifically_validated"] is False
              assert document["benchmark_validated"] is False
              assert document["product_qualified"] is False
              assert document["customer_execution_enabled"] is False
              assert document["claim_safe"] is False
          PY
          cd "$GITHUB_WORKSPACE"
          rm -rf source-observation-release-evidence
          mkdir -p source-observation-release-evidence
          cp "$outside/pocket.json" source-observation-release-evidence/
          cp "$outside/result.json" source-observation-release-evidence/
          cp "$outside/result-verification.json" source-observation-release-evidence/
          cp "$outside/bundle-verification.json" source-observation-release-evidence/

      - name: Upload reproducible wheel and source-observation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorer-source-observation-release-py${{ matrix.python-version }}-${{ github.sha }}
          path: |
            dist-bundle
            source-observation-release-evidence
          if-no-files-found: error
          retention-days: 7
