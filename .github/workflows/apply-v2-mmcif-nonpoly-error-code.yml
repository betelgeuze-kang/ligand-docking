name: apply-v2-mmcif-nonpoly-error-code

on:
  pull_request:
    paths:
      - ".github/workflows/apply-v2-mmcif-nonpoly-error-code.yml"

permissions:
  contents: write

concurrency:
  group: apply-v2-mmcif-nonpoly-error-code
  cancel-in-progress: false

jobs:
  apply-correction:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/v2-mmcif-nonpoly-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/v2-mmcif-nonpoly-identity
          fetch-depth: 0
          persist-credentials: true
          clean: true
          show-progress: false

      - name: Correct the stable oversized-token error assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/test_engine_v2_mmcif_nonpoly_identity.py')
          source = path.read_text(encoding='utf-8')
          old = '    assert exc_info.value.code == "semantic_token_out_of_bounds"\n'
          new = '    assert exc_info.value.code == "source_token_out_of_bounds"\n'
          if source.count(old) != 1:
              raise SystemExit('oversized-token assertion count drifted')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile tests/unit/test_engine_v2_mmcif_nonpoly_identity.py
          git diff --check

      - name: Commit only the test correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/unit/test_engine_v2_mmcif_nonpoly_identity.py
          git diff --cached --check
          git commit -m "test(v2): align nonpoly oversized-token error code"
          git push origin HEAD:codex/v2-mmcif-nonpoly-identity
