name: ci-repository-hygiene

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 2
          show-progress: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install focused governance dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install pytest==9.1.1 ruff==0.11.13 PyYAML==6.0.3 cryptography==46.0.5

      - name: Compile and test repository, supply-chain, and release policies
        run: |
          python -m py_compile \
            tools/check_repository_hygiene.py \
            tools/verify_product_supply_chain.py \
            tools/verify_product_release_qualification.py \
            tests/conftest.py \
            tests/unit/test_repository_hygiene.py \
            tests/unit/test_product_supply_chain.py \
            tests/unit/test_product_release_qualification.py \
            tests/unit/test_pytest_product_artifact_bootstrap_boundary.py
          python tools/verify_product_supply_chain.py --repo-root .
          python tools/verify_product_release_qualification.py
          python - <<'PY'
          import pathlib
          import yaml

          yaml.safe_load(pathlib.Path('.github/dependabot.yml').read_text(encoding='utf-8'))
          yaml.safe_load(pathlib.Path('deploy/docker-compose.product.yml').read_text(encoding='utf-8'))
          PY
          python -m pytest --confcutdir=tests/unit -q \
            tests/unit/test_repository_hygiene.py \
            tests/unit/test_product_supply_chain.py \
            tests/unit/test_product_release_qualification.py \
            tests/unit/test_pytest_product_artifact_bootstrap_boundary.py
          python -m ruff check \
            tools/verify_product_supply_chain.py \
            tools/verify_product_release_qualification.py \
            tests/conftest.py \
            tests/unit/test_product_supply_chain.py \
            tests/unit/test_product_release_qualification.py \
            tests/unit/test_pytest_product_artifact_bootstrap_boundary.py

      - name: Prove a new focused test performs no implicit bootstrap
        run: |
          test ! -e runs/product_capability_surface_contract_current.json
          cat > tests/unit/test_temporary_explicit_bootstrap_probe.py <<'PY'
          def test_new_focused_contract_has_no_product_dependency():
              assert True
          PY
          BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP=auto \
            python -m pytest -q \
              tests/unit/test_temporary_explicit_bootstrap_probe.py
          test ! -e runs/product_capability_surface_contract_current.json
          rm -f tests/unit/test_temporary_explicit_bootstrap_probe.py

      - name: Resolve reviewed commit range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha=""
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            base_sha="${PUSH_BEFORE_SHA}"
          fi
          if [[ -n "${base_sha}" && ! "${base_sha}" =~ ^0+$ ]]; then
            if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${base_sha}"
            fi
          fi
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"

      - name: Audit tracked and changed paths
        shell: bash
        run: |
          set +e
          python tools/check_repository_hygiene.py \
            --base "${{ steps.range.outputs.base_sha }}" \
            --head HEAD \
            > repository-hygiene.log 2>&1
          status=$?
          cat repository-hygiene.log
          exit "${status}"

      - name: Upload repository hygiene diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-hygiene-${{ github.run_id }}-${{ github.run_attempt }}
          path: repository-hygiene.log
          if-no-files-found: warn
          retention-days: 7
