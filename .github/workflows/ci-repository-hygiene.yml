name: ci-repository-hygiene

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 2
          show-progress: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: python -m pip install pytest==9.1.1

      - name: Compile and test hygiene policy
        run: |
          python -m py_compile tools/check_repository_hygiene.py tests/unit/test_repository_hygiene.py
          python -m pytest --confcutdir=tests/unit -q tests/unit/test_repository_hygiene.py

      - name: Resolve reviewed commit range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha=""
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            base_sha="${PUSH_BEFORE_SHA}"
          fi
          if [[ -n "${base_sha}" && ! "${base_sha}" =~ ^0+$ ]]; then
            if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${base_sha}"
            fi
          fi
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"

      - name: Audit tracked and changed paths
        shell: bash
        run: |
          set +e
          python tools/check_repository_hygiene.py \
            --base "${{ steps.range.outputs.base_sha }}" \
            --head "${GITHUB_SHA}" \
            > repository-hygiene.log 2>&1
          status=$?
          cat repository-hygiene.log
          exit "${status}"

      - name: Upload repository hygiene diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-hygiene-${{ github.run_id }}-${{ github.run_attempt }}
          path: repository-hygiene.log
          if-no-files-found: warn
          retention-days: 7
