name: ci-engine-v2-native-direct-ewald-composite-dynamics

on:
  pull_request:
    paths:
      - "include/betelgeuze/direct_ewald.h"
      - "include/betelgeuze/direct_ewald_composite.h"
      - "include/betelgeuze/direct_ewald_composite_dynamics.h"
      - "include/betelgeuze/engine.h"
      - "native/CMakeLists.txt"
      - "native/betelgeuze_engine.exports"
      - "native/betelgeuze_engine.map"
      - "native/src/composite/**"
      - "native/src/context.cpp"
      - "native/src/dynamics/**"
      - "native/src/ewald/**"
      - "native/src/hip/**"
      - "native/src/cpu/**"
      - "native/src/rust/**"
      - "native/src/evaluator.cpp"
      - "native/src/forcefield.cpp"
      - "native/src/internal.hpp"
      - "native/src/system.cpp"
      - "native/tests/check_exports.cmake"
      - "native/tests/direct_ewald_composite.cpp"
      - "native/tests/direct_ewald_composite_dynamics.cpp"
      - "rust/Cargo.lock"
      - "rust/Cargo.toml"
      - "rust/cpu-kernel/**"
      - "rust/betelgeuze-sys/**"
      - "rust/betelgeuze-runtime/**"
      - "rust_engine_v2/Cargo.lock"
      - "rust_engine_v2/Cargo.toml"
      - "config/engine_v2_native_direct_ewald_composite_profile_v1.json"
      - "config/engine_v2_native_direct_ewald_composite_profile_v1_sources.json"
      - "config/engine_v2_native_direct_ewald_composite_dynamics_profile_v1.json"
      - "config/engine_v2_native_direct_ewald_composite_dynamics_profile_v1_sources.json"
      - "docs/engine_v2_native_direct_ewald_composite_dynamics_v1.md"
      - "tools/__init__.py"
      - "tools/verify_engine_v2_native_direct_ewald_composite_dynamics_v1.py"
      - "tests/unit/test_engine_v2_native_direct_ewald_composite_dynamics_v1.py"
      - ".github/workflows/ci-engine-v2-native-direct-ewald-composite-dynamics.yml"
  push:
    branches: ["main"]
    paths:
      - "include/betelgeuze/direct_ewald.h"
      - "include/betelgeuze/direct_ewald_composite.h"
      - "include/betelgeuze/direct_ewald_composite_dynamics.h"
      - "include/betelgeuze/engine.h"
      - "native/CMakeLists.txt"
      - "native/betelgeuze_engine.exports"
      - "native/betelgeuze_engine.map"
      - "native/src/composite/**"
      - "native/src/context.cpp"
      - "native/src/dynamics/**"
      - "native/src/ewald/**"
      - "native/src/hip/**"
      - "native/src/cpu/**"
      - "native/src/rust/**"
      - "native/src/evaluator.cpp"
      - "native/src/forcefield.cpp"
      - "native/src/internal.hpp"
      - "native/src/system.cpp"
      - "native/tests/check_exports.cmake"
      - "native/tests/direct_ewald_composite.cpp"
      - "native/tests/direct_ewald_composite_dynamics.cpp"
      - "rust/Cargo.lock"
      - "rust/Cargo.toml"
      - "rust/cpu-kernel/**"
      - "rust/betelgeuze-sys/**"
      - "rust/betelgeuze-runtime/**"
      - "rust_engine_v2/Cargo.lock"
      - "rust_engine_v2/Cargo.toml"
      - "config/engine_v2_native_direct_ewald_composite_profile_v1.json"
      - "config/engine_v2_native_direct_ewald_composite_profile_v1_sources.json"
      - "config/engine_v2_native_direct_ewald_composite_dynamics_profile_v1.json"
      - "config/engine_v2_native_direct_ewald_composite_dynamics_profile_v1_sources.json"
      - "docs/engine_v2_native_direct_ewald_composite_dynamics_v1.md"
      - "tools/__init__.py"
      - "tools/verify_engine_v2_native_direct_ewald_composite_dynamics_v1.py"
      - "tests/unit/test_engine_v2_native_direct_ewald_composite_dynamics_v1.py"
      - ".github/workflows/ci-engine-v2-native-direct-ewald-composite-dynamics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-native-direct-ewald-composite-dynamics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-cpu-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/composite-dynamics-cargo
    steps:
      - name: Check out current and historical evidence objects
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Select frozen hosted Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup override set 1.93.0

      - name: Verify immutable evidence and fail-closed unit contracts
        shell: bash
        run: |
          set -euo pipefail
          frozen=ebbd7a20538cfd7516d9b53adb2e54c6de14bd97
          frozen_tree=2ae92801369c7e16147e07cbb16e19c062e52cc9
          current_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse "$frozen^{tree}")" = "$frozen_tree"
          git diff --exit-code "$frozen" -- \
            config/engine_v2_native_direct_ewald_composite_dynamics_profile_v1.json \
            config/engine_v2_native_direct_ewald_composite_dynamics_profile_v1_sources.json \
            docs/engine_v2_native_direct_ewald_composite_dynamics_v1.md \
            tools/verify_engine_v2_native_direct_ewald_composite_dynamics_v1.py
          git checkout --detach --quiet "$frozen"
          python3 -m json.tool \
            config/engine_v2_native_direct_ewald_composite_dynamics_profile_v1.json \
            >/dev/null
          python3 -m json.tool \
            config/engine_v2_native_direct_ewald_composite_dynamics_profile_v1_sources.json \
            >/dev/null
          python3 tools/verify_engine_v2_native_direct_ewald_composite_dynamics_v1.py
          python3 -m pip install pytest==8.3.5
          python3 -m pytest -q \
            tests/unit/test_engine_v2_native_direct_ewald_composite_dynamics_v1.py
          git checkout --detach --quiet "$current_sha"
          test "$(git rev-parse HEAD)" = "$current_sha"

      - name: Configure CPU-only native tests
        run: >-
          cmake -S . -B build/native-composite-dynamics
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DBG_ENABLE_HIP=OFF
          -DBG_ENABLE_HIP_SAFE=OFF

      - name: Build and run focused native dynamics and ELF export tests
        run: |
          cmake --build build/native-composite-dynamics \
            --target betelgeuze_engine_direct_ewald_composite_dynamics \
            --parallel 2
          ctest --test-dir build/native-composite-dynamics \
            -R '^(betelgeuze_engine_direct_ewald_composite_dynamics|betelgeuze_engine_export_allowlist)$' \
            --output-on-failure

      - name: Run focused raw and safe Rust dynamics tests and docs
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked -p betelgeuze-sys --test layout --test raw_smoke
          cargo test --manifest-path rust/Cargo.toml --locked -p betelgeuze-runtime --test direct_ewald_composite_dynamics
          cargo test --manifest-path rust/Cargo.toml --locked -p betelgeuze-runtime --doc

  macos-export-boundary:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Check out native compute sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Select frozen hosted Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup override set 1.93.0

      - name: Report hosted toolchain
        run: |
          cmake --version
          clang++ --version
          rustc --version
          cargo --version

      - name: Configure Mach-O export boundary
        run: >-
          cmake -S . -B build/native-macos-composite-dynamics
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DBG_ENABLE_HIP=OFF
          -DBG_ENABLE_HIP_SAFE=OFF

      - name: Build the shared engine only
        run: >-
          cmake --build build/native-macos-composite-dynamics
          --target betelgeuze_engine
          --parallel 2

      - name: Verify exact Mach-O public exports
        run: >-
          ctest --test-dir build/native-macos-composite-dynamics
          -R '^betelgeuze_engine_export_allowlist$'
          --output-on-failure
