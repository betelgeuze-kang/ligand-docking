name: ci-strict-pose-rmsd

on:
  pull_request:
    paths:
      - "betelgeuze_engine/biodiscovery/__init__.py"
      - "betelgeuze_engine/biodiscovery/pose.py"
      - "betelgeuze_engine/biodiscovery/screening.py"
      - "betelgeuze_engine/biodiscovery/strict_pose_contracts.py"
      - "tests/unit/test_strict_pose_contracts.py"
      - "tests/unit/test_biodiscovery_screening.py"
      - "tests/unit/test_tier_beta_vertical_slice.py"
      - ".github/workflows/ci-strict-pose-rmsd.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine/biodiscovery/__init__.py"
      - "betelgeuze_engine/biodiscovery/pose.py"
      - "betelgeuze_engine/biodiscovery/screening.py"
      - "betelgeuze_engine/biodiscovery/strict_pose_contracts.py"
      - "tests/unit/test_strict_pose_contracts.py"
      - "tests/unit/test_biodiscovery_screening.py"
      - "tests/unit/test_tier_beta_vertical_slice.py"
      - ".github/workflows/ci-strict-pose-rmsd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-strict-pose-rmsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-pose-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Check out strict pose contract surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install -r requirements-mobile.txt
          python -m pip install numpy==1.26.4 pandas==2.3.3 rdkit==2025.9.3
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile strict pose and Tier-beta surfaces
        run: |
          python -m compileall -q \
            betelgeuze_engine/biodiscovery \
            tests/unit/test_strict_pose_contracts.py \
            tests/unit/test_biodiscovery_screening.py \
            tests/unit/test_tier_beta_vertical_slice.py

      - name: Run strict pose, screening, and vertical-slice regressions
        shell: bash
        run: |
          set +e
          python -m pytest --confcutdir=tests/unit -vv -x \
            tests/unit/test_strict_pose_contracts.py \
            tests/unit/test_biodiscovery_screening.py \
            tests/unit/test_tier_beta_vertical_slice.py \
            > strict-pose-rmsd.log 2>&1
          status=$?
          cat strict-pose-rmsd.log
          exit "$status"

      - name: Upload strict pose diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-pose-rmsd-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: strict-pose-rmsd.log
          if-no-files-found: error
          retention-days: 7
