name: apply-strict-pose-rmsd-patch

on:
  pull_request:
    paths:
      - ".github/patches/strict-pose-rmsd/**"
      - ".github/workflows/ci-strict-pose-rmsd.yml"

permissions:
  contents: write

concurrency:
  group: apply-strict-pose-rmsd-patch
  cancel-in-progress: false

jobs:
  apply-patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'betelgeuze-kang' &&
      github.head_ref == 'codex/strict-pose-rmsd'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the controlled feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/strict-pose-rmsd
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply reviewed source and test patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/patches/strict-pose-rmsd/part-00.patch \
            .github/patches/strict-pose-rmsd/part-01.patch \
            .github/patches/strict-pose-rmsd/part-02.patch \
            .github/patches/strict-pose-rmsd/part-03.patch \
            .github/patches/strict-pose-rmsd/part-04a.patch \
            .github/patches/strict-pose-rmsd/part-04b.patch \
            .github/patches/strict-pose-rmsd/part-05.patch \
            .github/patches/strict-pose-rmsd/part-06.patch \
            > /tmp/strict-pose-rmsd.patch
          git apply --check /tmp/strict-pose-rmsd.patch
          git apply /tmp/strict-pose-rmsd.patch
          rm -rf .github/patches/strict-pose-rmsd
          python -m py_compile \
            betelgeuze_engine/biodiscovery/pose.py \
            betelgeuze_engine/biodiscovery/screening.py \
            tests/unit/test_biodiscovery_screening.py
          git diff --check

      - name: Commit source changes without modifying workflow files
        shell: bash
        run: |
          set +e
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git status --short
            git add -A -- \
              betelgeuze_engine/biodiscovery/pose.py \
              betelgeuze_engine/biodiscovery/screening.py \
              tests/unit/test_biodiscovery_screening.py \
              .github/patches/strict-pose-rmsd
            git diff --cached --check
            git diff --cached --stat
            git commit -m "fix(biodiscovery): enforce strict state-aware pose RMSD [strict-pose-applied]"
            git push origin HEAD:codex/strict-pose-rmsd
          } > strict-pose-apply.log 2>&1
          status=$?
          cat strict-pose-apply.log
          exit "$status"

      - name: Upload strict pose apply diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-pose-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: strict-pose-apply.log
          if-no-files-found: warn
          retention-days: 1
