name: ci-strict-pose-rmsd

on:
  pull_request:
    paths:
      - "betelgeuze_engine/biodiscovery/pose.py"
      - "betelgeuze_engine/biodiscovery/screening.py"
      - "tests/unit/test_biodiscovery_screening.py"
      - "tests/unit/test_tier_beta_vertical_slice.py"
      - ".github/workflows/ci-strict-pose-rmsd.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine/biodiscovery/pose.py"
      - "betelgeuze_engine/biodiscovery/screening.py"
      - "tests/unit/test_biodiscovery_screening.py"
      - "tests/unit/test_tier_beta_vertical_slice.py"
      - ".github/workflows/ci-strict-pose-rmsd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-strict-pose-rmsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-pose-rmsd:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PRODUCT_API_AUTH_REQUIRED: "0"
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Check out focused BioDiscovery surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            api
            betelgeuze_engine
            betelgeuze_product
            core
            tests/__init__.py
            tests/fixtures/tier_beta
            tests/unit/test_biodiscovery_screening.py
            tests/unit/test_tier_beta_vertical_slice.py
            requirements-mobile.txt
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-mobile.txt

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install -r requirements-mobile.txt
          python -m pip install numpy==1.26.4 rdkit-pypi==2022.9.5
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile strict pose and screening surfaces
        run: |
          python -m compileall -q \
            api \
            betelgeuze_engine/biodiscovery/pose.py \
            betelgeuze_engine/biodiscovery/screening.py \
            tests/unit/test_biodiscovery_screening.py \
            tests/unit/test_tier_beta_vertical_slice.py

      - name: Run strict RMSD, conformer, clustering, and screening contracts
        shell: bash
        run: |
          set +e
          python -m pytest --confcutdir=tests/unit -vv -x \
            tests/unit/test_biodiscovery_screening.py \
            tests/unit/test_tier_beta_vertical_slice.py::test_service_pdb_smiles_success_signed_manifest_and_claim_limits \
            > strict-pose-rmsd.log 2>&1
          status=$?
          cat strict-pose-rmsd.log
          exit "$status"

      - name: Upload strict pose RMSD diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-pose-rmsd-${{ github.run_id }}-${{ github.run_attempt }}
          path: strict-pose-rmsd.log
          if-no-files-found: error
          retention-days: 7
