name: ci-strict-pose-rmsd

on:
  pull_request:
    paths:
      - "betelgeuze_engine/biodiscovery/pose.py"
      - "betelgeuze_engine/biodiscovery/coarse_receptor.py"
      - "betelgeuze_engine/biodiscovery/protein_prep.py"
      - "betelgeuze_engine/biodiscovery/ligand_prep.py"
      - "betelgeuze_engine/biodiscovery/screening.py"
      - "betelgeuze_engine/biodiscovery/scoring.py"
      - "betelgeuze_engine/biodiscovery/stability_observations.py"
      - "betelgeuze_engine/biodiscovery/manifest.py"
      - "betelgeuze_engine/physics/neighbor.py"
      - "betelgeuze_product/tier_beta_vertical_slice.py"
      - "betelgeuze_engine/product/runners/tier_beta_service_adapter.py"
      - "tests/unit/test_biodiscovery_screening.py"
      - "tests/unit/test_deep_review_geometry.py"
      - "tests/unit/test_biodiscovery_protein_prep.py"
      - "tests/unit/test_biodiscovery_pose_validity.py"
      - "tests/unit/test_biodiscovery_stability_observations.py"
      - "tests/unit/test_tier_beta_vertical_slice.py"
      - "tests/unit/test_biodiscovery_ligand_input_integrity.py"
      - "tests/unit/test_biodiscovery_manifest_integrity.py"
      - "tests/unit/test_neighbor_cache_geometry.py"
      - "tests/unit/test_biodiscovery_runtime_integrity.py"
      - "tests/unit/test_api_h4_security_hardening.py"
      - "pytest.ini"
      - "requirements-mobile.txt"
      - ".github/workflows/ci-strict-pose-rmsd.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine/biodiscovery/pose.py"
      - "betelgeuze_engine/biodiscovery/coarse_receptor.py"
      - "betelgeuze_engine/biodiscovery/protein_prep.py"
      - "betelgeuze_engine/biodiscovery/ligand_prep.py"
      - "betelgeuze_engine/biodiscovery/screening.py"
      - "betelgeuze_engine/biodiscovery/scoring.py"
      - "betelgeuze_engine/biodiscovery/stability_observations.py"
      - "betelgeuze_engine/biodiscovery/manifest.py"
      - "betelgeuze_engine/physics/neighbor.py"
      - "betelgeuze_product/tier_beta_vertical_slice.py"
      - "betelgeuze_engine/product/runners/tier_beta_service_adapter.py"
      - "tests/unit/test_biodiscovery_screening.py"
      - "tests/unit/test_deep_review_geometry.py"
      - "tests/unit/test_biodiscovery_protein_prep.py"
      - "tests/unit/test_biodiscovery_pose_validity.py"
      - "tests/unit/test_biodiscovery_stability_observations.py"
      - "tests/unit/test_tier_beta_vertical_slice.py"
      - "tests/unit/test_biodiscovery_ligand_input_integrity.py"
      - "tests/unit/test_biodiscovery_manifest_integrity.py"
      - "tests/unit/test_neighbor_cache_geometry.py"
      - "tests/unit/test_biodiscovery_runtime_integrity.py"
      - "tests/unit/test_api_h4_security_hardening.py"
      - "pytest.ini"
      - "requirements-mobile.txt"
      - ".github/workflows/ci-strict-pose-rmsd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-strict-pose-rmsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-pose-rmsd:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PRODUCT_API_AUTH_REQUIRED: "0"
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: "disabled"
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
    steps:
      - name: Check out focused BioDiscovery surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            api
            betelgeuze_engine
            betelgeuze_product
            betelgeuze_ai_md/__init__.py
            betelgeuze_ai_md/contracts
            core
            tests/__init__.py
            tests/unit/__init__.py
            tests/fixtures/tier_beta
            tests/unit/test_biodiscovery_screening.py
            tests/unit/test_deep_review_geometry.py
            tests/unit/test_biodiscovery_protein_prep.py
            tests/unit/test_biodiscovery_stability_observations.py
            tests/unit/test_biodiscovery_pose_validity.py
            tests/unit/test_tier_beta_vertical_slice.py
            tests/unit/test_biodiscovery_ligand_input_integrity.py
            tests/unit/test_biodiscovery_manifest_integrity.py
            tests/unit/test_neighbor_cache_geometry.py
            tests/unit/test_biodiscovery_runtime_integrity.py
            tests/unit/test_api_h4_security_hardening.py
            pytest.ini
            requirements-mobile.txt
            .github/workflows/ci-strict-pose-rmsd.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-mobile.txt

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install -r requirements-mobile.txt
          python -m pip install numpy==1.26.4 rdkit-pypi==2022.9.5
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile strict pose and screening surfaces
        run: |
          python -m compileall -q \
            api \
            betelgeuze_engine/biodiscovery/pose.py \
            betelgeuze_engine/biodiscovery/coarse_receptor.py \
            betelgeuze_engine/biodiscovery/protein_prep.py \
            betelgeuze_engine/biodiscovery/ligand_prep.py \
            betelgeuze_engine/biodiscovery/screening.py \
            betelgeuze_engine/biodiscovery/scoring.py \
            betelgeuze_engine/biodiscovery/stability_observations.py \
            betelgeuze_engine/biodiscovery/manifest.py \
            betelgeuze_engine/physics/neighbor.py \
            betelgeuze_product/tier_beta_vertical_slice.py \
            betelgeuze_engine/product/runners/tier_beta_service_adapter.py \
            tests/unit/test_biodiscovery_screening.py \
            tests/unit/test_deep_review_geometry.py \
            tests/unit/test_biodiscovery_protein_prep.py \
            tests/unit/test_biodiscovery_pose_validity.py \
            tests/unit/test_biodiscovery_stability_observations.py \
            tests/unit/test_tier_beta_vertical_slice.py \
            tests/unit/test_biodiscovery_ligand_input_integrity.py \
            tests/unit/test_biodiscovery_manifest_integrity.py \
            tests/unit/test_neighbor_cache_geometry.py \
            tests/unit/test_biodiscovery_runtime_integrity.py \
            tests/unit/test_api_h4_security_hardening.py

      - name: Run strict geometry, runtime, input, and persisted-integrity contracts
        shell: bash
        run: |
          set +e
          python -m pytest --confcutdir=tests/unit -vv -x -W error \
            tests/unit/test_biodiscovery_screening.py \
            tests/unit/test_deep_review_geometry.py \
            tests/unit/test_biodiscovery_protein_prep.py \
            tests/unit/test_biodiscovery_pose_validity.py \
            tests/unit/test_biodiscovery_stability_observations.py \
            tests/unit/test_biodiscovery_ligand_input_integrity.py \
            tests/unit/test_biodiscovery_manifest_integrity.py \
            tests/unit/test_neighbor_cache_geometry.py \
            tests/unit/test_biodiscovery_runtime_integrity.py \
            tests/unit/test_tier_beta_vertical_slice.py::test_service_pdb_smiles_success_signed_manifest_and_claim_limits \
            tests/unit/test_tier_beta_vertical_slice.py::test_stability_simulation_records_md_reproducibility_diagnostics \
            tests/unit/test_api_h4_security_hardening.py::test_tier_beta_artifacts_replace_links_without_touching_victims \
            tests/unit/test_api_h4_security_hardening.py::test_tier_beta_artifacts_replace_fifos_without_blocking \
            --junitxml=strict-pose-rmsd-junit.xml > strict-pose-rmsd.log 2>&1
          status=$?
          cat strict-pose-rmsd.log
          exit "$status"

      - name: Upload strict pose RMSD diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-pose-rmsd-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            strict-pose-rmsd.log
            strict-pose-rmsd-junit.xml
            betelgeuze_engine
            betelgeuze_product
            betelgeuze_ai_md/__init__.py
            betelgeuze_ai_md/contracts
            api
            core
            tests/__init__.py
            tests/unit/__init__.py
            tests/unit/test_biodiscovery_screening.py
            tests/unit/test_deep_review_geometry.py
            tests/unit/test_biodiscovery_protein_prep.py
            tests/unit/test_biodiscovery_pose_validity.py
            tests/unit/test_biodiscovery_stability_observations.py
            tests/unit/test_tier_beta_vertical_slice.py
            tests/unit/test_biodiscovery_ligand_input_integrity.py
            tests/unit/test_biodiscovery_manifest_integrity.py
            tests/unit/test_neighbor_cache_geometry.py
            tests/unit/test_biodiscovery_runtime_integrity.py
            tests/unit/test_api_h4_security_hardening.py
            tests/fixtures/tier_beta
            pytest.ini
            requirements-mobile.txt
            .github/workflows/ci-strict-pose-rmsd.yml
          if-no-files-found: error
          retention-days: 7
