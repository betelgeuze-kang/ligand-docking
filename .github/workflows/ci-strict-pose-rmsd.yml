name: apply-strict-pose-rmsd-patch

on:
  pull_request:
    paths:
      - ".github/patches/strict-pose-rmsd/**"
      - ".github/workflows/ci-strict-pose-rmsd.yml"

permissions:
  contents: write

concurrency:
  group: apply-strict-pose-rmsd-final
  cancel-in-progress: false

jobs:
  apply-patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'betelgeuze-kang' &&
      github.head_ref == 'codex/strict-pose-rmsd-final'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the controlled final feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/strict-pose-rmsd-final
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply the locally and Git-verified source patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/patches/strict-pose-rmsd/part-00.patch \
            .github/patches/strict-pose-rmsd/part-01.patch \
            .github/patches/strict-pose-rmsd/part-02.patch \
            .github/patches/strict-pose-rmsd/part-03.patch \
            .github/patches/strict-pose-rmsd/part-04a.patch \
            .github/patches/strict-pose-rmsd/part-04b.patch \
            .github/patches/strict-pose-rmsd/part-05.patch \
            .github/patches/strict-pose-rmsd/part-06.patch \
            > /tmp/strict-pose-rmsd.patch
          echo "4c618a83fda8d2b73da0f849878376e9489d507a661ec092e61eef5e185e4f58  /tmp/strict-pose-rmsd.patch" | sha256sum --check -
          git apply --check --verbose /tmp/strict-pose-rmsd.patch
          git apply --verbose /tmp/strict-pose-rmsd.patch
          rm -rf .github/patches/strict-pose-rmsd
          python -m py_compile \
            betelgeuze_engine/biodiscovery/pose.py \
            betelgeuze_engine/biodiscovery/screening.py \
            tests/unit/test_biodiscovery_screening.py
          git diff --check

      - name: Commit source and test changes without modifying workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            betelgeuze_engine/biodiscovery/pose.py \
            betelgeuze_engine/biodiscovery/screening.py \
            tests/unit/test_biodiscovery_screening.py \
            .github/patches/strict-pose-rmsd
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(biodiscovery): enforce strict state-aware pose RMSD"
          git push origin HEAD:codex/strict-pose-rmsd-final
