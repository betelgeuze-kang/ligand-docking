name: apply-strict-pose-rmsd-patch

on:
  push:
    branches: ["codex/strict-pose-rmsd"]
    paths:
      - "tools/patches/strict_pose_rmsd.patch*"
      - ".github/workflows/ci-strict-pose-rmsd.yml"

permissions:
  contents: write

concurrency:
  group: apply-strict-pose-rmsd-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-patch:
    if: >-
      github.repository == 'betelgeuze-kang/ligand-docking' &&
      github.actor == 'betelgeuze-kang' &&
      github.ref == 'refs/heads/codex/strict-pose-rmsd'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the controlled feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/strict-pose-rmsd
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Decode and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(tools/patches/strict_pose_rmsd.patch.b64.*)
          if (( ${#parts[@]} == 0 )); then
            echo "reviewed patch parts already consumed"
            exit 0
          fi
          cat "${parts[@]}" | base64 --decode > /tmp/strict-pose-rmsd.patch
          echo "06321e5955819f8a49f05fb10d4bfcb11c8c9d1f916381a196741c834eba6348  /tmp/strict-pose-rmsd.patch" | sha256sum --check -
          git apply --check /tmp/strict-pose-rmsd.patch
          git apply /tmp/strict-pose-rmsd.patch
          rm -f tools/patches/strict_pose_rmsd.patch*
          python -m py_compile \
            betelgeuze_engine/biodiscovery/pose.py \
            betelgeuze_engine/biodiscovery/screening.py \
            tests/unit/test_biodiscovery_screening.py \
            tests/unit/test_tier_beta_vertical_slice.py
          git diff --check

      - name: Commit source changes without modifying workflow files
        shell: bash
        run: |
          set +e
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- \
              betelgeuze_engine/biodiscovery/pose.py \
              betelgeuze_engine/biodiscovery/screening.py \
              tests/unit/test_biodiscovery_screening.py \
              tests/unit/test_tier_beta_vertical_slice.py \
              tools/patches
            git diff --cached --check
            git diff --cached --stat
            if git diff --cached --quiet; then
              echo "no patch changes remain"
              exit 0
            fi
            git commit -m "fix(biodiscovery): enforce strict state-aware pose RMSD"
            git push origin HEAD:codex/strict-pose-rmsd
          } > strict-pose-apply.log 2>&1
          status=$?
          cat strict-pose-apply.log
          exit "$status"

      - name: Upload strict pose apply diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-pose-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: strict-pose-apply.log
          if-no-files-found: warn
          retention-days: 1
