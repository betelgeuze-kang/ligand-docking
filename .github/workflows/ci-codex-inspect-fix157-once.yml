name: ci-codex-inspect-fix157-once

on:
  pull_request:
    paths:
      - ".github/workflows/ci-codex-inspect-fix157-once.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect latest repair dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base = f'https://api.github.com/repos/{repository}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(url):
              with urlopen(Request(url, headers=headers), timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          query = urlencode(
              {
                  'branch': 'agent/v2-claim-state-truthfulness',
                  'event': 'workflow_dispatch',
                  'per_page': 10,
              }
          )
          deadline = time.monotonic() + 8 * 60
          selected = None
          while time.monotonic() < deadline:
              payload = get(
                  f'{base}/actions/workflows/ci-codex-fix157-once.yml/runs?{query}'
              )
              runs = payload.get('workflow_runs', [])
              if runs:
                  selected = max(runs, key=lambda row: row.get('run_number', 0))
                  if selected.get('status') == 'completed':
                      break
              time.sleep(10)
          if selected is None:
              raise SystemExit('no repair workflow dispatch was found')
          jobs = get(f"{base}/actions/runs/{selected['id']}/jobs?per_page=100")
          print(
              json.dumps(
                  {
                      'run_id': selected.get('id'),
                      'status': selected.get('status'),
                      'conclusion': selected.get('conclusion'),
                      'head_sha': selected.get('head_sha'),
                      'html_url': selected.get('html_url'),
                      'jobs': [
                          {
                              'id': job.get('id'),
                              'name': job.get('name'),
                              'status': job.get('status'),
                              'conclusion': job.get('conclusion'),
                              'steps': job.get('steps'),
                          }
                          for job in jobs.get('jobs', [])
                      ],
                  },
                  sort_keys=True,
              )
          )
          if selected.get('status') != 'completed':
              raise SystemExit('repair workflow did not complete before timeout')
          if selected.get('conclusion') != 'success':
              raise SystemExit('repair workflow failed')
          PY
