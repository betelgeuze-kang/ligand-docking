name: ci-codex-inspect-fix157-once

on:
  pull_request:
    paths:
      - ".github/workflows/ci-codex-inspect-fix157-once.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print repair failure tail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          request = Request(
              f'https://api.github.com/repos/{repository}/actions/jobs/88294655326/logs',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urlopen(request, timeout=60) as response:
              raw = response.read().decode('utf-8', errors='replace')
          lines = raw.splitlines()
          print('\n'.join(lines[-160:]))
          PY
