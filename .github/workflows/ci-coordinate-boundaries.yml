name: ci-coordinate-boundaries
on:
  pull_request:
    paths:
      - 'betelgeuze_engine/product/prepared_coordinate_export.py'
      - 'tools/product/diagnose_prepared_cross_numerics.py'
      - 'tests/unit/test_coordinate_boundary_followup.py'
      - '.github/workflows/ci-coordinate-boundaries.yml'
  push:
    branches: [main]
    paths:
      - 'betelgeuze_engine/product/prepared_coordinate_export.py'
      - 'tools/product/diagnose_prepared_cross_numerics.py'
      - 'tests/unit/test_coordinate_boundary_followup.py'
      - '.github/workflows/ci-coordinate-boundaries.yml'
permissions:
  contents: read
jobs:
  boundary-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest==8.3.5 numpy==2.3.5 scipy==1.15.3 scikit-learn==1.7.2 rdkit==2026.3.6 ruff==0.12.4 MDAnalysis==2.10.0 mdtraj==1.11.1.post1
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Inspect and test
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree} > boundary-checkout.txt
          python -m pip freeze > boundary-dependencies.txt
          sha256sum betelgeuze_engine/product/prepared_coordinate_export.py tools/product/diagnose_prepared_cross_numerics.py tests/unit/test_coordinate_boundary_followup.py > boundary-sources.sha256
          python -m ruff check --isolated --no-cache betelgeuze_engine/product/prepared_coordinate_export.py tools/product/diagnose_prepared_cross_numerics.py tests/unit/test_coordinate_boundary_followup.py
          python -m pytest --rootdir="$PWD" -c /dev/null --noconftest -p no:cacheprovider -W error -q tests/unit/test_coordinate_boundary_followup.py tests/unit/test_prepared_coordinate_export.py tests/unit/test_prepared_coordinate_array.py tests/unit/test_prepared_cross_force_diagnostic.py tests/unit/test_prepared_cross_numeric_check.py --junitxml=boundary-junit.xml 2>&1 | tee boundary-tests.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coordinate-boundaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            boundary-*.txt
            boundary-*.sha256
            boundary-*.xml
            boundary-*.log
          if-no-files-found: error
          retention-days: 14
