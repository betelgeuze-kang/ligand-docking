name: cleanup-v2-mmcif-nonpoly-applicators

on:
  pull_request:
    paths:
      - ".github/workflows/cleanup-v2-mmcif-nonpoly-applicators.yml"

permissions:
  contents: write

concurrency:
  group: cleanup-v2-mmcif-nonpoly-applicators
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/v2-mmcif-nonpoly-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      TARGET_BRANCH: codex/v2-mmcif-nonpoly-identity
    steps:
      - name: Remove temporary applicators with one Git Data commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          token = os.environ['GH_TOKEN']
          repository = os.environ['GH_REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          api = 'https://api.github.com'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'betelgeuze-nonpoly-cleanup',
          }

          def request(method: str, path: str, payload: object | None = None) -> dict:
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = Request(api + path, data=data, headers=headers, method=method)
              with urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          ref = request(
              'GET',
              f'/repos/{repository}/git/ref/heads/{quote(branch, safe="")}',
          )
          parent_sha = str(ref['object']['sha'])
          commit = request('GET', f'/repos/{repository}/git/commits/{parent_sha}')
          base_tree = str(commit['tree']['sha'])

          temporary_paths = (
              '.github/workflows/apply-v2-mmcif-nonpoly-registration-v3.yml',
              '.github/workflows/apply-v2-mmcif-nonpoly-registration-final.yml',
              '.github/workflows/apply-v2-mmcif-nonpoly-source-only.yml',
              '.github/patches/apply_v2_mmcif_nonpoly_registration.py',
              '.github/workflows/cleanup-v2-mmcif-nonpoly-applicators.yml',
          )
          tree = request(
              'POST',
              f'/repos/{repository}/git/trees',
              {
                  'base_tree': base_tree,
                  'tree': [
                      {
                          'path': path,
                          'mode': '100644',
                          'type': 'blob',
                          'sha': None,
                      }
                      for path in temporary_paths
                  ],
              },
          )
          cleaned = request(
              'POST',
              f'/repos/{repository}/git/commits',
              {
                  'message': 'chore: remove temporary nonpoly registration applicators',
                  'tree': tree['sha'],
                  'parents': [parent_sha],
              },
          )
          request(
              'PATCH',
              f'/repos/{repository}/git/refs/heads/{quote(branch, safe="")}',
              {'sha': cleaned['sha'], 'force': False},
          )
          print(f"cleaned_commit={cleaned['sha']}")
          PY
