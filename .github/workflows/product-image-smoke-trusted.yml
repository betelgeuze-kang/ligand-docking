name: product-image-smoke-trusted

on:
  push:
    branches:
      - main
    tags:
      - v*
      - product-*
    paths:
      - Dockerfile.product
      - pyproject.toml
      - requirements-package.txt
      - requirements-base.txt
      - requirements.txt
      - requirements-api.txt
      - requirements-deploy.txt
      - requirements-rocm.txt
      - requirements-product-rocm.txt
      - api/**
      - core/**
      - betelgeuze_engine/**
      - betelgeuze_product/**
      - rust_engine/**
      - tools/product/build_ai_md_*.py
      - tests/unit/test_build_ai_md_*.py
      - tests/unit/test_betelgeuze_ai_md_*.py
      - third_party/rocm_device_libs_pkg/**
      - deploy/verify_product_image.sh
      - scripts/normalize_product_image_smoke_artifact_ownership.sh
      - tools/product/build_product_image_smoke_preflight.py
      - tools/build_product_image_smoke_preflight.py
      - api/validated_runner_runtime_qualification.py
      - tests/unit/test_build_product_image_smoke_preflight.py
      - tests/unit/test_validated_runner_runtime_qualification.py
      - .github/workflows/product-image-smoke.yml
      - .github/workflows/product-image-smoke-trusted.yml
      - tools/product/run_runtime_neighbor_release_scaling.py
      - tests/unit/test_runtime_neighbor_release_scaling.py
      - tools/product/run_rust_hip_neighbor_provider_parity.py
      - tests/unit/test_rust_hip_neighbor_provider_parity.py
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      verify_mode:
        description: "Product image smoke mode. build defaults to self-hosted Linux; rocm-runtime requires a self-hosted ROCm runner."
        required: true
        default: build
        type: choice
        options:
          - build
          - rocm-runtime


permissions:
  contents: read

concurrency:
  group: product-image-smoke-trusted-${{ github.ref }}-${{ github.event.inputs.verify_mode || 'push' }}
  cancel-in-progress: true

jobs:
  product-image-build-smoke-trusted:
    if: >-
      ${{ vars.TRUSTED_SELF_HOSTED_CI_ENABLED == 'true'
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch'
      && github.event.inputs.verify_mode == 'build'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v')
      || startsWith(github.ref, 'refs/tags/product-')))) }}
    runs-on: [self-hosted, linux]
    timeout-minutes: 120
    steps:
      - name: Check out trusted source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: product-ci-checkout
          persist-credentials: false
          clean: true
          show-progress: false

      - name: Prepare ephemeral product image artifact root
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="${RUNNER_TEMP}/product-image-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          smoke_root="${RUNNER_TEMP}/product-image-build-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${artifact_root}"
          rm -rf "${smoke_root}"
          mkdir -p "${artifact_root}"
          ln -s "${artifact_root}" product-ci-checkout/runs
          echo "PRODUCT_IMAGE_RUNNER_SMOKE_DIR=${smoke_root}" >> "${GITHUB_ENV}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Verify product image build smoke
        working-directory: product-ci-checkout
        env:
          PRODUCT_IMAGE_VERIFY_MODE: build
          DOCKER_BUILDKIT: "1"
          PRODUCT_IMAGE_REQUIRE_BUILDX: "1"
          PRODUCT_IMAGE_PRUNE_BEFORE_BUILD: "1"
        shell: bash
        run: |
          mkdir -p runs
          export PRODUCT_IMAGE_CONTAINER_UID_GID="$(id -u):$(id -g)"
          set -o pipefail
          bash deploy/verify_product_image.sh 2>&1 | tee runs/product_image_build_smoke.log
      - name: Normalize product image smoke artifact ownership
        if: always()
        working-directory: product-ci-checkout
        shell: bash
        run: |
          GITHUB_WORKSPACE="${PWD}" bash scripts/normalize_product_image_smoke_artifact_ownership.sh \
            --log-path runs/product_image_build_smoke.log
      - name: Upload product image build smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-image-build-smoke-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/product-image-build-${{ github.run_id }}-${{ github.run_attempt }}/**
            ${{ runner.temp }}/product-image-build-smoke-${{ github.run_id }}-${{ github.run_attempt }}/**
      - name: Summarize product image build boundary
        if: always()
        working-directory: product-ci-checkout
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = Path("runs/product_image_smoke_receipt_current.json")
          payload = {}
          if receipt.is_file():
              try:
                  payload = json.loads(receipt.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  payload = {"status": "receipt_json_invalid"}
          lines = [
              "## Product Image Build Smoke",
              "",
              f"- mode: `{payload.get('mode', 'build')}`",
              f"- status: `{payload.get('status', 'missing_receipt')}`",
              f"- product runtime claim: `false`",
              f"- required runtime claim mode: `rocm-runtime on a trusted ROCm runner plus a separately pinned namespace runtime receipt`",
              "",
              payload.get(
                  "claim_boundary",
                  "Build smoke verifies image build/import scope only; product claim promotion also requires a ROCm runtime receipt and a separately pinned namespace runtime receipt.",
              ),
              "",
          ]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              Path(summary_path).write_text("\n".join(lines), encoding="utf-8")
          else:
              print("\n".join(lines))
          PY

  product-image-rocm-runtime-smoke:
    if: >-
      ${{ vars.TRUSTED_SELF_HOSTED_CI_ENABLED == 'true'
      && (github.event_name == 'schedule'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/product-'))
      || (github.event_name == 'workflow_dispatch'
      && github.event.inputs.verify_mode == 'rocm-runtime'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v')
      || startsWith(github.ref, 'refs/tags/product-')))) }}
    runs-on: [self-hosted, linux, rocm]
    timeout-minutes: 120
    steps:
      - name: Check out trusted source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: product-ci-checkout
          persist-credentials: false
          clean: true
          show-progress: false

      - name: Prepare ephemeral ROCm artifact root
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="${RUNNER_TEMP}/product-image-rocm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          smoke_root="${RUNNER_TEMP}/product-image-rocm-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${artifact_root}"
          rm -rf "${smoke_root}"
          mkdir -p "${artifact_root}"
          ln -s "${artifact_root}" product-ci-checkout/runs
          echo "PRODUCT_IMAGE_RUNNER_SMOKE_DIR=${smoke_root}" >> "${GITHUB_ENV}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Verify product image ROCm/HIP/Rust runtime smoke
        working-directory: product-ci-checkout
        env:
          PRODUCT_IMAGE_VERIFY_MODE: rocm-runtime
          DOCKER_BUILDKIT: "1"
          PRODUCT_IMAGE_REQUIRE_BUILDX: "1"
          PRODUCT_IMAGE_PRUNE_BEFORE_BUILD: "1"
        shell: bash
        run: |
          mkdir -p runs
          export PRODUCT_IMAGE_CONTAINER_UID_GID="$(id -u):$(id -g)"
          set -o pipefail
          bash deploy/verify_product_image.sh 2>&1 | tee runs/product_image_rocm_runtime_smoke.log
      - name: Normalize product image smoke artifact ownership
        if: always()
        working-directory: product-ci-checkout
        shell: bash
        run: |
          GITHUB_WORKSPACE="${PWD}" bash scripts/normalize_product_image_smoke_artifact_ownership.sh \
            --log-path runs/product_image_rocm_runtime_smoke.log
      - name: Upload product image ROCm runtime smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-image-rocm-runtime-smoke-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/product-image-rocm-${{ github.run_id }}-${{ github.run_attempt }}/**
            ${{ runner.temp }}/product-image-rocm-smoke-${{ github.run_id }}-${{ github.run_attempt }}/**
      - name: Summarize product image ROCm runtime boundary
        if: always()
        working-directory: product-ci-checkout
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = Path("runs/product_image_smoke_receipt_current.json")
          payload = {}
          if receipt.is_file():
              try:
                  payload = json.loads(receipt.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  payload = {"status": "receipt_json_invalid"}
          lines = [
              "## Product Image ROCm Runtime Smoke",
              "",
              f"- mode: `{payload.get('mode', 'rocm-runtime')}`",
              f"- status: `{payload.get('status', 'missing_receipt')}`",
              f"- clean_container_smoke_ready: `{payload.get('clean_container_smoke_ready', False)}`",
              f"- container_runtime_proof_ready: `{payload.get('container_runtime_proof_ready', False)}`",
              f"- validated_runner_namespace_runtime_qualified: `{payload.get('validated_runner_namespace_runtime_qualified', False)}`",
              f"- customer_execution_enabled: `{payload.get('customer_execution_enabled', False)}`",
              f"- product_runner_claim_metadata_ready: `{payload.get('product_runner_claim_metadata_ready', False)}`",
              f"- blockers: `{payload.get('blockers', [])}`",
              f"- runtime_neighbor_release_scaling_status: `{payload.get('runtime_neighbor_release_scaling_status', 'missing_scaling_receipt')}`",
              f"- runtime_neighbor_release_scaling_ready: `{payload.get('runtime_neighbor_release_scaling_ready', False)}`",
              f"- runtime_neighbor_release_atom_counts_ready: `{payload.get('runtime_neighbor_release_atom_counts_ready', False)}`",
              f"- runtime_neighbor_release_pair_count_slope: `{payload.get('runtime_neighbor_release_pair_count_slope', '')}`",
              f"- rust_hip_neighbor_provider_parity_status: `{payload.get('rust_hip_neighbor_provider_parity_status', 'missing_parity_receipt')}`",
              f"- rust_hip_neighbor_provider_parity_ready: `{payload.get('rust_hip_neighbor_provider_parity_ready', False)}`",
              f"- rust_hip_neighbor_provider_parity_max_distance_abs_delta: `{payload.get('rust_hip_neighbor_provider_parity_max_distance_abs_delta', '')}`",
              f"- rust_hip_neighbor_provider_parity_max_energy_abs_error: `{payload.get('rust_hip_neighbor_provider_parity_max_energy_abs_error', '')}`",
              "",
              payload.get(
                  "claim_boundary",
                  "ROCm runtime smoke does not qualify validated execution; a separately pinned namespace runtime receipt is also required.",
              ),
              "",
          ]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              Path(summary_path).write_text("\n".join(lines), encoding="utf-8")
          else:
              print("\n".join(lines))
          PY
