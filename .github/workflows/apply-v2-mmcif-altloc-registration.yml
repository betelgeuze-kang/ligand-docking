name: apply-v2-mmcif-altloc-registration

on:
  pull_request:
    paths:
      - ".github/workflows/apply-v2-mmcif-altloc-registration.yml"

permissions:
  contents: write

concurrency:
  group: apply-v2-mmcif-altloc-registration
  cancel-in-progress: false

jobs:
  register-capability:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'betelgeuze-kang' &&
      github.head_ref == 'codex/v2-mmcif-altloc-declarations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/v2-mmcif-altloc-declarations
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply exact export capability and canonical registrations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(f"unexpected replacement count in {path}: {old!r}")
              file.write_text(source.replace(old, new, 1), encoding="utf-8")

          init_import = '''from .mmcif_altloc_declarations import (
              ATOM_SITE_CATEGORY,
              MAX_MMCIF_ALTLOC_DECLARATION_INTEGER,
              MAX_MMCIF_ALTLOC_DECLARATION_ROWS,
              MAX_MMCIF_ALTLOC_DECLARATION_TOKEN_CHARS,
              MMCIF_ALTLOC_DECLARATION_DOCUMENT_SCHEMA_ID,
              MMCIF_ALTLOC_DECLARATION_PARSER_VERSION,
              MMCIF_ALTLOC_DECLARATION_PROFILE_ID,
              MMCIF_ALTLOC_DECLARATION_PROJECTION_SCHEMA_ID,
              MMCIF_ALTLOC_DECLARATION_SOURCE_BINDING_SCHEMA_ID,
              MMCIF_ALTLOC_REQUIRED_HEADERS,
              MmcifAltlocAtomDeclaration,
              MmcifAltlocDeclarationError,
              MmcifAltlocDeclarationSnapshot,
              mmcif_altloc_declaration_document,
              mmcif_altloc_declaration_json_bytes,
              mmcif_altloc_declaration_projection,
              mmcif_altloc_declaration_source_binding,
              parse_mmcif_altloc_declarations,
              require_mmcif_altloc_declaration_document,
              write_mmcif_altloc_declaration_json,
          )
          '''
          replace_once(
              "betelgeuze_engine_v2/molecular/__init__.py",
              "from .mmcif_semantics import (\n",
              init_import + "from .mmcif_semantics import (\n",
          )
          init_names = '''    "ATOM_SITE_CATEGORY",
              "MAX_MMCIF_ALTLOC_DECLARATION_INTEGER",
              "MAX_MMCIF_ALTLOC_DECLARATION_ROWS",
              "MAX_MMCIF_ALTLOC_DECLARATION_TOKEN_CHARS",
              "MMCIF_ALTLOC_DECLARATION_DOCUMENT_SCHEMA_ID",
              "MMCIF_ALTLOC_DECLARATION_PARSER_VERSION",
              "MMCIF_ALTLOC_DECLARATION_PROFILE_ID",
              "MMCIF_ALTLOC_DECLARATION_PROJECTION_SCHEMA_ID",
              "MMCIF_ALTLOC_DECLARATION_SOURCE_BINDING_SCHEMA_ID",
              "MMCIF_ALTLOC_REQUIRED_HEADERS",
              "MmcifAltlocAtomDeclaration",
              "MmcifAltlocDeclarationError",
              "MmcifAltlocDeclarationSnapshot",
          '''
          replace_once(
              "betelgeuze_engine_v2/molecular/__init__.py",
              '__all__ = [\n    "ATOM_CATEGORY",\n',
              '__all__ = [\n' + init_names + '    "ATOM_CATEGORY",\n',
          )
          init_functions = '''    "mmcif_altloc_declaration_document",
              "mmcif_altloc_declaration_json_bytes",
              "mmcif_altloc_declaration_projection",
              "mmcif_altloc_declaration_source_binding",
              "parse_mmcif_altloc_declarations",
              "require_mmcif_altloc_declaration_document",
              "write_mmcif_altloc_declaration_json",
          '''
          replace_once(
              "betelgeuze_engine_v2/molecular/__init__.py",
              '    "mmcif_semantic_document",\n',
              init_functions + '    "mmcif_semantic_document",\n',
          )

          replace_once(
              "betelgeuze_engine_v2/capabilities.py",
              'MMCIF_ZERO_OCCUPANCY_CAPABILITY_ID = (\n    "v2_bounded_mmcif_zero_occupancy_declarations"\n)\n',
              'MMCIF_ZERO_OCCUPANCY_CAPABILITY_ID = (\n    "v2_bounded_mmcif_zero_occupancy_declarations"\n)\n'
              'MMCIF_ALTLOC_DECLARATIONS_CAPABILITY_ID = "v2_bounded_mmcif_altloc_declarations"\n',
          )
          capability_blockers = '''    MMCIF_ALTLOC_DECLARATIONS_CAPABILITY_ID: (
              "conformer_selection_not_implemented",
              "coordinate_and_occupancy_values_not_interpreted",
              "altloc_population_and_missingness_not_inferred",
              "mmcif_chemistry_topology_and_preparation_not_interpreted",
              "product_integration_not_qualified",
          ),
          '''
          replace_once(
              "betelgeuze_engine_v2/capabilities.py",
              '    PHYSICS_REGISTRY_CAPABILITY_ID: (\n',
              capability_blockers + '    PHYSICS_REGISTRY_CAPABILITY_ID: (\n',
          )
          capability_row = '''            MMCIF_ALTLOC_DECLARATIONS_CAPABILITY_ID: _row(
                  MMCIF_ALTLOC_DECLARATIONS_CAPABILITY_ID,
                  current_state="bounded_polymer_atom_site_altloc_declarations",
                  internal_execution_enabled=True,
                  blocker_source="betelgeuze_engine_v2.capabilities.CAPABILITY_BLOCKERS",
              ),
          '''
          replace_once(
              "betelgeuze_engine_v2/capabilities.py",
              '            PHYSICS_REGISTRY_CAPABILITY_ID: _row(\n',
              capability_row + '            PHYSICS_REGISTRY_CAPABILITY_ID: _row(\n',
          )
          replace_once(
              "betelgeuze_engine_v2/capabilities.py",
              '    "MMCIF_SEMANTICS_CAPABILITY_ID",\n',
              '    "MMCIF_ALTLOC_DECLARATIONS_CAPABILITY_ID",\n'
              '    "MMCIF_SEMANTICS_CAPABILITY_ID",\n',
          )

          config_row = '''  v2_bounded_mmcif_altloc_declarations:
              current_state: bounded_polymer_atom_site_altloc_declarations
              implemented: true
              reference_contract_ready: true
              internal_reference_execution_enabled: true
              calibrated: false
              scientifically_validated: false
              public_evidence_ready: false
              benchmark_validated: false
              product_qualified: false
              customer_execution_enabled: false
              claim_safe: false
              blocker_source: betelgeuze_engine_v2.capabilities.CAPABILITY_BLOCKERS
              blockers:
                - conformer_selection_not_implemented
                - coordinate_and_occupancy_values_not_interpreted
                - altloc_population_and_missingness_not_inferred
                - mmcif_chemistry_topology_and_preparation_not_interpreted
                - product_integration_not_qualified

          '''
          replace_once(
              "config/independent_engine_v2_capabilities.yaml",
              "  v2_independent_physics_registry:\n",
              config_row + "  v2_independent_physics_registry:\n",
          )

          replace_once(
              "tests/unit/test_engine_v2_post_merge_state.py",
              "    MMCIF_SEMANTICS_CAPABILITY_ID,\n",
              "    MMCIF_ALTLOC_DECLARATIONS_CAPABILITY_ID,\n"
              "    MMCIF_SEMANTICS_CAPABILITY_ID,\n",
          )
          replace_once(
              "tests/unit/test_engine_v2_post_merge_state.py",
              '    assert len(loaded["capabilities"]) == 11\n',
              '    assert len(loaded["capabilities"]) == 12\n',
          )
          replace_once(
              "tests/unit/test_engine_v2_post_merge_state.py",
              "    assert MMCIF_SEMANTICS_CAPABILITY_ID in rows\n",
              "    assert MMCIF_ALTLOC_DECLARATIONS_CAPABILITY_ID in rows\n"
              "    assert MMCIF_SEMANTICS_CAPABILITY_ID in rows\n",
          )
          altloc_assertions = '''    altloc = rows[MMCIF_ALTLOC_DECLARATIONS_CAPABILITY_ID]
              assert altloc["current_state"] == "bounded_polymer_atom_site_altloc_declarations"
              assert altloc["internal_reference_execution_enabled"] is True
              assert "conformer_selection_not_implemented" in altloc["blockers"]
              assert "coordinate_and_occupancy_values_not_interpreted" in altloc["blockers"]
              assert "altloc_population_and_missingness_not_inferred" in altloc["blockers"]
              assert "mmcif_chemistry_topology_and_preparation_not_interpreted" in altloc["blockers"]

          '''
          replace_once(
              "tests/unit/test_engine_v2_post_merge_state.py",
              "    physics_blockers = rows[PHYSICS_REGISTRY_CAPABILITY_ID][\"blockers\"]\n",
              altloc_assertions
              + "    physics_blockers = rows[PHYSICS_REGISTRY_CAPABILITY_ID][\"blockers\"]\n",
          )
          replace_once(
              "tests/unit/test_engine_v2_post_merge_state.py",
              '        "test_engine_v2_mmcif_zero_occupancy.py",\n',
              '        "test_engine_v2_mmcif_zero_occupancy.py",\n'
              '        "test_engine_v2_mmcif_altloc_declarations.py",\n',
          )

          main_workflow = ".github/workflows/ci-engine-v2-main.yml"
          replace_once(
              main_workflow,
              "            tests/unit/test_engine_v2_mmcif_zero_occupancy.py\n",
              "            tests/unit/test_engine_v2_mmcif_zero_occupancy.py\n"
              "            tests/unit/test_engine_v2_mmcif_altloc_declarations.py\n",
          )
          replace_once(
              main_workflow,
              "            tests/unit/test_engine_v2_mmcif_zero_occupancy.py \\\n",
              "            tests/unit/test_engine_v2_mmcif_zero_occupancy.py \\\n"
              "            tests/unit/test_engine_v2_mmcif_altloc_declarations.py \\\n",
          )
          replace_once(
              main_workflow,
              "          from betelgeuze_engine_v2.molecular.mmcif_zero_occupancy import (\n",
              "          from betelgeuze_engine_v2.molecular.mmcif_altloc_declarations import (\n"
              "              MMCIF_ALTLOC_DECLARATION_DOCUMENT_SCHEMA_ID,\n"
              "          )\n"
              "          from betelgeuze_engine_v2.molecular.mmcif_zero_occupancy import (\n",
          )
          replace_once(
              main_workflow,
              '          assert MMCIF_ZERO_OCCUPANCY_DOCUMENT_SCHEMA_ID.endswith("/1.0.0")\n',
              '          assert MMCIF_ALTLOC_DECLARATION_DOCUMENT_SCHEMA_ID.endswith("/1.0.0")\n'
              '          assert MMCIF_ZERO_OCCUPANCY_DOCUMENT_SCHEMA_ID.endswith("/1.0.0")\n',
          )

          focused = ".github/workflows/ci-engine-v2-mmcif-altloc-declarations.yml"
          replace_once(
              focused,
              '      - "tests/unit/test_engine_v2_mmcif_altloc_declarations.py"\n',
              '      - "betelgeuze_engine_v2/molecular/__init__.py"\n'
              '      - "betelgeuze_engine_v2/capabilities.py"\n'
              '      - "config/independent_engine_v2_capabilities.yaml"\n'
              '      - "tests/unit/test_engine_v2_mmcif_altloc_declarations.py"\n'
              '      - "tests/unit/test_engine_v2_post_merge_state.py"\n'
              '      - ".github/workflows/ci-engine-v2-main.yml"\n',
          )
          replace_once(
              focused,
              "            tools/check_engine_v2_architecture.py\n",
              "            config/independent_engine_v2_capabilities.yaml\n"
              "            tools/check_engine_v2_architecture.py\n"
              "            tests/unit/test_engine_v2_post_merge_state.py\n"
              "            docs/engine_v2_status.md\n"
              "            docs/engine_v2_public_api.md\n"
              "            docs/entrypoints.md\n"
              "            README.md\n"
              "            README.ko.md\n"
              "            .github/workflows/ci-engine-v2-main.yml\n",
          )
          replace_once(
              focused,
              "          python -m pip install pytest==8.3.5 numpy==1.26.4\n",
              "          python -m pip install pytest==8.3.5 PyYAML==6.0.3 numpy==1.26.4\n",
          )
          replace_once(
              focused,
              "            tests/unit/test_engine_v2_mmcif_altloc_declarations.py \\\n",
              "            tests/unit/test_engine_v2_mmcif_altloc_declarations.py \\\n"
              "            tests/unit/test_engine_v2_post_merge_state.py \\\n",
          )

          Path(".github/workflows/apply-v2-mmcif-altloc-registration.yml").unlink()
          PY

          python -m py_compile \
            betelgeuze_engine_v2/capabilities.py \
            betelgeuze_engine_v2/molecular/__init__.py \
            betelgeuze_engine_v2/molecular/mmcif_altloc_declarations.py \
            tests/unit/test_engine_v2_mmcif_altloc_declarations.py \
            tests/unit/test_engine_v2_post_merge_state.py
          git diff --check

      - name: Commit registration and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(v2): register bounded mmCIF altloc declarations"
          git push origin HEAD:codex/v2-mmcif-altloc-declarations
