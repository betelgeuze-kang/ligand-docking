name: ci-engine-v2-mmcif-nonpoly-partial-charges

on:
  pull_request:
    paths:
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_partial_charge_assignments.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_all_atom_round_trip.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_parameter_source_binding.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_preparation_corpus.py"
      - "betelgeuze_engine_v2/molecular/__init__.py"
      - "betelgeuze_engine_v2/capabilities.py"
      - "config/independent_engine_v2_capabilities.yaml"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_partial_charge_assignments.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_all_atom_round_trip.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_preparation_corpus.py"
      - "tests/unit/test_engine_v2_commercial_roadmap.py"
      - "tests/unit/test_engine_v2_post_merge_state.py"
      - "docs/engine_v2_status.md"
      - "docs/independent_engine_v2_commercial_roadmap.ko.md"
      - "docs/roadmaps/engine-v2-scientific-evidence-roadmap.md"
      - ".github/workflows/ci-engine-v2-mmcif-nonpoly-partial-charges.yml"
      - ".github/workflows/ci-engine-v2-mmcif-nonpoly-all-atom-round-trip.yml"
      - ".github/workflows/ci-engine-v2-mmcif-nonpoly-parameter-source-binding.yml"
      - ".github/workflows/ci-engine-v2-mmcif-nonpoly-preparation-corpus.yml"
      - ".github/workflows/ci-engine-v2-main.yml"
  push:
    branches: ["main"]
    paths:
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_partial_charge_assignments.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_all_atom_round_trip.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_parameter_source_binding.py"
      - "betelgeuze_engine_v2/molecular/mmcif_nonpoly_preparation_corpus.py"
      - "betelgeuze_engine_v2/molecular/__init__.py"
      - "betelgeuze_engine_v2/capabilities.py"
      - "config/independent_engine_v2_capabilities.yaml"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_partial_charge_assignments.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_all_atom_round_trip.py"
      - "tests/unit/test_engine_v2_mmcif_nonpoly_preparation_corpus.py"
      - "tests/unit/test_engine_v2_commercial_roadmap.py"
      - "tests/unit/test_engine_v2_post_merge_state.py"
      - "docs/engine_v2_status.md"
      - "docs/independent_engine_v2_commercial_roadmap.ko.md"
      - "docs/roadmaps/engine-v2-scientific-evidence-roadmap.md"
      - ".github/workflows/ci-engine-v2-mmcif-nonpoly-partial-charges.yml"
      - ".github/workflows/ci-engine-v2-mmcif-nonpoly-all-atom-round-trip.yml"
      - ".github/workflows/ci-engine-v2-mmcif-nonpoly-parameter-source-binding.yml"
      - ".github/workflows/ci-engine-v2-mmcif-nonpoly-preparation-corpus.yml"
      - ".github/workflows/ci-engine-v2-main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-mmcif-nonpoly-partial-charges-${{ github.ref }}
  cancel-in-progress: true

jobs:
  partial-charges:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out bounded partial charge surface
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            betelgeuze_engine_v2
            config/independent_engine_v2_capabilities.yaml
            tools/check_engine_v2_architecture.py
            tests/unit/test_engine_v2_mmcif_nonpoly_partial_charge_assignments.py
            tests/unit/test_engine_v2_mmcif_nonpoly_all_atom_round_trip.py
            tests/unit/test_engine_v2_mmcif_nonpoly_preparation_corpus.py
            tests/unit/test_engine_v2_commercial_roadmap.py
            tests/unit/test_engine_v2_post_merge_state.py
            docs/engine_v2_status.md
            docs/engine_v2_public_api.md
            docs/independent_engine_v2_commercial_roadmap.ko.md
            docs/roadmaps/engine-v2-scientific-evidence-roadmap.md
            docs/entrypoints.md
            README.md
            README.ko.md
            .github/workflows/ci-engine-v2-mmcif-nonpoly-partial-charges.yml
            .github/workflows/ci-engine-v2-mmcif-nonpoly-all-atom-round-trip.yml
            .github/workflows/ci-engine-v2-mmcif-nonpoly-parameter-source-binding.yml
            .github/workflows/ci-engine-v2-mmcif-nonpoly-preparation-corpus.yml
            .github/workflows/ci-engine-v2-main.yml
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused CPU dependencies
        run: |
          python -m pip install pip==25.0.1
          python -m pip install pytest==8.3.5 PyYAML==6.0.3 numpy==1.26.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and enforce architecture boundary
        shell: bash
        run: |
          set +e
          {
            python -m compileall -q betelgeuze_engine_v2
            python tools/check_engine_v2_architecture.py
          } > mmcif-nonpoly-partial-charges.log 2>&1
          status=$?
          cat mmcif-nonpoly-partial-charges.log
          exit "$status"

      - name: Run partial charge and registry contracts
        shell: bash
        run: |
          set +e
          python -m pytest -vv -x \
            tests/unit/test_engine_v2_mmcif_nonpoly_partial_charge_assignments.py \
            tests/unit/test_engine_v2_mmcif_nonpoly_all_atom_round_trip.py \
            tests/unit/test_engine_v2_mmcif_nonpoly_preparation_corpus.py \
            tests/unit/test_engine_v2_commercial_roadmap.py \
            tests/unit/test_engine_v2_post_merge_state.py \
            >> mmcif-nonpoly-partial-charges.log 2>&1
          status=$?
          cat mmcif-nonpoly-partial-charges.log
          exit "$status"

      - name: Upload partial charge diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mmcif-nonpoly-partial-charges-py${{ matrix.python-version }}-${{ github.run_id }}
          path: mmcif-nonpoly-partial-charges.log
          if-no-files-found: error
          retention-days: 7
