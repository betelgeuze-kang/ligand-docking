name: ci-public-selector-shadow

on:
  pull_request:
    paths:
      - 'betelgeuze_engine/product/public_assay_selector_shadow.py'
      - 'betelgeuze_engine/product/runners/htvs_pipeline.py'
      - 'tests/unit/test_public_assay_selector_shadow.py'
      - 'tests/unit/test_htvs_public_assay_shadow_integration.py'
      - 'tests/unit/test_public_chembl_selector_shadow.py'
      - 'docs/public_assay_selector_shadow.md'
      - '.github/workflows/ci-public-selector-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'betelgeuze_engine/product/public_assay_selector_shadow.py'
      - 'betelgeuze_engine/product/runners/htvs_pipeline.py'
      - 'tests/unit/test_public_assay_selector_shadow.py'
      - 'tests/unit/test_htvs_public_assay_shadow_integration.py'
      - 'tests/unit/test_public_chembl_selector_shadow.py'
      - 'docs/public_assay_selector_shadow.md'
      - '.github/workflows/ci-public-selector-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-public-selector-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-pre-docking-shadow-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Record checkout and source identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, sys
          files = [
              'betelgeuze_engine/product/public_assay_selector_shadow.py',
              'betelgeuze_engine/product/runners/htvs_pipeline.py',
              'tests/unit/test_public_assay_selector_shadow.py',
              'tests/unit/test_htvs_public_assay_shadow_integration.py',
              'tests/unit/test_public_chembl_selector_shadow.py',
              'docs/public_assay_selector_shadow.md',
              '.github/workflows/ci-public-selector-shadow.yml',
          ]
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          value = {
              'checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'checkout_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'pull_request_head_sha': event.get('pull_request', {}).get('head', {}).get('sha'),
              'github_sha': os.environ['GITHUB_SHA'],
              'cwd': str(pathlib.Path.cwd()), 'python': sys.version, 'platform': platform.platform(),
              'source_sha256': {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in files},
              'scope': 'synthetic shadow contracts; no public-data download, training, docking or protected holdouts',
          }
          pathlib.Path('public-selector-source.json').write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')
          PY
      - name: Install CPU test dependencies
        run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4 scipy==1.15.3 scikit-learn==1.7.2 pandas==2.2.3 PyYAML==6.0.2 rdkit==2026.3.6 ruff==0.11.13
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip freeze > public-selector-dependencies.txt
      - name: Exercise synthetic selector and canonical HTVS interception
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --isolated --no-cache betelgeuze_engine/product/public_assay_selector_shadow.py tests/unit/test_public_assay_selector_shadow.py tests/unit/test_htvs_public_assay_shadow_integration.py tests/unit/test_public_chembl_selector_shadow.py 2>&1 | tee public-selector-lint.log
          set +e
          python -m pytest --rootdir="$PWD" -c /dev/null --noconftest -p no:cacheprovider -W error -vv tests/unit/test_public_assay_selector_shadow.py tests/unit/test_htvs_public_assay_shadow_integration.py tests/unit/test_public_chembl_selector_shadow.py --junitxml=public-selector-junit.xml 2>&1 | tee public-selector.log
          pytest_status=${PIPESTATUS[0]}
          set -e
          printf '{"pytest_exit_code": %s}\n' "$pytest_status" > public-selector-exit.json
          exit "$pytest_status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: public-selector-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public-selector.log
            public-selector-lint.log
            public-selector-junit.xml
            public-selector-exit.json
            public-selector-source.json
            public-selector-dependencies.txt
            betelgeuze_engine/product/public_assay_selector_shadow.py
            betelgeuze_engine/product/runners/htvs_pipeline.py
            tests/unit/test_public_assay_selector_shadow.py
            tests/unit/test_htvs_public_assay_shadow_integration.py
            tests/unit/test_public_chembl_selector_shadow.py
            docs/public_assay_selector_shadow.md
            .github/workflows/ci-public-selector-shadow.yml
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
