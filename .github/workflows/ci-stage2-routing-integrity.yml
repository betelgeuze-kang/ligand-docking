name: ci-stage2-routing-integrity

on:
  pull_request:
    paths:
      - 'tools/product/stage2_skip_router.py'
      - 'tools/product/merge_stage2_manifests.py'
      - 'tools/product/generate_ligand_trajectory_batch.py'
      - 'tools/generate_ligand_trajectory_engine.py'
      - 'betelgeuze_engine/product/runners/htvs_pipeline.py'
      - 'tests/unit/test_stage2_skip_router_integrity.py'
      - 'tests/unit/test_htvs_stage2_router_integration.py'
      - 'tests/unit/test_stage2_manifest_integrity.py'
      - 'tests/unit/test_run_ligand_htvs_pipeline_contract_claim.py'
      - '.github/workflows/ci-stage2-routing-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'tools/product/stage2_skip_router.py'
      - 'tools/product/merge_stage2_manifests.py'
      - 'tools/product/generate_ligand_trajectory_batch.py'
      - 'tools/generate_ligand_trajectory_engine.py'
      - 'betelgeuze_engine/product/runners/htvs_pipeline.py'
      - 'tests/unit/test_stage2_skip_router_integrity.py'
      - 'tests/unit/test_htvs_stage2_router_integration.py'
      - 'tests/unit/test_stage2_manifest_integrity.py'
      - 'tests/unit/test_run_ligand_htvs_pipeline_contract_claim.py'
      - '.github/workflows/ci-stage2-routing-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-stage2-routing-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing-software-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install CPU software test dependencies
        run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4 pandas==2.2.3 PyYAML==6.0.2
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check routing and mocked HTVS orchestration
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --confcutdir=tests/unit -W error -vv \
            tests/unit/test_stage2_skip_router_integrity.py \
            tests/unit/test_htvs_stage2_router_integration.py \
            tests/unit/test_stage2_manifest_integrity.py \
            --junitxml=stage2-routing-junit.xml 2>&1 | tee stage2-routing.log
          python -m pytest --confcutdir=tests/unit -W error -vv \
            tests/unit/test_run_ligand_htvs_pipeline_contract_claim.py \
            -k 'stage2 or preset or sla' \
            --junitxml=stage2-consumer-regression-junit.xml 2>&1 | tee stage2-consumer-regression.log
      - name: Preserve exact test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stage2-routing.log
            stage2-routing-junit.xml
            stage2-consumer-regression.log
            stage2-consumer-regression-junit.xml
            tools/product/stage2_skip_router.py
            tools/product/merge_stage2_manifests.py
            tools/product/generate_ligand_trajectory_batch.py
            tools/generate_ligand_trajectory_engine.py
            betelgeuze_engine/product/runners/htvs_pipeline.py
            tests/unit/test_stage2_skip_router_integrity.py
            tests/unit/test_htvs_stage2_router_integration.py
            tests/unit/test_stage2_manifest_integrity.py
            tests/unit/test_run_ligand_htvs_pipeline_contract_claim.py
          if-no-files-found: error
          retention-days: 7
