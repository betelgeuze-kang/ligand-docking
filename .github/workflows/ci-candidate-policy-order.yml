name: ci-candidate-policy-order
on:
  pull_request:
    paths:
      - 'tools/product/compare_prepared_candidate_policies.py'
      - 'tests/unit/test_candidate_policy_order_v2.py'
      - '.github/workflows/ci-candidate-policy-order.yml'
  push:
    branches: [main]
    paths:
      - 'tools/product/compare_prepared_candidate_policies.py'
      - 'tests/unit/test_candidate_policy_order_v2.py'
      - '.github/workflows/ci-candidate-policy-order.yml'
permissions:
  contents: read
jobs:
  policy-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4 scipy==1.15.3 scikit-learn==1.7.2 rdkit==2026.3.6 ruff==0.12.4
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Check policy contracts and actual workers
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree} > policy-checkout.txt
          python -m pip freeze > policy-dependencies.txt
          sha256sum tools/product/compare_prepared_candidate_policies.py tests/unit/test_candidate_policy_order_v2.py > policy-sources.sha256
          python -m ruff check --isolated --no-cache tools/product/compare_prepared_candidate_policies.py tests/unit/test_candidate_policy_order_v2.py
          python -m pytest --rootdir="$PWD" -c /dev/null --noconftest -p no:cacheprovider -W error -q tests/unit/test_prepared_candidate_comparison.py tests/unit/test_candidate_policy_order_v2.py --junitxml=policy-junit.xml 2>&1 | tee policy-tests.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: candidate-order-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            policy-*.txt
            policy-*.sha256
            policy-*.xml
            policy-*.log
          if-no-files-found: error
          retention-days: 14
