name: ci-ai-evidence

on:
  pull_request:
    paths:
      - 'tools/train_residual_production_score_model.py'
      - 'tools/builder_json_utils.py'
      - 'tools/product/builder_json_utils.py'
      - 'tools/product/stage2_skip_router.py'
      - 'tests/unit/test_train_residual_production_score_model.py'
      - 'tests/unit/test_residual_training_integrity.py'
      - 'tools/product/build_residual_production_supervised_dataset.py'
      - 'tools/product/residual_evidence.py'
      - 'tools/builder_table_utils.py'
      - 'tools/product/builder_table_utils.py'
      - 'tests/unit/test_build_residual_production_supervised_dataset.py'
      - 'tests/unit/test_residual_evidence_pairs.py'
      - '.github/workflows/ci-ai-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'tools/train_residual_production_score_model.py'
      - 'tools/builder_json_utils.py'
      - 'tools/product/builder_json_utils.py'
      - 'tools/product/stage2_skip_router.py'
      - 'tests/unit/test_train_residual_production_score_model.py'
      - 'tests/unit/test_residual_training_integrity.py'
      - 'tools/product/build_residual_production_supervised_dataset.py'
      - 'tools/product/residual_evidence.py'
      - 'tools/builder_table_utils.py'
      - 'tools/product/builder_table_utils.py'
      - 'tests/unit/test_build_residual_production_supervised_dataset.py'
      - 'tests/unit/test_residual_evidence_pairs.py'
      - '.github/workflows/ci-ai-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-ai-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-evidence-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4 scikit-learn==1.6.1
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run synthetic training and evidence integrity tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools/train_residual_production_score_model.py tools/product/stage2_skip_router.py
          python -m pytest --confcutdir=tests/unit -W error -vv \
            tests/unit/test_train_residual_production_score_model.py \
            tests/unit/test_residual_training_integrity.py \
            tests/unit/test_build_residual_production_supervised_dataset.py \
            tests/unit/test_residual_evidence_pairs.py \
            --junitxml=ai-evidence-junit.xml 2>&1 | tee ai-evidence.log
      - name: Preserve exact test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ai-evidence.log
            ai-evidence-junit.xml
            tools/product/build_residual_production_supervised_dataset.py
            tools/product/residual_evidence.py
            tools/builder_table_utils.py
            tools/product/builder_table_utils.py
            tests/unit/test_build_residual_production_supervised_dataset.py
            tests/unit/test_residual_evidence_pairs.py
            tools/train_residual_production_score_model.py
            tools/product/stage2_skip_router.py
            tests/unit/test_train_residual_production_score_model.py
            tests/unit/test_residual_training_integrity.py
          if-no-files-found: error
          retention-days: 7
