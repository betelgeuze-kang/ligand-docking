name: ci-residual-shadow-contract

on:
  pull_request:
    paths:
      - 'betelgeuze_engine/product/residual_score_contract.py'
      - 'betelgeuze_engine/product/residual_score_shadow.py'
      - 'betelgeuze_engine/product/runners/backmapping_scoring.py'
      - 'tools/train_residual_production_score_model.py'
      - 'tests/unit/test_residual_score_shadow_contract.py'
      - 'tests/unit/test_backmapping_residual_model_shadow.py'
      - '.github/workflows/ci-residual-shadow-contract.yml'
  push:
    branches: [main]
    paths:
      - 'betelgeuze_engine/product/residual_score_contract.py'
      - 'betelgeuze_engine/product/residual_score_shadow.py'
      - 'betelgeuze_engine/product/runners/backmapping_scoring.py'
      - 'tools/train_residual_production_score_model.py'
      - 'tests/unit/test_residual_score_shadow_contract.py'
      - 'tests/unit/test_backmapping_residual_model_shadow.py'
      - '.github/workflows/ci-residual-shadow-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-residual-shadow-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-shadow-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4 scikit-learn==1.6.1 pandas==2.2.3 PyYAML==6.0.2
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Exercise exact saved model and canonical consumer with synthetic observations
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --confcutdir=tests/unit -W error -vv tests/unit/test_residual_score_shadow_contract.py tests/unit/test_backmapping_residual_model_shadow.py --junitxml=residual-shadow-junit.xml 2>&1 | tee residual-shadow.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: residual-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            residual-shadow.log
            residual-shadow-junit.xml
            betelgeuze_engine/product/residual_score_contract.py
            betelgeuze_engine/product/residual_score_shadow.py
            betelgeuze_engine/product/runners/backmapping_scoring.py
            tools/train_residual_production_score_model.py
            tests/unit/test_residual_score_shadow_contract.py
            tests/unit/test_backmapping_residual_model_shadow.py
          if-no-files-found: error
          retention-days: 14
