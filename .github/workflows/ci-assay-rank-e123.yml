name: ci-assay-rank-e123
on:
  pull_request:
    paths:
      - 'betelgeuze_product/public_assay*.py'
      - 'betelgeuze_product/residual_evidence.py'
      - 'betelgeuze_engine/product/*.py'
      - 'tools/product/*.py'
      - 'tests/unit/test_public_assay*.py'
      - 'tests/unit/test_paired_rank_metrics.py'
      - 'tests/unit/test_prepared_rank_workflow.py'
      - 'tests/unit/test_prepared_candidate_comparison.py'
      - 'tests/unit/test_censored_rank_metrics.py'
      - 'tools/benchmark_paired_rank_metrics.py'
      - 'tools/verify_assay_rank_install.py'
      - 'pyproject.toml'
      - '.github/workflows/ci-assay-rank-e123.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: assay-rank-e123-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assay-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      PYTHONPATH: .
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies
        run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4 scipy==1.15.3 scikit-learn==1.7.2 rdkit==2026.3.6 ruff==0.12.4 build==1.2.2.post1 setuptools==75.8.2 wheel==0.45.1
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Record source and environment
        run: |
          mkdir -p e123-evidence
          git rev-parse HEAD > e123-evidence/checkout.txt
          git rev-parse 'HEAD^{tree}' >> e123-evidence/checkout.txt
          python -m pip freeze > e123-evidence/dependencies.txt
          sha256sum betelgeuze_product/public_assay_preflight.py betelgeuze_engine/product/paired_rank_metrics.py tools/product/compare_prepared_candidate_ranks.py > e123-evidence/implementation.sha256
      - name: Lint changed production and new regression code
        run: |
          python -m ruff check --isolated --no-cache betelgeuze_product/public_assay_preflight.py betelgeuze_engine/product/paired_rank_metrics.py tools/product/compare_prepared_candidate_ranks.py tests/unit/test_public_assay_preflight_v2.py tests/unit/test_paired_rank_metrics.py tests/unit/test_prepared_rank_workflow.py tools/benchmark_paired_rank_metrics.py tools/verify_assay_rank_install.py
          git diff --check
      - name: Existing and new contracts with real CPU arms
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --rootdir="$PWD" -c /dev/null --noconftest -p no:cacheprovider -W error -vv tests/unit/test_public_assay_preflight.py tests/unit/test_public_assay_preflight_v2.py tests/unit/test_paired_rank_metrics.py tests/unit/test_prepared_rank_workflow.py tests/unit/test_censored_rank_metrics.py tests/unit/test_prepared_candidate_comparison.py tests/unit/test_public_assay_components.py tests/unit/test_public_chembl_staged_intake.py --junitxml=e123-evidence/regressions.xml 2>&1 | tee e123-evidence/regressions.log
      - name: Retain exact summary memory and timing observations
        run: python tools/benchmark_paired_rank_metrics.py --output e123-evidence/metric-benchmark.json
      - name: Build product wheel and verify installed E1/E3 without source imports
        run: |
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/e123-wheels"
          python -m venv "$RUNNER_TEMP/e123-installed"
          "$RUNNER_TEMP/e123-installed/bin/python" -I -m pip install --no-deps "$RUNNER_TEMP"/e123-wheels/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/e123-installed/bin/python" -I "$GITHUB_WORKSPACE/tools/verify_assay_rank_install.py" > "$GITHUB_WORKSPACE/e123-evidence/installed.json"
          env -u PYTHONPATH "$RUNNER_TEMP/e123-installed/bin/python" -I "$GITHUB_WORKSPACE/tests/unit/test_public_assay_preflight.py" -v 2> "$GITHUB_WORKSPACE/e123-evidence/installed-preflight.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: assay-rank-e123-${{ matrix.python-version }}-${{ github.run_id }}
          path: e123-evidence/
          if-no-files-found: error
          retention-days: 14
