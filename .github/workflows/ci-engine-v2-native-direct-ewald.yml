name: ci-engine-v2-native-direct-ewald

on:
  pull_request:
    paths:
      - "include/betelgeuze/direct_ewald.h"
      - "include/betelgeuze/engine.h"
      - "native/CMakeLists.txt"
      - "native/betelgeuze_engine.map"
      - "native/src/context.cpp"
      - "native/src/ewald/**"
      - "native/src/internal.hpp"
      - "native/src/system.cpp"
      - "native/tests/check_exports.cmake"
      - "native/tests/direct_ewald.cpp"
      - "rust/Cargo.lock"
      - "rust/Cargo.toml"
      - "rust/cpu-kernel/**"
      - "rust/betelgeuze-sys/**"
      - "rust/betelgeuze-runtime/**"
      - "rust/reference-ewald/**"
      - "config/engine_v2_direct_ewald_reference_profile_v1.json"
      - "config/engine_v2_native_direct_ewald_cpu_profile_v1.json"
      - "config/engine_v2_native_direct_ewald_cpu_profile_v1_sources.json"
      - "docs/engine_v2_native_direct_ewald_cpu_v1.md"
      - "tools/__init__.py"
      - "tools/verify_engine_v2_native_direct_ewald_cpu_v1.py"
      - "tests/unit/test_engine_v2_native_direct_ewald_cpu_v1.py"
      - ".github/workflows/ci-engine-v2-native-direct-ewald.yml"
  push:
    branches: ["main"]
    paths:
      - "include/betelgeuze/direct_ewald.h"
      - "include/betelgeuze/engine.h"
      - "native/CMakeLists.txt"
      - "native/betelgeuze_engine.map"
      - "native/src/context.cpp"
      - "native/src/ewald/**"
      - "native/src/internal.hpp"
      - "native/src/system.cpp"
      - "native/tests/check_exports.cmake"
      - "native/tests/direct_ewald.cpp"
      - "rust/Cargo.lock"
      - "rust/Cargo.toml"
      - "rust/cpu-kernel/**"
      - "rust/betelgeuze-sys/**"
      - "rust/betelgeuze-runtime/**"
      - "rust/reference-ewald/**"
      - "config/engine_v2_direct_ewald_reference_profile_v1.json"
      - "config/engine_v2_native_direct_ewald_cpu_profile_v1.json"
      - "config/engine_v2_native_direct_ewald_cpu_profile_v1_sources.json"
      - "docs/engine_v2_native_direct_ewald_cpu_v1.md"
      - "tools/__init__.py"
      - "tools/verify_engine_v2_native_direct_ewald_cpu_v1.py"
      - "tests/unit/test_engine_v2_native_direct_ewald_cpu_v1.py"
      - ".github/workflows/ci-engine-v2-native-direct-ewald.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-native-direct-ewald-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immutable-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out the bounded evidence closure
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
          sparse-checkout: |
            include
            native
            rust
            config/engine_v2_direct_ewald_reference_profile_v1.json
            config/engine_v2_native_direct_ewald_cpu_profile_v1.json
            config/engine_v2_native_direct_ewald_cpu_profile_v1_sources.json
            docs/engine_v2_native_direct_ewald_cpu_v1.md
            tools/__init__.py
            tools/verify_engine_v2_native_direct_ewald_cpu_v1.py
            tests/unit/test_engine_v2_native_direct_ewald_cpu_v1.py
            .github/workflows/ci-engine-v2-native-direct-ewald.yml
          sparse-checkout-cone-mode: false

      - name: Report Python
        run: python3 --version

      - name: Verify canonical profile and source binding
        run: |
          python3 -m json.tool \
            config/engine_v2_native_direct_ewald_cpu_profile_v1.json >/dev/null
          python3 -m json.tool \
            config/engine_v2_native_direct_ewald_cpu_profile_v1_sources.json \
            >/dev/null
          python3 tools/verify_engine_v2_native_direct_ewald_cpu_v1.py

      - name: Verify fail-closed evidence tests
        run: |
          python3 -m pip install pytest==8.3.5
          python3 -m pytest -q \
            tests/unit/test_engine_v2_native_direct_ewald_cpu_v1.py
