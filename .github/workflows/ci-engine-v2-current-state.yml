name: ci-engine-v2-current-state

on:
  pull_request:
    paths:
      - "config/engine_v2_current_state_v1.json"
      - "config/independent_engine_v2_capabilities.yaml"
      - "docs/engine_v2_current_state_v1.md"
      - "docs/engine_v2_status.md"
      - "docs/engine_v2_stage0_status.md"
      - "docs/engine_v2_native_fixed64_cpu_qualification_v7_result.md"
      - "tools/verify_engine_v2_current_state_v1.py"
      - "tests/unit/test_verify_engine_v2_current_state_v1.py"
      - ".github/workflows/ci-engine-v2-current-state.yml"
  push:
    branches:
      - main
    paths:
      - "config/engine_v2_current_state_v1.json"
      - "config/independent_engine_v2_capabilities.yaml"
      - "docs/engine_v2_current_state_v1.md"
      - "docs/engine_v2_status.md"
      - "docs/engine_v2_stage0_status.md"
      - "docs/engine_v2_native_fixed64_cpu_qualification_v7_result.md"
      - "tools/verify_engine_v2_current_state_v1.py"
      - "tests/unit/test_verify_engine_v2_current_state_v1.py"
      - ".github/workflows/ci-engine-v2-current-state.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-v2-current-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current-state surface
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            config/engine_v2_current_state_v1.json
            config/independent_engine_v2_capabilities.yaml
            docs/engine_v2_current_state_v1.md
            docs/engine_v2_status.md
            docs/engine_v2_stage0_status.md
            docs/engine_v2_native_fixed64_cpu_qualification_v7_result.md
            tools/verify_engine_v2_current_state_v1.py
            tests/unit/test_verify_engine_v2_current_state_v1.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install pytest==8.3.5

      - name: Verify current state
        run: python tools/verify_engine_v2_current_state_v1.py --pretty

      - name: Compile verifier
        run: python -m py_compile tools/verify_engine_v2_current_state_v1.py

      - name: Run current-state tests
        run: python -m pytest -q tests/unit/test_verify_engine_v2_current_state_v1.py
