name: ci-reference-minimization-consumer
on:
  pull_request:
    paths:
      - 'betelgeuze_product/reference_minimization_workflow.py'
      - 'tests/unit/test_reference_minimization_workflow.py'
      - 'betelgeuze_engine_v2/physics/reference_minimization.py'
      - '.github/workflows/ci-reference-minimization-consumer.yml'
  push:
    branches: [main]
    paths:
      - 'betelgeuze_product/reference_minimization_workflow.py'
      - 'tests/unit/test_reference_minimization_workflow.py'
      - '.github/workflows/ci-reference-minimization-consumer.yml'
permissions:
  contents: read
jobs:
  reference-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BETELGEUZE_PRODUCT_TEST_ARTIFACT_BOOTSTRAP: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4 ruff==0.12.4 setuptools==75.8.0 wheel==0.45.1
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify actual solver and restart
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree} > minimization-checkout.txt
          python -m pip freeze > minimization-dependencies.txt
          sha256sum betelgeuze_product/reference_minimization_workflow.py tests/unit/test_reference_minimization_workflow.py > minimization-sources.sha256
          python -m ruff check --isolated --no-cache betelgeuze_product/reference_minimization_workflow.py tests/unit/test_reference_minimization_workflow.py
          python -m pytest --rootdir="$PWD" -c /dev/null --noconftest -p no:cacheprovider -W error -q tests/unit/test_reference_minimization_workflow.py tests/unit/test_engine_v2_reference_minimization.py tests/unit/test_engine_v2_reference_physics.py tests/unit/test_engine_v2_reference_parameter_applicability.py --junitxml=minimization-junit.xml 2>&1 | tee minimization-tests.log
      - name: Installed project execution outside checkout
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps --no-build-isolation . -w minimization-wheel
          python -m venv --system-site-packages "$RUNNER_TEMP/minimization-env"
          "$RUNNER_TEMP/minimization-env/bin/python" -m pip install --no-deps --force-reinstall minimization-wheel/*.whl
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tests.unit.test_reference_minimization_workflow import make_request
          root=Path(os.environ['RUNNER_TEMP'])
          request,_,_,_=make_request(root/'minimization-input')
          (root/'minimization-request.json').write_text(json.dumps(request))
          PY
          cd "$RUNNER_TEMP"
          P="$RUNNER_TEMP/minimization-env/bin/python"
          "$P" -I -c 'from pathlib import Path; import sys,betelgeuze_product.reference_minimization_workflow as w; assert Path(w.__file__).is_relative_to(Path(sys.prefix)); print(w.__file__)' > minimization-installed-import.txt
          "$P" -I -m betelgeuze_product.reference_minimization_workflow --request "$RUNNER_TEMP/minimization-request.json" --run-dir "$RUNNER_TEMP/minimization-run" > minimization-installed-execution.json
          "$P" -I -m betelgeuze_product.reference_minimization_workflow --request "$RUNNER_TEMP/minimization-request.json" --run-dir "$RUNNER_TEMP/minimization-run" --resume > minimization-installed-resume.json
          "$P" -I -m betelgeuze_product.reference_minimization_workflow --run-dir "$RUNNER_TEMP/minimization-run" --verify-run > minimization-installed-verification.json
          cp minimization-installed-* "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reference-minimization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            minimization-*.txt
            minimization-*.sha256
            minimization-*.xml
            minimization-*.log
            minimization-installed-*.json
          if-no-files-found: error
          retention-days: 14
