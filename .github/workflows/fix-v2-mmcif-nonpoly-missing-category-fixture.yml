name: fix-v2-mmcif-nonpoly-missing-category-fixture

on:
  pull_request:
    paths:
      - ".github/workflows/fix-v2-mmcif-nonpoly-missing-category-fixture.yml"

permissions:
  contents: write

concurrency:
  group: fix-v2-mmcif-nonpoly-missing-category-fixture
  cancel-in-progress: false

jobs:
  correct-fixture:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'betelgeuze-kang' &&
      github.head_ref == 'codex/v2-mmcif-nonpoly-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled feature branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/v2-mmcif-nonpoly-identity
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Build a syntactically valid source with the category omitted
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/test_engine_v2_mmcif_nonpoly_identity.py")
          source = path.read_text(encoding="utf-8")
          old = '''    missing = _source(
              entity_rows=PURE_ENTITY_ROWS,
              asym_rows=PURE_ASYM_ROWS,
              component_rows=PURE_COMPONENT_ROWS,
              entity_nonpoly_rows=(),
              scheme_rows=PURE_SCHEME_ROWS,
          )
          '''
          new = '''    missing = (
              "data_nonpoly\\n#\\n"
              + _loop(ENTITY_HEADERS, PURE_ENTITY_ROWS)
              + _loop(ASYM_HEADERS, PURE_ASYM_ROWS)
              + _loop(CHEM_COMP_HEADERS, PURE_COMPONENT_ROWS)
              + _loop(SCHEME_HEADERS, PURE_SCHEME_ROWS)
          )
          '''
          if source.count(old) != 1:
              raise SystemExit("missing-category fixture block drifted")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          Path(
              ".github/workflows/fix-v2-mmcif-nonpoly-missing-category-fixture.yml"
          ).unlink()
          PY
          python -m py_compile tests/unit/test_engine_v2_mmcif_nonpoly_identity.py
          git diff --check

      - name: Commit corrected fixture and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(v2): omit missing nonpoly category loop"
          git push origin HEAD:codex/v2-mmcif-nonpoly-identity
