name: ci-api-h4-hosted

on:
  pull_request:
    paths:
      - "api/**"
      - "tests/unit/test_api_h4_security_hardening.py"
      - "tests/unit/test_api_attempt_artifact_confinement.py"
      - "tests/unit/test_api_job_store.py"
      - "tests/unit/test_api_security_middleware.py"
      - "tests/unit/test_api_validated_runner_adapter.py"
      - "tests/unit/test_api_worker_deploy_artifacts.py"
      - "tests/unit/test_build_api_docking_dispatch_e2e_evidence.py"
      - "tests/unit/test_build_api_customer_flow_release_evidence.py"
      - "tests/unit/test_build_product_image_smoke_preflight.py"
      - "tests/unit/test_build_product_launch_r4_preflight.py"
      - "tests/unit/test_build_product_release_source_of_truth_gate.py"
      - "tests/unit/test_build_restricted_unattended_execution_readiness.py"
      - "tests/unit/test_ci_contract_fixture_packets.py"
      - "tests/unit/test_validated_runner_runtime_qualification.py"
      - "tests/unit/test_run_product_release_current_refresh.py"
      - "tests/mobile/test_simulation_job_ownership.py"
      - "tests/mobile/test_simulation_endpoint_access.py"
      - "requirements-mobile.txt"
      - "pytest.ini"
      - "pytest-mobile.ini"
      - "tools/product/github_workflow_trust_boundaries.py"
      - "tools/product/build_product_image_smoke_preflight.py"
      - "tools/product/build_product_release_source_of_truth_gate.py"
      - "tools/product/build_api_docking_dispatch_e2e_evidence.py"
      - "tools/product/build_api_customer_flow_release_evidence.py"
      - "tools/product/build_restricted_unattended_execution_readiness.py"
      - "tools/product/ci_contract_fixture_packets.py"
      - "tools/product/run_tier_alpha_adrb2_dispatch_smoke.py"
      - "tools/product/run_product_release_current_refresh.py"
      - "deploy/docker-compose.product.yml"
      - "deploy/docker-compose.product.env.example"
      - "deploy/run_tier_alpha_product_stack.sh"
      - "deploy/verify_product_image.sh"
      - "scripts/normalize_product_image_smoke_artifact_ownership.sh"
      - "deploy/k8s/**"
      - "deploy/systemd/**"
      - "config/api_validated_runner_profiles/README.md"
      - ".github/workflows/ci-api-h4-hosted.yml"

permissions:
  contents: read

concurrency:
  group: ci-api-h4-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-security:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PRODUCT_API_AUTH_REQUIRED: "0"
    steps:
      - name: Check out untrusted source on an ephemeral runner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true
          show-progress: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-mobile.txt

      - name: Install the pinned dependency-light API profile
        run: python -m pip install -r requirements-mobile.txt

      - name: Compile H4 API security surfaces
        run: >-
          python -m py_compile
          api/sqlite_runtime.py
          api/security_ledger.py
          api/atomic_job_admission.py
          api/artifact_access.py
          api/job_store.py
          api/simulation_job_ownership.py
          api/simulation_endpoint_access.py
          api/security.py
          api/result_manifest.py
          api/deployment_secret_policy.py
          api/startup_preflight.py
          api/linux_runner_supervisor.py
          api/validated_runner_execution_evidence.py
          api/validated_runner_runtime_qualification.py
          api/validated_runner.py
          api/worker.py
          betelgeuze_ai_md/contracts/api_adapter.py
          betelgeuze_ai_md/contracts/manifest.py
          api/models.py
          api/main.py
          tools/product/build_product_release_source_of_truth_gate.py

      - name: Import the product API
        run: python -c "import api.main"

      - name: Run the attachment-required H4 regressions
        run: >-
          python -m pytest --confcutdir=tests/unit -q
          tests/unit/test_api_h4_security_hardening.py
          tests/unit/test_api_attempt_artifact_confinement.py

      - name: Run adjacent API regressions
        run: >-
          python -m pytest --confcutdir=tests/unit -q
          tests/unit/test_api_job_store.py
          tests/unit/test_api_security_middleware.py
          tests/unit/test_build_api_docking_dispatch_e2e_evidence.py
          tests/unit/test_build_api_customer_flow_release_evidence.py
          tests/unit/test_build_product_image_smoke_preflight.py
          tests/unit/test_build_product_launch_r4_preflight.py
          tests/unit/test_build_product_release_source_of_truth_gate.py
          tests/unit/test_build_restricted_unattended_execution_readiness.py
          tests/unit/test_ci_contract_fixture_packets.py
          tests/unit/test_run_product_release_current_refresh.py
          tests/unit/test_validated_runner_runtime_qualification.py

      - name: Run hosted-safe validated runner regressions
        run: >-
          python -m pytest --confcutdir=tests/unit -q
          tests/unit/test_api_validated_runner_adapter.py::test_validated_runner_child_environment_excludes_service_secrets
          tests/unit/test_api_validated_runner_adapter.py::test_validated_runner_fails_before_spawn_without_linux_containment
          tests/unit/test_api_validated_runner_adapter.py::test_api_task_remains_fail_closed_when_validated_runner_disabled
          tests/unit/test_api_validated_runner_adapter.py::test_validated_runner_rejects_profile_path_traversal
          tests/unit/test_api_validated_runner_adapter.py::test_validated_runner_rejects_output_outside_job_results_before_spawn
          tests/unit/test_api_validated_runner_adapter.py::test_validated_runner_rejects_enabled_profile_without_evidence
          tests/unit/test_api_validated_runner_adapter.py::test_worker_rejects_partial_or_malformed_runtime_qualification_status
          tests/unit/test_api_validated_runner_adapter.py::test_artifact_reader_rejects_boolean_alias_in_signed_worker_provenance
          tests/unit/test_api_validated_runner_adapter.py::test_artifact_reader_rejects_unsigned_runtime_qualification_status
          tests/unit/test_api_validated_runner_adapter.py::test_artifact_reader_rejects_unsigned_execution_evidence_status

      - name: Run hosted-safe deployment regressions
        run: >-
          python -m pytest --confcutdir=tests/unit -q
          tests/unit/test_api_worker_deploy_artifacts.py::test_product_compose_runs_api_and_worker_with_shared_queue
          tests/unit/test_api_worker_deploy_artifacts.py::test_standard_container_route_keeps_validated_execution_unqualified
          tests/unit/test_api_worker_deploy_artifacts.py::test_tier_alpha_smoke_uses_operator_only_runner_and_exact_manifest_binding
          tests/unit/test_api_worker_deploy_artifacts.py::test_tier_alpha_operator_wrapper_binds_exact_execution_purpose
          tests/unit/test_api_worker_deploy_artifacts.py::test_systemd_dispatch_unit_polls_docking_ledger
          tests/unit/test_api_worker_deploy_artifacts.py::test_systemd_worker_unit_is_fail_closed_and_writes_only_data_dir
          tests/unit/test_api_worker_deploy_artifacts.py::test_systemd_api_server_unit_is_fail_closed_and_matches_product_env_contract
          tests/unit/test_api_worker_deploy_artifacts.py::test_product_dockerfile_contains_worker_entrypoint_assets
          tests/unit/test_api_worker_deploy_artifacts.py::test_model_registry_scripts_are_signed_artifact_based
          tests/unit/test_api_worker_deploy_artifacts.py::test_product_rollout_plan_is_approval_gated_and_documented
          tests/unit/test_api_worker_deploy_artifacts.py::test_product_release_bundle_links_operator_policy_and_evidence
          tests/unit/test_api_worker_deploy_artifacts.py::test_k8s_manifests_define_api_worker_shared_queue_rollout
          tests/unit/test_api_worker_deploy_artifacts.py::test_k8s_explicit_runner_disable_and_role_scoped_secrets
          tests/unit/test_api_worker_deploy_artifacts.py::test_product_api_worker_ci_workflow_runs_contract_checks
          tests/unit/test_api_worker_deploy_artifacts.py::test_monitoring_alerts_are_wired_to_runtime_metrics_and_paged_webhook
          tests/unit/test_api_worker_deploy_artifacts.py::test_validated_runner_profile_examples_are_disabled_by_default

      - name: Run ownership and endpoint regressions
        run: >-
          python -m pytest --confcutdir=tests/mobile -c pytest-mobile.ini -q
          tests/mobile/test_simulation_job_ownership.py
          tests/mobile/test_simulation_endpoint_access.py
