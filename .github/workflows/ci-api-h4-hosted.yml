name: ci-api-h4-hosted

on:
  pull_request:
    paths:
      - "api/**"
      - "tests/unit/test_api_h4_security_hardening.py"
      - "tests/unit/test_api_job_store.py"
      - "tests/unit/test_api_security_middleware.py"
      - "tests/unit/test_api_validated_runner_adapter.py"
      - "tests/mobile/test_simulation_job_ownership.py"
      - "tests/mobile/test_simulation_endpoint_access.py"
      - "requirements-mobile.txt"
      - "pytest.ini"
      - "pytest-mobile.ini"
      - "tools/product/github_workflow_trust_boundaries.py"
      - ".github/workflows/ci-api-h4-hosted.yml"

permissions:
  contents: read

concurrency:
  group: ci-api-h4-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-security:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PRODUCT_API_AUTH_REQUIRED: "0"
    steps:
      - name: Check out untrusted source on an ephemeral runner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          clean: true
          show-progress: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-mobile.txt

      - name: Install the pinned dependency-light API profile
        run: python -m pip install -r requirements-mobile.txt

      - name: Compile H4 API security surfaces
        run: >-
          python -m py_compile
          api/sqlite_runtime.py
          api/security_ledger.py
          api/atomic_job_admission.py
          api/artifact_access.py
          api/job_store.py
          api/simulation_job_ownership.py
          api/simulation_endpoint_access.py
          api/security.py
          api/result_manifest.py
          api/validated_runner.py
          api/worker.py
          betelgeuze_ai_md/contracts/api_adapter.py
          betelgeuze_ai_md/contracts/manifest.py
          api/models.py
          api/main.py

      - name: Import the product API
        run: python -c "import api.main"

      - name: Run the attachment-required H4 regressions
        run: python -m pytest -q tests/unit/test_api_h4_security_hardening.py

      - name: Run adjacent API regressions
        run: >-
          python -m pytest --confcutdir=tests/unit -q
          tests/unit/test_api_job_store.py
          tests/unit/test_api_security_middleware.py
          tests/unit/test_api_validated_runner_adapter.py::test_validated_runner_child_environment_excludes_service_secrets

      - name: Run ownership and endpoint regressions
        run: >-
          python -m pytest --confcutdir=tests/mobile -c pytest-mobile.ini -q
          tests/mobile/test_simulation_job_ownership.py
          tests/mobile/test_simulation_endpoint_access.py
