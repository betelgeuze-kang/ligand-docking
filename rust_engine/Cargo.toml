[package]
name = "ldi_arc_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "ldi_arc_rust"
crate-type = ["cdylib"]

[features]
default = []
native-inference = ["dep:tract-onnx", "dep:ndarray", "dep:rand", "dep:serde_json"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
libc = "0.2"
tract-onnx = { version = "0.22.0", optional = true }
ndarray = { version = "0.15", optional = true }
rand = { version = "0.8", optional = true }
serde_json = { version = "1.0", optional = true }
