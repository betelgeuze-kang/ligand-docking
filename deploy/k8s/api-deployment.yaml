apiVersion: apps/v1
kind: Deployment
metadata:
  name: micf-api-server
  namespace: micf-product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: micf-api-server
  template:
    metadata:
      labels:
        app: micf-api-server
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-server
          image: micf-api:product
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: micf-api-config
          env:
            - name: PRODUCT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: micf-api-secrets
                  key: PRODUCT_API_TOKEN
            - name: API_RESULT_MANIFEST_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: micf-api-secrets
                  key: API_RESULT_MANIFEST_SIGNING_KEY
            - name: DOCKING_PRIVATE_PAYLOAD_KEYS
              valueFrom:
                secretKeyRef:
                  name: micf-api-secrets
                  key: DOCKING_PRIVATE_PAYLOAD_KEYS
            # Explicit env entries override every envFrom source. Keep the
            # standard Kubernetes route fail-closed even if a Secret repeats it.
            - name: API_VALIDATED_RUNNER_ENABLED
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: results
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: micf-product-results
