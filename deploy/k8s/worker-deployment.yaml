apiVersion: apps/v1
kind: Deployment
metadata:
  name: micf-api-worker
  namespace: micf-product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: micf-api-worker
  template:
    metadata:
      labels:
        app: micf-api-worker
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-worker
          image: micf-api:product
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >
              python3 tools/run_api_simulation_worker.py
              --worker-id api-worker-${HOSTNAME}
              --lease-seconds ${API_WORKER_LEASE_SECONDS}
              --heartbeat-interval-seconds ${API_WORKER_HEARTBEAT_INTERVAL_SECONDS}
          envFrom:
            - configMapRef:
                name: micf-api-config
          env:
            - name: API_RESULT_MANIFEST_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: micf-api-secrets
                  key: API_RESULT_MANIFEST_SIGNING_KEY
            - name: API_VALIDATED_RUNNER_ENABLED
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: results
              mountPath: /data
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: micf-product-results
