apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: micf-product
resources:
  - namespace.yaml
  - pvc.yaml
  - configmap.yaml
  # Provision micf-api-secrets separately from an operator-managed secret store.
  # secret.example.yaml is a template and must never be applied by kustomize.
  - api-deployment.yaml
  - worker-deployment.yaml
  - dispatch-deployment.yaml
  - service.yaml
