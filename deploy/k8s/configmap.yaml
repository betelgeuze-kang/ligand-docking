apiVersion: v1
kind: ConfigMap
metadata:
  name: micf-api-config
  namespace: micf-product
data:
  API_INLINE_WORKER_ENABLED: "0"
  API_VALIDATED_RUNNER_ENABLED: "0"
  API_VALIDATED_RUNNER_PROFILES_PATH: "/app/config/api_validated_runner_profiles"
  API_VALIDATED_RUNNER_TIMEOUT_SECONDS: "3600"
  API_JOB_STORE_PATH: "/data/api_jobs.sqlite3"
  RESULTS_STORAGE_PATH: "/data/results"
  DOCKING_PRIVATE_PAYLOAD_DIR: "/data/private_payloads"
  PRODUCT_API_AUDIT_LOG_PATH: "/data/results/product_audit_log.jsonl"
  PRODUCT_API_SECURITY_LEDGER_PATH: "/data/results/product_security.sqlite3"
  API_WORKER_LEASE_SECONDS: "300"
  API_WORKER_HEARTBEAT_INTERVAL_SECONDS: "30"
  API_RESULT_MANIFEST_KEY_ID: "product-k8s-local"
  PRODUCT_API_AUTH_REQUIRED: "1"
  PRODUCT_API_MAX_PAYLOAD_BYTES: "10485760"
  PRODUCT_API_RATE_LIMIT_PER_MINUTE: "120"
  PRODUCT_API_HOSTED_EXPOSURE_APPROVED: "0"
  PRODUCT_API_TLS_TERMINATION_OPERATOR_VERIFIED: "0"
