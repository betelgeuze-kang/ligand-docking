[workspace]
members = [
    "betelgeuze-*",
    "cpu-kernel",
    "reference-dynamics",
    "reference-physics",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license-file = "../LICENSE"

[profile.qualification-v6]
inherits = "release"
opt-level = 3
debug = false
strip = "none"
debug-assertions = false
overflow-checks = true
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1

[profile.qualification-v7]
inherits = "release"
opt-level = 3
debug = false
strip = "none"
debug-assertions = false
overflow-checks = true
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
