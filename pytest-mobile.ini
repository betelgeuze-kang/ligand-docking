[pytest]
testpaths = tests/mobile
addopts = -ra --strict-markers
markers =
    mobile: dependency-light tests supported in a mobile/CPU-only development environment
    requires_torch: optional PyTorch execution lane; skipped when PyTorch is unavailable
    requires_rdkit: optional RDKit chemistry lane; skipped when RDKit is unavailable
    requires_openmm: optional OpenMM molecular-dynamics lane; skipped when OpenMM is unavailable
    requires_h5py: optional HDF5 artifact lane; skipped when h5py is unavailable
    requires_gpu: CUDA, ROCm, HIP, or other accelerator execution lane
    requires_local_artifacts: test requires ignored local runs/data/model artifacts
