  <text class="panel-title" x="1082" y="378">D. GPCR close-out and promoted package</text>
  <text class="label" x="1088" y="418">GPCR core blind before/after</text>
  <text class="body" x="1088" y="460">v4r1</text>
  <text class="old" x="1170" y="460">PR-AUC 0.4336</text>
  <text class="body" x="1320" y="460">top20 rate 0.15</text>
  <text class="body" x="1450" y="460">hits 3</text>
  <text class="body" x="1088" y="500">v6r3</text>
  <text class="good" x="1170" y="500">PR-AUC 1.000</text>
  <text class="body" x="1320" y="500">top20 rate 0.30</text>
  <text class="body" x="1450" y="500">hits 6</text>
  <text class="small" x="1088" y="542">Close-out came from binding_score_composite_v7</text>
  <text class="small" x="1088" y="562">plus the inline-score ligand-prior propagation fix.</text>
  <line class="muted-line" x1="1086" y1="590" x2="1546" y2="590"/>
  <text class="label" x="1088" y="626">Promoted package</text>
  <text class="body" x="1088" y="654">Run: 2026-03-22_biorxiv_v7r1</text>
  <text class="body" x="1088" y="678">Zip: runs/biorxiv_external_validation_package_current.zip</text>
