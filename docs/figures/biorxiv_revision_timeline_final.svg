  <text class="body" x="544" y="468">set1_core_blind</text>
  <text class="good" x="718" y="468">PASS</text>
  <text class="small" x="768" y="468">PR 1.000</text>
  <text class="good" x="814" y="468">PASS</text>
  <text class="good" x="898" y="468">PASS</text>
  <text class="good" x="990" y="468">PASS</text>
  <text class="small" x="718" y="492">final blocker closed here</text>
