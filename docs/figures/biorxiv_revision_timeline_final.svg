  <text class="good" x="718" y="548">PASS</text>
  <text class="small" x="768" y="548">PR 0.823</text>
  <text class="good" x="814" y="548">PASS</text>
  <text class="good" x="898" y="548">PASS</text>
  <text class="good" x="990" y="548">PASS</text>
  <text class="body" x="544" y="628">set3_operational_smoke</text>
  <text class="good" x="718" y="628">PASS</text>
  <text class="small" x="768" y="628">PR 1.000</text>
  <text class="good" x="814" y="628">PASS</text>
  <text class="good" x="898" y="628">PASS</text>
  <text class="good" x="990" y="628">PASS</text>

