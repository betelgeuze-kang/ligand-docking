  <text class="body" x="56" y="466">Core Blind Set</text>
  <text class="body" x="260" y="466">primary</text>
  <rect class="pass" x="396" y="446" width="74" height="28" rx="10"/><text class="label" x="414" y="465">PASS</text>
  <text class="body" x="56" y="512">Expanded OOD Set</text>
  <text class="body" x="260" y="512">secondary_generalization</text>
  <rect class="pass" x="396" y="492" width="74" height="28" rx="10"/><text class="label" x="414" y="511">PASS</text>
  <text class="body" x="56" y="558">Operational Smoke Set</text>
  <text class="body" x="260" y="558">reproducibility_support</text>
