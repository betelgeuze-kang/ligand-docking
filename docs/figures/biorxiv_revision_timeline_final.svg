  <path class="line" d="M408 214 L464 214"/>
  <path class="line" d="M614 214 L670 214"/>
  <path class="line" d="M820 214 L876 214"/>
  <path class="line" d="M1026 214 L1082 214"/>
  <path class="line" d="M1232 214 L1288 214"/>

