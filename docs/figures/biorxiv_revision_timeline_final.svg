  <text class="small" x="622" y="160">kinase gate</text>
  <text class="small" x="828" y="274">GPCR residual blocker</text>
  <text class="small" x="1034" y="160">live rerun</text>
  <text class="small" x="1238" y="274">priors fix</text>

