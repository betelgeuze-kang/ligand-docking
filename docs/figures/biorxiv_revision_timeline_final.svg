<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Final figure draft for corrective validation timeline</title>
  <desc id="desc">Compact multi-panel summary of corrective validation revisions and final accepted package.</desc>
  <style>
    .bg { fill: #fcfcfd; }
    .title { font: 700 28px Arial, sans-serif; fill: #111827; }
    .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
    .panel { fill: #ffffff; stroke: #d7dee8; stroke-width: 1.5; }
    .panel-title { font: 700 18px Arial, sans-serif; fill: #111827; }
    .label { font: 700 15px Arial, sans-serif; fill: #111827; }
    .body { font: 400 13px Arial, sans-serif; fill: #1f2937; }
    .small { font: 400 12px Arial, sans-serif; fill: #475569; }
    .archived { fill: #eceff3; stroke: #6b7280; stroke-width: 2; }
    .corrective { fill: #f8e7c8; stroke: #9a6a12; stroke-width: 2; }
    .accepted { fill: #dff5e8; stroke: #2d7a46; stroke-width: 2.5; }
    .pass { fill: #dff5e8; stroke: #2d7a46; stroke-width: 1.5; }
    .line { stroke: #94a3b8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .muted-line { stroke: #cbd5e1; stroke-width: 2; fill: none; }
    .good { font: 700 15px Arial, sans-serif; fill: #166534; }
    .old { font: 700 15px Arial, sans-serif; fill: #92400e; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

