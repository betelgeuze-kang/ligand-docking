  <text class="label" x="70" y="198">v1</text>
  <text class="body" x="70" y="221">Frozen preregistration</text>
  <text class="body" x="70" y="241">Infra + split confounds</text>

  <rect class="corrective" x="258" y="170" width="150" height="88" rx="14"/>
  <text class="label" x="276" y="198">v2</text>
  <text class="body" x="276" y="221">Heavy-root + disjoint</text>
  <text class="body" x="276" y="241">kinase correction</text>

  <rect class="corrective" x="464" y="170" width="150" height="88" rx="14"/>
  <text class="label" x="482" y="198">v3</text>
  <text class="body" x="482" y="221">Blind score wiring</text>
  <text class="body" x="482" y="241">TRPV1/GPCR OOD recover</text>

  <rect class="corrective" x="670" y="170" width="150" height="88" rx="14"/>
  <text class="label" x="688" y="198">v4</text>
  <text class="body" x="688" y="221">Kinase gate mismatch</text>
  <text class="body" x="688" y="241">resolved</text>

  <rect class="corrective" x="876" y="170" width="150" height="88" rx="14"/>
  <text class="label" x="894" y="198">v5</text>
  <text class="body" x="894" y="221">GPCR-only residual</text>
  <text class="body" x="894" y="241">blocker search</text>

