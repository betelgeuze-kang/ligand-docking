betelgeuze-engine-v2-public-materialize = "betelgeuze_engine_v2.benchmark.public_suite_materialization:main"
betelgeuze-engine-v2-s0-review = "betelgeuze_engine_v2.offline.s0_production_evidence_bundle:main"

[tool.setuptools.packages.find]
include = ["betelgeuze_engine_v2*"]
exclude = [
  "tests*",
  "api*",
  "core*",
  "train*",
  "betelgeuze_product*",
  "betelgeuze_ai_md*",
]

[tool.setuptools.package-data]
betelgeuze_engine_v2 = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["betelgeuze_engine_v2"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
