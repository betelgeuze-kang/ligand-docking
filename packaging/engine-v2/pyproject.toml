[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "betelgeuze-engine-v2"
version = "0.2.0rc2"
description = "Fail-closed independent molecular Engine v2 reference contracts and CPU primitives."
requires-python = ">=3.10,<3.13"
dependencies = [
  "cryptography==46.0.5",
  "numpy>=1.26,<3",
  "torch==2.6.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.scripts]
betelgeuze-engine-v2 = "betelgeuze_engine_v2.cli_dispatch:main"

[tool.setuptools.packages.find]
include = ["betelgeuze_engine_v2*"]
exclude = [
  "tests*",
  "api*",
  "core*",
  "train*",
  "betelgeuze_product*",
  "betelgeuze_ai_md*",
]

[tool.setuptools.package-data]
betelgeuze_engine_v2 = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["betelgeuze_engine_v2"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
