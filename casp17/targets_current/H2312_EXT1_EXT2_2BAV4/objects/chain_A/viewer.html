});
canvas.addEventListener("pointermove", event => {
  if (!dragging) return;
  ry += (event.clientX - lastX) * 0.008;
  rx += (event.clientY - lastY) * 0.008;
  lastX = event.clientX;
  lastY = event.clientY;
});
canvas.addEventListener("pointerup", () => { dragging = false; });
window.addEventListener("resize", resize);
resize();
tick();
</script>
</body>
