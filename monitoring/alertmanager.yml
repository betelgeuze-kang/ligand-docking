global:
  resolve_timeout: 5m

route:
  receiver: 'operator-paged-webhook'
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
- name: 'operator-paged-webhook'
  webhook_configs:
  - url_file: '/etc/alertmanager/paged-webhook-url'
    send_resolved: true
    max_alerts: 20

inhibit_rules:
- source_match:
    severity: 'critical'
  target_match:
    severity: 'warning'
  equal: ['alertname', 'dev', 'instance']
