# monitoring/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "product_api_alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093 # Alertmanager 컨테이너 이름

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'gpu-exporter'
    static_configs:
      - targets: ['gpu-exporter:9835'] # rocm_smi_exporter 또는 dcgm_exporter 포트

  - job_name: 'micf-api'
    static_configs:
      - targets: ['api-server:8000'] # FastAPI 앱이 메트릭을 노출하는 경로
    metrics_path: '/metrics' # FastAPI에서 prometheus_client를 통해 노출하는 경로
    scrape_interval: 5s
    scrape_timeout: 4s
